rintf(\"Size %d\\n\", stack_size(&st));\n        }\n    }\n    return 0;\n}\n"},{"id":"V-T12","cat":"struct","title":"循环队列解报数出列·代码分析","difficulty":3,"tags":["循环队列","结构体封装","模拟","代码分析"],"source":"配套代码分析（原题 T12）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T12 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define CAP 205     /* 队列容量，需大于人数 n */\n\n/* 循环队列：head 指向队头，tail 指向下一个空位，count 记录元素个数 */\ntypedef struct {\n    int data[CAP];\n    int head;\n    int tail;\n    int count;\n} Queue;\n\nvoid queue_init(Queue *q)\n{\n    q->head = 0;\n    q->tail = 0;\n    q->count = 0;\n}\n\nint queue_push(Queue *q, int x)\n{\n    if (q->count >= CAP) {\n        return 0;\n    }\n    q->data[q->tail] = x;\n    q->tail = (q->tail + 1) % CAP;   /* 到末尾回头，实现循环复用 */\n    q->count++;\n    return 1;\n}\n\nint queue_pop(Queue *q, int *x)\n{\n    if (q->count == 0) {\n        return 0;\n    }\n    *x = q->data[q->head];\n    q->head = (q->head + 1) % CAP;\n    q->count--;\n    return 1;\n}\n\nint queue_front(const Queue *q, int *x)\n{\n    if (q->count == 0) {\n        return 0;\n    }\n    *x = q->data[q->head];\n    return 1;\n}\n\nint queue_empty(const Queue *q)\n{\n    return q->count == 0;\n}\n\nint queue_size(const Queue *q)\n{\n    return q->count;\n}\n\nint main(void)\n{\n    Queue q;\n    int n, m, i, k;\n    int x = 0;\n    int first = 1;\n\n    scanf(\"%d %d\", &n, &m);\n    queue_init(&q);\n    for (i = 1; i <= n; i++) {\n        queue_push(&q, i);\n    }\n\n    printf(\"Order:\");\n    while (!queue_empty(&q)) {\n        /* 前 m-1 个人从队头取出再放到队尾，第 m 个人出列 */\n        for (k = 1; k < m; k++) {\n            queue_pop(&q, &x);\n            queue_push(&q, x);\n        }\n        queue_pop(&q, &x);\n        if (!first) {\n            printf(\" \");\n        }\n        printf(\"%d\", x);\n        first = 0;\n    }\n    printf(\"\\n\");\n    printf(\"Last:%d\\n\", x);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5 2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"7 3\n","out":"Order:3 6 2 7 5 1 4\nLast:4\n"}],"hint":"指定输入的完整输出：\n```\nOrder:2 4 1 5 3\nLast:3\n```\n分析要点：循环队列的入队是 `data[tail] = x; tail = (tail + 1) % CAP;`，出队是 `x = data[head]; head = (head + 1) % CAP;`。外层循环条件是队列非空；每次出圈后把出圈者记下来，它最终就是 `Last`。\n边界核对：用「头尾相等」判空会和判满冲突，所以本题额外用 `count` 记录元素个数；`count` 必须在入队、出队两处同步维护。m = 1 时内层循环一次都不执行，直接出队，不要写特判反而出错。","pitfalls":"用「头尾相等」判空会和判满冲突，所以本题额外用 `count` 记录元素个数；`count` 必须在入队、出队两处同步维护。m = 1 时内层循环一次都不执行，直接出队，不要写特判反而出错。","solution":"#include <stdio.h>\n\n#define CAP 205     /* 队列容量，需大于人数 n */\n\n/* 循环队列：head 指向队头，tail 指向下一个空位，count 记录元素个数 */\ntypedef struct {\n    int data[CAP];\n    int head;\n    int tail;\n    int count;\n} Queue;\n\nvoid queue_init(Queue *q)\n{\n    q->head = 0;\n    q->tail = 0;\n    q->count = 0;\n}\n\nint queue_push(Queue *q, int x)\n{\n    if (q->count >= CAP) {\n        return 0;\n    }\n    q->data[q->tail] = x;\n    q->tail = (q->tail + 1) % CAP;   /* 到末尾回头，实现循环复用 */\n    q->count++;\n    return 1;\n}\n\nint queue_pop(Queue *q, int *x)\n{\n    if (q->count == 0) {\n        return 0;\n    }\n    *x = q->data[q->head];\n    q->head = (q->head + 1) % CAP;\n    q->count--;\n    return 1;\n}\n\nint queue_front(const Queue *q, int *x)\n{\n    if (q->count == 0) {\n        return 0;\n    }\n    *x = q->data[q->head];\n    return 1;\n}\n\nint queue_empty(const Queue *q)\n{\n    return q->count == 0;\n}\n\nint queue_size(const Queue *q)\n{\n    return q->count;\n}\n\nint main(void)\n{\n    Queue q;\n    int n, m, i, k;\n    int x = 0;\n    int first = 1;\n\n    scanf(\"%d %d\", &n, &m);\n    queue_init(&q);\n    for (i = 1; i <= n; i++) {\n        queue_push(&q, i);\n    }\n\n    printf(\"Order:\");\n    while (!queue_empty(&q)) {\n        /* 前 m-1 个人从队头取出再放到队尾，第 m 个人出列 */\n        for (k = 1; k < m; k++) {\n            queue_pop(&q, &x);\n            queue_push(&q, x);\n        }\n        queue_pop(&q, &x);\n        if (!first) {\n            printf(\" \");\n        }\n        printf(\"%d\", x);\n        first = 0;\n    }\n    printf(\"\\n\");\n    printf(\"Last:%d\\n\", x);\n    return 0;\n}\n"},{"id":"V-T13","cat":"struct","title":"学生信息管理系统·代码分析","difficulty":4,"tags":["结构体数组","增删改查","结构体封装","代码分析"],"source":"配套代码分析（原题 T13）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T13 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXS 100    /* 最多管理的学生人数 */\n#define MAXL 16     /* 学号、姓名的最大长度 + 余量 */\n\ntypedef struct {\n    char id[MAXL];\n    char name[MAXL];\n    int math;\n    int eng;\n    int comp;\n} STUDENT;\n\n/* 学生集合：结构体数组 + 当前人数，一组函数负责增删改查 */\ntypedef struct {\n    STUDENT stu[MAXS];\n    int count;\n} SYSTEM;\n\nvoid sys_init(SYSTEM *sys)\n{\n    sys->count = 0;\n}\n\nint sys_find(const SYSTEM *sys, const char *id)\n{\n    int i;\n    for (i = 0; i < sys->count; i++) {\n        if (strcmp(sys->stu[i].id, id) == 0) {\n            return i;\n        }\n    }\n    return -1;\n}\n\ndouble stu_average(const STUDENT *s)\n{\n    return (s->math + s->eng + s->comp) / 3.0;\n}\n\nint sys_add(SYSTEM *sys, const char *id, const char *name, int a, int b, int c)\n{\n    STUDENT *s;\n    if (sys->count >= MAXS || sys_find(sys, id) >= 0) {\n        return 0;\n    }\n    s = &sys->stu[sys->count];\n    strcpy(s->id, id);\n    strcpy(s->name, name);\n    s->math = a;\n    s->eng = b;\n    s->comp = c;\n    sys->count++;\n    return 1;\n}\n\nint sys_delete(SYSTEM *sys, const char *id)\n{\n    int pos = sys_find(sys, id);\n    int i;\n    if (pos < 0) {\n        return 0;\n    }\n    for (i = pos; i < sys->count - 1; i++) {\n        sys->stu[i] = sys->stu[i + 1];\n    }\n    sys->count--;\n    return 1;\n}\n\nint sys_update(SYSTEM *sys, const char *id, int a, int b, int c)\n{\n    int pos = sys_find(sys, id);\n    if (pos < 0) {\n        return 0;\n    }\n    sys->stu[pos].math = a;\n    sys->stu[pos].eng = b;\n    sys->stu[pos].comp = c;\n    return 1;\n}\n\nvoid sys_show(const SYSTEM *sys, const char *id)\n{\n    int pos = sys_find(sys, id);\n    const STUDENT *s;\n    if (pos < 0) {\n        printf(\"Not exist\\n\");\n        return;\n    }\n    s = &sys->stu[pos];\n    printf(\"ID:%s\\n\", s->id);\n    printf(\"Name:%s\\n\", s->name);\n    printf(\"Average:%.1f\\n\", stu_average(s));\n}\n\n/* 按平均分降序输出全体，同分按学号升序（排序在副本上做，不改动原数组） */\nvoid sys_list(const SYSTEM *sys)\n{\n    STUDENT tmp[MAXS];\n    int n = sys->count;\n    int i, j;\n\n    memcpy(tmp, sys->stu, sizeof(STUDENT) * (size_t)n);\n    for (i = 1; i < n; i++) {\n        STUDENT key = tmp[i];\n        j = i - 1;\n        while (j >= 0) {\n            double ka = stu_average(&key);\n            double ja = stu_average(&tmp[j]);\n            int put = (ja < ka) || (ja == ka && strcmp(tmp[j].id, key.id) > 0);\n            if (!put) {\n                break;\n            }\n            tmp[j + 1] = tmp[j];\n            j--;\n        }\n        tmp[j + 1] = key;\n    }\n    for (i = 0; i < n; i++) {\n        printf(\"%s %s %.1f\\n\", tmp[i].id, tmp[i].name, stu_average(&tmp[i]));\n    }\n}\n\nint main(void)\n{\n    SYSTEM sys;\n    int n, i;\n\n    sys_init(&sys);\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        int cmd;\n        scanf(\"%d\", &cmd);\n        if (cmd == 1) {\n            char id[MAXL], name[MAXL];\n            int a, b, c;\n            scanf(\"%s %s %d %d %d\", id, name, &a, &b, &c);\n            printf(\"%s\\n\", sys_add(&sys, id, name, a, b, c) ? \"Add success\" : \"Add failed\");\n        } else if (cmd == 2) {\n            char id[MAXL];\n            scanf(\"%s\", id);\n            printf(\"%s\\n\", sys_delete(&sys, id) ? \"Delete success\" : \"Not exist\");\n        } else if (cmd == 3) {\n            char id[MAXL];\n            int a, b, c;\n            scanf(\"%s %d %d %d\", id, &a, &b, &c);\n            printf(\"%s\\n\", sys_update(&sys, id, a, b, c) ? \"Update success\" : \"Not exist\");\n        } else if (cmd == 4) {\n            char id[MAXL];\n            scanf(\"%s\", id);\n            sys_show(&sys, id);\n        } else if (cmd == 5) {\n            sys_list(&sys);\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n6\n1 2018001 Tom 60 70 80\n1 2018002 Jerry 90 90 90\n1 2018003 Ann 70 70 70\n1 2018001 Tom 1 2 3\n2 2018003\n5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8\n1 201817123 Tom 89 80 76\n1 2019989890 Jerry 78 99 67\n4 201817123\n2 201817123\n4 201817123\n4 2019989890\n3 2019989890 79 90 99\n4 2019989890\n","out":"Add success\nAdd success\nID:201817123\nName:Tom\nAverage:81.7\nDelete success\nNot exist\nID:2019989890\nName:Jerry\nAverage:81.3\nUpdate success\nID:2019989890\nName:Jerry\nAverage:89.3\n"}],"hint":"指定输入的完整输出：\n```\nAdd success\nAdd success\nAdd success\nAdd failed\nDelete success\n2018002 Jerry 90.0\n2018001 Tom 70.0\n```\n分析要点：先写 `sys_find` 返回下标（找不到返回 -1），增删改查都靠它，逻辑会非常统一。删除时把后面的元素整体前移一位再 `count--`；列表排序可以对数组做插入排序，也可以对下标排序。\n边界核对：添加时既要判人数上限 100，又要判学号是否已存在；平均分要除以 3.0 并保留 1 位小数；命令 5 排序后输出，别破坏原数组里「按学号可查」的语义（排序前先拷贝一份，或用下标排序）。","pitfalls":"添加时既要判人数上限 100，又要判学号是否已存在；平均分要除以 3.0 并保留 1 位小数；命令 5 排序后输出，别破坏原数组里「按学号可查」的语义（排序前先拷贝一份，或用下标排序）。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXS 100    /* 最多管理的学生人数 */\n#define MAXL 16     /* 学号、姓名的最大长度 + 余量 */\n\ntypedef struct {\n    char id[MAXL];\n    char name[MAXL];\n    int math;\n    int eng;\n    int comp;\n} STUDENT;\n\n/* 学生集合：结构体数组 + 当前人数，一组函数负责增删改查 */\ntypedef struct {\n    STUDENT stu[MAXS];\n    int count;\n} SYSTEM;\n\nvoid sys_init(SYSTEM *sys)\n{\n    sys->count = 0;\n}\n\nint sys_find(const SYSTEM *sys, const char *id)\n{\n    int i;\n    for (i = 0; i < sys->count; i++) {\n        if (strcmp(sys->stu[i].id, id) == 0) {\n            return i;\n        }\n    }\n    return -1;\n}\n\ndouble stu_average(const STUDENT *s)\n{\n    return (s->math + s->eng + s->comp) / 3.0;\n}\n\nint sys_add(SYSTEM *sys, const char *id, const char *name, int a, int b, int c)\n{\n    STUDENT *s;\n    if (sys->count >= MAXS || sys_find(sys, id) >= 0) {\n        return 0;\n    }\n    s = &sys->stu[sys->count];\n    strcpy(s->id, id);\n    strcpy(s->name, name);\n    s->math = a;\n    s->eng = b;\n    s->comp = c;\n    sys->count++;\n    return 1;\n}\n\nint sys_delete(SYSTEM *sys, const char *id)\n{\n    int pos = sys_find(sys, id);\n    int i;\n    if (pos < 0) {\n        return 0;\n    }\n    for (i = pos; i < sys->count - 1; i++) {\n        sys->stu[i] = sys->stu[i + 1];\n    }\n    sys->count--;\n    return 1;\n}\n\nint sys_update(SYSTEM *sys, const char *id, int a, int b, int c)\n{\n    int pos = sys_find(sys, id);\n    if (pos < 0) {\n        return 0;\n    }\n    sys->stu[pos].math = a;\n    sys->stu[pos].eng = b;\n    sys->stu[pos].comp = c;\n    return 1;\n}\n\nvoid sys_show(const SYSTEM *sys, const char *id)\n{\n    int pos = sys_find(sys, id);\n    const STUDENT *s;\n    if (pos < 0) {\n        printf(\"Not exist\\n\");\n        return;\n    }\n    s = &sys->stu[pos];\n    printf(\"ID:%s\\n\", s->id);\n    printf(\"Name:%s\\n\", s->name);\n    printf(\"Average:%.1f\\n\", stu_average(s));\n}\n\n/* 按平均分降序输出全体，同分按学号升序（排序在副本上做，不改动原数组） */\nvoid sys_list(const SYSTEM *sys)\n{\n    STUDENT tmp[MAXS];\n    int n = sys->count;\n    int i, j;\n\n    memcpy(tmp, sys->stu, sizeof(STUDENT) * (size_t)n);\n    for (i = 1; i < n; i++) {\n        STUDENT key = tmp[i];\n        j = i - 1;\n        while (j >= 0) {\n            double ka = stu_average(&key);\n            double ja = stu_average(&tmp[j]);\n            int put = (ja < ka) || (ja == ka && strcmp(tmp[j].id, key.id) > 0);\n            if (!put) {\n                break;\n            }\n            tmp[j + 1] = tmp[j];\n            j--;\n        }\n        tmp[j + 1] = key;\n    }\n    for (i = 0; i < n; i++) {\n        printf(\"%s %s %.1f\\n\", tmp[i].id, tmp[i].name, stu_average(&tmp[i]));\n    }\n}\n\nint main(void)\n{\n    SYSTEM sys;\n    int n, i;\n\n    sys_init(&sys);\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        int cmd;\n        scanf(\"%d\", &cmd);\n        if (cmd == 1) {\n            char id[MAXL], name[MAXL];\n            int a, b, c;\n            scanf(\"%s %s %d %d %d\", id, name, &a, &b, &c);\n            printf(\"%s\\n\", sys_add(&sys, id, name, a, b, c) ? \"Add success\" : \"Add failed\");\n        } else if (cmd == 2) {\n            char id[MAXL];\n            scanf(\"%s\", id);\n            printf(\"%s\\n\", sys_delete(&sys, id) ? \"Delete success\" : \"Not exist\");\n        } else if (cmd == 3) {\n            char id[MAXL];\n            int a, b, c;\n            scanf(\"%s %d %d %d\", id, &a, &b, &c);\n            printf(\"%s\\n\", sys_update(&sys, id, a, b, c) ? \"Update success\" : \"Not exist\");\n        } else if (cmd == 4) {\n            char id[MAXL];\n            scanf(\"%s\", id);\n            sys_show(&sys, id);\n        } else if (cmd == 5) {\n            sys_list(&sys);\n        }\n    }\n    return 0;\n}\n"},{"id":"V-T14","cat":"struct","title":"动态数组选前k名·代码分析","difficulty":4,"tags":["动态内存","malloc","结构体数组","qsort","代码分析"],"source":"配套代码分析（原题 T14）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T14 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct {\n    char name[20];\n    int a;       /* 第一场成绩 */\n    int b;       /* 第二场成绩 */\n    int total;\n} PLAYER;\n\n/* 总分降序 -> 第一场成绩降序 -> 姓名升序 */\nstatic int cmp(const void *p, const void *q)\n{\n    const PLAYER *x = (const PLAYER *)p;\n    const PLAYER *y = (const PLAYER *)q;\n\n    if (x->total != y->total) {\n        return y->total - x->total;\n    }\n    if (x->a != y->a) {\n        return y->a - x->a;\n    }\n    return strcmp(x->name, y->name);\n}\n\nint main(void)\n{\n    PLAYER *arr;\n    int n, k, i;\n\n    if (scanf(\"%d %d\", &n, &k) != 2) {\n        return 0;\n    }\n    if (n <= 0) {\n        return 0;\n    }\n\n    /* 按人数动态申请结构体数组，n 可达 200000 */\n    arr = (PLAYER *)malloc((size_t)n * sizeof(PLAYER));\n    if (arr == NULL) {\n        return 1;\n    }\n\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %d\", arr[i].name, &arr[i].a, &arr[i].b);\n        arr[i].total = arr[i].a + arr[i].b;\n    }\n\n    qsort(arr, (size_t)n, sizeof(PLAYER), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %s %d %d %d\\n\", i + 1, arr[i].name,\n               arr[i].total, arr[i].a, arr[i].b);\n    }\n\n    free(arr);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4 4\nZoe 80 80\nAmy 80 80\nBob 90 60\nCara 80 80\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5 3\nAnn 90 80\nBob 70 90\nCindy 100 100\nDan 90 90\nEve 60 50\n","out":"1 Cindy 200 100 100\n2 Dan 180 90 90\n3 Ann 170 90 80\n"}],"hint":"指定输入的完整输出：\n```\n1 Amy 160 80 80\n2 Cara 160 80 80\n3 Zoe 160 80 80\n4 Bob 150 90 60\n```\n分析要点：`arr = (PLAYER *)malloc((size_t)n * sizeof(PLAYER));` 之后一定要判空。`qsort` 的比较函数原型是 `int cmp(const void *, const void *)`，先强制转换成 `PLAYER *` 再比较。\n边界核对：`malloc` 的参数是字节数 `n * sizeof(PLAYER)`，漏乘 `sizeof` 会严重越界；比较函数返回的是「负数表示前面小」，降序要写成 `y->total - x->total`；用完必须 `free`。","pitfalls":"`malloc` 的参数是字节数 `n * sizeof(PLAYER)`，漏乘 `sizeof` 会严重越界；比较函数返回的是「负数表示前面小」，降序要写成 `y->total - x->total`；用完必须 `free`。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\ntypedef struct {\n    char name[20];\n    int a;       /* 第一场成绩 */\n    int b;       /* 第二场成绩 */\n    int total;\n} PLAYER;\n\n/* 总分降序 -> 第一场成绩降序 -> 姓名升序 */\nstatic int cmp(const void *p, const void *q)\n{\n    const PLAYER *x = (const PLAYER *)p;\n    const PLAYER *y = (const PLAYER *)q;\n\n    if (x->total != y->total) {\n        return y->total - x->total;\n    }\n    if (x->a != y->a) {\n        return y->a - x->a;\n    }\n    return strcmp(x->name, y->name);\n}\n\nint main(void)\n{\n    PLAYER *arr;\n    int n, k, i;\n\n    if (scanf(\"%d %d\", &n, &k) != 2) {\n        return 0;\n    }\n    if (n <= 0) {\n        return 0;\n    }\n\n    /* 按人数动态申请结构体数组，n 可达 200000 */\n    arr = (PLAYER *)malloc((size_t)n * sizeof(PLAYER));\n    if (arr == NULL) {\n        return 1;\n    }\n\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %d\", arr[i].name, &arr[i].a, &arr[i].b);\n        arr[i].total = arr[i].a + arr[i].b;\n    }\n\n    qsort(arr, (size_t)n, sizeof(PLAYER), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %s %d %d %d\\n\", i + 1, arr[i].name,\n               arr[i].total, arr[i].a, arr[i].b);\n    }\n\n    free(arr);\n    return 0;\n}\n"},{"id":"V-R01","cat":"algo","title":"通行卡权限位里 1 的个数·代码分析","difficulty":1,"tags":["位运算","二进制","循环","代码分析"],"source":"配套代码分析（原题 R01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 1005\n\nunsigned int card[MAXN];\nint cnt[MAXN];\n\nint main(void)\n{\n    int n, i, sum = 0, best = -1, arg = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%u\", &card[i]);\n    }\n\n    for (i = 0; i < n; i++) {\n        unsigned int x = card[i];\n        int c = 0;\n        while (x > 0) {\n            c += (int)(x & 1u);\n            x >>= 1;\n        }\n        cnt[i] = c;\n        sum += c;\n        if (c > best) {\n            best = c;\n            arg = (int)card[i];\n        }\n    }\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", cnt[i]);\n    }\n    printf(\"\\n\");\n    printf(\"SUM %d\\n\", sum);\n    printf(\"MAX %d\\n\", arg);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\n7 7 3\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n0 1 5 12 1023\n","out":"0 1 2 2 10\nSUM 15\nMAX 1023\n"}],"hint":"指定输入的完整输出：\n```\n3 3 2\nSUM 8\nMAX 7\n```\n分析要点：对每个数反复做 `x & 1` 取最低位、`x >>= 1` 去掉最低位，直到 x 变成 0，累加就得到 1 的个数。找一个变量记录当前的“最大个数”以及对应的原数，只有严格更大时才更新，就能自然实现“并列取最先出现”。\n边界核对：0 的二进制中 1 的个数是 0（循环一次也不执行），容易漏掉；把位图存成 `unsigned int` 更稳妥，避免对有符号数右移的依赖；n 个数可能跨行，用循环调用 `scanf` 读够 n 个即可。","pitfalls":"0 的二进制中 1 的个数是 0（循环一次也不执行），容易漏掉；把位图存成 `unsigned int` 更稳妥，避免对有符号数右移的依赖；n 个数可能跨行，用循环调用 `scanf` 读够 n 个即可。","solution":"#include <stdio.h>\n\n#define MAXN 1005\n\nunsigned int card[MAXN];\nint cnt[MAXN];\n\nint main(void)\n{\n    int n, i, sum = 0, best = -1, arg = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%u\", &card[i]);\n    }\n\n    for (i = 0; i < n; i++) {\n        unsigned int x = card[i];\n        int c = 0;\n        while (x > 0) {\n            c += (int)(x & 1u);\n            x >>= 1;\n        }\n        cnt[i] = c;\n        sum += c;\n        if (c > best) {\n            best = c;\n            arg = (int)card[i];\n        }\n    }\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", cnt[i]);\n    }\n    printf(\"\\n\");\n    printf(\"SUM %d\\n\", sum);\n    printf(\"MAX %d\\n\", arg);\n    return 0;\n}\n"},{"id":"V-R02","cat":"algo","title":"不能直接跨端的塔片搬运·代码分析","difficulty":2,"tags":["递推","long long","汉诺塔变式","代码分析"],"source":"配套代码分析（原题 R02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int n, i;\n    long long f = 0; /* f(0) = 0，f(n) = 3 * f(n-1) + 2 */\n\n    scanf(\"%d\", &n);\n    for (i = 1; i <= n; i++) {\n        f = 3 * f + 2;\n    }\n    printf(\"%lld\\n\", f);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n38\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"1\n","out":"2\n"}],"hint":"指定输入的完整输出：\n```\n1350851717672992088\n```\n分析要点：f(n) 的三步结构：把上面 n-1 片从 A 搬到 C（f(n-1) 次），把最大的那片从 A 搬到 B（1 次），把 n-1 片从 C 搬回 A（f(n-1) 次），把最大片从 B 搬到 C（1 次），再把 n-1 片从 A 搬到 C（f(n-1) 次）。用一个循环 `f = 3 * f + 2` 递推到 n 即可。\n边界核对：n = 38 时答案约 1.35×10^18，必须用 `long long` 存并用 `%lld` 输出，`int` 会溢出；递推是 `f = 3 * f + 2` 从 f = 0 开始执行 n 轮（等于 3^n - 1），不要套用经典汉诺塔的 2^n - 1。","pitfalls":"n = 38 时答案约 1.35×10^18，必须用 `long long` 存并用 `%lld` 输出，`int` 会溢出；递推是 `f = 3 * f + 2` 从 f = 0 开始执行 n 轮（等于 3^n - 1），不要套用经典汉诺塔的 2^n - 1。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, i;\n    long long f = 0; /* f(0) = 0，f(n) = 3 * f(n-1) + 2 */\n\n    scanf(\"%d\", &n);\n    for (i = 1; i <= n; i++) {\n        f = 3 * f + 2;\n    }\n    printf(\"%lld\\n\", f);\n    return 0;\n}\n"},{"id":"V-R03","cat":"algo","title":"成绩表的计数排序·代码分析","difficulty":2,"tags":["计数排序","桶计数","统计","代码分析"],"source":"配套代码分析（原题 R03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 100005\n#define MAXS 101\n\nint score[MAXN];\nint cnt[MAXS];\n\nint main(void)\n{\n    int n, i, s;\n    int hi = -1, lo = 101, mode = 0, modeCnt = 0, first = 1;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &score[i]);\n        cnt[score[i]]++;\n    }\n\n    for (s = 0; s <= 100; s++) {\n        for (i = 0; i < cnt[s]; i++) {\n            if (!first) {\n                printf(\" \");\n            }\n            printf(\"%d\", s);\n            first = 0;\n        }\n        if (cnt[s] > 0) {\n            if (s > hi) {\n                hi = s;\n            }\n            if (s < lo) {\n                lo = s;\n            }\n            if (cnt[s] > modeCnt) {\n                modeCnt = cnt[s];\n                mode = s;\n            }\n        }\n    }\n    printf(\"\\n\");\n    printf(\"MAX %d\\n\", hi);\n    printf(\"MIN %d\\n\", lo);\n    printf(\"MODE %d\\n\", mode);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1\n100\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8\n88 72 95 88 60 72 88 100\n","out":"60 72 72 88 88 88 95 100\nMAX 100\nMIN 60\nMODE 88\n"}],"hint":"指定输入的完整输出：\n```\n100\nMAX 100\nMIN 100\nMODE 100\n```\n分析要点：开一个 `int cnt[101]` 统计每个分数出现的次数，再让 s 从 0 扫到 100，把 cnt[s] 个 s 依次输出，就完成了计数排序，时间复杂度只有 O(n + 100)。统计众数时顺序扫描，用 `cnt[s] > best` 判断，就能自然取到并列中的较小分数。\n边界核对：n 最大 10 万，输出时注意行末不能多空格；众数并列要取较小值（判断写成 `>` 而不是 `>=`）；`cnt` 数组必须初始化为 0。","pitfalls":"n 最大 10 万，输出时注意行末不能多空格；众数并列要取较小值（判断写成 `>` 而不是 `>=`）；`cnt` 数组必须初始化为 0。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n#define MAXS 101\n\nint score[MAXN];\nint cnt[MAXS];\n\nint main(void)\n{\n    int n, i, s;\n    int hi = -1, lo = 101, mode = 0, modeCnt = 0, first = 1;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &score[i]);\n        cnt[score[i]]++;\n    }\n\n    for (s = 0; s <= 100; s++) {\n        for (i = 0; i < cnt[s]; i++) {\n            if (!first) {\n                printf(\" \");\n            }\n            printf(\"%d\", s);\n            first = 0;\n        }\n        if (cnt[s] > 0) {\n            if (s > hi) {\n                hi = s;\n            }\n            if (s < lo) {\n                lo = s;\n            }\n            if (cnt[s] > modeCnt) {\n                modeCnt = cnt[s];\n                mode = s;\n            }\n        }\n    }\n    printf(\"\\n\");\n    printf(\"MAX %d\\n\", hi);\n    printf(\"MIN %d\\n\", lo);\n    printf(\"MODE %d\\n\", mode);\n    return 0;\n}\n"},{"id":"V-R04","cat":"algo","title":"阶乘末尾连续零的个数·代码分析","difficulty":2,"tags":["数论","公式","long long","代码分析"],"source":"配套代码分析（原题 R04）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R04 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    long long n, cnt = 0;\n\n    scanf(\"%lld\", &n);\n    while (n > 0) {\n        n /= 5;\n        cnt += n;\n    }\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1000\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"10\n","out":"2\n"}],"hint":"指定输入的完整输出：\n```\n249\n```\n分析要点：末尾 0 的个数等于 min(n! 中因子 2 的个数, 因子 5 的个数)，而 2 的个数一定不少于 5 的个数，所以只数 5：个数 = n/5 + n/25 + n/125 + …。用 while 循环每次 `n /= 5` 累加即可，复杂度 O(log n)。\n边界核对：n 最大 10^9，绝对不能真的去算 n!（会溢出）；注意 100 以内的数也可能贡献多个 5（如 25、125），所以要循环除 5 而不是只除一次；计数用 `long long`。","pitfalls":"n 最大 10^9，绝对不能真的去算 n!（会溢出）；注意 100 以内的数也可能贡献多个 5（如 25、125），所以要循环除 5 而不是只除一次；计数用 `long long`。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    long long n, cnt = 0;\n\n    scanf(\"%lld\", &n);\n    while (n > 0) {\n        n /= 5;\n        cnt += n;\n    }\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n"},{"id":"V-R05","cat":"algo","title":"档案编号的三类二分检索·代码分析","difficulty":3,"tags":["二分查找","边界处理","lower_bound","代码分析"],"source":"配套代码分析（原题 R05）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R05 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 200005\n\nint a[MAXN];\n\n/* 第一个大于等于 x 的下标，范围 0..n */\nint lowerBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] < x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\n/* 第一个大于 x 的下标，范围 0..n */\nint upperBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] <= x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\nint main(void)\n{\n    int n, m, i, t, x;\n\n    scanf(\"%d%d\", &n, &m);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n\n    for (i = 0; i < m; i++) {\n        scanf(\"%d%d\", &t, &x);\n        if (t == 1) {\n            int cnt = upperBound(a, n, x) - lowerBound(a, n, x);\n            printf(\"%d\\n\", cnt);\n        } else if (t == 2) {\n            int p = lowerBound(a, n, x);\n            printf(\"%d\\n\", p < n ? p + 1 : 0);\n        } else {\n            int p = upperBound(a, n, x);\n            printf(\"%d\\n\", p);\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5 3\n-2 -2 0 5 5\n1 -2\n2 7\n3 -2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"6 6\n1 3 3 3 7 9\n1 3\n2 4\n3 4\n2 10\n3 0\n1 5\n","out":"3\n5\n4\n0\n0\n0\n"}],"hint":"指定输入的完整输出：\n```\n2\n0\n2\n```\n分析要点：三种请求都能归结为两个边界函数：`lower(x)` 返回第一个大于等于 x 的下标（下标从 0 开始，可能等于 n，表示不存在），`upper(x)` 返回第一个大于 x 的下标。于是 t=1 的答案是 `upper - lower`；t=2 的答案是 `lower + 1`，但当 lower 等于 n 时要输出 0；t=3 的答案是 `upper` 本身（它就是“不大于 x 的元素个数”，正好等于最后一份的序号）。\n边界核对：边界函数用 `while (l < r)` + `mid = l + (r - l) / 2` 最不容易写错；n、m 都可能达到 20 万，逐个顺序扫描会超时，必须二分；所有输出位置都是从 1 开始计数的，别忘记 +1 或换算。","pitfalls":"边界函数用 `while (l < r)` + `mid = l + (r - l) / 2` 最不容易写错；n、m 都可能达到 20 万，逐个顺序扫描会超时，必须二分；所有输出位置都是从 1 开始计数的，别忘记 +1 或换算。","solution":"#include <stdio.h>\n\n#define MAXN 200005\n\nint a[MAXN];\n\n/* 第一个大于等于 x 的下标，范围 0..n */\nint lowerBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] < x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\n/* 第一个大于 x 的下标，范围 0..n */\nint upperBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] <= x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\nint main(void)\n{\n    int n, m, i, t, x;\n\n    scanf(\"%d%d\", &n, &m);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n\n    for (i = 0; i < m; i++) {\n        scanf(\"%d%d\", &t, &x);\n        if (t == 1) {\n            int cnt = upperBound(a, n, x) - lowerBound(a, n, x);\n            printf(\"%d\\n\", cnt);\n        } else if (t == 2) {\n            int p = lowerBound(a, n, x);\n            printf(\"%d\\n\", p < n ? p + 1 : 0);\n        } else {\n            int p = upperBound(a, n, x);\n            printf(\"%d\\n\", p);\n        }\n    }\n    return 0;\n}\n"},{"id":"V-R06","cat":"algo","title":"学科竞赛的多关键字榜单·代码分析","difficulty":3,"tags":["结构体数组","多关键字排序","qsort","代码分析"],"source":"配套代码分析（原题 R06）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R06 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXN 100005\n\ntypedef struct {\n    int id;\n    int math;\n    int eng;\n    int total;\n} Player;\n\nPlayer stu[MAXN];\n\n/* 总分降序 -> 数学降序 -> 编号升序 */\nint cmp(const void *pa, const void *pb)\n{\n    const Player *a = (const Player *)pa;\n    const Player *b = (const Player *)pb;\n\n    if (a->total != b->total) {\n        return a->total > b->total ? -1 : 1;\n    }\n    if (a->math != b->math) {\n        return a->math > b->math ? -1 : 1;\n    }\n    if (a->id != b->id) {\n        return a->id < b->id ? -1 : 1;\n    }\n    return 0;\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d%d%d\", &stu[i].id, &stu[i].math, &stu[i].eng);\n        stu[i].total = stu[i].math + stu[i].eng;\n    }\n\n    qsort(stu, (size_t)n, sizeof(Player), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %d\\n\", stu[i].id, stu[i].total);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3 3\n7 100 100\n2 100 100\n5 99 100\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4 3\n101 90 80\n102 95 85\n103 92 78\n104 95 80\n","out":"102 180\n104 175\n103 170\n"}],"hint":"指定输入的完整输出：\n```\n2 200\n7 200\n5 199\n```\n分析要点：把每位选手的编号、数学、英语和总分放进结构体数组（可以只设 `id`、`math`、`eng`、`total` 这几个成员），再用 `qsort` 和一个比较函数一次排好。比较函数按“总分 → 数学 → 编号”的顺序依次判断，第一个不相等的键决定顺序。\n边界核对：比较函数必须返回负数、0、正数三种情况，漏掉 `return 0;` 会让 qsort 行为不确定；10 万个结构体约 1.6 MB，务必定义成全局变量，否则可能爆栈；只要输出前 k 名，别把所有人都打印出来。","pitfalls":"比较函数必须返回负数、0、正数三种情况，漏掉 `return 0;` 会让 qsort 行为不确定；10 万个结构体约 1.6 MB，务必定义成全局变量，否则可能爆栈；只要输出前 k 名，别把所有人都打印出来。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXN 100005\n\ntypedef struct {\n    int id;\n    int math;\n    int eng;\n    int total;\n} Player;\n\nPlayer stu[MAXN];\n\n/* 总分降序 -> 数学降序 -> 编号升序 */\nint cmp(const void *pa, const void *pb)\n{\n    const Player *a = (const Player *)pa;\n    const Player *b = (const Player *)pb;\n\n    if (a->total != b->total) {\n        return a->total > b->total ? -1 : 1;\n    }\n    if (a->math != b->math) {\n        return a->math > b->math ? -1 : 1;\n    }\n    if (a->id != b->id) {\n        return a->id < b->id ? -1 : 1;\n    }\n    return 0;\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d%d%d\", &stu[i].id, &stu[i].math, &stu[i].eng);\n        stu[i].total = stu[i].math + stu[i].eng;\n    }\n\n    qsort(stu, (size_t)n, sizeof(Player), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %d\\n\", stu[i].id, stu[i].total);\n    }\n    return 0;\n}\n"},{"id":"V-R07","cat":"algo","title":"连续订单的最高净收益·代码分析","difficulty":3,"tags":["最大连续子段和","动态规划","long long","代码分析"],"source":"配套代码分析（原题 R07）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R07 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 100005\n\nlong long a[MAXN];\n\nint main(void)\n{\n    int n, i;\n    long long cur, best;\n    int cs, bs, be;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%lld\", &a[i]);\n    }\n\n    best = a[0];\n    bs = 0;\n    be = 0;\n    cur = a[0];\n    cs = 0;\n\n    for (i = 1; i < n; i++) {\n        if (cur + a[i] >= a[i]) { /* 相等时沿用更早的起点 */\n            cur += a[i];\n        } else {\n            cur = a[i];\n            cs = i;\n        }\n        if (cur > best || (cur == best && (cs < bs || (cs == bs && i < be)))) {\n            best = cur;\n            bs = cs;\n            be = i;\n        }\n    }\n\n    printf(\"%lld %d %d\\n\", best, bs + 1, be + 1);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n7\n4 -2 3 -10 5 5 -3\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n1 -1 1\n","out":"1 1 1\n"}],"hint":"指定输入的完整输出：\n```\n10 5 6\n```\n分析要点：用 Kadane 递推：设 cur 为“以第 i 天结尾的最大子段和”，则 cur = max(cur + a[i], a[i])，同时记录 cur 的起点；当 cur + a[i] 与 a[i] 相等时沿用旧起点，才能保证起点更早。然后再和全局最优比较：和更大就换；和相同则起点更早优先；起点也相同则结束天数更小优先。\n边界核对：全负数时答案是最小的那个负数，不能把初始最大和设成 0；和可能超出 int 范围，必须用 `long long`；cur 的起点别在“相等”时被重置，否则会丢掉“起点更早”的合法答案。","pitfalls":"全负数时答案是最小的那个负数，不能把初始最大和设成 0；和可能超出 int 范围，必须用 `long long`；cur 的起点别在“相等”时被重置，否则会丢掉“起点更早”的合法答案。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nlong long a[MAXN];\n\nint main(void)\n{\n    int n, i;\n    long long cur, best;\n    int cs, bs, be;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%lld\", &a[i]);\n    }\n\n    best = a[0];\n    bs = 0;\n    be = 0;\n    cur = a[0];\n    cs = 0;\n\n    for (i = 1; i < n; i++) {\n        if (cur + a[i] >= a[i]) { /* 相等时沿用更早的起点 */\n            cur += a[i];\n        } else {\n            cur = a[i];\n            cs = i;\n        }\n        if (cur > best || (cur == best && (cs < bs || (cs == bs && i < be)))) {\n            best = cur;\n            bs = cs;\n            be = i;\n        }\n    }\n\n    printf(\"%lld %d %d\\n\", best, bs + 1, be + 1);\n    return 0;\n}\n"},{"id":"V-R08","cat":"algo","title":"区间内的素数计数·代码分析","difficulty":3,"tags":["素数筛","前缀和","预处理","代码分析"],"source":"配套代码分析（原题 R08）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R08 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXV 1000000\n\nstatic char isPrime[MAXV + 2];\nstatic int pre[MAXV + 2];\n\nint main(void)\n{\n    int q, i, j, l, r;\n\n    for (i = 2; i <= MAXV; i++) {\n        isPrime[i] = 1;\n    }\n    for (i = 2; (long long)i * i <= MAXV; i++) {\n        if (isPrime[i]) {\n            for (j = i * i; j <= MAXV; j += i) {\n                isPrime[j] = 0;\n            }\n        }\n    }\n    pre[0] = 0;\n    for (i = 1; i <= MAXV; i++) {\n        pre[i] = pre[i - 1] + (isPrime[i] ? 1 : 0);\n    }\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        scanf(\"%d%d\", &l, &r);\n        printf(\"%d\\n\", pre[r] - pre[l - 1]);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2\n1 1\n999983 1000000\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n1 10\n11 20\n1 1000000\n","out":"4\n4\n78498\n"}],"hint":"指定输入的完整输出：\n```\n0\n1\n```\n分析要点：用埃拉托斯特尼筛法把 1 到 10^6 的素数标记出来：`isPrime[i]` 初值为真，从 2 开始，若 i 是素数就把它的倍数（可以从 i*i 开始）全部标记成合数。筛完再做前缀和 `pre[i] = pre[i - 1] + isPrime[i]`，每次询问用 `pre[R] - pre[L - 1]` 一次算出答案。\n边界核对：1 不是素数，必须把 `isPrime[1]` 置 0；筛法的内层从 `i * i` 开始，注意 `i * i` 在 int 内不要越界；区间查询要用前缀和，不能每次询问都重新筛一遍（q 最大 10 万）。","pitfalls":"1 不是素数，必须把 `isPrime[1]` 置 0；筛法的内层从 `i * i` 开始，注意 `i * i` 在 int 内不要越界；区间查询要用前缀和，不能每次询问都重新筛一遍（q 最大 10 万）。","solution":"#include <stdio.h>\n\n#define MAXV 1000000\n\nstatic char isPrime[MAXV + 2];\nstatic int pre[MAXV + 2];\n\nint main(void)\n{\n    int q, i, j, l, r;\n\n    for (i = 2; i <= MAXV; i++) {\n        isPrime[i] = 1;\n    }\n    for (i = 2; (long long)i * i <= MAXV; i++) {\n        if (isPrime[i]) {\n            for (j = i * i; j <= MAXV; j += i) {\n                isPrime[j] = 0;\n            }\n        }\n    }\n    pre[0] = 0;\n    for (i = 1; i <= MAXV; i++) {\n        pre[i] = pre[i - 1] + (isPrime[i] ? 1 : 0);\n    }\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        scanf(\"%d%d\", &l, &r);\n        printf(\"%d\\n\", pre[r] - pre[l - 1]);\n    }\n    return 0;\n}\n"},{"id":"V-R09","cat":"algo","title":"两个纪念日相隔的天数·代码分析","difficulty":3,"tags":["日期计算","闰年","模拟","代码分析"],"source":"配套代码分析（原题 R09）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R09 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nstatic const int mdays[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n\nstatic int isLeap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}\n\n/* 从 1900-01-01 起算，返回该日期是第几天（0 开始） */\nstatic long long serial(int y, int m, int d)\n{\n    long long s = 0;\n    int i;\n\n    for (i = 1900; i < y; i++) {\n        s += isLeap(i) ? 366 : 365;\n    }\n    for (i = 1; i < m; i++) {\n        s += mdays[i];\n        if (i == 2 && isLeap(y)) {\n            s += 1;\n        }\n    }\n    s += d - 1;\n    return s;\n}\n\nint main(void)\n{\n    int y1, m1, d1, y2, m2, d2;\n    long long diff;\n\n    scanf(\"%d%d%d\", &y1, &m1, &d1);\n    scanf(\"%d%d%d\", &y2, &m2, &d2);\n\n    diff = serial(y1, m1, d1) - serial(y2, m2, d2);\n    if (diff < 0) {\n        diff = -diff;\n    }\n    printf(\"%lld\\n\", diff);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1900 1 1\n2100 12 31\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2024 1 1\n2024 12 31\n","out":"365\n"}],"hint":"指定输入的完整输出：\n```\n73413\n```\n分析要点：写两个小函数：`isLeap(y)` 判断闰年，`serial(y, m, d)` 把日期换算成“从 1900 年 1 月 1 日起是第几天”——先累加之前整年的天数（每年 365 或 366），再累加之前整月的天数（闰年 2 月加 1 天），最后加上 `d - 1`。两个 serial 相减再取绝对值就是答案。\n边界核对：闰年规则是“能被 4 整除且不能被 100 整除，或能被 400 整除”，只写 `y % 4 == 0` 会在 2100 年算错；闰年 2 月要在月份天数表的基础上额外加 1；相隔天数可能达到 7 万多天，用 `long long` 统计，并且别忘记取绝对值。","pitfalls":"闰年规则是“能被 4 整除且不能被 100 整除，或能被 400 整除”，只写 `y % 4 == 0` 会在 2100 年算错；闰年 2 月要在月份天数表的基础上额外加 1；相隔天数可能达到 7 万多天，用 `long long` 统计，并且别忘记取绝对值。","solution":"#include <stdio.h>\n\nstatic const int mdays[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n\nstatic int isLeap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}\n\n/* 从 1900-01-01 起算，返回该日期是第几天（0 开始） */\nstatic long long serial(int y, int m, int d)\n{\n    long long s = 0;\n    int i;\n\n    for (i = 1900; i < y; i++) {\n        s += isLeap(i) ? 366 : 365;\n    }\n    for (i = 1; i < m; i++) {\n        s += mdays[i];\n        if (i == 2 && isLeap(y)) {\n            s += 1;\n        }\n    }\n    s += d - 1;\n    return s;\n}\n\nint main(void)\n{\n    int y1, m1, d1, y2, m2, d2;\n    long long diff;\n\n    scanf(\"%d%d%d\", &y1, &m1, &d1);\n    scanf(\"%d%d%d\", &y2, &m2, &d2);\n\n    diff = serial(y1, m1, d1) - serial(y2, m2, d2);\n    if (diff < 0) {\n        diff = -diff;\n    }\n    printf(\"%lld\\n\", diff);\n    return 0;\n}\n"},{"id":"V-R10","cat":"algo","title":"千位大整数的加法·代码分析","difficulty":3,"tags":["高精度","字符数组","进位","代码分析"],"source":"配套代码分析（原题 R10）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R10 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXL 1005\n\nint main(void)\n{\n    char s1[MAXL], s2[MAXL];\n    int res[MAXL + 2];\n    int n1, n2, len, i, carry, top;\n\n    scanf(\"%s\", s1);\n    scanf(\"%s\", s2);\n    n1 = (int)strlen(s1);\n    n2 = (int)strlen(s2);\n    len = (n1 > n2) ? n1 : n2;\n\n    for (i = 0; i <= len + 1; i++) {\n        res[i] = 0;\n    }\n\n    carry = 0;\n    for (i = 0; i < len; i++) {\n        int d1 = (i < n1) ? s1[n1 - 1 - i] - '0' : 0;\n        int d2 = (i < n2) ? s2[n2 - 1 - i] - '0' : 0;\n        int sum = d1 + d2 + carry;\n        res[i] = sum % 10;\n        carry = sum / 10;\n    }\n    if (carry > 0) {\n        res[len] = carry;\n    }\n\n    top = len;\n    while (top > 0 && res[top] == 0) {\n        top--;\n    }\n    for (i = top; i >= 0; i--) {\n        printf(\"%d\", res[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n0\n0\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"000123\n0777\n","out":"900\n"}],"hint":"指定输入的完整输出：\n```\n0\n```\n分析要点：用两个字符数组读入，从两个串的末尾开始逐位相加并处理进位，结果存到 int 数组里（多留一位存最高位的进位），最后从高位找第一个非零位开始输出。\n边界核对：结果可能比输入多一位（如 999 + 1 = 1000），结果数组要开到 1002；去掉前导零时不要把有效位全删光，结果为 0 时必须输出 `0`；字符转数字要减 `'0'`。","pitfalls":"结果可能比输入多一位（如 999 + 1 = 1000），结果数组要开到 1002；去掉前导零时不要把有效位全删光，结果为 0 时必须输出 `0`；字符转数字要减 `'0'`。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXL 1005\n\nint main(void)\n{\n    char s1[MAXL], s2[MAXL];\n    int res[MAXL + 2];\n    int n1, n2, len, i, carry, top;\n\n    scanf(\"%s\", s1);\n    scanf(\"%s\", s2);\n    n1 = (int)strlen(s1);\n    n2 = (int)strlen(s2);\n    len = (n1 > n2) ? n1 : n2;\n\n    for (i = 0; i <= len + 1; i++) {\n        res[i] = 0;\n    }\n\n    carry = 0;\n    for (i = 0; i < len; i++) {\n        int d1 = (i < n1) ? s1[n1 - 1 - i] - '0' : 0;\n        int d2 = (i < n2) ? s2[n2 - 1 - i] - '0' : 0;\n        int sum = d1 + d2 + carry;\n        res[i] = sum % 10;\n        carry = sum / 10;\n    }\n    if (carry > 0) {\n        res[len] = carry;\n    }\n\n    top = len;\n    while (top > 0 && res[top] == 0) {\n        top--;\n    }\n    for (i = top; i >= 0; i--) {\n        printf(\"%d\", res[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"V-R11","cat":"algo","title":"手写快速排序与第 k 矮·代码分析","difficulty":4,"tags":["快速排序","分区","递归","代码分析"],"source":"配套代码分析（原题 R11）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R11 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\n\nstatic void swapElem(int *x, int *y)\n{\n    int t = *x;\n    *x = *y;\n    *y = t;\n}\n\n/* 三数取中：调整后 h[l] <= h[mid] <= h[r]，再把中位数换到 h[l] 作基准 */\nstatic void medianToLeft(int l, int r)\n{\n    int mid = l + (r - l) / 2;\n\n    if (h[mid] < h[l]) {\n        swapElem(&h[mid], &h[l]);\n    }\n    if (h[r] < h[l]) {\n        swapElem(&h[r], &h[l]);\n    }\n    if (h[r] < h[mid]) {\n        swapElem(&h[r], &h[mid]);\n    }\n    swapElem(&h[l], &h[mid]);\n}\n\n/* 挖坑法分区：返回基准的最终下标，左侧元素都不大于基准，右侧都不小于基准 */\nstatic int partition(int l, int r)\n{\n    int pivot, i, j;\n\n    medianToLeft(l, r);\n    pivot = h[l];\n    i = l;\n    j = r;\n    while (i < j) {\n        while (i < j && h[j] > pivot) {\n            j--;\n        }\n        if (i < j) {\n            h[i] = h[j];\n            i++;\n        }\n        while (i < j && h[i] < pivot) {\n            i++;\n        }\n        if (i < j) {\n            h[j] = h[i];\n            j--;\n        }\n    }\n    h[i] = pivot;\n    return i;\n}\n\nstatic void quickSort(int l, int r)\n{\n    int cut;\n\n    if (l >= r) {\n        return;\n    }\n    cut = partition(l, r);\n    quickSort(l, cut - 1);\n    quickSort(cut + 1, r);\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    quickSort(0, n - 1);\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    printf(\"KTH %d\\n\", h[k - 1]);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5 1\n2 2 2 2 2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8 4\n5 3 9 3 1 8 3 7\n","out":"1 3 3 3 5 7 8 9\nKTH 3\n"}],"hint":"指定输入的完整输出：\n```\n2 2 2 2 2\nKTH 2\n```\n分析要点：分区可以用“挖坑法”：先三数取中选基准（把 l、mid、r 中大小居中的那个换到 h[l]），取出 pivot 后 l 位置就成了一个“坑”；右指针 j 从右往左找不大于 pivot 的元素，把它填进左边的坑，再让左指针 i 从左往右找不小于 pivot 的元素，把它填进右边的坑；i、j 相遇时把 pivot 放进最后的坑，返回这个位置。再递归 `[l, cut-1]` 和 `[cut+1, r]`。排好序后输出 `h[k-1]`。\n边界核对：递归出口必须写 `if (l >= r) return;`；注意每次分区后基准已经落到最终位置，递归时要把它排除在外（写成 `[l, cut-1]` 和 `[cut+1, r]`），否则会死递归；基准若固定取第一个元素，在已排序的 10 万数据上会退化到 O(n^2) 而超时；内层扫描一律加 `i < j` 保护，防止越界。","pitfalls":"递归出口必须写 `if (l >= r) return;`；注意每次分区后基准已经落到最终位置，递归时要把它排除在外（写成 `[l, cut-1]` 和 `[cut+1, r]`），否则会死递归；基准若固定取第一个元素，在已排序的 10 万数据上会退化到 O(n^2) 而超时；内层扫描一律加 `i < j` 保护，防止越界。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\n\nstatic void swapElem(int *x, int *y)\n{\n    int t = *x;\n    *x = *y;\n    *y = t;\n}\n\n/* 三数取中：调整后 h[l] <= h[mid] <= h[r]，再把中位数换到 h[l] 作基准 */\nstatic void medianToLeft(int l, int r)\n{\n    int mid = l + (r - l) / 2;\n\n    if (h[mid] < h[l]) {\n        swapElem(&h[mid], &h[l]);\n    }\n    if (h[r] < h[l]) {\n        swapElem(&h[r], &h[l]);\n    }\n    if (h[r] < h[mid]) {\n        swapElem(&h[r], &h[mid]);\n    }\n    swapElem(&h[l], &h[mid]);\n}\n\n/* 挖坑法分区：返回基准的最终下标，左侧元素都不大于基准，右侧都不小于基准 */\nstatic int partition(int l, int r)\n{\n    int pivot, i, j;\n\n    medianToLeft(l, r);\n    pivot = h[l];\n    i = l;\n    j = r;\n    while (i < j) {\n        while (i < j && h[j] > pivot) {\n            j--;\n        }\n        if (i < j) {\n            h[i] = h[j];\n            i++;\n        }\n        while (i < j && h[i] < pivot) {\n            i++;\n        }\n        if (i < j) {\n            h[j] = h[i];\n            j--;\n        }\n    }\n    h[i] = pivot;\n    return i;\n}\n\nstatic void quickSort(int l, int r)\n{\n    int cut;\n\n    if (l >= r) {\n        return;\n    }\n    cut = partition(l, r);\n    quickSort(l, cut - 1);\n    quickSort(cut + 1, r);\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    quickSort(0, n - 1);\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    printf(\"KTH %d\\n\", h[k - 1]);\n    return 0;\n}\n"},{"id":"V-R12","cat":"algo","title":"身高队列的相邻交换次数·代码分析","difficulty":4,"tags":["归并排序","逆序对","分治","代码分析"],"source":"配套代码分析（原题 R12）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R12 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\nint tmp[MAXN];\nlong long swaps = 0;\n\nstatic void mergeSort(int l, int r)\n{\n    int mid, i, j, k;\n\n    if (l >= r) {\n        return;\n    }\n    mid = l + (r - l) / 2;\n    mergeSort(l, mid);\n    mergeSort(mid + 1, r);\n\n    i = l;\n    j = mid + 1;\n    k = l;\n    while (i <= mid && j <= r) {\n        if (h[i] <= h[j]) {\n            tmp[k++] = h[i++];\n        } else {\n            tmp[k++] = h[j++];\n            swaps += (long long)(mid - i + 1);\n        }\n    }\n    while (i <= mid) {\n        tmp[k++] = h[i++];\n    }\n    while (j <= r) {\n        tmp[k++] = h[j++];\n    }\n    for (k = l; k <= r; k++) {\n        h[k] = tmp[k];\n    }\n}\n\nint main(void)\n{\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    mergeSort(0, n - 1);\n\n    printf(\"SWAPS %lld\\n\", swaps);\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5\n5 4 3 2 1\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n3 1 2\n","out":"SWAPS 2\n1 2 3\n"}],"hint":"指定输入的完整输出：\n```\nSWAPS 10\n1 2 3 4 5\n```\n分析要点：相邻交换的最少次数等于序列的**逆序对**个数，即满足 i < j 且 h[i] > h[j] 的配对个数。用归并排序在合并时顺带统计：合并左右两段时，若取的是右段的元素，说明它比左段剩下的所有元素都小，可以一次性把“左段剩余元素个数”累加进答案。\n边界核对：逆序对最多约 5×10^9，必须用 `long long` 统计；身高相等不算逆序对（比较用 `>`，合并时左段优先取等值元素）；合并前记得保存两段元素或用临时数组，且注意临时数组下标不要越界。","pitfalls":"逆序对最多约 5×10^9，必须用 `long long` 统计；身高相等不算逆序对（比较用 `>`，合并时左段优先取等值元素）；合并前记得保存两段元素或用临时数组，且注意临时数组下标不要越界。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\nint tmp[MAXN];\nlong long swaps = 0;\n\nstatic void mergeSort(int l, int r)\n{\n    int mid, i, j, k;\n\n    if (l >= r) {\n        return;\n    }\n    mid = l + (r - l) / 2;\n    mergeSort(l, mid);\n    mergeSort(mid + 1, r);\n\n    i = l;\n    j = mid + 1;\n    k = l;\n    while (i <= mid && j <= r) {\n        if (h[i] <= h[j]) {\n            tmp[k++] = h[i++];\n        } else {\n            tmp[k++] = h[j++];\n            swaps += (long long)(mid - i + 1);\n        }\n    }\n    while (i <= mid) {\n        tmp[k++] = h[i++];\n    }\n    while (j <= r) {\n        tmp[k++] = h[j++];\n    }\n    for (k = l; k <= r; k++) {\n        h[k] = tmp[k];\n    }\n}\n\nint main(void)\n{\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    mergeSort(0, n - 1);\n\n    printf(\"SWAPS %lld\\n\", swaps);\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"V-R13","cat":"algo","title":"带路障棋盘的通行方案数·代码分析","difficulty":4,"tags":["递推","动态规划","取模","代码分析"],"source":"配套代码分析（原题 R13）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R13 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 1005\n#define MOD 1000000007\n\nstatic int dp[MAXN][MAXN];\nstatic char blocked[MAXN][MAXN];\n\nint main(void)\n{\n    int m, n, k, i, j, r, c;\n\n    scanf(\"%d%d%d\", &m, &n, &k);\n    for (i = 0; i < k; i++) {\n        scanf(\"%d%d\", &r, &c);\n        blocked[r][c] = 1;\n    }\n\n    if (blocked[1][1]) {\n        printf(\"0\\n\");\n        return 0;\n    }\n    dp[1][1] = 1;\n    for (i = 1; i <= m; i++) {\n        for (j = 1; j <= n; j++) {\n            if (i == 1 && j == 1) {\n                continue;\n            }\n            if (blocked[i][j]) {\n                dp[i][j] = 0;\n                continue;\n            }\n            {\n                long long s = 0;\n                if (i > 1) {\n                    s += dp[i - 1][j];\n                }\n                if (j > 1) {\n                    s += dp[i][j - 1];\n                }\n                dp[i][j] = (int)(s % MOD);\n            }\n        }\n    }\n\n    printf(\"%d\\n\", dp[m][n]);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3 3 0\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3 3 1\n2 2\n","out":"2\n"}],"hint":"指定输入的完整输出：\n```\n6\n```\n分析要点：设 dp[i][j] 为走到 (i,j) 的走法数，则 dp[i][j] = (dp[i-1][j] + dp[i][j-1]) % 1000000007；路障格子的 dp 直接置 0；dp[1][1] 的初值为 1。按行列顺序递推，最后输出 dp[m][n]。\n边界核对：每做一次加法就要取模，否则路径数会远远超出 `long long` 的范围；dp 数组要开到 1001×1001（约 4 MB），必须定义为全局变量，放到 main 里会爆栈；边界要判断：第一行只能从左边转移、第一列只能从上边转移，用 `i > 1`、`j > 1` 防止越界，起点 (1,1) 的初值只能是 1。","pitfalls":"每做一次加法就要取模，否则路径数会远远超出 `long long` 的范围；dp 数组要开到 1001×1001（约 4 MB），必须定义为全局变量，放到 main 里会爆栈；边界要判断：第一行只能从左边转移、第一列只能从上边转移，用 `i > 1`、`j > 1` 防止越界，起点 (1,1) 的初值只能是 1。","solution":"#include <stdio.h>\n\n#define MAXN 1005\n#define MOD 1000000007\n\nstatic int dp[MAXN][MAXN];\nstatic char blocked[MAXN][MAXN];\n\nint main(void)\n{\n    int m, n, k, i, j, r, c;\n\n    scanf(\"%d%d%d\", &m, &n, &k);\n    for (i = 0; i < k; i++) {\n        scanf(\"%d%d\", &r, &c);\n        blocked[r][c] = 1;\n    }\n\n    if (blocked[1][1]) {\n        printf(\"0\\n\");\n        return 0;\n    }\n    dp[1][1] = 1;\n    for (i = 1; i <= m; i++) {\n        for (j = 1; j <= n; j++) {\n            if (i == 1 && j == 1) {\n                continue;\n            }\n            if (blocked[i][j]) {\n                dp[i][j] = 0;\n                continue;\n            }\n            {\n                long long s = 0;\n                if (i > 1) {\n                    s += dp[i - 1][j];\n                }\n                if (j > 1) {\n                    s += dp[i][j - 1];\n                }\n                dp[i][j] = (int)(s % MOD);\n            }\n        }\n    }\n\n    printf(\"%d\\n\", dp[m][n]);\n    return 0;\n}\n"},{"id":"V-R14","cat":"algo","title":"超大下标兔子数列取模·代码分析","difficulty":4,"tags":["矩阵快速幂","递推","取模","代码分析"],"source":"配套代码分析（原题 R14）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 R14 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\ntypedef struct {\n    long long m[2][2];\n} Mat;\n\nstatic long long MODV;\n\nstatic Mat multiply(Mat a, Mat b)\n{\n    Mat c;\n    int i, j, k;\n\n    for (i = 0; i < 2; i++) {\n        for (j = 0; j < 2; j++) {\n            long long s = 0;\n            for (k = 0; k < 2; k++) {\n                s = (s + a.m[i][k] * b.m[k][j]) % MODV;\n            }\n            c.m[i][j] = s;\n        }\n    }\n    return c;\n}\n\nint main(void)\n{\n    int q, i;\n    long long n, e;\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        Mat base, res;\n\n        scanf(\"%lld%lld\", &n, &MODV);\n\n        base.m[0][0] = 1; base.m[0][1] = 1;\n        base.m[1][0] = 1; base.m[1][1] = 0;\n        res.m[0][0] = 1;  res.m[0][1] = 0;\n        res.m[1][0] = 0;  res.m[1][1] = 1;\n\n        e = n - 1;\n        while (e > 0) {\n            if (e & 1) {\n                res = multiply(res, base);\n            }\n            base = multiply(base, base);\n            e >>= 1;\n        }\n        printf(\"%lld\\n\", res.m[0][0] % MODV);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2\n1000000000000000000 1000000007\n5 100\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n10 1000\n90 1000000007\n1 2\n","out":"55\n210345902\n1\n"}],"hint":"指定输入的完整输出：\n```\n209783453\n5\n```\n分析要点：记向量 V(k) = (f(k+1), f(k))，则 V(k) = A · V(k-1)，其中 A = [[1,1],[1,0]]，且 V(1) = (1,1)。所以 f(n) 就等于 A^(n-1) 的左上角元素。矩阵快速幂：结果矩阵初始化为单位阵，指数 e = n-1 不断右移，遇到二进制位为 1 就把结果乘上当前底数，底数每轮自乘一次，所有乘法都取模。\n边界核对：M 最大约 10^9，两个小于 M 的数相乘接近 10^18，用 `int` 会溢出成负数，必须用 `long long` 存中间结果再取模；n = 1 时指数是 0，要保证返回 1；指数是 `long long`，循环条件写成 `while (e > 0)` 并每次 `e >>= 1`。","pitfalls":"M 最大约 10^9，两个小于 M 的数相乘接近 10^18，用 `int` 会溢出成负数，必须用 `long long` 存中间结果再取模；n = 1 时指数是 0，要保证返回 1；指数是 `long long`，循环条件写成 `while (e > 0)` 并每次 `e >>= 1`。","solution":"#include <stdio.h>\n\ntypedef struct {\n    long long m[2][2];\n} Mat;\n\nstatic long long MODV;\n\nstatic Mat multiply(Mat a, Mat b)\n{\n    Mat c;\n    int i, j, k;\n\n    for (i = 0; i < 2; i++) {\n        for (j = 0; j < 2; j++) {\n            long long s = 0;\n            for (k = 0; k < 2; k++) {\n                s = (s + a.m[i][k] * b.m[k][j]) % MODV;\n            }\n            c.m[i][j] = s;\n        }\n    }\n    return c;\n}\n\nint main(void)\n{\n    int q, i;\n    long long n, e;\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        Mat base, res;\n\n        scanf(\"%lld%lld\", &n, &MODV);\n\n        base.m[0][0] = 1; base.m[0][1] = 1;\n        base.m[1][0] = 1; base.m[1][1] = 0;\n        res.m[0][0] = 1;  res.m[0][1] = 0;\n        res.m[1][0] = 0;  res.m[1][1] = 1;\n\n        e = n - 1;\n        while (e > 0) {\n            if (e & 1) {\n                res = multiply(res, base);\n            }\n            base = multiply(base, base);\n            e >>= 1;\n        }\n        printf(\"%lld\\n\", res.m[0][0] % MODV);\n    }\n    return 0;\n}\n"},{"id":"K001","cat":"basic","title":"与表达式的安全除法","difficulty":2,"tags":["短路求值与逻辑表达式","专项补缺"],"source":"新编","desc":"### 题目描述\n输入a,b（-100至100）。仅当b非0且a/b>2时输出YES，否则NO，使用短路与避免除0。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"5 0\n","out":"NO\n"},{"in":"9 2\n","out":"YES\n"}],"hint":"&&左侧为假时不会计算右侧。","pitfalls":"&&左侧为假时不会计算右侧。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a,b;scanf(\"%d%d\",&a,&b);puts(b!=0&&a/b>2?\"YES\":\"NO\");return 0;}\n"},{"id":"K002","cat":"basic","title":"或表达式条件计数","difficulty":2,"tags":["短路求值与逻辑表达式","专项补缺"],"source":"新编","desc":"### 题目描述\n输入a,b（各0或1）。令c初值0，计算 a || (++c,b)，输出逻辑结果与c，中间空格。不得改变求值次序。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"1 0\n","out":"1 0\n"},{"in":"0 1\n","out":"1 1\n"}],"hint":"||左侧为真时跳过右侧，逗号运算符先递增再取b。","pitfalls":"||左侧为真时跳过右侧，逗号运算符先递增再取b。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a,b,c=0;scanf(\"%d%d\",&a,&b);int r=a||(++c,b);printf(\"%d %d\\n\",r,c);return 0;}\n"},{"id":"K003","cat":"loop","title":"遇零终止的正数和","difficulty":2,"tags":["break与continue","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n（1至100）和n个绝对值≤100的整数。顺序扫描，负数跳过，遇0立即停止累计；输出此前正数和。必须使用break和continue。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"5\n2 -1 3 0 9\n","out":"5\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"break终止最近一层循环，continue跳过本轮余下语句。","pitfalls":"break终止最近一层循环，continue跳过本轮余下语句。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,a[100],s=0;scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);for(int i=0;i<n;i++){if(!a[i])break;if(a[i]<0)continue;s+=a[i];}printf(\"%d\\n\",s);return 0;}\n"},{"id":"K004","cat":"loop","title":"跳过倍数寻找首项","difficulty":2,"tags":["break与continue","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n,k（1≤n≤100，1≤k≤100）。扫描1至n，跳过3的倍数，输出第一个严格大于k的剩余整数，无则-1。用continue跳过，用break停止。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"10 5\n","out":"7\n"},{"in":"2 2\n","out":"-1\n"}],"hint":"严格大于不包含k自身。","pitfalls":"严格大于不包含k自身。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,k,b=-1;scanf(\"%d%d\",&n,&k);for(int i=1;i<=n;i++){if(i%3==0)continue;if(i>k){b=i;break;}}printf(\"%d\\n\",b);return 0;}\n"},{"id":"K005","cat":"pointer","title":"只读指针区间求和","difficulty":2,"tags":["const指针与只读接口","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n（1至50）和n个绝对值≤100的整数，实现sum(const int *begin,const int *end)，求半开区间和，禁止通过指针修改元素。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"3\n1 -1 4\n","out":"4\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"const int *允许移动指针但不允许通过它改元素；尾后指针只用于比较。","pitfalls":"const int *允许移动指针但不允许通过它改元素；尾后指针只用于比较。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint sum(const int *b,const int *e){int s=0;while(b!=e)s+=*b++;return s;}int main(void){int n,a[50];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);printf(\"%d\\n\",sum(a,a+n));return 0;}\n"},{"id":"K006","cat":"pointer","title":"固定指向的指针","difficulty":2,"tags":["const指针与只读接口","专项补缺"],"source":"新编","desc":"### 题目描述\n输入a,b（-100至100），声明int *const p=&a，通过*p将a增加b，输出a；p自身不得重新赋值。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"2 3\n","out":"5\n"},{"in":"-1 1\n","out":"0\n"}],"hint":"int *const固定指针本身，所指对象仍可修改。","pitfalls":"int *const固定指针本身，所指对象仍可修改。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a,b;scanf(\"%d%d\",&a,&b);int *const p=&a;*p+=b;printf(\"%d\\n\",a);return 0;}\n"},{"id":"K007","cat":"basic","title":"数组元素个数","difficulty":2,"tags":["sizeof与数组退化","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n（1至10），定义int a[10]={0}，读入前n项（绝对值≤100）。用sizeof a / sizeof a[0]求容量，输出容量和前n项和。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"2\n1 2\n","out":"10 3\n"},{"in":"1\n0\n","out":"10 0\n"}],"hint":"数组在定义处的sizeof得到整个数组字节数。","pitfalls":"数组在定义处的sizeof得到整个数组字节数。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,a[10]={0},s=0;scanf(\"%d\",&n);for(int i=0;i<n;i++){scanf(\"%d\",a+i);s+=a[i];}printf(\"%zu %d\\n\",sizeof a/sizeof a[0],s);return 0;}\n"},{"id":"K008","cat":"basic","title":"数组形参必须传长度","difficulty":2,"tags":["sizeof与数组退化","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n（1至10）及n个绝对值≤100的整数。实现int nonzero(const int a[],int n)，输出非零元素数，不得试图用sizeof形参确定长度。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"3\n0 -1 2\n","out":"2\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"函数的数组形参调整为指针，长度必须另传。","pitfalls":"函数的数组形参调整为指针，长度必须另传。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint nonzero(const int a[],int n){int c=0;for(int i=0;i<n;i++)c+=a[i]!=0;return c;}int main(void){int n,a[10];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);printf(\"%d\\n\",nonzero(a,n));return 0;}\n"},{"id":"K009","cat":"struct","title":"类型别名与指针别名","difficulty":2,"tags":["typedef自定义类型","专项补缺"],"source":"新编","desc":"### 题目描述\n用typedef int *IntPtr，输入x,y（-100至100），声明IntPtr p=&x,q=&y，交换*p与*q并输出x y。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"2 3\n","out":"3 2\n"},{"in":"0 0\n","out":"0 0\n"}],"hint":"typedef别名是完整类型，与#define文本替换不同。","pitfalls":"typedef别名是完整类型，与#define文本替换不同。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\ntypedef int *IntPtr;int main(void){int x,y;scanf(\"%d%d\",&x,&y);IntPtr p=&x,q=&y;int t=*p;*p=*q;*q=t;printf(\"%d %d\\n\",x,y);return 0;}\n"},{"id":"K010","cat":"struct","title":"结构体别名作为返回类型","difficulty":2,"tags":["typedef自定义类型","专项补缺"],"source":"新编","desc":"### 题目描述\n定义typedef struct {int lo,hi;} Range。输入a,b（-100至100），函数返回有序端点Range，主函数输出lo hi。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"9 2\n","out":"2 9\n"},{"in":"1 1\n","out":"1 1\n"}],"hint":"结构体值返回复制成员，不返回局部对象地址。","pitfalls":"结构体值返回复制成员，不返回局部对象地址。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\ntypedef struct{int lo,hi;}Range;Range ordered(int a,int b){Range r={a<b?a:b,a>b?a:b};return r;}int main(void){int a,b;scanf(\"%d%d\",&a,&b);Range r=ordered(a,b);printf(\"%d %d\\n\",r.lo,r.hi);return 0;}\n"},{"id":"K011","cat":"algo","title":"临时文件文本往返","difficulty":2,"tags":["文件流与读写定位（拓展）","专项补缺"],"source":"新编","desc":"### 题目描述\n输入n（1至20）及n个绝对值≤100的整数。使用tmpfile创建临时流，以文本逐行写入，rewind后读取并输出总和；不得使用固定文件名。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"3\n1 2 -1\n","out":"2\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"检查打开结果，以读取函数返回值为循环条件，不能用while(!feof(f))。","pitfalls":"检查打开结果，以读取函数返回值为循环条件，不能用while(!feof(f))。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,x,s=0;scanf(\"%d\",&n);FILE *f=tmpfile();if(!f)return 1;for(int i=0;i<n;i++){scanf(\"%d\",&x);fprintf(f,\"%d\\n\",x);}rewind(f);while(fscanf(f,\"%d\",&x)==1)s+=x;fclose(f);printf(\"%d\\n\",s);return 0;}\n"},{"id":"K012","cat":"algo","title":"二进制流定位读取","difficulty":2,"tags":["文件流与读写定位（拓展）","专项补缺"],"source":"新编","desc":"### 题目描述\n输入三个绝对值≤100的整数，再输入k（0至2）。写入tmpfile二进制流，使用fseek定位第k项并用fread读取，输出它。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"2 4 6 1\n","out":"4\n"},{"in":"-1 0 1 0\n","out":"-1\n"}],"hint":"二进制布局只供同一程序往返验证，不假设跨平台文件格式。","pitfalls":"二进制布局只供同一程序往返验证，不假设跨平台文件格式。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a[3],k,x;scanf(\"%d%d%d%d\",a,a+1,a+2,&k);FILE *f=tmpfile();if(!f)return 1;if(fwrite(a,sizeof a[0],3,f)!=3){fclose(f);return 1;}if(fseek(f,(long)k*(long)sizeof(int),SEEK_SET)||fread(&x,sizeof x,1,f)!=1){fclose(f);return 1;}fclose(f);printf(\"%d\\n\",x);return 0;}\n"},{"id":"K013","cat":"pointer","title":"通用地址读取整数","difficulty":2,"tags":["void指针与对象生存期","专项补缺"],"source":"新编","desc":"### 题目描述\n输入x（-100至100）。实现int read_int(const void *p)，将通用地址转换回const int *后读取并返回x，主函数输出。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"3\n","out":"3\n"},{"in":"-1\n","out":"-1\n"}],"hint":"void *不能直接解引用或进行标准C指针算术，恢复实际对象类型后访问。","pitfalls":"void *不能直接解引用或进行标准C指针算术，恢复实际对象类型后访问。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint read_int(const void *p){return *(const int *)p;}int main(void){int x;scanf(\"%d\",&x);printf(\"%d\\n\",read_int(&x));return 0;}\n"},{"id":"K014","cat":"pointer","title":"返回堆对象而非局部地址","difficulty":2,"tags":["void指针与对象生存期","专项补缺"],"source":"新编","desc":"### 题目描述\n输入x（-100至100），实现int *make(int x)，返回动态分配的整数地址，存放x+1。主函数输出所指值并释放，不得返回自动局部变量地址。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"2\n","out":"3\n"},{"in":"-1\n","out":"0\n"}],"hint":"对象生存期必须覆盖使用时刻，free后即使指针非NULL也不能解引用。","pitfalls":"对象生存期必须覆盖使用时刻，free后即使指针非NULL也不能解引用。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint *make(int x){int *p=malloc(sizeof *p);if(p)*p=x+1;return p;}int main(void){int x;scanf(\"%d\",&x);int *p=make(x);if(!p)return 1;printf(\"%d\\n\",*p);free(p);p=NULL;return 0;}\n"},{"id":"K015","cat":"string","title":"重叠删除字符区间","difficulty":2,"tags":["重叠内存移动","专项补缺"],"source":"新编","desc":"### 题目描述\n输入不含空白的串s（长度1至30），再输入l,r（0≤l≤r<长度）。用memmove删除闭区间[l,r]，输出剩余字符串，可为空。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"abcde 1 3\n","out":"ae\n"},{"in":"a 0 0\n","out":"\n"}],"hint":"移动长度要包含终止符；重叠区域使用memmove。","pitfalls":"移动长度要包含终止符；重叠区域使用memmove。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[31];int l,r;scanf(\"%30s%d%d\",s,&l,&r);size_t n=strlen(s);memmove(s+l,s+r+1,n-(size_t)r);puts(s);return 0;}\n"},{"id":"K016","cat":"string","title":"重叠插入一个字符","difficulty":2,"tags":["重叠内存移动","专项补缺"],"source":"新编","desc":"### 题目描述\n输入无空白字符串s（长度1至29）、插入位置k（0至长度）和非空白字符c。用memmove把k及以后字符右移一位（包含终止符），插入c并输出。\n\n### 输入格式\n按题意给定次序输入。\n\n### 输出格式\n按题意输出，末尾换行。","samples":[{"in":"abc 1 X\n","out":"aXbc\n"},{"in":"a 1 z\n","out":"az\n"}],"hint":"缓冲区容量至少是原长度加2，插入末尾同样要移动终止符。","pitfalls":"缓冲区容量至少是原长度加2，插入末尾同样要移动终止符。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[31],c;int k;scanf(\"%29s%d %c\",s,&k,&c);size_t n=strlen(s);memmove(s+k+1,s+k,n-(size_t)k+1);s[k]=c;puts(s);return 0;}\n"}],"exams":[{"id":"M1","title":"模拟卷 1 · 入门综合","subtitle":"覆盖 Ch1–Ch2 基本数据类型与输入输出、Ch3.2 选择结构、Ch3.3 循环入门、Ch4 一维数组；难度：期中偏易","duration":90,"problems":[{"id":"M1-1","cat":"basic","title":"文具店结账","difficulty":1,"tags":["输入输出","整除与取余"],"source":"新编","desc":"### 题目描述\n小明到文具店买签字笔，每支笔单价为 `price` 分（1 元 = 100 分），一共买 `n` 支，另外还要支付 `freight` 分的包装费。请你帮小明算出总花费，并按「X 元 Y 角 Z 分」的格式输出。\n\n### 输入格式\n一行，三个非负整数 `price`、`n`、`freight`，用空格分隔。\n其中 `0 ≤ price ≤ 1000`，`0 ≤ n ≤ 1000`，`0 ≤ freight ≤ 10000`，且总花费不超过 10000 元。\n\n### 输出格式\n一行，格式为 `总计 X 元 Y 角 Z 分`，其中 X 为整元数，0 ≤ Y ≤ 9，0 ≤ Z ≤ 9，行末换行。","samples":[{"in":"25 40 50\n","out":"总计 10 元 5 角 0 分\n"},{"in":"0 0 7\n","out":"总计 0 元 0 角 7 分\n"}],"hint":"总花费 `total = price * n + freight`，单位是「分」。元、角、分分别由 `total / 100`、`total / 10 % 10`、`total % 10` 得到。","pitfalls":"角数是「十位数字」，要写成 `total / 10 % 10`，不能直接写 `total / 10`。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int price, n, freight;\n    int total;\n\n    scanf(\"%d%d%d\", &price, &n, &freight);\n    total = price * n + freight;\n    printf(\"总计 %d 元 %d 角 %d 分\\n\", total / 100, total / 10 % 10, total % 10);\n    return 0;\n}\n","_exam":"M1","_examTitle":"模拟卷 1 · 入门综合"},{"id":"M1-2","cat":"select","title":"十字路口信号灯","difficulty":2,"tags":["多分支","区间判断"],"source":"新编","desc":"### 题目描述\n某十字路口的信号灯按 90 秒一个周期循环：周期内的第 0 到 44 秒为绿灯，第 45 到 49 秒为黄灯，第 50 到 89 秒为红灯。给定当前处于该周期内的第 t 秒，输出此刻的信号灯颜色，以及它还要持续多少秒才切换。\n\n### 输入格式\n一行，一个整数 `t`（`0 ≤ t ≤ 89`），表示当前处于周期内的第 t 秒。\n\n### 输出格式\n一行，格式为 `绿灯 还剩 X 秒`（黄灯、红灯同理），其中 X 表示当前颜色还要持续的秒数。","samples":[{"in":"0\n","out":"绿灯 还剩 45 秒\n"},{"in":"47\n","out":"黄灯 还剩 3 秒\n"},{"in":"80\n","out":"红灯 还剩 10 秒\n"}],"hint":"三段区间用 `if / else if / else` 判断；剩余秒数等于该段结束时刻减去 t：绿灯到 45 秒结束、黄灯到 50 秒结束、红灯到 90 秒结束。","pitfalls":"区间边界：t = 44 仍然是绿灯（还剩 1 秒），t = 45 才是黄灯；不要写成 `t <= 45`。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int t;\n\n    scanf(\"%d\", &t);\n    if (t < 45) {\n        printf(\"绿灯 还剩 %d 秒\\n\", 45 - t);\n    } else if (t < 50) {\n        printf(\"黄灯 还剩 %d 秒\\n\", 50 - t);\n    } else {\n        printf(\"红灯 还剩 %d 秒\\n\", 90 - t);\n    }\n    return 0;\n}\n","_exam":"M1","_examTitle":"模拟卷 1 · 入门综合"},{"id":"M1-3","cat":"loop","title":"食堂消费统计","difficulty":2,"tags":["循环累加","条件计数"],"source":"新编","desc":"### 题目描述\n小张记录了 n 天在食堂的消费金额（整数，单位：元）。请你统计：总消费金额、单笔消费超过 30 元的次数，以及平均每天的消费金额。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 100`）。\n第二行，n 个整数 `a1 … an`（`1 ≤ ai ≤ 200`），表示每天的消费金额，用空格分隔。\n\n### 输出格式\n共三行：\n- 第一行 `总消费 X 元`\n- 第二行 `超过30元的次数 Y`\n- 第三行 `平均每天 Z 元`，其中 Z 保留 2 位小数","samples":[{"in":"5\n12 45 30 60 8\n","out":"总消费 155 元\n超过30元的次数 2\n平均每天 31.00 元\n"},{"in":"1\n30\n","out":"总消费 30 元\n超过30元的次数 0\n平均每天 30.00 元\n"}],"hint":"一个循环读完 n 个数，边读边累加总和、并在 `a > 30` 时让计数器加一；平均值为 `1.0 * sum / n`。","pitfalls":"`sum / n` 是整数除法会丢掉小数，要写成 `1.0 * sum / n` 或先把 sum 转成 double。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, i, a;\n    int sum = 0, cnt = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a);\n        sum += a;\n        if (a > 30) {\n            cnt++;\n        }\n    }\n    printf(\"总消费 %d 元\\n\", sum);\n    printf(\"超过30元的次数 %d\\n\", cnt);\n    printf(\"平均每天 %.2f 元\\n\", 1.0 * sum / n);\n    return 0;\n}\n","_exam":"M1","_examTitle":"模拟卷 1 · 入门综合"},{"id":"M1-4","cat":"array1","title":"体测一千米成绩单","difficulty":3,"tags":["一维数组","最值","平均值"],"source":"新编","desc":"### 题目描述\n体育课上 n 名同学完成了 1000 米测试，老师按学号顺序记录了每个人的用时。请你找出最快和最慢的用时，算出平均用时（保留 1 位小数），并报告最快成绩第一次出现的位置（按输入顺序，从 1 开始编号）。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 50`）。\n第二行，n 个整数 `t1 … tn`（`100 ≤ ti ≤ 600`），表示每位同学的用时（秒），用空格分隔。\n\n### 输出格式\n共四行：\n- 第一行 `最快用时 X 秒`\n- 第二行 `最慢用时 Y 秒`\n- 第三行 `平均用时 Z 秒`，其中 Z 保留 1 位小数\n- 第四行 `最快成绩首次出现在第 P 位`","samples":[{"in":"4\n250 300 220 220\n","out":"最快用时 220 秒\n最慢用时 300 秒\n平均用时 247.5 秒\n最快成绩首次出现在第 3 位\n"},{"in":"1\n180\n","out":"最快用时 180 秒\n最慢用时 180 秒\n平均用时 180.0 秒\n最快成绩首次出现在第 1 位\n"}],"hint":"把 n 个数存进数组后一次遍历：用两个变量分别记录当前最小、最大值，记录最小值时只在严格小于当前最小值时更新位置，这样得到的就是「首次出现」。","pitfalls":"平均用时要用 `1.0 * sum / n`；记录「首次出现」时不能用 `<=`，否则会记成最后一次出现的位置。","solution":"#include <stdio.h>\n\n#define MAXN 55\n\nint main(void)\n{\n    int n, i;\n    int t[MAXN];\n    int minv, maxv, minpos;\n    int sum = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &t[i]);\n        sum += t[i];\n    }\n    minv = t[0];\n    maxv = t[0];\n    minpos = 1;\n    for (i = 1; i < n; i++) {\n        if (t[i] < minv) {\n            minv = t[i];\n            minpos = i + 1;\n        }\n        if (t[i] > maxv) {\n            maxv = t[i];\n        }\n    }\n    printf(\"最快用时 %d 秒\\n\", minv);\n    printf(\"最慢用时 %d 秒\\n\", maxv);\n    printf(\"平均用时 %.1f 秒\\n\", 1.0 * sum / n);\n    printf(\"最快成绩首次出现在第 %d 位\\n\", minpos);\n    return 0;\n}\n","_exam":"M1","_examTitle":"模拟卷 1 · 入门综合"},{"id":"M1-5","cat":"mix","title":"爬楼梯方案数与奇偶","difficulty":3,"tags":["递推","数组存表","奇偶统计"],"source":"新编","desc":"### 题目描述\n教学楼有一段楼梯共 n 级台阶，小刘每次可以跨 1 级或 2 级。记 `f(k)` 为恰好走完 k 级台阶的方案数，则 `f(1) = 1`、`f(2) = 2`，且当 `k ≥ 3` 时 `f(k) = f(k-1) + f(k-2)`。\n\n请先把前 n 项 `f(1) … f(n)` 依次存入数组，再输出 `f(n)`，以及前 n 项中奇数、偶数的个数。\n\n### 输入格式\n一行，一个整数 `n`（`1 ≤ n ≤ 40`），保证 `f(n)` 不超过 int 的取值范围。\n\n### 输出格式\n共三行：\n- 第一行 `方案数 X`\n- 第二行 `奇数 Y 项`\n- 第三行 `偶数 Z 项`","samples":[{"in":"5\n","out":"方案数 8\n奇数 3 项\n偶数 2 项\n"},{"in":"1\n","out":"方案数 1\n奇数 1 项\n偶数 0 项\n"},{"in":"40\n","out":"方案数 165580141\n奇数 27 项\n偶数 13 项\n"}],"hint":"先拷入 `f[1] = 1`、`f[2] = 2`，再从 `i = 3` 到 n 递推 `f[i] = f[i-1] + f[i-2]`；统计奇偶时用 `f[i] % 2` 判断。","pitfalls":"n = 1 时只有一项，循环要从合适的位置开始，不要访问 `f[2]`；`f[40]` 仍在 int 范围内，但不要开太小的数组。","solution":"#include <stdio.h>\n\n#define MAXN 45\n\nint main(void)\n{\n    int n, i;\n    int f[MAXN];\n    int odd = 0, even = 0;\n\n    scanf(\"%d\", &n);\n    if (n >= 1) {\n        f[1] = 1;\n    }\n    if (n >= 2) {\n        f[2] = 2;\n    }\n    for (i = 3; i <= n; i++) {\n        f[i] = f[i - 1] + f[i - 2];\n    }\n    for (i = 1; i <= n; i++) {\n        if (f[i] % 2 == 0) {\n            even++;\n        } else {\n            odd++;\n        }\n    }\n    printf(\"方案数 %d\\n\", f[n]);\n    printf(\"奇数 %d 项\\n\", odd);\n    printf(\"偶数 %d 项\\n\", even);\n    return 0;\n}\n","_exam":"M1","_examTitle":"模拟卷 1 · 入门综合"}]},{"id":"M2","title":"模拟卷 2 · 选择与循环强化","subtitle":"覆盖 Ch3.2 多分支与 switch、Ch3.3 嵌套循环与穷举、Ch4 一维数组计数；难度：中等偏易","duration":90,"problems":[{"id":"M2-1","cat":"select","title":"某月有多少天","difficulty":2,"tags":["switch","多分支","闰年"],"source":"新编","desc":"### 题目描述\n日历上每个月的天数并不相同。给定年份和月份，请输出该月有多少天。\n闰年的判定规则：年份能被 4 整除且不能被 100 整除，或者能被 400 整除。闰年的 2 月有 29 天，平年的 2 月有 28 天。\n\n### 输入格式\n一行，两个整数 `y` 和 `m`（`1800 ≤ y ≤ 2100`，`1 ≤ m ≤ 12`），分别表示年份和月份，用空格分隔。\n\n### 输出格式\n一行，格式为 `该月有 D 天`。","samples":[{"in":"2024 2\n","out":"该月有 29 天\n"},{"in":"1900 2\n","out":"该月有 28 天\n"},{"in":"2024 4\n","out":"该月有 30 天\n"}],"hint":"用 `switch (m)` 分档：1、3、5、7、8、10、12 月是 31 天；4、6、9、11 月是 30 天；2 月再用闰年规则判断 28 或 29 天。","pitfalls":"闰年条件是 `(y % 4 == 0 && y % 100 != 0) || y % 400 == 0`，中间的「不能整除 100」和后面的「能整除 400」是「或」的关系；switch 每个分支记得 `break`。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int y, m, days;\n\n    scanf(\"%d%d\", &y, &m);\n    switch (m) {\n    case 1:\n    case 3:\n    case 5:\n    case 7:\n    case 8:\n    case 10:\n    case 12:\n        days = 31;\n        break;\n    case 4:\n    case 6:\n    case 9:\n    case 11:\n        days = 30;\n        break;\n    default:\n        if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {\n            days = 29;\n        } else {\n            days = 28;\n        }\n        break;\n    }\n    printf(\"该月有 %d 天\\n\", days);\n    return 0;\n}\n","_exam":"M2","_examTitle":"模拟卷 2 · 选择与循环强化"},{"id":"M2-2","cat":"loop","title":"晚自习打卡数据统计","difficulty":2,"tags":["哨兵循环","条件统计"],"source":"新编","desc":"### 题目描述\n自习室的门禁系统会记录每次刷卡的时间间隔（整数，单位：分钟）。数据以 0 作为结束标志，0 本身不参与统计。请你统计间隔为奇数、偶数的记录各有多少条，以及奇数间隔之和、偶数间隔之和。\n\n### 输入格式\n一行，若干个整数，以空格分隔，最后一个整数一定是 0（结束标志），其余整数的绝对值不超过 `10^6`，且在被 0 结束前最多有 1000 个整数。\n\n### 输出格式\n共四行：\n- 第一行 `奇数个数 X`\n- 第二行 `偶数个数 Y`\n- 第三行 `奇数之和 S`\n- 第四行 `偶数之和 T`\n\n若结束标志前没有任何数据，四个数都为 0。","samples":[{"in":"3 4 5 7 0\n","out":"奇数个数 3\n偶数个数 1\n奇数之和 15\n偶数之和 4\n"},{"in":"0\n","out":"奇数个数 0\n偶数个数 0\n奇数之和 0\n偶数之和 0\n"},{"in":"-3 -2 6 0\n","out":"奇数个数 1\n偶数个数 2\n奇数之和 -3\n偶数之和 4\n"}],"hint":"用 `while (scanf(\"%d\", &x) == 1 && x != 0)` 边读边判断：`x % 2 != 0` 为奇数。负数的取余结果可能是负数，但 `x % 2 != 0` 依然能正确区分奇偶。","pitfalls":"0 是结束标志，不能计入统计；不要写死循环读入而不判断 0，否则会多算一条记录。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int x;\n    int oddCnt = 0, evenCnt = 0;\n    long long oddSum = 0, evenSum = 0;\n\n    while (scanf(\"%d\", &x) == 1 && x != 0) {\n        if (x % 2 != 0) {\n            oddCnt++;\n            oddSum += x;\n        } else {\n            evenCnt++;\n            evenSum += x;\n        }\n    }\n    printf(\"奇数个数 %d\\n\", oddCnt);\n    printf(\"偶数个数 %d\\n\", evenCnt);\n    printf(\"奇数之和 %lld\\n\", oddSum);\n    printf(\"偶数之和 %lld\\n\", evenSum);\n    return 0;\n}\n","_exam":"M2","_examTitle":"模拟卷 2 · 选择与循环强化"},{"id":"M2-3","cat":"loop","title":"九九乘法表下三角","difficulty":3,"tags":["嵌套循环","格式输出"],"source":"新编","desc":"### 题目描述\n打印九九乘法表的下三角部分：共 n 行，第 i 行（`1 ≤ i ≤ n`）输出 i 个式子，依次为 `1*i=…`、`2*i=…`、……、`i*i=…`。\n\n### 输入格式\n一行，一个整数 `n`（`1 ≤ n ≤ 9`）。\n\n### 输出格式\n共 n 行，第 i 行有 i 个式子。同一行内相邻两个式子之间用**两个空格**分隔，行末不能有多余空格。","samples":[{"in":"3\n","out":"1*1=1\n1*2=2  2*2=4\n1*3=3  2*3=6  3*3=9\n"},{"in":"1\n","out":"1*1=1\n"},{"in":"9\n","out":"1*1=1\n1*2=2  2*2=4\n1*3=3  2*3=6  3*3=9\n1*4=4  2*4=8  3*4=12  4*4=16\n1*5=5  2*5=10  3*5=15  4*5=20  5*5=25\n1*6=6  2*6=12  3*6=18  4*6=24  5*6=30  6*6=36\n1*7=7  2*7=14  3*7=21  4*7=28  5*7=35  6*7=42  7*7=49\n1*8=8  2*8=16  3*8=24  4*8=32  5*8=40  6*8=48  7*8=56  8*8=64\n1*9=9  2*9=18  3*9=27  4*9=36  5*9=45  6*9=54  7*9=63  8*9=72  9*9=81\n"}],"hint":"双重循环：外层 i 从 1 到 n 控制行，内层 j 从 1 到 i 控制该行的式子；式子的两个因数是先 j 后 i，结果是 `i * j`。","pitfalls":"内层循环的上界是 i（不是 n），这样才能形成下三角；每个式子后面的分隔是「两个空格」，只在式子之间输出，行末不要多输出。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 1; i <= n; i++) {\n        for (j = 1; j <= i; j++) {\n            if (j > 1) {\n                printf(\"  \");\n            }\n            printf(\"%d*%d=%d\", j, i, i * j);\n        }\n        printf(\"\\n\");\n    }\n    return 0;\n}\n","_exam":"M2","_examTitle":"模拟卷 2 · 选择与循环强化"},{"id":"M2-4","cat":"loop","title":"区间内的水仙花数","difficulty":3,"tags":["穷举","数位处理"],"source":"新编","desc":"### 题目描述\n若一个三位数的各位数字的立方和恰好等于它本身，就称它为「水仙花数」，例如 `153 = 1^3 + 5^3 + 3^3`。给定区间 `[a, b]`，请按从小到大的顺序输出区间内所有的水仙花数，并统计个数。\n\n### 输入格式\n一行，两个整数 `a` 和 `b`（`100 ≤ a ≤ b ≤ 999`），用空格分隔。\n\n### 输出格式\n每个水仙花数占一行（按升序）；最后一行输出 `共 K 个`。区间内一个水仙花数都没有时，最后一行输出 `共 0 个`。","samples":[{"in":"100 999\n","out":"153\n370\n371\n407\n共 4 个\n"},{"in":"150 160\n","out":"153\n共 1 个\n"},{"in":"100 150\n","out":"共 0 个\n"}],"hint":"从 a 遍历到 b，用 `/ 100`、`/ 10 % 10`、`% 10` 分别取出百位、十位、个位，判断三个数字的立方和是否等于原数；区间端点也要检查。","pitfalls":"每个数都要重新拆位，不要沿用上一个数的各位数字；注意 a 和 b 都要包含在枚举范围内。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int a, b, x, cnt = 0;\n    int h, t, u;\n\n    scanf(\"%d%d\", &a, &b);\n    for (x = a; x <= b; x++) {\n        h = x / 100;\n        t = x / 10 % 10;\n        u = x % 10;\n        if (h * h * h + t * t * t + u * u * u == x) {\n            printf(\"%d\\n\", x);\n            cnt++;\n        }\n    }\n    printf(\"共 %d 个\\n\", cnt);\n    return 0;\n}\n","_exam":"M2","_examTitle":"模拟卷 2 · 选择与循环强化"},{"id":"M2-5","cat":"array1","title":"分数段人数与及格率","difficulty":3,"tags":["一维数组","分支统计"],"source":"新编","desc":"### 题目描述\n老师拿到了 n 名同学的期中成绩（整数，0 到 100）。请你统计五个分数段的人数，并计算及格率（成绩不低于 60 分的人数占总人数的百分比）。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 100`）。\n第二行，n 个整数，表示成绩，每个成绩满足 `0 ≤ 成绩 ≤ 100`，用空格分隔。\n\n### 输出格式\n共六行：\n- 第一行 `90-100: a`\n- 第二行 `80-89: b`\n- 第三行 `70-79: c`\n- 第四行 `60-69: d`\n- 第五行 `0-59: e`\n- 第六行 `及格率: P%`，其中 P 保留 1 位小数\n\n注意冒号后有一个空格。","samples":[{"in":"4\n100 85 60 59\n","out":"90-100: 1\n80-89: 1\n70-79: 0\n60-69: 1\n0-59: 1\n及格率: 75.0%\n"},{"in":"2\n0 100\n","out":"90-100: 1\n80-89: 0\n70-79: 0\n60-69: 0\n0-59: 1\n及格率: 50.0%\n"},{"in":"5\n60 60 60 60 59\n","out":"90-100: 0\n80-89: 0\n70-79: 0\n60-69: 4\n0-59: 1\n及格率: 80.0%\n"}],"hint":"把每个成绩除以 10 得到 0 到 10 的整数，用这个值作为计数数组的下标（100 分得到的下标 10 归入第一段）；及格率为 `100.0 * 及格人数 / n`。","pitfalls":"100 分除以 10 得 10，数组要开到下标 10 并把它并入 90-100 段；及格率要用浮点运算，否则整数除法会得到 0。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, i, s, idx;\n    int cnt[11] = {0};\n    int pass;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &s);\n        idx = s / 10;\n        cnt[idx]++;\n    }\n    printf(\"90-100: %d\\n\", cnt[9] + cnt[10]);\n    printf(\"80-89: %d\\n\", cnt[8]);\n    printf(\"70-79: %d\\n\", cnt[7]);\n    printf(\"60-69: %d\\n\", cnt[6]);\n    printf(\"0-59: %d\\n\", cnt[0] + cnt[1] + cnt[2] + cnt[3] + cnt[4] + cnt[5]);\n    pass = n - (cnt[0] + cnt[1] + cnt[2] + cnt[3] + cnt[4] + cnt[5]);\n    printf(\"及格率: %.1f%%\\n\", 100.0 * pass / n);\n    return 0;\n}\n","_exam":"M2","_examTitle":"模拟卷 2 · 选择与循环强化"}]},{"id":"M3","title":"模拟卷 3 · 数组基础","subtitle":"覆盖 Ch4.1–4.2 一维数组遍历、排序与下标统计、Ch4.3–4.4 二维数组与矩阵处理；难度：中等","duration":90,"problems":[{"id":"M3-1","cat":"array1","title":"宿舍床位两两互换","difficulty":2,"tags":["一维数组","元素交换"],"source":"新编","desc":"### 题目描述\n宿舍里 n 张床位从左到右摆放，每张床有一个整数编号。管理员要求把相邻两张床两两互换（第 1 张与第 2 张换，第 3 张与第 4 张换，依此类推）；若 n 是奇数，最后一张床保持不动。请把编号存入数组，在数组内完成交换后输出。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 20`）。\n第二行，n 个整数，每个整数满足 `-1000 ≤ 编号 ≤ 1000`，用空格分隔。\n\n### 输出格式\n一行，交换后的 n 个编号，相邻两个之间用一个空格分隔，行末不能有多余空格。","samples":[{"in":"5\n1 2 3 4 5\n","out":"2 1 4 3 5\n"},{"in":"2\n-1 0\n","out":"0 -1\n"},{"in":"1\n9\n","out":"9\n"}],"hint":"让下标 i 以步长 2 前进，每次交换 `a[i]` 与 `a[i+1]`；循环条件写 `i + 1 < n`，这样 n 为奇数时最后一对不会被越界访问。","pitfalls":"循环条件写成 `i < n` 或 `i < n - 1` 在奇数 n 时会访问 `a[n]` 越界；交换要用临时变量。","solution":"#include <stdio.h>\n\n#define MAXN 25\n\nint main(void)\n{\n    int n, i, tmp;\n    int a[MAXN];\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n    for (i = 0; i + 1 < n; i += 2) {\n        tmp = a[i];\n        a[i] = a[i + 1];\n        a[i + 1] = tmp;\n    }\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","_exam":"M3","_examTitle":"模拟卷 3 · 数组基础"},{"id":"M3-2","cat":"array1","title":"入场式班级排序","difficulty":3,"tags":["冒泡排序","交换次数"],"source":"新编","desc":"### 题目描述\n运动会入场式要求 n 个班按班级编号从小到大站位，但给出的编号顺序是乱的（可能有重复编号）。请用**冒泡排序**把编号升序排好，并统计排序过程中发生交换的总次数（每交换两个元素计 1 次）。\n\n排序过程按标准冒泡进行：共 `n-1` 轮，第 k 轮从左到右比较相邻两个元素，若前一个大于后一个就交换它们（不要提前结束）。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 100`）。\n第二行，n 个整数，每个整数满足 `1 ≤ 编号 ≤ 1000`，用空格分隔。\n\n### 输出格式\n共两行：\n- 第一行，升序排列后的 n 个整数，相邻两个整数之间用一个空格分隔，行末不能有多余空格\n- 第二行 `交换次数 C`","samples":[{"in":"4\n4 3 2 1\n","out":"1 2 3 4\n交换次数 6\n"},{"in":"3\n5 5 1\n","out":"1 5 5\n交换次数 2\n"},{"in":"1\n9\n","out":"9\n交换次数 0\n"}],"hint":"双重循环：外层 `i` 从 0 到 n-2，内层 `j` 从 0 到 n-2-i；内层每次比较 `a[j]` 与 `a[j+1]`，前大后小就交换并让计数器加一。","pitfalls":"内层循环上界是 `n-2-i`，多比较一轮会越界；比较用 `>` 才能得到升序。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\nint main(void)\n{\n    int n, i, j, tmp, cnt = 0;\n    int a[MAXN];\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n    for (i = 0; i < n - 1; i++) {\n        for (j = 0; j < n - 1 - i; j++) {\n            if (a[j] > a[j + 1]) {\n                tmp = a[j];\n                a[j] = a[j + 1];\n                a[j + 1] = tmp;\n                cnt++;\n            }\n        }\n    }\n    for (i = 0; i < n; i++) {\n        printf(\"%d\", a[i]);\n        if (i < n - 1) {\n            printf(\" \");\n        }\n    }\n    printf(\"\\n\");\n    printf(\"交换次数 %d\\n\", cnt);\n    return 0;\n}\n","_exam":"M3","_examTitle":"模拟卷 3 · 数组基础"},{"id":"M3-3","cat":"array2","title":"方阵上三角化","difficulty":3,"tags":["二维数组","矩阵遍历","条件置零"],"source":"新编","desc":"### 题目描述\n把一个 n 阶方阵「上三角化」：保留主对角线及其右上方的元素，把主对角线左下方的元素全部改成 0，然后输出处理后的方阵。另外还要输出被改掉的这些元素（不含主对角线）之和。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 20`）。\n接下来 n 行，每行 n 个整数，每个整数的绝对值不超过 1000，用空格分隔。\n\n### 输出格式\n前 n 行：处理后的方阵，每行 n 个整数，相邻两个整数之间用一个空格分隔，行末不能有多余空格。\n最后一行：`左下角元素之和 S`。","samples":[{"in"
