n1. **野指针**：声明了 `int *p` 却没有任何指向，就解引用赋值——p 落在随机内存上，读写都可能崩。\n2. **忘记判空**：`malloc` 返回 `NULL` 后直接写。\n3. **越界一字节**：字符串开 `char s[5]` 存 5 个字符，没位置放 `'\\0'`。\n4. **返回局部变量地址**：`int *f(void) { int x; return &x; }` —— 函数返回后 x 已失效。\n5. **free 两次或 free 后继续用**（悬垂指针）。\n6. **类型不匹配**：把浮点数或整数常量直接赋给指针变量却不做强制转换，编译警告，运行出错。\n7. **用 `==` 比较字符串**：`s == t` 比的是地址，必须用 `strcmp`。\n8. **`&` 与 `&&` 混用**：取地址是 `&`，逻辑与是 `&&`，`&` 是位与。\n\n### 八、考点提示\n\n- 指针题先画图：谁指向哪块内存，箭头画出来，比看代码清楚。\n- 指针数组排序题（实验 10_11）注意：只需 `swap(&p[i], &p[j])` 交换指针，不要 `strcpy`。\n- `malloc` 记得 `#include <stdlib.h>`，`free` 之后把指针置 `NULL` 是好习惯。\n- 传 `int a[]` 的形参，实际收到的是指针；题目给的接口若写 `char *str`，就按指针处理，别写 `str[i]` 之外的花样。\n"},{"id":"g-struct","title":"结构体、枚举与自定义类型","ch":"实验 11 · Ch8","weight":"必考","body":"### 一、定义与 `typedef`\n\n结构体把\"属于同一个对象的一组数据\"打包成一个新类型。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\ntypedef struct {\n    char id[16];\n    char name[32];\n    int  score;\n} Student;              /* 以后 Student 就是类型名，用起来像 int */\n```\n\n- 有了 `typedef`，定义变量写 `Student s;`；没有就得写 `struct Student s;`，考试两种都可能出现。\n- 成员用点访问：`s.score = 90;`、`strcpy(s.name, \"Tom\");`（字符数组**不能**直接赋值）。\n- `sizeof(Student)` 可能大于成员之和（对齐填充），不要用它计算\"有几个成员\"。\n\n### 二、嵌套与结构体数组\n\n```c\n#define N 100\n\ntypedef struct {\n    int y, m, d;\n} Date;\n\ntypedef struct {\n    char name[32];\n    Date birth;        /* 嵌套：结构体里放结构体 */\n    int  score;\n} Person;\n\nPerson ps[N];          /* 结构体数组：100 个人连续存放 */\n\n/* 访问方式：逐层点下去 */\n/* ps[i].birth.y 就是第 i 个人的出生年份 */\n```\n\n结构体数组就是\"一次定义一批对象\"，取值仍是两次下标：`ps[i].score`。读取时注意 `scanf(\"%s\", ps[i].name)`——数组名本身已是地址，不加 `&`。\n\n### 三、结构体指针与 `->`\n\n```c\ntypedef struct {\n    char id[16];\n    char name[32];\n    int  score;\n} Student;\n\nvoid printStudent(const Student *s)\n{\n    printf(\"%s %s %d\\n\", s->id, s->name, s->score);\n    /* s->score 等价于 (*s).score；漏掉括号写成 *s.score 是错的 */\n}\n\nvoid raiseScore(Student *s, int delta)\n{\n    s->score += delta;      /* 传指针才能真正改到调用者的结构体 */\n}\n```\n\n- `s->score` 是 `(*s).score` 的简写。\n- 结构体传参默认整块拷贝，大结构体（含字符串数组）建议传 `const Student *`，既快又安全。\n- 指针数组 + 结构体是最常见的\"免拷贝\"组合：`Student *idx[N]`。\n\n### 四、结构体排序：Swap / Comp / Sort 三段式\n\n实验 11 的经典结构：交换、比较、排序三个函数分离开，考试常直接给你前两个的签名要你补第三个。\n\n```c\ntypedef struct {\n    char id[16];\n    int  total, ce, ws;     /* 综合成绩、机试、加权 */\n} STUDENT;\n\nvoid Swap(STUDENT *s1, STUDENT *s2)\n{\n    STUDENT t = *s1;        /* 结构体可以整体赋值 */\n    *s1 = *s2;\n    *s2 = t;\n}\n\nint Comp(const STUDENT *s1, const STUDENT *s2)\n{\n    if (s1->total != s2->total)          /* 第一关键字：总分降序 */\n        return s1->total > s2->total;\n    return s1->ce > s2->ce;              /* 第二关键字：机试降序 */\n}\n\nvoid Sort(STUDENT a[], int size)\n{\n    int i, j;\n    for (i = 0; i < size - 1; i++)\n        for (j = 0; j < size - 1 - i; j++)\n            if (!Comp(&a[j], &a[j + 1]))     /* 前面不比后面大，就交换 */\n                Swap(&a[j], &a[j + 1]);\n}\n```\n\n多关键字排序的解题公式：**先按第一关键字比较，相等再比第二关键字，再相等比第三关键字**。写 `Comp` 时用 `if` 逐层落下，别堆成一长串 `&&`。\n\n### 五、结构体 + 动态内存\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\ntypedef struct {\n    char id[16];\n    int  score;\n} Stu;\n\nint main(void)\n{\n    int n, i;\n    Stu *arr;\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n    arr = (Stu *)malloc((size_t)n * sizeof(Stu));\n    if (arr == NULL) {\n        printf(\"no memory\\n\");\n        return 0;\n    }\n    for (i = 0; i < n; i++)\n        scanf(\"%s %d\", arr[i].id, &arr[i].score);\n    for (i = 0; i < n; i++)\n        printf(\"%s %d\\n\", arr[i].id, arr[i].score);\n\n    free(arr);\n    arr = NULL;\n    return 0;\n}\n```\n\n注意 `malloc` 的写法顺序：**强制类型转换 → 元素个数 × `sizeof(元素类型)` → 判空**。用完 `free`，并把指针置 `NULL` 防止误用。\n\n### 六、枚举与联合（概念题考点）\n\n```c\ntypedef enum { MON = 1, TUE, WED, THU, FRI, SAT, SUN } WeekDay;\n\nunion Value {\n    int    i;\n    double d;\n    char   s[8];\n};\n```\n\n| 类型 | 本质 | 长度 | 用途 |\n|---|---|---|---|\n| `enum` | 一组整型常量（默认从 0 递增） | 同 `int` | 让状态、星期、性别更好读 |\n| `union` | 所有成员**共用**一块内存 | 最大成员的大小 | 省内存，同一时刻只用一个成员 |\n| `struct` | 成员**各占**内存依次排列 | 成员之和（含对齐） | 组织一个对象的多个属性 |\n\n枚举变量本质是整数，可以直接用于 `switch`；`union` 期末一般只出\"改一个成员会影响另一个成员\"这类阅读题。\n\n### 七、考点提示\n\n- 结构体数组读入：`scanf(\"%s %d %d\", a[i].id, &a[i].ce, &a[i].ws);`——字符串不加 `&`，整数必须加。\n- 排序稳定性的实践意义：同分同学按学号输出时，用**插入排序**或带第二关键字的冒泡。\n- 结构体不能直接用 `==` 比较（除非逐成员比较），也不能直接 `printf`，要逐成员输出。\n- 学生信息管理系统类题（增删改查）用\"结构体数组 + 计数器 size\"就能实现，不必上动态内存。\n- 实验 11 那套综合成绩排名题，通常给出 `Swap`、`Comp`、`Sort` 三个函数声明，只让你填其中一个。填之前先看清题意：总分怎么算（机试 + 加权，还是各占 50%）、总分相同时比什么、输出时三个整数是什么顺序。接口签名必须与题面**逐字符一致**，多一个 `const` 都可能编译不过。\n- 结构体数组作为函数参数时同样会退化成指针，所以 `void Sort(STUDENT a[], int size)` 里 `sizeof(a)` 也是指针大小，长度只能用 `size`。\n- 结构体成员里如果放了字符数组，读入时注意数组名不加 `&`；如果放的是 `char *`，则必须先分配内存才能读入，这是最容易 RE 的一步。\n"},{"id":"g-class","title":"从结构体到「类」的设计","ch":"教材末章 · 综合","weight":"中频","body":"### 一、先明确一件事\n\n**本学期期末机考只考 C 语言**，本节内容不会以 C++ 代码的形式出现在考卷上。它有三个作用：第一，帮你理解教材最后一章在讲什么；第二，把\"结构体 + 一组操作函数\"这种 C 的写法当成\"类\"来读，做实验 11 的综合题会更清楚；第三，为后续的面向对象课程铺路。C++ 内容仅出现在下面这张对照表里，题目和答案一律用 C。\n\n### 二、概念对照：C 的写法 ↔ 面向对象的说法\n\n| 面向对象概念 | C++ 里的写法 | C 语言里的对应做法 |\n|---|---|---|\n| 数据成员 | `class S { int size; };` 里的成员变量 | 结构体成员 `struct S { int size; };` |\n| 成员函数 | `void add(Student s);` 写在类里 | 独立函数，第一个参数是结构体指针：`void S_add(S *p, Student s);` |\n| 构造函数 | `S() { size = 0; }` 自动调用 | 初始化函数 `void S_init(S *p) { p->size = 0; }` 手工调用 |\n| 析构函数 | `~S()` 自动释放 | `void S_destroy(S *p)` 里手工 `free` |\n| 封装 | `private:` 外部不能访问 | 靠约定：函数名加前缀 + `static` 限制文件内可见 |\n| 对象调用 | `obj.add(x)`，隐式传 `this` | `S_add(&obj, x)`，显式传地址，就是 `this` |\n| 访问成员 | `obj.size`、`ptr->size` | `obj.size`、`ptr->size`（语法一样） |\n| 访问控制 | `public` / `private` / `protected` | 无关键字，用头文件 + `static` + 命名约定模拟 |\n| 继承多态 | `class B : public A` | 无对应，用函数指针模拟（了解即可） |\n\n一句话总结：**类 = 数据 + 操作这些数据的函数，再加\"外部只能通过函数访问数据\"这条约定**。C 里没有 `class` 关键字，但把\"结构体 + 以它为第一个参数的函数族\"看成一个整体，就已经是类的雏形。\n\n### 三、C 版「学生管理类」完整框架\n\n下面这段代码把封装思想落实成 C：数据放在结构体里，全部操作通过 `Manager_` 前缀的函数进行，外部不直接碰 `data` 与 `size`。这就是实验 11 综合题（学生信息管理系统）最稳的写法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAX_STU 100\n\ntypedef struct {\n    char id[16];\n    char name[32];\n    int  math, eng, cs;      /* 数据成员：外部不直接改 */\n} Student;\n\ntypedef struct {\n    Student data[MAX_STU];   /* 内部存储方式对外隐藏 */\n    int     size;            /* 当前人数，相当于\"对象的状态\" */\n} StudentManager;\n\n/* 初始化：对应构造函数 */\nvoid Manager_Init(StudentManager *m)\n{\n    m->size = 0;\n}\n\n/* 内部辅助函数：static 表示只在本文件可见，相当于 private */\nstatic int Manager_Find(const StudentManager *m, const char *id)\n{\n    int i;\n    for (i = 0; i < m->size; i++)\n        if (strcmp(m->data[i].id, id) == 0)\n            return i;\n    return -1;\n}\n\n/* 增加：成功返回 1，失败返回 0 */\nint Manager_Add(StudentManager *m, const Student *s)\n{\n    if (m->size >= MAX_STU) return 0;\n    if (Manager_Find(m, s->id) >= 0) return 0;   /* 学号已存在 */\n    m->data[m->size] = *s;\n    m->size++;\n    return 1;\n}\n\n/* 删除：后面的元素整体前移一格 */\nint Manager_Del(StudentManager *m, const char *id)\n{\n    int i = Manager_Find(m, id);\n    int k;\n    if (i < 0) return 0;\n    for (k = i; k < m->size - 1; k++)\n        m->data[k] = m->data[k + 1];\n    m->size--;\n    return 1;\n}\n\n/* 修改成绩 */\nint Manager_Update(StudentManager *m, const char *id, int math, int eng, int cs)\n{\n    int i = Manager_Find(m, id);\n    if (i < 0) return 0;\n    m->data[i].math = math;\n    m->data[i].eng  = eng;\n    m->data[i].cs   = cs;\n    return 1;\n}\n\n/* 查询平均分：找不到返回 -1 */\ndouble Manager_Average(const StudentManager *m, const char *id)\n{\n    int i = Manager_Find(m, id);\n    if (i < 0) return -1.0;\n    return (m->data[i].math + m->data[i].eng + m->data[i].cs) / 3.0;\n}\n\n/* 显示某个学生的三行信息（与题面输出格式一致） */\nvoid Manager_ShowOne(const StudentManager *m, int i)\n{\n    printf(\"Student ID:%s\\n\", m->data[i].id);\n    printf(\"Name:%s\\n\", m->data[i].name);\n    printf(\"Average Score:%.1f\\n\",\n           (m->data[i].math + m->data[i].eng + m->data[i].cs) / 3.0);\n}\n\n/* 显示全部 */\nvoid Manager_Show(const StudentManager *m)\n{\n    int i;\n    for (i = 0; i < m->size; i++)\n        printf(\"%s %s %d %d %d\\n\", m->data[i].id, m->data[i].name,\n               m->data[i].math, m->data[i].eng, m->data[i].cs);\n}\n\nint main(void)\n{\n    StudentManager mgr;\n    Student s;\n    int n, op, i, math, eng, cs, pos;\n\n    Manager_Init(&mgr);                  /* 一定要先初始化，否则 size 是垃圾值 */\n    if (scanf(\"%d\", &n) != 1) return 0;\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%d\", &op) != 1) break;\n        if (op == 1) {\n            scanf(\"%s %s %d %d %d\", s.id, s.name, &s.math, &s.eng, &s.cs);\n            printf(Manager_Add(&mgr, &s) ? \"Add success\\n\" : \"Students already exist\\n\");\n        } else if (op == 2) {\n            scanf(\"%s\", s.id);\n            printf(Manager_Del(&mgr, s.id) ? \"Delete success\\n\" : \"Students do not exist\\n\");\n        } else if (op == 3) {\n            scanf(\"%s %d %d %d\", s.id, &math, &eng, &cs);\n            printf(Manager_Update(&mgr, s.id, math, eng, cs)\n                   ? \"Update success\\n\" : \"Students do not exist\\n\");\n        } else {\n            scanf(\"%s\", s.id);\n            pos = Manager_Find(&mgr, s.id);\n            if (pos < 0) printf(\"Students do not exist\\n\");\n            else Manager_ShowOne(&mgr, pos);\n        }\n    }\n    return 0;\n}\n```\n\n### 四、读这段代码时该看到什么\n\n1. **数据被包起来了**：`mgr.data` 与 `mgr.size` 只在 `Manager_*` 函数里出现，`main` 只调用\"动作\"，不知道内部是数组还是链表。\n2. **每个函数都有\"操作对象\"参数**：`StudentManager *m` 就是 C 里的 `this`，所以函数名统一加 `Manager_` 前缀，读起来和 `mgr.Add(...)` 感觉接近。\n3. **接口与实现分离**：`Manager_Find` 用 `static` 藏起来，外部看不到——这是 C 里最接近 `private` 的手段。\n4. **失败有返回值**：`Add` 返回 0/1、`Average` 返回 -1.0，调用者据此输出提示语，而不是靠全局错误码。\n5. **初始化的责任在调用者**：没有构造函数，就必须在 `main` 开头显式 `Manager_Init(&mgr);`，否则 `size` 是垃圾值。这是 C 写\"类\"最容易忘的一步。\n\n### 五、和 C++ 的字面差异（仅作对照，考试不写）\n\n| 目的 | C 写法（考试用这个） | C++ 写法（了解） |\n|---|---|---|\n| 定义类型 | `struct Student { ... };` | `class Student { ... };` |\n| 访问成员 | `p->score`、`p->size` | `p->score`、`p->size`（相同） |\n| 初始化 | 调用 `Manager_Init(&mgr)` | 自动调用构造函数 |\n| 写输出 | `printf(\"%d\\n\", x)` | `cout << x << endl;` |\n| 申请内存 | `malloc` / `free` | `new` / `delete` |\n| 传对象 | 传指针避免拷贝 | 传引用 `void f(S &s)` |\n\n考场上只认左边一列。看到右边一列的语法出现在自己的解答里，一定要改回 C。\n\n### 六、考点提示\n\n- 实验 11 综合题本质就是\"结构体数组 + 增删改查函数 + 边界判断\"，把上面对框代码的骨架记住即可复用。\n- 注意输出格式：题目要求 `Student ID:2019...` 这种前缀时，冒号后面**不要空格**。\n- 删除操作用\"后面的元素前移\"实现，别忘了 `size--`；`size` 为 0 时删除要返回失败。\n- 查平均分要除以 `3.0`（不是 `3`），并注意保留一位或两位小数。\n"},{"id":"g-algo","title":"算法专题：排序、二分与常用套路","ch":"实验 7 + 综合","weight":"高频","body":"### 一、四种排序的对比与代码\n\n| 排序 | 核心思路 | 最好 | 平均 | 最坏 | 稳定性 | 代码量 |\n|---|---|---|---|---|---|---|\n| 冒泡 | 相邻逆序就交换，大的往后冒 | O(n) | O(n^2) | O(n^2) | 稳定 | 最短 |\n| 选择 | 每轮找最小，与当前位交换 | O(n^2) | O(n^2) | O(n^2) | **不稳定** | 短 |\n| 插入 | 把当前元素插进前面有序段 | O(n) | O(n^2) | O(n^2) | 稳定 | 短 |\n| 归并/快排 | 分治 | — | O(n log n) | — | 归并稳定 | 长（本课不要求手写） |\n\n```c\n/* 冒泡：每轮把当前最大值送到末尾 */\nvoid bubbleSort(int a[], int n)\n{\n    int i, j, t;\n    for (i = 0; i < n - 1; i++)\n        for (j = 0; j < n - 1 - i; j++)\n            if (a[j] > a[j + 1]) {\n                t = a[j];\n                a[j] = a[j + 1];\n                a[j + 1] = t;\n            }\n}\n\n/* 选择：每轮在未排序部分挑最小值放到前面 */\nvoid selectSort(int a[], int n)\n{\n    int i, j, k, t;\n    for (i = 0; i < n - 1; i++) {\n        k = i;\n        for (j = i + 1; j < n; j++)\n            if (a[j] < a[k]) k = j;\n        if (k != i) {\n            t = a[i];\n            a[i] = a[k];\n            a[k] = t;\n        }\n    }\n}\n\n/* 插入：把 a[i] 插入前面已排好的有序段 */\nvoid insertSort(int a[], int n)\n{\n    int i, j, key;\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        for (j = i - 1; j >= 0 && a[j] > key; j--)\n            a[j + 1] = a[j];\n        a[j + 1] = key;\n    }\n}\n```\n\n### 二、二分查找的三种变式（必背）\n\n二分的前提是**数组已经有序**。统一用\"左闭右开\"写法 `[l, r)`，循环条件 `l < r`，可以少踩很多坑。\n\n```c\n/* 变式 1：精确查找，返回下标，找不到返回 -1 */\nint binarySearch(const int a[], int n, int key)\n{\n    int l = 0, r = n - 1;\n    while (l <= r) {\n        int mid = l + (r - l) / 2;      /* 防止 l + r 溢出 */\n        if (a[mid] == key) return mid;\n        if (a[mid] < key) l = mid + 1;\n        else r = mid - 1;\n    }\n    return -1;\n}\n\n/* 变式 2：第一个 >= x 的下标（没有则返回 n） */\nint lowerBound(const int a[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (a[mid] >= x) r = mid;\n        else l = mid + 1;\n    }\n    return l;\n}\n\n/* 变式 3：最后一个 <= x 的下标（没有则返回 -1） */\nint upperBoundFloor(const int a[], int n, int x)\n{\n    int l = -1, r = n - 1;\n    while (l < r) {\n        int mid = l + (r - l + 1) / 2;   /* 上取整，否则可能死循环 */\n        if (a[mid] <= x) l = mid;\n        else r = mid - 1;\n    }\n    return l;\n}\n```\n\n判断\"该用哪个变式\"的口诀：**要求\"第一个满足条件的\"就用 `r = mid` 型；要求\"最后一个满足条件的\"就用 `l = mid` 型并上取整**。\n\n### 三、递推与模拟\n\n- **递推三要素**：初值、递推式、计算顺序（从小到大）。手算前 3 项，再写代码。\n- 常见递推：斐波那契、爬楼梯、兔子繁殖、杨辉三角、错排。\n- **模拟**：不讲技巧，按题意一步步走。日期推进、报数出列、矩阵填数、队列排队都是模拟题。\n- 模拟题的核心是把状态写清：现在走到哪、计数到几、下一步该改什么。\n\n```c\n/* 日期推进：给定 年 月 日，求下一天 */\nint daysOfMonth[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n\nint isLeap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;\n}\n\nvoid nextDay(int *py, int *pm, int *pd)\n{\n    int limit = daysOfMonth[*pm] + ((*pm == 2 && isLeap(*py)) ? 1 : 0);\n    (*pd)++;\n    if (*pd > limit) {\n        *pd = 1;\n        (*pm)++;\n        if (*pm > 12) {\n            *pm = 1;\n            (*py)++;\n        }\n    }\n}\n```\n\n### 四、前缀和、最大子段和\n\n```c\n/* 前缀和：pre[i] 表示 a[0]..a[i-1] 的和，区间 [l, r] 的和 = pre[r+1] - pre[l] */\nvoid buildPrefix(const int a[], int n, long long pre[])\n{\n    int i;\n    pre[0] = 0;\n    for (i = 0; i < n; i++)\n        pre[i + 1] = pre[i] + a[i];\n}\n```\n\n```c\n/* 最大子段和：Kadane，一遍扫描 O(n) */\nlong long maxSubArray(const int a[], int n)\n{\n    long long best = a[0], cur = a[0];\n    int i;\n    for (i = 1; i < n; i++) {\n        cur = (cur > 0) ? cur + a[i] : a[i];   /* 前面的和是负的就丢掉 */\n        if (cur > best) best = cur;\n    }\n    return best;\n}\n```\n\n### 五、素数筛与素数判定\n\n```c\n#define MAXN 1000000\n\nint isComposite[MAXN + 1];   /* 0 表示素数；全局数组自动清零 */\n\nvoid sieve(int n)\n{\n    int i, j;\n    if (n >= 0) isComposite[0] = 1;\n    if (n >= 1) isComposite[1] = 1;\n    for (i = 2; i <= n / i; i++)          /* 只筛到 sqrt(n) */\n        if (!isComposite[i])\n            for (j = i * i; j <= n; j += i)   /* 从 i*i 开始标记 */\n                isComposite[j] = 1;\n}\n```\n\n单次判断素数用试除法即可，循环条件写 `i <= n / i` 避免 `i * i` 溢出。\n\n### 六、进制与高精度入门\n\n- **十进制转 b 进制**：除 b 取余，余数逆序排列。\n- **b 进制转十进制**：从高位起 `ans = ans * b + 当前位`。\n- **小数部分**：乘 b 取整，顺序排列（期末少见，了解即可）。\n\n```c\n#include <string.h>\n\n/* 高精度加法：先按位倒序相加，最后去掉前导 0 并翻转输出 */\nvoid bigAdd(const char *a, const char *b, char *out)\n{\n    int la = (int)strlen(a), lb = (int)strlen(b);\n    int i = la - 1, j = lb - 1, k = 0, carry = 0;\n    char tmp[512];\n\n    while (i >= 0 || j >= 0 || carry) {\n        int s = carry;\n        if (i >= 0) s += a[i--] - '0';\n        if (j >= 0) s += b[j--] - '0';\n        tmp[k++] = (char)('0' + s % 10);\n        carry = s / 10;\n    }\n    while (k > 0)\n        *out++ = tmp[--k];\n    *out = '\\0';\n}\n```\n\n### 七、位运算技巧\n\n```c\nint popcount(unsigned int x)   { int c = 0; while (x) { c += (int)(x & 1u); x >>= 1; } return c; }\nint isPowerOfTwo(unsigned int x) { return x != 0u && (x & (x - 1u)) == 0u; }\nint lowbit(int x)              { return x & (-x); }        /* 取出最低位的 1 */\nint getBit(int x, int k)       { return (x >> k) & 1; }\nint setBit(int x, int k)       { return x | (1 << k); }\nint clearBit(int x, int k)     { return x & ~(1 << k); }\nint flipBit(int x, int k)      { return x ^ (1 << k); }\n```\n\n常用结论：`n & 1` 判奇偶；`n >> 1` 等价整除 2；`x ^ x = 0` 可用于找出唯一出现奇数次的数；`~x = -x - 1`。\n\n### 八、复杂度估算与考点提示\n\n估算复杂度就数\"最内层语句执行了多少次\"：两层循环各跑 n 次就是 O(n^2)，一层循环加二分就是 O(n log n)。以 n 为参考：n ≤ 1000 时 O(n^2) 完全够用；n 到 10^5 时 O(n^2) 是 10^10 次运算必然 TLE，必须换 O(n) 或 O(n log n)；n 到 10^6 时连 O(n log n) 都要小心，常配前缀和、桶计数。所以**看到数据范围就该反推算法**：范围小可以暴力枚举，范围大就要找公式、二分或一次遍历。\n\n- 排序题注意\"按什么关键字排、升序还是降序、相同时怎么办\"，先写清规则再动手。\n- 二分题一定先排序；题目给的下标是 0 还是 1 起始要看清楚；`mid` 用 `l + (r - l) / 2` 防溢出。\n- 数据范围决定类型：和、乘积、斐波那契超过 21 亿就要换 `long long`，格式符同步改 `%lld`。\n- 递推题先手算前 3 项并和程序输出对照，能立刻发现初值或下标偏移的错误。\n- 模拟题不要追求技巧，把\"状态变量\"列出来逐个更新，比硬凑一个复杂循环稳得多。\n- 一旦发现代码里有\"看起来能跑但说不清为什么对\"的部分，那就是潜在 WA 源头，宁可按最笨但正确的写法重写。\n"},{"id":"g-exam","title":"机考应试：读题、排错与时间分配","ch":"全范围 · 应试","weight":"必考","body":"### 一、读题三遍法（每题不超过 3 分钟）\n\n1. **第一遍只看两件事**：输入什么（几行、什么类型、有没有多组）、输出什么（几行、什么格式）。用笔在纸上写下一个最小样例。\n2. **第二遍抓数据范围与细节**：`1 ≤ n ≤ 100` 决定数组开多大；\"保留 2 位小数\"决定 `%.2f`；\"数字间一个空格，行末无多余空格\"决定输出写法；\"若不存在输出 `Not Found`\"决定分支。\n3. **第三遍手推样例**：把题目给的样例在纸上走一遍，确认自己理解的规则和样例一致。**样例都推不出正确答案时不要开始写代码**。\n\n读题时立刻记下三个东西：数组大小、数据类型（是否要 `long long`）、输出的精确格式。\n\n### 二、I/O 与格式陷阱清单\n\n| 陷阱 | 错误写法 | 正确写法 |\n|---|---|---|\n| 忘记取地址 | `scanf(\"%d\", n)` | `scanf(\"%d\", &n)` |\n| 字符串却加了 & | `scanf(\"%s\", &s)` | `scanf(\"%s\", s)` |\n| `double` 用 `%f` 读 | `scanf(\"%f\", &x)` | `scanf(\"%lf\", &x)` |\n| `long long` 用 `%d` | `printf(\"%d\", x)` | `printf(\"%lld\", x)` |\n| `%c` 读到换行 | `scanf(\"%c\", &ch)` | `scanf(\" %c\", &ch)` |\n| 行末多空格 | `printf(\"%d \", a[i])` 每个都加 | `printf(i ? \" %d\" : \"%d\", a[i])` |\n| 忘了换行 | 最后一行没 `\\n` | 每行都以 `\\n` 结尾 |\n| 多组输入只读一组 | 只 `scanf` 一次 | `while (scanf(\"%d\", &n) == 1)` |\n\n```c\n/* 多组输入的标准写法：读到 EOF 为止 */\nint n;\nwhile (scanf(\"%d\", &n) == 1) {\n    /* 处理一组 */\n    printf(\"%d\\n\", n);\n}\n```\n\n输出还有一个铁律：**题面没让输出的内容一个字都不要输出**。不要写\"请输入 n：\"、不要打印\"答案是\"、不要输出调试信息。\n\n### 三、WA / TLE / RE 排查流程\n\n| 现象 | 全称 | 最可能原因 | 检查顺序 |\n|---|---|---|---|\n| WA | Wrong Answer | 逻辑或格式错 | 输出格式 → 边界值 → 变量类型 → 算法本身 |\n| TLE | Time Limit Exceeded | 复杂度太高或死循环 | 循环是否终止 → 是否 O(n^2) 用在 n=1e5 → 是否重复计算 |\n| RE | Runtime Error | 越界、除零、野指针、爆栈 | 数组大小 +5 → 除数为 0 → 指针未初始化 → 递归深度 |\n| CE | Compile Error | 语法错误 | 看编译器第一行报错（后面的常是连锁反应） |\n| PE | Presentation Error | 空格/换行不符 | 行末空格、最后一行换行 |\n\n排查 WA 的顺序很关键，**先查格式再查算法**：八成 WA 都死在\"多一个空格\"\"少一个换行\"\"小数位数不对\"上。\n\n```c\nlong long sum = 0;      /* 你自己代码里的累加和 */\nint       n   = 0;      /* 个数，可能为 0 */\ndouble    avg;\n\n/* 除零与边界：除法前永远加判断 */\nif (n != 0)\n    avg = (double)sum / n;\nelse\n    avg = 0.0;\n```\n\n### 四、时间分配（按 120 分钟、6 题设计）\n\n| 时间 | 做什么 |\n|---|---|\n| 0–10 分钟 | 通读 6 题，标注难度，决定做题顺序（先易后难） |\n| 10–45 分钟 | 拿下 2 道简单题，每题都要过样例再提交 |\n| 45–95 分钟 | 攻克 2 道中档题（数组/字符串/函数类） |\n| 95–110 分钟 | 尝试压轴题，先写暴力拿部分分，再优化 |\n| 110–120 分钟 | 回查格式、重跑样例、检查数组大小与类型 |\n\n**不要在一道题上死磕超过 20 分钟**。卡住就换题，情绪和时间的双重损失最致命。\n\n### 五、上机时怎么自己造数据\n\n提交前至少自己在草稿纸上跑这几个测试：\n\n1. **最小规模**：`n = 1`、字符串长度为 1、单个元素。\n2. **边界值**：题目给的最大范围（`n = 100`、值 = 最大值）。\n3. **特殊形态**：所有元素相同、严格升序、严格降序、全为 0、含负数。\n4. **空输入或结束标记**：题目说\"输入 0 结束\"时测 0 这一组。\n5. **样例之外的对比**：写个小程序暴力算一遍，和你的输出比对。\n\n```c\n/* 造数据的小工具：生成 n 个随机数 */\n#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\n\nint main(void)\n{\n    int i, n = 10;\n    srand((unsigned)time(NULL));\n    printf(\"%d\\n\", n);\n    for (i = 0; i < n; i++)\n        printf(\"%d \", rand() % 100);\n    printf(\"\\n\");\n    return 0;\n}\n```\n\n### 六、调试技巧\n\n- **printf 大法**：在循环里打印中间变量，确认每一步状态。交卷前记得删掉。\n- **缩小规模**：把 `n = 1000` 改成 `n = 5`，手工验证每一步。\n- **二分注释法**：把后半段代码注释掉，看前半段输出对不对，逐步扩大范围。\n- **怀疑数组越界**：把数组开大 10 倍试试，如果答案变了就说明有越界。\n- **怀疑类型溢出**：把所有 `int` 换成 `long long`（格式符同步改 `%lld`）试一次。\n- **检查未初始化**：把所有变量定义时都赋初值，能消除一大类随机错误。\n- **看题面细节**：题目里每个\"注意\"\"保证\"\"输出样例\"都逐字读一遍。\n\n### 七、交卷前 10 分钟检查清单\n\n1. 所有题目都提交过至少一次了吗（有分比没分强）。\n2. 数组大小是否留了余量（`+5` 或 `+10`）。\n3. 是否用了 `long long` 的地方还没改格式符。\n4. 多组输入是否写成 `while (scanf(...) == 1)`。\n5. 行末是否有多余空格、最后一行是否有换行。\n6. 是否误用了 `gets`（本题集与评测机都不允许，用 `fgets`）。\n7. 编译警告里有没有\"未初始化变量\"\"数组下标可能越界\"的提示。\n\n### 八、考场心态\n\n- 每道题先想\"暴力怎么做\"，暴力能过就先交暴力，再想优化。\n- 忘了一个库函数不要紧，手写 5 行足够（`strlen`、`strcmp`、`swap`）。\n- 卡住时把题面重读一遍，多数\"想不出\"其实是\"读错了\"。\n- 剩下 20 分钟不要大改结构，只做小修补。\n"},{"id":"g-audit","title":"逐项覆盖核查与补缺导航","ch":"本次修订 · 核查表","weight":"高频","body":"### 核查范围\n\n核查依据：本地 SPEC_FINAL.md、原有150道精选题、知识精讲、速查手册及 PTA 原题库。范围按课程“基础至数组、字符串、函数递归、指针动态内存、结构体与封装”整理，并保留原资料中的算法拓展。未取得学校正式考纲，不能据此断言覆盖所有可能的C语言考题。\n\n本次核查表以原题的每个具体任务为一行，并增加原题缺少的语言机制专项。每行至少有两道可定位的练习。原有具体任务采用“一道完整编程＋一道配套代码分析”；V-题与原题共用算法，**不是第二道独立编程题**。新增X/K专项是独立编程题。模考试题不用于凑题库最低数量。\n\n练习方法：编程题先独立实现；代码分析题先写指定输入的输出、关键变量变化、停止条件和边界解释，再展开答案核对。代码分析题样例区另给格式参考；指定输入的输出可由参考程序核对。\n\n新增重点：二级指针、数组指针及二维参数、realloc扩容、深浅复制、回调、静态局部与遮蔽、递归数组处理、const指针、void指针、生存期、sizeof与数组形参退化、宏与条件编译、短路求值、break/continue、缓冲区容量、memmove、typedef。联合体、链表、文件流为拓展，不据此推断学校一定考查。\n\n“类的设计”按原资料的C语言约定，用结构体与操作函数训练封装；不添加C++类语法。原T05、T11、T12、T13及新增FM9-4、FM10-5覆盖该思想。\n\n## 题型覆盖表\n\n编程任务覆盖：数值计算、条件与枚举、循环与模拟、数组统计和修改、排序与查找、矩阵变换、字符串处理、函数接口与递归、指针操作和动态内存、结构体排序及管理、算法综合。每个原有具体任务增加配套代码分析。额外补充语言机制专项，题号与每个小类别的数量见下表。\n\n| 所属板块 | 具体小类别 / 原任务 | 对应题号 | 数量 | 练习构成 |\n|---|---|---|---:|---|\n| 指针内存 | 二级指针：改变指向与动态分配 | X001, X002 | 2 | 两道专项编程 |\n| 指针内存 | 数组指针与二维参数 | X003, X004 | 2 | 两道专项编程 |\n| 指针内存 | 动态扩容与所有权 | X005, X006 | 2 | 两道专项编程 |\n| 指针内存 | 函数指针与回调 | X007, X008 | 2 | 两道专项编程 |\n| 函数递归 | 作用域与静态局部变量 | X009, X010 | 2 | 两道专项编程 |\n| 函数递归 | 递归数组处理 | X011, X012 | 2 | 两道专项编程 |\n| 自定义类型 | 联合体与枚举类型（拓展） | X013, X014 | 2 | 两道专项编程 |\n| 基础 | 宏与条件编译 | X015, X016 | 2 | 两道专项编程 |\n| 基础 | 整型提升与表达式转换 | X017, X018 | 2 | 两道专项编程 |\n| 算法综合 | 位掩码集合操作 | X019, X020 | 2 | 两道专项编程 |\n| 字符串 | 字符串终止符与缓冲区容量 | X021, X022 | 2 | 两道专项编程 |\n| 自定义类型 | 结构体复制与指针成员 | X023, X024 | 2 | 两道专项编程 |\n| 指针内存 | 单链表（拓展） | X025, X026 | 2 | 两道专项编程 |\n| 基础 | 两数之和与差的计算 | A01, V-A01 | 2 | 编程＋配套代码分析 |\n| 基础 | 性别、年龄与身高的格式化输出 | A02, V-A02 | 2 | 编程＋配套代码分析 |\n| 基础 | 四则运算表达式的求值 | A03, V-A03 | 2 | 编程＋配套代码分析 |\n| 基础 | 圆的周长与面积 | A04, V-A04 | 2 | 编程＋配套代码分析 |\n| 基础 | 三位整数的拆位与逆序 | A05, V-A05 | 2 | 编程＋配套代码分析 |\n| 基础 | 网购订单的运费计算 | A06, V-A06 | 2 | 编程＋配套代码分析 |\n| 基础 | 公历闰年判断 | A07, V-A07 | 2 | 编程＋配套代码分析 |\n| 基础 | 字母的编码与大小写转换 | A08, V-A08 | 2 | 编程＋配套代码分析 |\n| 基础 | 基本数据类型与所占字节数 | A09, V-A09 | 2 | 编程＋配套代码分析 |\n| 基础 | 三角形面积（海伦公式） | A10, V-A10 | 2 | 编程＋配套代码分析 |\n| 基础 | 双十一满减与会员折扣 | A11, V-A11 | 2 | 编程＋配套代码分析 |\n| 选择 | 两个整数的大小比较 | B01, V-B01 | 2 | 编程＋配套代码分析 |\n| 选择 | 表达式求值与除零判断 | B02, V-B02 | 2 | 编程＋配套代码分析 |\n| 选择 | 百分制成绩的等级划分 | B03, V-B03 | 2 | 编程＋配套代码分析 |\n| 选择 | 居民阶梯水费计算 | B04, V-B04 | 2 | 编程＋配套代码分析 |\n| 选择 | 该日期是当年的第几天 | B05, V-B05 int *out`，修改形参地址不会改变调用者的指针变量。返回多个统计量通常分别传入输出对象的地址。\n\n`malloc(n * sizeof *p)`分配后先判空。`realloc`先用临时指针接收，成功才更新原指针；失败时原对象仍由原指针持有。本资料约定动态数组规模为正，不依赖零大小分配的实现差异。`calloc`把分配的字节置零；不要把全零字节模式泛化为所有平台上任意类型的数值表示。\n\n返回自动局部变量的地址会产生悬空指针；返回调用者仍存活的数组内部地址可以有效。释放堆对象后，任何指向该对象的别名都不能继续解引用，仅将其中一个指针置NULL不会修复其他别名。\n\n结构体赋值复制全部成员的值。成员是普通int时得到独立值；成员是指针时复制地址，仍共享目标对象。独立副本必须另分配内存并复制内容。`void *`应转换回实际对象的类型再访问，不能在标准C中直接解引用或做指针算术。\n\n### 数组、字符串和边界\n\n在数组定义处，`sizeof a / sizeof a[0]`可得到元素数；函数形参`int a[]`被调整为指针，必须显式传长度。`sizeof`结果类型是`size_t`，输出用`%zu`。不要假设指针宽度等于int宽度。\n\n长度为n的C字符串至少需要n+1字节容纳终止符。`strlen`不含终止符，`sizeof`是对象大小。读取整行可用`fgets`，它可能保留换行；缓冲区不够时可能只读到一部分。`scanf`读取字符前的空白控制与读取数字后的残留换行需特别检查。字符串字面量不可修改，需修改的内容应存入字符数组。\n\n源与目标区域重叠时用`memmove`，不能依赖`memcpy`；删除、插入字符串时应把终止符一起移动。`strcmp`仅保证结果的正负或零，不保证恰好返回1或-1。`strncpy`达到上限时可能不补终止符，不能把它简单当作总是安全的字符串复制。\n\n### 表达式、宏与控制流\n\n整数除法先截断，事后转double不能恢复小数；大整数乘法要先把至少一个操作数扩大到`long long`，仅扩大接收变量类型不能避免中间int溢出。带符号整数溢出没有可依赖的标准输出。不要为`i++ + ++i`等未定义行为题猜固定答案。\n\n`&&`和`||`从左到右短路求值，可用于保护除数和数组下标；`&`、`|`是按位运算，不短路。普通函数实参的求值次序不能假定从左到右。`break`退出最近一层循环或switch；`continue`进入最近一层循环的下一轮，for循环仍执行更新表达式。\n\n函数式宏应给参数和完整展开式加括号，但括号不能消除重复求值的副作用。需要单次求值时优先考虑函数。条件编译在编译前进行，不是运行时分支。头文件声明、多源文件链接、extern及static的文件作用域可结合课程讲义阅读；本离线题库的可运行答案统一为单文件程序。\n\n### 作用域、递归与自定义类型\n\n自动局部变量每次进入块获得新的对象；静态局部变量在多次调用间保存值。块内同名声明可以遮蔽外层名字。C语言参数都是值传递，地址也是作为指针值传入。\n\n递归必须同时说明出口、规模缩小和返回值含义。数组递归先处理空区间或单元素出口，再访问元素；不能靠全局变量初值掩盖负数或空集合边界。回溯题还需说明撤销修改的位置。\n\ntypedef定义类型别名，不创建自动类型转换规则。枚举常量可表示离散状态；联合体成员共享存储，应使用类型标记决定读取哪个成员。结构体加一组操作函数可以训练C语言中的封装思想；操作应先校验，再修改对象，拒绝的操作保持原状态。\n\n### 拓展边界\n\n单链表题训练结构体自引用、二级指针及节点释放。文件流题训练打开失败处理、读写返回值、关闭、rewind与fseek；二进制直接写结构体可能受填充、字节序和类型宽度影响，不应作为通用可移植文件格式。是否考试以正式教学要求为准。\n"}]}};</script>

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function fmtTime(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtClock(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }
  function stars(n) {
    n = Math.max(1, Math.min(5, n || 1));
    var out = '';
    for (var i = 0; i < 5; i++) out += i < n ? '★' : '<span class="off">★</span>';
    return out;
  }

  function toast(msg) {

  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);

    document.body.removeChild(ta);

  /* ================= 轻量 Markdown ================= */
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function md(text) {
    if (!text) return '';
    var lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    var out = [], para = [], i = 0;
    function flush() {
      if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; }
    }
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*```/.test(line)) {
        flush();
        var lang = line.replace(/^\s*```/, '').trim();
        var buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push('<pre class="code"><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^###\s+/.test(line)) { flush(); out.push('<h4>' + inline(line.replace(/^###\s+/, '')) + '</h4>'); i++; continue; }
      if (/^\s*\|/.test(line)) {
        flush();
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function (c) { return c.trim(); }); };
        var html = '<table>';
        rows.forEach(function (r, ri) {
          if (ri === 1 && /^[\s|:\-]+$/.test(r)) return;
          var tag = ri === 0 ? 'th' : 'td';
          html += '<tr>' + cells(r).map(function (c) { return '<' + tag + '>' + inline(c) + '</' + tag + '>'; }).join('') + '</tr>';
        });
        html += '</table>';
        out.push(html);
        continue;
      }
      if (/^\s*[-*]\s+/.test(line)) {
        flush();
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ul>' + items.join('') + '</ul>');
        continue;
      }
      if (/^\s*\d+\.\s+/.test(line)) {
        flush();
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          oitems.push('<li>' + inline(lines[i].replace(/^\s*\d+\.\s+/, '')) + '</li>');
          i++;
        }
        out.push('<ol>' + oitems.join('') + '</ol>');
        continue;
      }
      if (line.trim() === '') { flush(); i++; continue; }
      para.push(line);
      i++;
    }
    flush();
    return out.join('\n');
  }

    PROBLEMS.forEach(function (p) {
      var a = store.answers[p.id];
      if (a && a.text && a.text.trim()) s.answered++;
      var st = statusOf(p.id);
      if (st === 'done') s.done++;
      else if (st === 'doing') s.doing++;

    s.wrong = Object.keys(store.wrong).filter(function (id) { return !!BY_ID[id]; }).length;

      if (statusOf(p.id) === 'done') done++;

      ? shown.map(function(p) { return '<a class="card problem-summary" href="#/library/' + p.id + '"><span class="p-id">' + esc(p.id) + '</span><div><h3>' + esc(p.title) + '</h3><span class="muted small">' + esc(catName(p.cat)) + ' · ' + ({todo:'未做',doing:'在练',done:'已掌握',review:'需复习'}[statusOf(p.id)]) + '</span></div><span class="stars">' + stars(p.difficulty) + '</span><span>作答 →</span></a>'; }).join('')
      : '<div class="card empty">没有符合条件的题目。<br>试试清空搜索词或切换到「全部题目」。</div>';
    var more = document.getElementById('loadMore');
    if (more) {
      if (list.length > shown.length) {
        more.innerHTML = '<button class="btn" data-load-more="1">加载更多（还有 ' + (list.length - shown.length) + ' 题）</button>';
      } else if (list.length) {
        more.innerHTML = '<span class="muted small">已显示全部 ' + list.length + ' 题</span>';
      } else {
        more.innerHTML = '';
      }
    }
    var rc = document.getElementById('resultCount');
    if (rc) rc.textContent = '共 ' + list.length + ' 题，已显示 ' + shown.length + ' 题';
    var cats = document.querySelectorAll('[data-cat]');
    for (var i = 0; i < cats.length; i++) cats[i].classList.toggle('active', cats[i].dataset.cat === state.cat);
    var diffs = document.querySelectorAll('[data-diff]');
    for (var j = 0; j < diffs.length; j++) diffs[j].classList.toggle('active', Number(diffs[j].dataset.diff) === state.diff);
    var sts = document.querySelectorAll('[data-st]');
    for (var k = 0; k < sts.length; k++) sts[k].classList.toggle('active', sts[k].dataset.st === state.status);
    var w = document.getElementById('wrongOnly');
    if (w) w.checked = state.wrongOnly;
  }

  /* ================= 模拟考试列表 ================= */
  function examCard(e) {
    var ses = examSession(e);
    var submitted = ses && ses.submittedAt;
    var total = (e.problems || []).length;
    var answered = 0;
    (e.problems || []).forEach(function (p) { var a = store.answers[p.id]; if (a && a.text && a.text.trim()) answered++; });
    var topics = {};
    (e.problems || []).forEach(function (p) { topics[p.cat] = true; });
    var topicHtml = Object.keys(topics).map(function (c) { return '<span class="tag">' + catName(c) + '</span>'; }).join('');
    var status = submitted ? '<span class="pill ok">已完成</span>' : (ses ? '<span class="pill warn">进行中</span>' : '<span class="pill">未开始</span>');
    var btn = submitted
      ? '<a class="btn" href="#/exam/' + e.id + '">查看试卷与答案</a>'
      : (ses ? '<a class="btn primary" href="#/exam/' + e.id + '">继续答题</a>' : '<button class="btn primary" data-start-exam="' + e.id + '">开始模考</button>');
    return '<div class="card exam-card"><div class="top"><div><h3>' + esc(e.title) + '</h3><div class="sub">' + esc(e.subtitle || '') + '</div></div>' + status + '</div>' +
      '<div class="meta"><span>' + total + ' 题</span><span>' + (e.duration || 120) + ' 分钟</span><span>已作答 ' + answered + '/' + total + '</span>' + (submitted ? '<span>交卷时间 ' + fmtTime(submitted) + '</span>' : '') + '</div>' +
      '<div class="topics">' + topicHtml + '</div>' +
      '<div class="exam-progress"><div class="cap"><span>作答进度</span><span>' + answered + '/' + total + '</span></div><div class="bar thin"><i style="width:' + pct(answered, total) + '%"></i></div></div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' + btn + (submitted ? '<button class="btn small" data-start-exam="' + e.id + '" data-reset="1">重新模考</button>' : '') + '</div></div>';
  }
  function viewExams() {
    var intro = '<div class="card" style="padding:16px 20px;margin-bottom:16px;background:var(--panel-2)">' +
      '<b>模拟考试说明</b><div class="muted small" style="margin-top:4px">期末卷每套 6 题、限时 120 分钟，按本地课程资料覆盖函数、字符串、指针、结构体与算法。FM7–FM10为新增仿真卷，每卷100分；练习卷不代表学校真实命题。「期中范围热身卷」每套 5 题、限时 90 分钟。点开始后计时，交卷后显示参考答案；作答自动保存，可随时退出再继续。</div></div>';
    var fm = EXAMS.filter(function (e) { return /^FM/.test(e.id || ''); });
    var warm = EXAMS.filter(function (e) { return !/^FM/.test(e.id || ''); });
    var blocks = '';
    if (fm.length) blocks += '<div class="section-title"><h2>期末全真模拟卷</h2><span class="sub">6 题 / 120 分钟 · 覆盖实验 5–11</span></div><div class="grid cols-2">' + fm.map(examCard).join('') + '</div>';
    if (warm.length) blocks += '<div class="section-title"><h2>期中范围热身卷</h2><span class="sub">5 题 / 90 分钟 · Ch1–Ch4</span></div><div class="grid cols-2">' + warm.map(examCard).join('') + '</div>';
    return '<div class="page-head"><div><h1>模拟考试</h1><p>共 ' + EXAMS.length + ' 套限时训练，其中 ' + fm.length + ' 套期末全真卷。建议先按考点练熟新增内容，再用全真卷检验。</p></div></div>' +
      intro + blocks;
  }

  /* ================= 考场 ================= */
  function examById(id) {
    for (var i = 0; i < EXAMS.length; i++) if (EXAMS[i].id === id) return EXAMS[i];
    return null;
  }
  function sessionOf(e) {
    var s = store.exams[e.id];
    if (!s) {
      s = { startedAt: Date.now(), submittedAt: null, current: 1 };
      store.exams[e.id] = s;
      save();
    }
    return s;
  }
  function viewExamRoom() {
    var e = examById(state.examId);
    if (!e) return '<div class="empty">未找到该试卷。<a href="#/exams">返回模拟考试</a></div>';
    var ses = sessionOf(e);
    var submitted = !!ses.submittedAt;
    var total = e.problems.length;
    var no = Math.max(1, Math.min(total, ses.current || 1));
    var q = e.problems[no - 1];
    var answeredN = 0;
    e.problems.forEach(function (p) { var a = store.answers[p.id]; if (a && a.text && a.text.trim()) answeredN++; });
    var navBtns = e.problems.map(function (p, i) {
      var a = store.answers[p.id];
      var has = a && a.text && a.text.trim();
      return '<button class="qbtn' + (i + 1 === no ? ' active' : '') + (has ? ' answered' : '') + '" data-exam-no="' + (i + 1) + '"><span class="no">' + (i + 1) + '</span><span class="t">' + esc(p.title) + '</span></button>';
    }).join('');
    var banner = submitted ? '<div class="exam-submitted">✅ 已交卷（' + fmtTime(ses.submittedAt) + '）。下面显示参考答案，可对照答案把错题加入错题本，再点「重新模考」再练一轮。</div>' : '';
    var timerHtml = submitted ? '<span class="exam-timer" id="examTimer">已交卷</span>' : '<span class="exam-timer" id="examTimer">--:--</span>';
    return '<div class="exam-room">' +
      '<div class="exam-head"><div><div class="title">' + esc(e.title) + '</div><div class="sub">' + esc(e.subtitle || '') + ' · 共 ' + total + ' 题 · ' + (e.duration || 120) + ' 分钟</div></div>' + timerHtml +
      '<button class="btn small" data-exam-exit="1">退出考场</button></div>' +
      '<div class="exam-body"><aside class="exam-nav"><div class="legend">题号颜色：<b style="color:var(--teal)">绿</b>=已作答，蓝=当前题</div>' + navBtns +
      '<div style="margin-top:14px"><div class="muted small">已作答 ' + answeredN + '/' + total + '</div><div class="bar thin" style="margin-top:6px"><i style="width:' + pct(answeredN, total) + '%"></i></div></div></aside>' +
      '<div class="exam-main"><div class="q-wrap">' + banner +
      '<div class="q-head"><span class="p-id">' + esc(q.id) + '</span><h2>' + esc(q.title) + '</h2><span class="stars">' + stars(q.difficulty) + '</span></div>' +
      metaHtml(q) + '<div class="q-desc md">' + md(q.desc) + '</div>' + samplesHtml(q) + answerHtml(q) +
      (submitted ? solutionHtml(q) : '<div class="muted small" style="margin-top:12px">交卷后可查看参考答案。</div>') +
      '</div></div></div>' +
      '<div class="exam-foot"><button class="btn" data-exam-prev="1"' + (no <= 1 ? ' disabled' : '') + '>← 上一题</button>' +
      '<button class="btn" data-exam-next="1"' + (no >= total ? ' disabled' : '') + '>下一题 →</button><span class="spacer"></span>' +
      (submitted ? '<span class="muted small">已交卷，可继续查看解析</span>' : '<button class="btn teal" data-exam-submit="1">交卷并查看参考答案</button>') +
      '</div></div>';
  }
  function startTimer(e) {
    if (state.timerId) clearInterval(state.timerId);
    var ses = store.exams[e.id];
    if (!ses || ses.submittedAt) return;
    var tick = function () {
      var s = store.exams[e.id];
      if (!s || s.submittedAt) { clearInterval(state.timerId); state.timerId = null; return; }
      var left = s.startedAt + (e.duration || 90) * 60000 - Date.now();
      var el = document.getElementById('examTimer');
      if (el) {
        el.textContent = fmtClock(left);
        el.classList.toggle('warn', left <= 5 * 60000);
      }
      if (left <= 0) {
        clearInterval(state.timerId);
        state.timerId = null;
        submitExam(e, true);
      }
    };
    tick();
    state.timerId = setInterval(tick, 1000);
  }
  function submitExam(e, auto) {
    var s = store.exams[e.id];
    if (!s || s.submittedAt) return;
    if (!auto && !confirm('确定交卷吗？交卷后可以查看参考答案，但仍可继续修改作答记录。')) return;
    s.submittedAt = Date.now();
    saveNow();
    render();
    toast(auto ? '时间到，已自动交卷' : '已交卷，参考答案已显示');
  }

  /* ================= 错题本 ================= */
  function wrongList() {
    return Object.keys(store.wrong).filter(function (id) { return !!BY_ID[id]; }).map(function (id) {
      return { id: id, p: BY_ID[id], w: store.wrong[id] };
    }).sort(function (a, b) {
      var ca = (CATS.map(function (c) { return c.id; }).indexOf(a.p.cat));
      var cb = (CATS.map(function (c) { return c.id; }).indexOf(b.p.cat));
      if (ca !== cb) return ca - cb;
      return (a.w.added || 0) - (b.w.added || 0);
    });
  }
  function viewWrong() {
    var list = wrongList();
    var byCat = {};
    list.forEach(function (it) { (byCat[it.p.cat] = byCat[it.p.cat] || []).push(it); });
    var groups = CATS.filter(function (c) { return byCat[c.id]; }).map(function (c) {
      var items = byCat[c.id].map(function (it) {
        return '<div class="wrong-item card"><span class="id">' + esc(it.id) + '</span>' +
          '<div><h4>' + esc(it.p.title) + '</h4><div class="meta">' + esc(catName(it.p.cat)) + ' · ' + stars(it.p.difficulty) + ' · 收录于 ' + fmtTime(it.w.added) +
          ' · 状态：' + ({ todo: '未做', doing: '在练', done: '已掌握', review: '需复习' }[statusOf(it.id)] || '未做') + '</div>' +
          '<textarea data-wrong-reason="' + it.id + '" placeholder="记录错误原因：是思路错了、边界漏了，还是格式/输出问题？">' + esc(it.w.reason || '') + '</textarea></div>' +
          '<div class="acts"><button class="btn small" data-goto-problem="' + it.id + '">去题目</button><button class="btn small danger" data-remove-wrong="' + it.id + '">移除</button></div></div>';
      }).join('');
      return '<div class="section-title" style="margin-top:18px"><h2 style="font-size:15px">' + c.name + '<span class="muted small" style="font-weight:400"> · ' + byCat[c.id].length + ' 题</span></h2><span class="sub">' + c.ch + '</span></div><div class="wrong-list">' + items + '</div>';
    }).join('');
    var md = '# 错题本（计导期末复习）\n\n收录 ' + list.length + ' 题\n\n' + list.map(function (it) {
      return '- ' + it.id + ' ' + it.p.title + '（' + catName(it.p.cat) + '）' + (it.w.reason ? '\n  - 错误原因：' + it.w.reason : '');
    }).join('\n');
    return '<div class="page-head"><div><h1>错题本</h1><p>按题号记录你的错题与错误原因，复习时优先重做。数据保存在本机浏览器，可导出。</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-export-wrong="1">导出错题本 (Markdown)</button><button class="btn danger" data-clear-wrong="1">清空错题本</button></div></div>' +
      (list.length ? '<div class="grid cols-4" style="margin-bottom:6px">' + CATS.map(function (c) {
        var n = (byCat[c.id] || []).length;
        return '<div class="card" style="padding:12px 16px"><div class="muted small">' + c.short + '</div><b style="font-size:22px">' + n + '</b><span class="muted small"> 题</span></div>';
      }).join('') + '</div>' : '') +
      (list.length ? groups : '<div class="card empty">错题本还是空的。在题目卡片上点「☆ 加入错题本」即可按题号收录；做错的题、没思路的题都可以放进来。</div>') +
      (list.length ? '<div class="section-title"><h2 style="font-size:15px">导出的 Markdown 预览</h2><span class="sub">点右上角按钮下载 .md 文件</span></div><textarea class="export-box" readonly>' + esc(md) + '</textarea>' : '');
  }

  /* ================= 速查手册 ================= */
  function viewSheet() {
    if (!SECTIONS.length) return '<div class="card empty">速查手册内容生成中…</div>';
    var nav = SECTIONS.map(function (s, i) { return '<button data-sheet="' + i + '">' + esc(s.title) + '</button>'; }).join('');
    var body = SECTIONS.map(function (s, i) {

      '<div class="sheet-layout"><aside class="sheet-nav card">' + nav + '</aside><div class="card sheet-body">' + body + '</div></div>';

  /* ================= 知识精讲 ================= */
  function viewGuide() {
    if (!GUIDE.length) return '<div class="card empty">知识精讲内容生成中…（请重新构建网页）</div>';
    var cur = state.guideId;
    var nav = GUIDE.map(function (g, i) {
      return '<button class="' + (cur === g.id ? 'active' : '') + '" data-sheet="' + i + '"><span>' + esc(g.title) + '</span>' + (g.weight ? '<i class="pill ' + (g.weight === '必考' ? 'danger' : g.weight === '高频' ? 'warn' : '') + '">' + esc(g.weight) + '</i>' : '') + '</button>';
    }).join('');

      }).join('');

    }).join('');
    var totalFinal = CATS.filter(function (c) { return c.group === 'final'; }).reduce(function (a, c) { return a + catStats(c.id).total; }, 0);
    return '<div class="page-head"><div><h1>知识精讲</h1><p>期末新增考点的系统讲解：概念 → 语法 → 代码模板 → 常见错误 → 对应练习。期末新增题库共 ' + totalFinal + ' 道题，讲完一节就去练那一组。</p></div>' +
      '<div class="muted small">' + GUIDE.length + ' 节</div></div>' +
      '<div class="sheet-layout"><aside class="sheet-nav card">' + nav + '</aside><div class="card sheet-body">' + body + '</div></div>';

  function scrollToGuideSection(id) {

  /* ================= 行为 ================= */
  function setAnswer(id, text) {
    var a = store.answers[id] || { text: '', note: '', updated: 0 };
    a.text = text;
    a.updated = Date.now();
    store.answers[id] = a;
    save();
    var el = document.getElementById('saved-' + id);
    if (el) el.textContent = '已保存 ' + fmtTime(a.updated);
  }
  function setNote(id, note) {
    var a = store.answers[id] || { text: '', note: '', updated: 0 };
    a.note = note;
    a.updated = a.updated || Date.now();
    store.answers[id] = a;
    save();
  }
  function setStatus(id, v) {
    store.status[id] = v;
    save();
    var segs = document.querySelectorAll('[data-status="' + id + '"]');
    for (var i = 0; i < segs.length; i++) segs[i].classList.toggle('on', segs[i].dataset.v === v);
  }
  function toggleWrong(id) {
    if (store.wrong[id]) {
      delete store.wrong[id];
      toast('已从错题本移除');
    } else {
      store.wrong[id] = { added: Date.now(), reason: '' };
      toast('已加入错题本');
    }
    save();
    var btns = document.querySelectorAll('[data-wrong="' + id + '"]');
    var on = !!store.wrong[id];
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', on);
      btns[i].textContent = on ? '★ 已收录错题本' : '☆ 加入错题本';
    }
  }
  function gotoProblem(id) {
    var p = BY_ID[id];
    if (!p) return;
    if (p._exam) { location.hash = '#/exam/' + p._exam; var ses = store.exams[p._exam]; if (ses) ses.current = examById(p._exam).problems.indexOf(p) + 1; }
    else location.hash = '#/library/' + id;
  }
  function viewPractice() {
    var p = BY_ID[state.problemId];
    var list = filtered();
    if (!list.some(function(x) { return x.id === p.id; })) list = PROBLEMS;
    var idx = list.indexOf(p);
    var cat = CAT_MAP[p.cat];
    var guideBtn = (cat && cat.guide) ? '<a class="btn small" href="#/guide/' + cat.guide + '">看考点精讲</a>' : '';
    return '<div class="practice-toolbar"><a class="btn small" href="#/library">← 返回题库</a><button class="btn small" data-toggle-list aria-expanded="true">收起题目列表</button>' + guideBtn + '<span class="muted small">作答自动保存 · ' + (idx+1) + ' / ' + list.length + '</span><span class="spacer"></span><button class="btn small" data-goto-problem="' + (list[idx-1] || p).id + '" ' + (idx === 0 ? 'disabled' : '') + '>上一题</button><button class="btn small" data-goto-problem="' + (list[idx+1] || p).id + '" ' + (idx === list.length-1 ? 'disabled' : '') + '>下一题</button></div><div class="practice-layout"><aside class="practice-nav card" aria-label="题目列表"><div class="practice-nav-title">题目列表 <span class="muted small">' + list.length + ' 题</span></div>' + list.map(function(x) { return '<a href="#/library/' + x.id + '" class="practice-link ' + (x.id === p.id ? 'active' : '') + '" ' + (x.id === p.id ? 'aria-current="page"' : '') + '><span class="mono">' + x.id + '</span><span>' + esc(x.title) + '</span></a>'; }).join('') + '</aside><section class="practice-main">' + cardHtml(p) + '</section></div>';
  }
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function exportAll() {
    saveNow();
    download('计导期末复习-记录备份-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(store, null, 2));
    toast('已导出 JSON 备份');
  }
  function exportAnswersMd() {
    var lines = ['# 计导期末复习 · 作答记录', '', '导出时间：' + new Date().toLocaleString(), ''];
    var n = 0;
    PROBLEMS.forEach(function (p) {
      var a = answerOf(p.id);
      if (!a.text || !a.text.trim()) return;
      n++;
      lines.push('## ' + p.id + ' ' + p.title, '', '状态：' + ({ todo: '未做', doing: '在练', done: '已掌握', review: '需复习' }[statusOf(p.id)] || '') + '　难度：' + p.difficulty + '★', '');
      lines.push('```c');
      lines.push(a.text);
      lines.push('```', '');
      if (a.note) lines.push('> 备注：' + a.note, '');
    });
    if (!n) { toast('还没有作答记录'); return; }
    download('计导期末复习-作答记录.md', lines.join('\n'), 'text/markdown;charset=utf-8');
    toast('已导出 ' + n + ' 道题的作答');
  }
  function exportWrongMd() {
    var list = wrongList();
    if (!list.length) { toast('错题本还是空的'); return; }
    var lines = ['# 错题本（计导期末复习）', '', '共 ' + list.length + ' 题', ''];
    list.forEach(function (it) {
      lines.push('- **' + it.id + '** ' + it.p.title + '（' + catName(it.p.cat) + '）' + (it.w.reason ? '　错误原因：' + it.w.reason : ''));
    });
    download('计导期末复习-错题本.md', lines.join('\n'), 'text/markdown;charset=utf-8');
    toast('已导出错题本');
  }
  function startExam(id, reset) {
    var e = examById(id);
    if (!e) return;
    if (reset) {
      if (!confirm('重新模考会重新开始计时，已作答内容会保留，确定吗？')) return;
      store.exams[id] = { startedAt: Date.now(), submittedAt: null, current: 1 };
      saveNow();
    } else if (!store.exams[id]) {
      store.exams[id] = { startedAt: Date.now(), submittedAt: null, current: 1 };
      saveNow();
    }
    location.hash = '#/exam/' + id;
    if (state.view === 'exam') render();
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var el;

    if ((el = t.closest('[data-toggle-list]'))) {
      var collapsed = document.querySelector('.practice-layout').classList.toggle('list-collapsed');
      el.textContent = collapsed ? '展开题目列表' : '收起题目列表';
      el.setAttribute('aria-expanded', String(!collapsed)); return;
    }
    if ((el = t.closest('[data-copy-btn]'))) return;

    if ((el = t.closest('.copy-btn'))) {
      var box = el.closest('.sample') || el.closest('.sol-code-wrap');
      var pre = box && box.querySelector('pre');
      if (pre) copyText(pre.textContent);
      ev.preventDefault();
      return;
    }
    if ((el = t.closest('[data-cat]'))) {
      state.cat = el.dataset.cat; state.page = 1; renderList(); return;
    }
    if ((el = t.closest('[data-diff]'))) {
      state.diff = Number(el.dataset.diff); state.page = 1; renderList(); return;
    }
    if ((el = t.closest('[data-st]'))) {
      state.status = el.dataset.st; state.page = 1; renderList(); return;
    }
    if ((el = t.closest('[data-status]'))) {
      setStatus(el.dataset.status, el.dataset.v);
      return;
    }
    if ((el = t.closest('[data-wrong]'))) {
      toggleWrong(el.dataset.wrong);
      return;
    }
    if ((el = t.closest('[data-clear-answer]'))) {
      var cid = el.dataset.clearAnswer;
      if (!confirm('清空这道题的作答记录？')) return;
      store.answers[cid] = { text: '', note: '', updated: 0 };
      saveNow();
      var card = document.getElementById('p-' + cid);
      if (card) { var ta = card.querySelector('[data-answer]'); if (ta) ta.value = ''; var nt = card.querySelector('[data-note]'); if (nt) nt.value = ''; }
      var sv = document.getElementById('saved-' + cid); if (sv) sv.textContent = '已清空';
      toast('已清空');
      return;
    }
    if ((el = t.closest('[data-load-more]'))) {
      state.page++; renderList(); return;
    }
    if ((el = t.closest('[data-goto-cat]'))) {
      ev.preventDefault();
      state.cat = el.dataset.gotoCat; state.view = 'library'; location.hash = '#/library';
      if (state.view === 'library' && location.hash === '#/library') render();
      return;
    }
    if ((el = t.closest('[data-nav-href]'))) {
      location.hash = el.dataset.navHref; return;
    }
    if ((el = t.closest('[data-goto-problem]'))) { gotoProblem(el.dataset.gotoProblem); return; }
    if ((el = t.closest('[data-remove-wrong]'))) {
      delete store.wrong[el.dataset.removeWrong];
      saveNow();
      render();
      toast('已从错题本移除');
      return;
    }
    if ((el = t.closest('[data-clear-wrong]'))) {
      if (!Object.keys(store.wrong).length) { toast('错题本已经是空的'); return; }
      if (!confirm('清空错题本？所有记录将被删除。')) return;
      store.wrong = {};
      saveNow();
      render();
      toast('错题本已清空');
      return;
    }
    if ((el = t.closest('[data-export-wrong]'))) { exportWrongMd(); return; }
    if ((el = t.closest('[data-export-all]'))) { exportAll(); return; }
    if ((el = t.closest('[data-export-answers]'))) { exportAnswersMd(); return; }
    if ((el = t.closest('[data-clear-all]'))) {
      if (!confirm('确定清空全部记录吗？此操作不可恢复，建议先导出备份。')) return;
      if (!confirm('再次确认：清空全部作答、状态、错题本与模考记录？')) return;
      store = emptyStore();
      saveNow();
      render();
      toast('已清空全部记录');
      return;
    }
    if ((el = t.closest('[data-start-exam]'))) {
      startExam(el.dataset.startExam, el.dataset.reset === '1');
      return;
    }
    if ((el = t.closest('[data-exam-no]'))) {
      var e0 = examById(state.examId); if (!e0) return;
      var s0 = store.exams[e0.id]; if (!s0) return;
      s0.current = Number(el.dataset.examNo); saveNow(); render();
      return;
    }
    if ((el = t.closest('[data-exam-prev]'))) {
      var e1 = examById(state.examId); if (!e1) return;
      var s1 = store.exams[e1.id]; if (!s1) return;
      s1.current = Math.max(1, (s1.current || 1) - 1); saveNow(); render(); return;
    }
    if ((el = t.closest('[data-exam-next]'))) {
      var e2 = examById(state.examId); if (!e2) return;
      var s2 = store.exams[e2.id]; if (!s2) return;
      s2.current = Math.min(e2.problems.length, (s2.current || 1) + 1); saveNow(); render(); return;
    }
    if ((el = t.closest('[data-exam-submit]'))) {
      var e3 = examById(state.examId); if (!e3) return;
      submitExam(e3, false); return;
    }
    if ((el = t.closest('[data-exam-exit]'))) {
      location.hash = '#/exams'; return;
    }
    if ((el = t.closest('[data-sheet]'))) {
      var idx = Number(el.dataset.sheet);
      if (state.view === 'guide') {
        var g = GUIDE[idx];
        if (!g) return;
        state.guideId = g.id;
        var target = '#/guide/' + g.id;
        if (location.hash === target) { render(); } else { location.hash = target; }
        return;
      }
      var sec = document.getElementById('sheet-' + idx);
      if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.matches('[data-answer]')) { setAnswer(t.dataset.answer, t.value); return; }
    if (t.matches('[data-note]')) { setNote(t.dataset.note, t.value); return; }
    if (t.matches('[data-wrong-reason]')) {
      var id = t.dataset.wrongReason;
      if (store.wrong[id]) { store.wrong[id].reason = t.value; save(); }
      return;
    }
    if (t.id === 'searchInput') {
      state.q = t.value; state.page = 1; renderList(); return;
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.id === 'wrongOnly') { state.wrongOnly = t.checked; state.page = 1; renderList(); return; }
    if (t.id === 'importFile') {
      var f = t.files && t.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var obj = JSON.parse(String(reader.result));
          if (!obj || typeof obj !== 'object' || !obj.answers) throw new Error('格式不对');
          if (!confirm('导入将覆盖当前全部记录（作答、状态、错题本、模考）。确定导入吗？')) return;
          var base = emptyStore();
          Object.keys(base).forEach(function (k) { if (obj[k] && typeof obj[k] === 'object') base[k] = obj[k]; });
          store = base;
          saveNow();
          render();
          toast('导入成功');
        } catch (err) {
          alert('导入失败：文件不是有效的备份 JSON。');
        }
      };
      reader.readAsText(f, 'utf-8');
      t.value = '';
      return;
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && state.view === 'exam') {
      if (confirm('退出考场？作答已自动保存，下次可继续。')) location.hash = '#/exams';
    }
  });

  /* ================= 顶部主题按钮 ================= */
  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    store.settings.theme = next; save();
    toast(next === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
  });

  /* ================= 启动 ================= */
  function applyTheme() {
    var t = store.settings.theme;
    if (!t) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  }
  applyTheme();
  route();

  if (state.view === 'exam') {
    var e = examById(state.examId);
    if (e) startTimer(e);
  }
  var _origRender = render;
  render = function () {
    _origRender();
    if (state.view === 'exam') {
      var ex = examById(state.examId);
      if (ex) startTimer(ex);
    }
  };
  window.__SITE__ = { problems: PROBLEMS.length, exams: EXAMS.length, sections: SECTIONS.length };
})();
</script>
</body>
</html>
