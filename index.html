fficulty":1,"tags":["指针","函数参数","数组","代码分析"],"source":"配套代码分析（原题 P01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n\nvoid swap(int *pa, int *pb)\n{\n    int t = *pa;\n    *pa = *pb;\n    *pb = t;\n}\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    swap(&a[0], &a[n - 1]);\n\n    for (i = 0; i < n; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1\n7\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n1 2 3 4 5\n","out":"5 2 3 4 1\n"}],"hint":"指定输入的完整输出：\n```\n7\n```\n分析要点：`swap` 的形参是指针，函数内用 `*pa` / `*pb` 读写所指变量；调用时传地址 `&a[i]`。\n边界核对：写成 `swap(a[0], a[n-1])` 是值传递，交换无效；n = 1 时首尾是同一个元素，交换前后不变。","pitfalls":"写成 `swap(a[0], a[n-1])` 是值传递，交换无效；n = 1 时首尾是同一个元素，交换前后不变。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\nvoid swap(int *pa, int *pb)\n{\n    int t = *pa;\n    *pa = *pb;\n    *pb = t;\n}\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    swap(&a[0], &a[n - 1]);\n\n    for (i = 0; i < n; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"V-P02","cat":"pointer","title":"指针扫描找最值·代码分析","difficulty":1,"tags":["指针","数组遍历","最值","代码分析"],"source":"配套代码分析（原题 P02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n    int *p, *best;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    best = a;\n    for (p = a + 1; p < a + n; p++) {\n        if (*p > *best)\n            best = p;\n    }\n\n    printf(\"%d %d\\n\", *best, (int)(best - a));\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\n-5 -2 -8 -1\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"6\n-3 -9 -3 7 7 2\n","out":"7 3\n"}],"hint":"指定输入的完整输出：\n```\n-1 3\n```\n分析要点：用 `best` 记录当前最大元素所在地址，遇到更大值就 `best = p`；下标用 `best - a` 算出。\n边界核对：比较要用 `>` 而不是 `>=`，否则记录的是最后一次出现；最大值初值取 `*a`，全负数时写 `0` 会错。","pitfalls":"比较要用 `>` 而不是 `>=`，否则记录的是最后一次出现；最大值初值取 `*a`，全负数时写 `0` 会错。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n    int *p, *best;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    best = a;\n    for (p = a + 1; p < a + n; p++) {\n        if (*p > *best)\n            best = p;\n    }\n\n    printf(\"%d %d\\n\", *best, (int)(best - a));\n    return 0;\n}\n"},{"id":"V-P03","cat":"pointer","title":"平均分与超标人数·代码分析","difficulty":2,"tags":["指针","数组遍历","平均值","代码分析"],"source":"配套代码分析（原题 P03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n\nint main(void)\n{\n    int n, i, cnt = 0;\n    int a[MAXN];\n    int *p;\n    double sum = 0.0, avg;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    for (p = a; p < a + n; p++)\n        sum += *p;\n    avg = sum / n;\n\n    for (p = a; p < a + n; p++) {\n        if ((double)*p > avg)\n            cnt++;\n    }\n\n    printf(\"%.2f\\n\", avg);\n    printf(\"%d\\n\", cnt);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\n-2 -2 -2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n1 2 3 4 5\n","out":"3.00\n2\n"}],"hint":"指定输入的完整输出：\n```\n-2.00\n0\n```\n分析要点：先遍历一遍把和累加进 `double`，求出平均分；再遍历一遍统计 `*p > avg` 的个数。\n边界核对：平均分要用浮点类型保存，`sum / n` 两个整数相除会被截断；判断要用 `>` 不能用 `>=`。","pitfalls":"平均分要用浮点类型保存，`sum / n` 两个整数相除会被截断；判断要用 `>` 不能用 `>=`。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\nint main(void)\n{\n    int n, i, cnt = 0;\n    int a[MAXN];\n    int *p;\n    double sum = 0.0, avg;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    for (p = a; p < a + n; p++)\n        sum += *p;\n    avg = sum / n;\n\n    for (p = a; p < a + n; p++) {\n        if ((double)*p > avg)\n            cnt++;\n    }\n\n    printf(\"%.2f\\n\", avg);\n    printf(\"%d\\n\", cnt);\n    return 0;\n}\n"},{"id":"V-P04","cat":"pointer","title":"一次返回四个统计量·代码分析","difficulty":2,"tags":["指针","输出参数","函数设计","代码分析"],"source":"配套代码分析（原题 P04）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P04 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n\nvoid analyze(const int *a, int n, int *psum, int *pmax, int *pmin, int *ppos)\n{\n    const int *p;\n\n    *psum = 0;\n    *ppos = 0;\n    *pmax = *a;\n    *pmin = *a;\n\n    for (p = a; p < a + n; p++) {\n        *psum += *p;\n        if (*p > *pmax)\n            *pmax = *p;\n        if (*p < *pmin)\n            *pmin = *p;\n        if (*p > 0)\n            (*ppos)++;\n    }\n}\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n    int sum, maxv, minv, pos;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    analyze(a, n, &sum, &maxv, &minv, &pos);\n\n    printf(\"%d %d %d %d\\n\", sum, maxv, minv, pos);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\n-1 -2 -3 -4\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n4 -2 9 9 0\n","out":"20 9 -2 3\n"}],"hint":"指定输入的完整输出：\n```\n-10 -1 -4 0\n```\n分析要点：最大值、最小值的初值都用 `*a`；循环里 `*psum += *p;`，不要忘记 `(*ppos)++` 的括号。\n边界核对：`*ppos++` 是「先把指针地址加 1」，必须写 `(*ppos)++`；最大值初值写成 0 时全负数用例会出错。","pitfalls":"`*ppos++` 是「先把指针地址加 1」，必须写 `(*ppos)++`；最大值初值写成 0 时全负数用例会出错。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\nvoid analyze(const int *a, int n, int *psum, int *pmax, int *pmin, int *ppos)\n{\n    const int *p;\n\n    *psum = 0;\n    *ppos = 0;\n    *pmax = *a;\n    *pmin = *a;\n\n    for (p = a; p < a + n; p++) {\n        *psum += *p;\n        if (*p > *pmax)\n            *pmax = *p;\n        if (*p < *pmin)\n            *pmin = *p;\n        if (*p > 0)\n            (*ppos)++;\n    }\n}\n\nint main(void)\n{\n    int n, i;\n    int a[MAXN];\n    int sum, maxv, minv, pos;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    analyze(a, n, &sum, &maxv, &minv, &pos);\n\n    printf(\"%d %d %d %d\\n\", sum, maxv, minv, pos);\n    return 0;\n}\n"},{"id":"V-P05","cat":"pointer","title":"手写 strlen 与 strcpy·代码分析","difficulty":2,"tags":["指针","字符串","字符统计","代码分析"],"source":"配套代码分析（原题 P05）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P05 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <ctype.h>\n\n#define MAXLEN 105\n\nint my_strlen(const char *s)\n{\n    const char *p = s;\n\n    while (*p != '\\0')\n        p++;\n    return (int)(p - s);\n}\n\nvoid my_strcpy(char *dst, const char *src)\n{\n    while (*src != '\\0') {\n        *dst = *src;\n        dst++;\n        src++;\n    }\n    *dst = '\\0';\n}\n\nint main(void)\n{\n    char s[MAXLEN];\n    char copy[MAXLEN];\n    const char *p;\n    int upper = 0, lower = 0, digit = 0;\n\n    if (scanf(\"%100s\", s) != 1)\n        return 0;\n\n    my_strcpy(copy, s);\n\n    for (p = s; *p != '\\0'; p++) {\n        if (isupper((unsigned char)*p))\n            upper++;\n        else if (islower((unsigned char)*p))\n            lower++;\n        else if (isdigit((unsigned char)*p))\n            digit++;\n    }\n\n    printf(\"%d\\n\", my_strlen(s));\n    printf(\"%s\\n\", copy);\n    printf(\"%d %d %d\\n\", upper, lower, digit);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nabcdef\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"Code2026Pt\n","out":"10\nCode2026Pt\n2 4 4\n"}],"hint":"指定输入的完整输出：\n```\n6\nabcdef\n0 6 0\n```\n分析要点：`my_strlen` 里让 `p` 从 `s` 走到 `'\\0'`，返回 `p - s`；`my_strcpy` 循环结束后要补写 `*dst = '\\0'`。\n边界核对：复制循环退出时没有给目标串补 `'\\0'`，输出会越界读到垃圾字符；`isupper` 等函数的参数要转成 `unsigned char`。","pitfalls":"复制循环退出时没有给目标串补 `'\\0'`，输出会越界读到垃圾字符；`isupper` 等函数的参数要转成 `unsigned char`。","solution":"#include <stdio.h>\n#include <ctype.h>\n\n#define MAXLEN 105\n\nint my_strlen(const char *s)\n{\n    const char *p = s;\n\n    while (*p != '\\0')\n        p++;\n    return (int)(p - s);\n}\n\nvoid my_strcpy(char *dst, const char *src)\n{\n    while (*src != '\\0') {\n        *dst = *src;\n        dst++;\n        src++;\n    }\n    *dst = '\\0';\n}\n\nint main(void)\n{\n    char s[MAXLEN];\n    char copy[MAXLEN];\n    const char *p;\n    int upper = 0, lower = 0, digit = 0;\n\n    if (scanf(\"%100s\", s) != 1)\n        return 0;\n\n    my_strcpy(copy, s);\n\n    for (p = s; *p != '\\0'; p++) {\n        if (isupper((unsigned char)*p))\n            upper++;\n        else if (islower((unsigned char)*p))\n            lower++;\n        else if (isdigit((unsigned char)*p))\n            digit++;\n    }\n\n    printf(\"%d\\n\", my_strlen(s));\n    printf(\"%s\\n\", copy);\n    printf(\"%d %d %d\\n\", upper, lower, digit);\n    return 0;\n}\n"},{"id":"V-P06","cat":"pointer","title":"手写 strcmp 比较字符串·代码分析","difficulty":2,"tags":["指针","字符串比较","字典序","代码分析"],"source":"配套代码分析（原题 P06）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P06 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXLEN 105\n\nint my_strcmp(const char *s1, const char *s2)\n{\n    const unsigned char *p = (const unsigned char *)s1;\n    const unsigned char *q = (const unsigned char *)s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return (*p < *q) ? -1 : 1;\n}\n\nint first_diff(const char *s1, const char *s2)\n{\n    const char *p = s1;\n    const char *q = s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return -1;\n    return (int)(p - s1);\n}\n\nint main(void)\n{\n    char s1[MAXLEN], s2[MAXLEN];\n\n    if (scanf(\"%100s\", s1) != 1)\n        return 0;\n    if (scanf(\"%100s\", s2) != 1)\n        return 0;\n\n    printf(\"%d\\n\", my_strcmp(s1, s2));\n    printf(\"%d\\n\", first_diff(s1, s2));\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nabc\nab\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"apple\napply\n","out":"-1\n4\n"}],"hint":"指定输入的完整输出：\n```\n1\n2\n```\n分析要点：比较循环的继续条件是 `*p != '\\0' && *p == *q`；循环结束后再判断 `*p == *q` 说明两串相等。\n边界核对：「abc」与「ab」比较时，短串先遇到 `'\\0'`，要按编码值判断短串更小，不能漏掉这个分支。","pitfalls":"「abc」与「ab」比较时，短串先遇到 `'\\0'`，要按编码值判断短串更小，不能漏掉这个分支。","solution":"#include <stdio.h>\n\n#define MAXLEN 105\n\nint my_strcmp(const char *s1, const char *s2)\n{\n    const unsigned char *p = (const unsigned char *)s1;\n    const unsigned char *q = (const unsigned char *)s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return (*p < *q) ? -1 : 1;\n}\n\nint first_diff(const char *s1, const char *s2)\n{\n    const char *p = s1;\n    const char *q = s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return -1;\n    return (int)(p - s1);\n}\n\nint main(void)\n{\n    char s1[MAXLEN], s2[MAXLEN];\n\n    if (scanf(\"%100s\", s1) != 1)\n        return 0;\n    if (scanf(\"%100s\", s2) != 1)\n        return 0;\n\n    printf(\"%d\\n\", my_strcmp(s1, s2));\n    printf(\"%d\\n\", first_diff(s1, s2));\n    return 0;\n}\n"},{"id":"V-P07","cat":"pointer","title":"指针数组切分单词·代码分析","difficulty":2,"tags":["指针数组","字符串切分","输入处理","代码分析"],"source":"配套代码分析（原题 P07）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P07 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXLEN 1005\n#define MAXW 505\n\nint split(char *s, char *words[])\n{\n    int cnt = 0;\n    char *p = s;\n\n    while (*p != '\\0') {\n        while (*p == ' ' || *p == '\\t' || *p == '\\n' || *p == '\\r')\n            p++;\n        if (*p == '\\0')\n            break;\n        if (cnt < MAXW)\n            words[cnt++] = p;\n        while (*p != '\\0' && *p != ' ' && *p != '\\t' && *p != '\\n' && *p != '\\r')\n            p++;\n        if (*p != '\\0') {\n            *p = '\\0';\n            p++;\n        }\n    }\n    return cnt;\n}\n\nint main(void)\n{\n    char text[MAXLEN];\n    char *words[MAXW];\n    int cnt, i;\n\n    if (fgets(text, sizeof text, stdin) == NULL)\n        return 0;\n\n    cnt = split(text, words);\n\n    printf(\"%d\\n\", cnt);\n    for (i = 0; i < cnt; i++)\n        printf(\"%s\\n\", words[i]);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n  hello   world  \n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"Pointer is powerful\n","out":"3\nPointer\nis\npowerful\n"}],"hint":"指定输入的完整输出：\n```\n2\nhello\nworld\n```\n分析要点：指针走一步判一次：跳过所有空白后若还没到串尾，就记下一个单词首地址，再把该单词后的空白写成 `'\\0'`。\n边界核对：`fgets` 会把行末 `'\\n'` 也读进来，要把它当空白处理；连续空格若处理不当会多算单词个数。","pitfalls":"`fgets` 会把行末 `'\\n'` 也读进来，要把它当空白处理；连续空格若处理不当会多算单词个数。","solution":"#include <stdio.h>\n\n#define MAXLEN 1005\n#define MAXW 505\n\nint split(char *s, char *words[])\n{\n    int cnt = 0;\n    char *p = s;\n\n    while (*p != '\\0') {\n        while (*p == ' ' || *p == '\\t' || *p == '\\n' || *p == '\\r')\n            p++;\n        if (*p == '\\0')\n            break;\n        if (cnt < MAXW)\n            words[cnt++] = p;\n        while (*p != '\\0' && *p != ' ' && *p != '\\t' && *p != '\\n' && *p != '\\r')\n            p++;\n        if (*p != '\\0') {\n            *p = '\\0';\n            p++;\n        }\n    }\n    return cnt;\n}\n\nint main(void)\n{\n    char text[MAXLEN];\n    char *words[MAXW];\n    int cnt, i;\n\n    if (fgets(text, sizeof text, stdin) == NULL)\n        return 0;\n\n    cnt = split(text, words);\n\n    printf(\"%d\\n\", cnt);\n    for (i = 0; i < cnt; i++)\n        printf(\"%s\\n\", words[i]);\n    return 0;\n}\n"},{"id":"V-P08","cat":"pointer","title":"指针查找子串首次出现·代码分析","difficulty":3,"tags":["指针","字符串匹配","返回指针","代码分析"],"source":"配套代码分析（原题 P08）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P08 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXLEN 510\n\nvoid strip_newline(char *s)\n{\n    char *p = s;\n\n    while (*p != '\\0' && *p != '\\n' && *p != '\\r')\n        p++;\n    *p = '\\0';\n}\n\nchar *locatesubstr(char *str1, char *str2)\n{\n    char *p;\n    char *t;\n\n    if (*str2 == '\\0')\n        return str1;\n\n    for (p = str1; *p != '\\0'; p++) {\n        char *s = p;\n\n        t = str2;\n        while (*t != '\\0' && *s == *t) {\n            s++;\n            t++;\n        }\n        if (*t == '\\0')\n            return p;\n    }\n    return NULL;\n}\n\nint main(void)\n{\n    char str1[MAXLEN];\n    char str2[MAXLEN];\n    char *p;\n\n    if (fgets(str1, sizeof str1, stdin) == NULL)\n        return 0;\n    if (fgets(str2, sizeof str2, stdin) == NULL)\n        return 0;\n    strip_newline(str1);\n    strip_newline(str2);\n\n    p = locatesubstr(str1, str2);\n    if (p == NULL) {\n        printf(\"NULL!\\n\");\n    } else {\n        printf(\"%d\\n\", (int)(p - str1));\n        printf(\"%s\\n\", p);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nabcdef\ncde\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"didjfsd dabcxxxxxx\nabc\n","out":"9\nabcxxxxxx\n"}],"hint":"指定输入的完整输出：\n```\n2\ncdef\n```\n分析要点：主串每个位置都作为起点试一次：设两个临时指针分别走主串和模式串，若模式串走到 `'\\0'` 就说明匹配成功。\n边界核对：用 `fgets` 读入后必须手动去掉行末 `'\\n'`，否则模式串永远匹配不上；下标用 `p - str1` 计算。","pitfalls":"用 `fgets` 读入后必须手动去掉行末 `'\\n'`，否则模式串永远匹配不上；下标用 `p - str1` 计算。","solution":"#include <stdio.h>\n\n#define MAXLEN 510\n\nvoid strip_newline(char *s)\n{\n    char *p = s;\n\n    while (*p != '\\0' && *p != '\\n' && *p != '\\r')\n        p++;\n    *p = '\\0';\n}\n\nchar *locatesubstr(char *str1, char *str2)\n{\n    char *p;\n    char *t;\n\n    if (*str2 == '\\0')\n        return str1;\n\n    for (p = str1; *p != '\\0'; p++) {\n        char *s = p;\n\n        t = str2;\n        while (*t != '\\0' && *s == *t) {\n            s++;\n            t++;\n        }\n        if (*t == '\\0')\n            return p;\n    }\n    return NULL;\n}\n\nint main(void)\n{\n    char str1[MAXLEN];\n    char str2[MAXLEN];\n    char *p;\n\n    if (fgets(str1, sizeof str1, stdin) == NULL)\n        return 0;\n    if (fgets(str2, sizeof str2, stdin) == NULL)\n        return 0;\n    strip_newline(str1);\n    strip_newline(str2);\n\n    p = locatesubstr(str1, str2);\n    if (p == NULL) {\n        printf(\"NULL!\\n\");\n    } else {\n        printf(\"%d\\n\", (int)(p - str1));\n        printf(\"%s\\n\", p);\n    }\n    return 0;\n}\n"},{"id":"V-P09","cat":"pointer","title":"指针就地删除指定字符·代码分析","difficulty":3,"tags":["指针","原地删除","字符串","代码分析"],"source":"配套代码分析（原题 P09）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P09 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXLEN 205\n#define MAXSET 25\n\nint delchars(char *str, const char *set)\n{\n    char *dst = str;\n    char *src;\n    int removed = 0;\n\n    for (src = str; *src != '\\0'; src++) {\n        const char *q = set;\n        int hit = 0;\n\n        while (*q != '\\0') {\n            if (*q == *src) {\n                hit = 1;\n                break;\n            }\n            q++;\n        }\n        if (hit)\n            removed++;\n        else\n            *dst++ = *src;\n    }\n    *dst = '\\0';\n    return removed;\n}\n\nint main(void)\n{\n    char str[MAXLEN];\n    char set[MAXSET];\n    int removed;\n\n    if (scanf(\"%200s\", str) != 1)\n        return 0;\n    if (scanf(\"%20s\", set) != 1)\n        return 0;\n\n    removed = delchars(str, set);\n\n    printf(\"%s\\n\", str);\n    printf(\"%d\\n\", removed);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nbanana\naenn\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"abcABCabc#\nb\n","out":"acABCac#\n2\n"}],"hint":"指定输入的完整输出：\n```\nb\n5\n```\n分析要点：`src` 顺序读、`dst` 只写保留下来的字符：`*dst++ = *src;` 全部扫完后别忘了 `*dst = '\\0';`。\n边界核对：用 `for (i...) if (str[i] != ch) str[j++] = str[i];` 时下标错位会漏字符；删除后必须在新的末尾补 `'\\0'`。","pitfalls":"用 `for (i...) if (str[i] != ch) str[j++] = str[i];` 时下标错位会漏字符；删除后必须在新的末尾补 `'\\0'`。","solution":"#include <stdio.h>\n\n#define MAXLEN 205\n#define MAXSET 25\n\nint delchars(char *str, const char *set)\n{\n    char *dst = str;\n    char *src;\n    int removed = 0;\n\n    for (src = str; *src != '\\0'; src++) {\n        const char *q = set;\n        int hit = 0;\n\n        while (*q != '\\0') {\n            if (*q == *src) {\n                hit = 1;\n                break;\n            }\n            q++;\n        }\n        if (hit)\n            removed++;\n        else\n            *dst++ = *src;\n    }\n    *dst = '\\0';\n    return removed;\n}\n\nint main(void)\n{\n    char str[MAXLEN];\n    char set[MAXSET];\n    int removed;\n\n    if (scanf(\"%200s\", str) != 1)\n        return 0;\n    if (scanf(\"%20s\", set) != 1)\n        return 0;\n\n    removed = delchars(str, set);\n\n    printf(\"%s\\n\", str);\n    printf(\"%d\\n\", removed);\n    return 0;\n}\n"},{"id":"V-P10","cat":"pointer","title":"指针就地逆序并判回文·代码分析","difficulty":3,"tags":["指针","动态内存","双指针","代码分析"],"source":"配套代码分析（原题 P10）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P10 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, i;\n    int *a;\n    int *left, *right;\n    int pal = 1;\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n\n    a = (int *)malloc(sizeof(int) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    left = a;\n    right = a + n - 1;\n    while (left < right) {\n        if (*left != *right)\n            pal = 0;\n        left++;\n        right--;\n    }\n\n    left = a;\n    right = a + n - 1;\n    while (left < right) {\n        int t = *left;\n\n        *left = *right;\n        *right = t;\n        left++;\n        right--;\n    }\n\n    for (i = 0; i < n; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    printf(\"%s\\n\", pal ? \"yes\" : \"no\");\n\n    free(a);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\n1 2 3 4\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n1 2 3 2 1\n","out":"1 2 3 2 1\nyes\n"}],"hint":"指定输入的完整输出：\n```\n4 3 2 1\nno\n```\n分析要点：先做一遍回文判断（不改动数据），再做一遍两端交换；`left < right` 是循环继续的条件，相遇就停。\n边界核对：回文判断要和逆序交替进行的话，必须先判后逆序，否则逆序后就永远「是回文」；忘记 `free` 会内存泄漏。","pitfalls":"回文判断要和逆序交替进行的话，必须先判后逆序，否则逆序后就永远「是回文」；忘记 `free` 会内存泄漏。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, i;\n    int *a;\n    int *left, *right;\n    int pal = 1;\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n\n    a = (int *)malloc(sizeof(int) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    left = a;\n    right = a + n - 1;\n    while (left < right) {\n        if (*left != *right)\n            pal = 0;\n        left++;\n        right--;\n    }\n\n    left = a;\n    right = a + n - 1;\n    while (left < right) {\n        int t = *left;\n\n        *left = *right;\n        *right = t;\n        left++;\n        right--;\n    }\n\n    for (i = 0; i < n; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n    printf(\"%s\\n\", pal ? \"yes\" : \"no\");\n\n    free(a);\n    return 0;\n}\n"},{"id":"V-P11","cat":"pointer","title":"动态数组去重·代码分析","difficulty":3,"tags":["动态内存","指针","去重","代码分析"],"source":"配套代码分析（原题 P11）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P11 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, i, m = 0;\n    int *a;\n    int *p;\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n\n    a = (int *)malloc(sizeof(int) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    for (i = 0; i < n; i++) {\n        int dup = 0;\n\n        for (p = a; p < a + m; p++) {\n            if (*p == a[i]) {\n                dup = 1;\n                break;\n            }\n        }\n        if (!dup)\n            a[m++] = a[i];\n    }\n\n    printf(\"%d\\n\", m);\n    for (i = 0; i < m; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n\n    free(a);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1\n-5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8\n3 1 3 2 1 4 4 2\n","out":"4\n3 1 2 4\n"}],"hint":"指定输入的完整输出：\n```\n1\n-5\n```\n分析要点：设 m 为「已经保留的元素个数」，对每个新元素用指针在 `a[0..m-1]` 中比一遍，没出现过才写入 `a[m++]`。\n边界核对：一边读一边和「整个数组」比较，会把还没处理的旧值算进来；比较范围只能是已保留的 `a[0..m-1]`。","pitfalls":"一边读一边和「整个数组」比较，会把还没处理的旧值算进来；比较范围只能是已保留的 `a[0..m-1]`。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, i, m = 0;\n    int *a;\n    int *p;\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n\n    a = (int *)malloc(sizeof(int) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++)\n        scanf(\"%d\", &a[i]);\n\n    for (i = 0; i < n; i++) {\n        int dup = 0;\n\n        for (p = a; p < a + m; p++) {\n            if (*p == a[i]) {\n                dup = 1;\n                break;\n            }\n        }\n        if (!dup)\n            a[m++] = a[i];\n    }\n\n    printf(\"%d\\n\", m);\n    for (i = 0; i < m; i++) {\n        if (i > 0)\n            printf(\" \");\n        printf(\"%d\", a[i]);\n    }\n    printf(\"\\n\");\n\n    free(a);\n    return 0;\n}\n"},{"id":"V-P12","cat":"pointer","title":"按长度排序字符串·代码分析","difficulty":3,"tags":["指针数组","字符串排序","比较规则","代码分析"],"source":"配套代码分析（原题 P12）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P12 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n#define MAXLEN 105\n\nint my_len(const char *s)\n{\n    const char *p = s;\n\n    while (*p != '\\0')\n        p++;\n    return (int)(p - s);\n}\n\nint my_cmp(const char *s1, const char *s2)\n{\n    const char *p = s1;\n    const char *q = s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return ((unsigned char)*p < (unsigned char)*q) ? -1 : 1;\n}\n\nint main(void)\n{\n    int n, i, j;\n    char store[MAXN][MAXLEN];\n    char *p[MAXN];\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%100s\", store[i]) != 1)\n            return 0;\n        p[i] = store[i];\n    }\n\n    for (i = 0; i < n - 1; i++) {\n        for (j = 0; j < n - 1 - i; j++) {\n            int la = my_len(p[j]);\n            int lb = my_len(p[j + 1]);\n            int need = 0;\n\n            if (la > lb)\n                need = 1;\n            else if (la == lb && my_cmp(p[j], p[j + 1]) > 0)\n                need = 1;\n\n            if (need) {\n                char *t = p[j];\n\n                p[j] = p[j + 1];\n                p[j + 1] = t;\n            }\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        printf(\"%s\\n\", p[i]);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\nbbb\naa\ncc\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4\napple\nfig\nkiwi\nfigs\n","out":"fig\nfigs\nkiwi\napple\n"}],"hint":"指定输入的完整输出：\n```\naa\ncc\nbbb\n```\n分析要点：比较函数分两级：长度不同比长度，长度相同再逐字符比；交换的是 `p[j]` 与 `p[j+1]` 这两个指针。\n边界核对：交换字符串本身（用 `strcpy`）既慢又容易越界；长度相同时如果只比长度，排序结果不稳定。","pitfalls":"交换字符串本身（用 `strcpy`）既慢又容易越界；长度相同时如果只比长度，排序结果不稳定。","solution":"#include <stdio.h>\n\n#define MAXN 105\n#define MAXLEN 105\n\nint my_len(const char *s)\n{\n    const char *p = s;\n\n    while (*p != '\\0')\n        p++;\n    return (int)(p - s);\n}\n\nint my_cmp(const char *s1, const char *s2)\n{\n    const char *p = s1;\n    const char *q = s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return ((unsigned char)*p < (unsigned char)*q) ? -1 : 1;\n}\n\nint main(void)\n{\n    int n, i, j;\n    char store[MAXN][MAXLEN];\n    char *p[MAXN];\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%100s\", store[i]) != 1)\n            return 0;\n        p[i] = store[i];\n    }\n\n    for (i = 0; i < n - 1; i++) {\n        for (j = 0; j < n - 1 - i; j++) {\n            int la = my_len(p[j]);\n            int lb = my_len(p[j + 1]);\n            int need = 0;\n\n            if (la > lb)\n                need = 1;\n            else if (la == lb && my_cmp(p[j], p[j + 1]) > 0)\n                need = 1;\n\n            if (need) {\n                char *t = p[j];\n\n                p[j] = p[j + 1];\n                p[j + 1] = t;\n            }\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        printf(\"%s\\n\", p[i]);\n    return 0;\n}\n"},{"id":"V-P13","cat":"pointer","title":"出现最多的字母·代码分析","difficulty":3,"tags":["指针","字符统计","计数数组","代码分析"],"source":"配套代码分析（原题 P13）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P13 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXLEN 1005\n\nint main(void)\n{\n    char text[MAXLEN];\n    const char *p;\n    int cnt[128];\n    int c, best = 0, bestc = -1, found = 0;\n\n    for (c = 0; c < 128; c++)\n        cnt[c] = 0;\n\n    if (fgets(text, sizeof text, stdin) == NULL)\n        return 0;\n\n    for (p = text; *p != '\\0'; p++) {\n        unsigned char u = (unsigned char)*p;\n\n        if ((u >= 'A' && u <= 'Z') || (u >= 'a' && u <= 'z'))\n            cnt[u]++;\n    }\n\n    for (c = 0; c < 128; c++) {\n        if (cnt[c] > 0) {\n            found = 1;\n            if (cnt[c] > best) {\n                best = cnt[c];\n                bestc = c;\n            }\n        }\n    }\n\n    if (!found) {\n        printf(\"none\\n\");\n    } else {\n        printf(\"%c\\n\", bestc);\n        printf(\"%d\\n\", best);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n12345 !!\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"Hello World\n","out":"l\n3\n"}],"hint":"指定输入的完整输出：\n```\nnone\n```\n分析要点：开一个 `int cnt[128]` 计数表，指针从串首扫到 `'\\0'`；最后从下标 0 往 127 扫，用严格大于更新最大值。\n边界核对：从 127 往 0 扫、或用 `>=` 更新，并列时拿到的就不是 ASCII 最小的字母；忘记排除数字和空格会统计错。","pitfalls":"从 127 往 0 扫、或用 `>=` 更新，并列时拿到的就不是 ASCII 最小的字母；忘记排除数字和空格会统计错。","solution":"#include <stdio.h>\n\n#define MAXLEN 1005\n\nint main(void)\n{\n    char text[MAXLEN];\n    const char *p;\n    int cnt[128];\n    int c, best = 0, bestc = -1, found = 0;\n\n    for (c = 0; c < 128; c++)\n        cnt[c] = 0;\n\n    if (fgets(text, sizeof text, stdin) == NULL)\n        return 0;\n\n    for (p = text; *p != '\\0'; p++) {\n        unsigned char u = (unsigned char)*p;\n\n        if ((u >= 'A' && u <= 'Z') || (u >= 'a' && u <= 'z'))\n            cnt[u]++;\n    }\n\n    for (c = 0; c < 128; c++) {\n        if (cnt[c] > 0) {\n            found = 1;\n            if (cnt[c] > best) {\n                best = cnt[c];\n                bestc = c;\n            }\n        }\n    }\n\n    if (!found) {\n        printf(\"none\\n\");\n    } else {\n        printf(\"%c\\n\", bestc);\n        printf(\"%d\\n\", best);\n    }\n    return 0;\n}\n"},{"id":"V-P14","cat":"pointer","title":"动态二维数组转置·代码分析","difficulty":4,"tags":["动态内存","二维数组","指针数组","代码分析"],"source":"配套代码分析（原题 P14）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P14 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, m, i, j;\n    int **a;\n\n    if (scanf(\"%d %d\", &n, &m) != 2 || n <= 0 || m <= 0)\n        return 0;\n\n    a = (int **)malloc(sizeof(int *) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        a[i] = (int *)malloc(sizeof(int) * (size_t)m);\n        if (a[i] == NULL) {\n            for (j = 0; j < i; j++)\n                free(a[j]);\n            free(a);\n            return 1;\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        for (j = 0; j < m; j++)\n            scanf(\"%d\", &a[i][j]);\n\n    for (j = 0; j < m; j++) {\n        for (i = 0; i < n; i++) {\n            if (i > 0)\n                printf(\" \");\n            printf(\"%d\", a[i][j]);\n        }\n        printf(\"\\n\");\n    }\n\n    for (i = 0; i < n; i++)\n        free(a[i]);\n    free(a);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1 3\n7 8 9\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2 3\n1 2 3\n4 5 6\n","out":"1 4\n2 5\n3 6\n"}],"hint":"指定输入的完整输出：\n```\n7\n8\n9\n```\n分析要点：分配顺序是「先指针数组、再逐行」；转置输出时用双重循环但先固定列 `j` 再走行 `i`，即 `a[i][j]`。\n边界核对：只 `free(a)` 不 `free(a[i])` 会泄漏每一行的内存；中途某行分配失败时要把前面已分配的行先释放。","pitfalls":"只 `free(a)` 不 `free(a[i])` 会泄漏每一行的内存；中途某行分配失败时要把前面已分配的行先释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, m, i, j;\n    int **a;\n\n    if (scanf(\"%d %d\", &n, &m) != 2 || n <= 0 || m <= 0)\n        return 0;\n\n    a = (int **)malloc(sizeof(int *) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        a[i] = (int *)malloc(sizeof(int) * (size_t)m);\n        if (a[i] == NULL) {\n            for (j = 0; j < i; j++)\n                free(a[j]);\n            free(a);\n            return 1;\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        for (j = 0; j < m; j++)\n            scanf(\"%d\", &a[i][j]);\n\n    for (j = 0; j < m; j++) {\n        for (i = 0; i < n; i++) {\n            if (i > 0)\n                printf(\" \");\n            printf(\"%d\", a[i][j]);\n        }\n        printf(\"\\n\");\n    }\n\n    for (i = 0; i < n; i++)\n        free(a[i]);\n    free(a);\n    return 0;\n}\n"},{"id":"V-P15","cat":"pointer","title":"函数指针选择排序方向·代码分析","difficulty":4,"tags":["函数指针","动态内存","字符串排序","代码分析"],"source":"配套代码分析（原题 P15）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P15 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXLEN 210\n\nint my_strcmp(const char *s1, const char *s2)\n{\n    const unsigned char *p = (const unsigned char *)s1;\n    const unsigned char *q = (const unsigned char *)s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return (*p < *q) ? -1 : 1;\n}\n\nint cmp_asc(const char *a, const char *b)\n{\n    return my_strcmp(a, b);\n}\n\nint cmp_desc(const char *a, const char *b)\n{\n    return -my_strcmp(a, b);\n}\n\nvoid sort(char **a, int n, int (*cmp)(const char *, const char *))\n{\n    int i, j;\n\n    for (i = 0; i < n - 1; i++) {\n        for (j = 0; j < n - 1 - i; j++) {\n            if (cmp(a[j], a[j + 1]) > 0) {\n                char *t = a[j];\n\n                a[j] = a[j + 1];\n                a[j + 1] = t;\n            }\n        }\n    }\n}\n\nint main(void)\n{\n    int n, mode, i, c;\n    char **arr;\n    char buf[MAXLEN];\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n    if (scanf(\"%d\", &mode) != 1)\n        return 0;\n    while ((c = getchar()) != '\\n' && c != EOF)\n        ;\n\n    arr = (char **)malloc(sizeof(char *) * (size_t)n);\n    if (arr == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        char *t, *dst;\n        const char *src;\n        int len;\n\n        if (fgets(buf, sizeof buf, stdin) == NULL)\n            buf[0] = '\\0';\n        t = buf;\n        while (*t != '\\0' && *t != '\\n' && *t != '\\r')\n            t++;\n        *t = '\\0';\n        len = (int)(t - buf);\n\n        arr[i] = (char *)malloc(sizeof(char) * (size_t)(len + 1));\n        if (arr[i] == NULL) {\n            while (i > 0)\n                free(arr[--i]);\n            free(arr);\n            return 1;\n        }\n        dst = arr[i];\n        for (src = buf; *src != '\\0'; src++)\n            *dst++ = *src;\n        *dst = '\\0';\n    }\n\n    sort(arr, n, (mode == 0) ? cmp_asc : cmp_desc);\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s\\n\", arr[i]);\n        free(arr[i]);\n    }\n    free(arr);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\n1\nb a\na c\nc\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n0\nbanana\napple\ncherry\n","out":"apple\nbanana\ncherry\n"}],"hint":"指定输入的完整输出：\n```\nc\nb a\na c\n```\n分析要点：函数名本身就是地址，`sort(arr, n, mode ? cmp_desc : cmp_asc)` 直接把比较函数传进去；`sort` 内部只交换 `char *`。\n边界核对：`scanf(\"%d\")` 之后行末的 `'\\n'` 会留在缓冲区，必须先吸掉，否则第一个字符串读到空行；`fgets` 读入后要手工去掉 `'\\n'`。","pitfalls":"`scanf(\"%d\")` 之后行末的 `'\\n'` 会留在缓冲区，必须先吸掉，否则第一个字符串读到空行；`fgets` 读入后要手工去掉 `'\\n'`。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXLEN 210\n\nint my_strcmp(const char *s1, const char *s2)\n{\n    const unsigned char *p = (const unsigned char *)s1;\n    const unsigned char *q = (const unsigned char *)s2;\n\n    while (*p != '\\0' && *p == *q) {\n        p++;\n        q++;\n    }\n    if (*p == *q)\n        return 0;\n    return (*p < *q) ? -1 : 1;\n}\n\nint cmp_asc(const char *a, const char *b)\n{\n    return my_strcmp(a, b);\n}\n\nint cmp_desc(const char *a, const char *b)\n{\n    return -my_strcmp(a, b);\n}\n\nvoid sort(char **a, int n, int (*cmp)(const char *, const char *))\n{\n    int i, j;\n\n    for (i = 0; i < n - 1; i++) {\n        for (j = 0; j < n - 1 - i; j++) {\n            if (cmp(a[j], a[j + 1]) > 0) {\n                char *t = a[j];\n\n                a[j] = a[j + 1];\n                a[j + 1] = t;\n            }\n        }\n    }\n}\n\nint main(void)\n{\n    int n, mode, i, c;\n    char **arr;\n    char buf[MAXLEN];\n\n    if (scanf(\"%d\", &n) != 1 || n <= 0)\n        return 0;\n    if (scanf(\"%d\", &mode) != 1)\n        return 0;\n    while ((c = getchar()) != '\\n' && c != EOF)\n        ;\n\n    arr = (char **)malloc(sizeof(char *) * (size_t)n);\n    if (arr == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        char *t, *dst;\n        const char *src;\n        int len;\n\n        if (fgets(buf, sizeof buf, stdin) == NULL)\n            buf[0] = '\\0';\n        t = buf;\n        while (*t != '\\0' && *t != '\\n' && *t != '\\r')\n            t++;\n        *t = '\\0';\n        len = (int)(t - buf);\n\n        arr[i] = (char *)malloc(sizeof(char) * (size_t)(len + 1));\n        if (arr[i] == NULL) {\n            while (i > 0)\n                free(arr[--i]);\n            free(arr);\n            return 1;\n        }\n        dst = arr[i];\n        for (src = buf; *src != '\\0'; src++)\n            *dst++ = *src;\n        *dst = '\\0';\n    }\n\n    sort(arr, n, (mode == 0) ? cmp_asc : cmp_desc);\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s\\n\", arr[i]);\n        free(arr[i]);\n    }\n    free(arr);\n    return 0;\n}\n"},{"id":"V-P16","cat":"pointer","title":"动态矩阵按行整理·代码分析","difficulty":4,"tags":["动态内存","行指针","就地排序","代码分析"],"source":"配套代码分析（原题 P16）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 P16 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, m, i, j;\n    int **a;\n    long long total = 0;\n\n    if (scanf(\"%d %d\", &n, &m) != 2 || n <= 0 || m <= 0)\n        return 0;\n\n    a = (int **)malloc(sizeof(int *) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        a[i] = (int *)malloc(sizeof(int) * (size_t)m);\n        if (a[i] == NULL) {\n            for (j = 0; j < i; j++)\n                free(a[j]);\n            free(a);\n            return 1;\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        for (j = 0; j < m; j++)\n            scanf(\"%d\", &a[i][j]);\n\n    for (i = 0; i < n; i++) {\n        int *p, *q;\n\n        for (p = a[i]; p < a[i] + m - 1; p++) {\n            for (q = p + 1; q < a[i] + m; q++) {\n                if (*q < *p) {\n                    int t = *p;\n\n                    *p = *q;\n                    *q = t;\n                }\n            }\n        }\n        total += a[i][0];\n    }\n\n    for (i = 0; i < n; i++) {\n        for (j = 0; j < m; j++) {\n            if (j > 0)\n                printf(\" \");\n            printf(\"%d\", a[i][j]);\n        }\n        printf(\"\\n\");\n    }\n    printf(\"%lld\\n\", total);\n\n    for (i = 0; i < n; i++)\n        free(a[i]);\n    free(a);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1 1\n-7\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2 3\n3 1 2\n9 -5 4\n","out":"1 2 3\n-5 4 9\n-4\n"}],"hint":"指定输入的完整输出：\n```\n-7\n-7\n```\n分析要点：外层循环走行、内层用两个指针 `p`、`q` 在本行内比较交换；累加时写 `total += a[i][0];`，`total` 声明成 `long long`。\n边界核对：行内排序的边界是 `a[i] + m`，写成 `a + m` 会串到别的行；和用 `int` 保存时大数据会溢出。","pitfalls":"行内排序的边界是 `a[i] + m`，写成 `a + m` 会串到别的行；和用 `int` 保存时大数据会溢出。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, m, i, j;\n    int **a;\n    long long total = 0;\n\n    if (scanf(\"%d %d\", &n, &m) != 2 || n <= 0 || m <= 0)\n        return 0;\n\n    a = (int **)malloc(sizeof(int *) * (size_t)n);\n    if (a == NULL)\n        return 1;\n\n    for (i = 0; i < n; i++) {\n        a[i] = (int *)malloc(sizeof(int) * (size_t)m);\n        if (a[i] == NULL) {\n            for (j = 0; j < i; j++)\n                free(a[j]);\n            free(a);\n            return 1;\n        }\n    }\n\n    for (i = 0; i < n; i++)\n        for (j = 0; j < m; j++)\n            scanf(\"%d\", &a[i][j]);\n\n    for (i = 0; i < n; i++) {\n        int *p, *q;\n\n        for (p = a[i]; p < a[i] + m - 1; p++) {\n            for (q = p + 1; q < a[i] + m; q++) {\n                if (*q < *p) {\n                    int t = *p;\n\n                    *p = *q;\n                    *q = t;\n                }\n            }\n        }\n        total += a[i][0];\n    }\n\n    for (i = 0; i < n; i++) {\n        for (j = 0; j < m; j++) {\n            if (j > 0)\n                printf(\" \");\n            printf(\"%d\", a[i][j]);\n        }\n        printf(\"\\n\");\n    }\n    printf(\"%lld\\n\", total);\n\n    for (i = 0; i < n; i++)\n        free(a[i]);\n    free(a);\n    return 0;\n}\n"},{"id":"V-T01","cat":"struct","title":"选手信息卡·代码分析","difficulty":1,"tags":["结构体","成员访问","结构体指针","代码分析"],"source":"配套代码分析（原题 T01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXLEN 32   /* 姓名、编号的最大长度 + 余量 */\n#define COURSES 3   /* 三项得分 */\n\ntypedef struct {\n    char name[MAXLEN];      /* 选手姓名，可含空格 */\n    char id[MAXLEN];        /* 选手编号 */\n    int score[COURSES];     /* 三项得分 */\n    int sum;                /* 总分 */\n} PLAYER;\n\n/* 去掉 fgets 读入的换行符 */\nstatic void strip_newline(char *s)\n{\n    size_t len = strlen(s);\n    while (len > 0 && (s[len - 1] == '\\n' || s[len - 1] == '\\r')) {\n        s[--len] = '\\0';\n    }\n}\n\nint main(void)\n{\n    PLAYER p;\n    PLAYER *ptr = &p;   /* 输出统一用结构体指针访问 */\n    int i, j;\n\n    if (fgets(p.name, MAXLEN, stdin) == NULL) {\n        return 0;\n    }\n    strip_newline(p.name);\n    if (fgets(p.id, MAXLEN, stdin) == NULL) {\n        return 0;\n    }\n    strip_newline(p.id);\n\n    p.sum = 0;\n    for (i = 0; i < COURSES; i++) {\n        scanf(\"%d\", &p.score[i]);\n        p.sum += p.score[i];\n    }\n\n    /* 三项得分从高到低排序（选择排序） */\n    for (i = 0; i < COURSES; i++) {\n        for (j = i + 1; j < COURSES; j++) {\n            if (p.score[j] > p.score[i]) {\n                int t = p.score[i];\n                p.score[i] = p.score[j];\n                p.score[j] = t;\n            }\n        }\n    }\n\n    printf(\"Name:%s\\n\", ptr->name);\n    printf(\"Id:%s\\n\", ptr->id);\n    printf(\"Score:%d %d %d\\n\", ptr->score[0], ptr->score[1], ptr->score[2]);\n    printf(\"Sum:%d\\n\", ptr->sum);\n    printf(\"Average:%.2f\\n\", ptr->sum / (double)COURSES);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nLiu Mengmeng\n0821131666\n88 90 93\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"Liu Mengmeng\n0821131666\n88 90 93\n","out":"Name:Liu Mengmeng\nId:0821131666\nScore:93 90 88\nSum:271\nAverage:90.33\n"}],"hint":"指定输入的完整输出：\n```\nName:Liu Mengmeng\nId:0821131666\nScore:93 90 88\nSum:271\nAverage:90.33\n```\n分析要点：先声明 `PLAYER` 结构体，用 `fgets` 读姓名和编号（注意去掉行尾换行符），再用 `scanf` 读三项得分；最后用 `PLAYER *ptr = &p;` 加 `ptr->name` 这类写法输出。\n边界核对：姓名里可能含空格，不能用 `scanf(\"%s\")` 读；`fgets` 会把 `\\n` 一起读进来，必须手动删掉，否则输出会多一个空行。","pitfalls":"姓名里可能含空格，不能用 `scanf(\"%s\")` 读；`fgets` 会把 `\\n` 一起读进来，必须手动删掉，否则输出会多一个空行。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXLEN 32   /* 姓名、编号的最大长度 + 余量 */\n#define COURSES 3   /* 三项得分 */\n\ntypedef struct {\n    char name[MAXLEN];      /* 选手姓名，可含空格 */\n    char id[MAXLEN];        /* 选手编号 */\n    int score[COURSES];     /* 三项得分 */\n    int sum;                /* 总分 */\n} PLAYER;\n\n/* 去掉 fgets 读入的换行符 */\nstatic void strip_newline(char *s)\n{\n    size_t len = strlen(s);\n    while (len > 0 && (s[len - 1] == '\\n' || s[len - 1] == '\\r')) {\n        s[--len] = '\\0';\n    }\n}\n\nint main(void)\n{\n    PLAYER p;\n    PLAYER *ptr = &p;   /* 输出统一用结构体指针访问 */\n    int i, j;\n\n    if (fgets(p.name, MAXLEN, stdin) == NULL) {\n        return 0;\n    }\n    strip_newline(p.name);\n    if (fgets(p.id, MAXLEN, stdin) == NULL) {\n        return 0;\n    }\n    strip_newline(p.id);\n\n    p.sum = 0;\n    for (i = 0; i < COURSES; i++) {\n        scanf(\"%d\", &p.score[i]);\n        p.sum += p.score[i];\n    }\n\n    /* 三项得分从高到低排序（选择排序） */\n    for (i = 0; i < COURSES; i++) {\n        for (j = i + 1; j < COURSES; j++) {\n            if (p.score[j] > p.score[i]) {\n                int t = p.score[i];\n                p.score[i] = p.score[j];\n                p.score[j] = t;\n            }\n        }\n    }\n\n    printf(\"Name:%s\\n\", ptr->name);\n    printf(\"Id:%s\\n\", ptr->id);\n    printf(\"Score:%d %d %d\\n\", ptr->score[0], ptr->score[1], ptr->score[2]);\n    printf(\"Sum:%d\\n\", ptr->sum);\n    printf(\"Average:%.2f\\n\", ptr->sum / (double)COURSES);\n    return 0;\n}\n"},{"id":"V-T02","cat":"struct","title":"结构体数组统计成绩·代码分析","difficulty":1,"tags":["结构体数组","平均分","最值","代码分析"],"source":"配套代码分析（原题 T02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n#define COURSES 3\n\ntypedef struct {\n    char name[24];\n    char id[24];\n    int score[COURSES];\n    int total;\n    double avg;\n} STUDENT;\n\nint main(void)\n{\n    STUDENT stu[MAXN];\n    int n, i, j;\n    int best = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %s\", stu[i].name, stu[i].id);\n        stu[i].total = 0;\n        for (j = 0; j < COURSES; j++) {\n            scanf(\"%d\", &stu[i].score[j]);\n            stu[i].total += stu[i].score[j];\n        }\n        stu[i].avg = stu[i].total / (double)COURSES;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"Name:%s Id:%s Total:%d Avg:%.2f\\n\",\n               stu[i].name, stu[i].id, stu[i].total, stu[i].avg);\n        if (stu[i].total > stu[best].total) {\n            best = i;\n        }\n    }\n    printf(\"Best:%s\\n\", stu[best].name);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\nTom 2018001 80 90 70\nJerry 2018002 100 100 100\nAnn 2018003 60 60 60\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\nTom 2018001 80 90 70\nJerry 2018002 100 100 100\nAnn 2018003 60 60 60\n","out":"Name:Tom Id:2018001 Total:240 Avg:80.00\nName:Jerry Id:2018002 Total:300 Avg:100.00\nName:Ann Id:2018003 Total:180 Avg:60.00\nBest:Jerry\n"}],"hint":"指定输入的完整输出：\n```\nName:Tom Id:2018001 Total:240 Avg:80.00\nName:Jerry Id:2018002 Total:300 Avg:100.00\nName:Ann Id:2018003 Total:180 Avg:60.00\nBest:Jerry\n```\n分析要点：读入时顺手累加 `total`，再用 `total / 3.0` 算平均分（注意写成 3.0，别做整除）。找最大值只需边输出边比较。\n边界核对：`total / 3` 是整数除法，平均分会变成整数；要写成 `3.0` 或用强制类型转换。`Best` 只在严格大于当前最大值时更新，才能保证并列时取最先出现者。","pitfalls":"`total / 3` 是整数除法，平均分会变成整数；要写成 `3.0` 或用强制类型转换。`Best` 只在严格大于当前最大值时更新，才能保证并列时取最先出现者。","solution":"#include <stdio.h>\n\n#define MAXN 105\n#define COURSES 3\n\ntypedef struct {\n    char name[24];\n    char id[24];\n    int score[COURSES];\n    int total;\n    double avg;\n} STUDENT;\n\nint main(void)\n{\n    STUDENT stu[MAXN];\n    int n, i, j;\n    int best = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %s\", stu[i].name, stu[i].id);\n        stu[i].total = 0;\n        for (j = 0; j < COURSES; j++) {\n            scanf(\"%d\", &stu[i].score[j]);\n            stu[i].total += stu[i].score[j];\n        }\n        stu[i].avg = stu[i].total / (double)COURSES;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"Name:%s Id:%s Total:%d Avg:%.2f\\n\",\n               stu[i].name, stu[i].id, stu[i].total, stu[i].avg);\n        if (stu[i].total > stu[best].total) {\n            best = i;\n        }\n    }\n    printf(\"Best:%s\\n\", stu[best].name);\n    return 0;\n}\n"},{"id":"V-T03","cat":"struct","title":"结构体排序总分与姓名·代码分析","difficulty":2,"tags":["结构体排序","多关键字","字符串比较","代码分析"],"source":"配套代码分析（原题 T03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char name[24];\n    int total;\n} STUDENT;\n\n/* 返回 1 表示 a 应排在 b 之前：总分降序，总分相同按姓名字典序升序 */\nstatic int before(const STUDENT *a, const STUDENT *b)\n{\n    if (a->total != b->total) {\n        return a->total > b->total;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    STUDENT a[MAXN];\n    STUDENT key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d\", a[i].name, &a[i].total);\n    }\n\n    /* 直接插入排序：整个结构体一起移动，不拆成两个平行数组 */\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d\\n\", a[i].name, a[i].total);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\nAlbert 1328\nBush 860\nLiu 1475\nBill 1328\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4\nAlbert 1328\nBush 860\nLiu 1475\nBill 1328\n","out":"Liu 1475\nAlbert 1328\nBill 1328\nBush 860\n"}],"hint":"指定输入的完整输出：\n```\nLiu 1475\nAlbert 1328\nBill 1328\nBush 860\n```\n分析要点：写一个 `before(a, b)` 函数：先比总分（降序），总分相同再用 `strcmp(a->name, b->name) < 0`；然后直接插入排序，交换/移动的单位是整条 `STUDENT`。\n边界核对：不要先按姓名排一遍再按总分排一遍（那样不稳定排序会破坏姓名次序的语义，还容易写错）。`strcmp` 返回的是差值，判断大小要用 `< 0`。","pitfalls":"不要先按姓名排一遍再按总分排一遍（那样不稳定排序会破坏姓名次序的语义，还容易写错）。`strcmp` 返回的是差值，判断大小要用 `< 0`。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char name[24];\n    int total;\n} STUDENT;\n\n/* 返回 1 表示 a 应排在 b 之前：总分降序，总分相同按姓名字典序升序 */\nstatic int before(const STUDENT *a, const STUDENT *b)\n{\n    if (a->total != b->total) {\n        return a->total > b->total;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    STUDENT a[MAXN];\n    STUDENT key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d\", a[i].name, &a[i].total);\n    }\n\n    /* 直接插入排序：整个结构体一起移动，不拆成两个平行数组 */\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d\\n\", a[i].name, a[i].total);\n    }\n    return 0;\n}\n"},{"id":"V-T04","cat":"struct","title":"综合成绩排名的三个函数·代码分析","difficulty":2,"tags":["结构体指针","函数设计","排序","代码分析"],"source":"配套代码分析（原题 T04）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T04 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char id[16];\n    int total;      /* 综合成绩 */\n    int p1;         /* 笔试成绩 */\n    int p2;         /* 项目成绩 */\n} STU;\n\n/* 交换两个结构体所指向的内容 */\nvoid Swap(STU *s1, STU *s2)\n{\n    STU t = *s1;\n    *s1 = *s2;\n    *s2 = t;\n}\n\n/* 若 s1 应排在 s2 之前返回 1，否则返回 0 */\nint Comp(STU *s1, STU *s2)\n{\n    if (s1->total != s2->total) {\n        return s1->total > s2->total;\n    }\n    return s1->p1 > s2->p1;\n}\n\n/* 选择排序，排序规则全部交给 Comp/Swap */\nvoid Sort(STU a[], int size)\n{\n    int i, j;\n    for (i = 0; i < size; i++) {\n        for (j = i + 1; j < size; j++) {\n            if (Comp(&a[j], &a[i])) {\n                Swap(&a[i], &a[j]);\n            }\n        }\n    }\n}\n\nint main(void)\n{\n    STU stu[MAXN];\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %d\", stu[i].id, &stu[i].p1, &stu[i].p2);\n        stu[i].total = stu[i].p1 + stu[i].p2;\n    }\n\n    Sort(stu, n);\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d %d %d\\n\", stu[i].id, stu[i].total, stu[i].p1, stu[i].p2);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\nstu001 78 74\nstu002 95 71\nstu003 84 75\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\nstu001 78 74\nstu002 95 71\nstu003 84 75\n","out":"stu002 166 95 71\nstu003 159 84 75\nstu001 152 78 74\n"}],"hint":"指定输入的完整输出：\n```\nstu002 166 95 71\nstu003 159 84 75\nstu001 152 78 74\n```\n分析要点：`Swap` 里用临时结构体变量整体赋值三次即可（`STU t = *s1; *s1 = *s2; *s2 = t;`）。`Sort` 的循环体只写 `if (Comp(&a[j], &a[i])) Swap(&a[i], &a[j]);`，把比较和交换都委托出去。\n边界核对：`Comp` 的参数是结构体指针，访问成员要用 `->`；只交换指针本身（`s1 = s2`）不会改变数组内容。排序时注意下标范围，别越界。","pitfalls":"`Comp` 的参数是结构体指针，访问成员要用 `->`；只交换指针本身（`s1 = s2`）不会改变数组内容。排序时注意下标范围，别越界。","solution":"#include <stdio.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char id[16];\n    int total;      /* 综合成绩 */\n    int p1;         /* 笔试成绩 */\n    int p2;         /* 项目成绩 */\n} STU;\n\n/* 交换两个结构体所指向的内容 */\nvoid Swap(STU *s1, STU *s2)\n{\n    STU t = *s1;\n    *s1 = *s2;\n    *s2 = t;\n}\n\n/* 若 s1 应排在 s2 之前返回 1，否则返回 0 */\nint Comp(STU *s1, STU *s2)\n{\n    if (s1->total != s2->total) {\n        return s1->total > s2->total;\n    }\n    return s1->p1 > s2->p1;\n}\n\n/* 选择排序，排序规则全部交给 Comp/Swap */\nvoid Sort(STU a[], int size)\n{\n    int i, j;\n    for (i = 0; i < size; i++) {\n        for (j = i + 1; j < size; j++) {\n            if (Comp(&a[j], &a[i])) {\n                Swap(&a[i], &a[j]);\n            }\n        }\n    }\n}\n\nint main(void)\n{\n    STU stu[MAXN];\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %d\", stu[i].id, &stu[i].p1, &stu[i].p2);\n        stu[i].total = stu[i].p1 + stu[i].p2;\n    }\n\n    Sort(stu, n);\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d %d %d\\n\", stu[i].id, stu[i].total, stu[i].p1, stu[i].p2);\n    }\n    return 0;\n}\n"},{"id":"V-T05","cat":"struct","title":"复数运算库·代码分析","difficulty":2,"tags":["结构体封装","结构体返回值","自定义类型","代码分析"],"source":"配套代码分析（原题 T05）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T05 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <math.h>\n\n/* 复数类型：数据成员只有 re、im，操作全部写成独立函数，模拟「类」 */\ntypedef struct {\n    double re;\n    double im;\n} Complex;\n\nComplex c_add(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re + b.re;\n    r.im = a.im + b.im;\n    return r;\n}\n\nComplex c_sub(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re - b.re;\n    r.im = a.im - b.im;\n    return r;\n}\n\nComplex c_mul(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re * b.re - a.im * b.im;\n    r.im = a.re * b.im + a.im * b.re;\n    return r;\n}\n\ndouble c_abs(Complex z)\n{\n    return sqrt(z.re * z.re + z.im * z.im);\n}\n\nvoid c_print(Complex z)\n{\n    printf(\"(%.2f,%.2f)\\n\", z.re, z.im);\n}\n\nint main(void)\n{\n    Complex a, b;\n    char op;\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\" %c\", &op);\n        scanf(\"%lf %lf\", &a.re, &a.im);\n        if (op == '|') {\n            printf(\"|z|=%.2f\\n\", c_abs(a));\n            continue;\n        }\n        scanf(\"%lf %lf\", &b.re, &b.im);\n        if (op == '+') {\n            c_print(c_add(a, b));\n        } else if (op == '-') {\n            c_print(c_sub(a, b));\n        } else {\n            c_print(c_mul(a, b));\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\n+ 1 2 3 4\n- 5 6 1 2\n* 1 2 3 4\n| 3 4\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4\n+ 1 2 3 4\n- 5 6 1 2\n* 1 2 3 4\n| 3 4\n","out":"(4.00,6.00)\n(4.00,4.00)\n(-5.00,10.00)\n|z|=5.00\n"}],"hint":"指定输入的完整输出：\n```\n(4.00,6.00)\n(4.00,4.00)\n(-5.00,10.00)\n|z|=5.00\n```\n分析要点：四个函数都写成 `Complex` 参数、`Complex` 返回值的形式，函数内部先算出一个局部 `Complex r` 再 `return r`。`main` 里读操作符可以用 `scanf(\" %c\", &op)`（%c 前加空格跳过空白）。\n边界核对：乘法的实部是 `ac - bd`、虚部是 `ad + bc`，两处容易写反；`%c` 前不加空格会读到上一行残留的换行符。","pitfalls":"乘法的实部是 `ac - bd`、虚部是 `ad + bc`，两处容易写反；`%c` 前不加空格会读到上一行残留的换行符。","solution":"#include <stdio.h>\n#include <math.h>\n\n/* 复数类型：数据成员只有 re、im，操作全部写成独立函数，模拟「类」 */\ntypedef struct {\n    double re;\n    double im;\n} Complex;\n\nComplex c_add(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re + b.re;\n    r.im = a.im + b.im;\n    return r;\n}\n\nComplex c_sub(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re - b.re;\n    r.im = a.im - b.im;\n    return r;\n}\n\nComplex c_mul(Complex a, Complex b)\n{\n    Complex r;\n    r.re = a.re * b.re - a.im * b.im;\n    r.im = a.re * b.im + a.im * b.re;\n    return r;\n}\n\ndouble c_abs(Complex z)\n{\n    return sqrt(z.re * z.re + z.im * z.im);\n}\n\nvoid c_print(Complex z)\n{\n    printf(\"(%.2f,%.2f)\\n\", z.re, z.im);\n}\n\nint main(void)\n{\n    Complex a, b;\n    char op;\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\" %c\", &op);\n        scanf(\"%lf %lf\", &a.re, &a.im);\n        if (op == '|') {\n            printf(\"|z|=%.2f\\n\", c_abs(a));\n            continue;\n        }\n        scanf(\"%lf %lf\", &b.re, &b.im);\n        if (op == '+') {\n            c_print(c_add(a, b));\n        } else if (op == '-') {\n            c_print(c_sub(a, b));\n        } else {\n            c_print(c_mul(a, b));\n        }\n    }\n    return 0;\n}\n"},{"id":"V-T06","cat":"struct","title":"日期相距天数与星期·代码分析","difficulty":2,"tags":["结构体","日期计算","函数封装","代码分析"],"source":"配套代码分析（原题 T06）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T06 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\ntypedef struct {\n    int y;\n    int m;\n    int d;\n} Date;\n\nstatic const char *WEEK[7] = {\"SUN\", \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\", \"SAT\"};\n\nstatic int is_leap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}\n\n/* 把日期换算成「公元 1 年 1 月 1 日以来的第几天」，相减即天数差 */\nstatic long long date_days(Date t)\n{\n    static const int mdays[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n    long long y = t.y - 1;\n    long long days = y * 365 + y / 4 - y / 100 + y / 400;\n    int m;\n\n    for (m = 1; m < t.m; m++) {\n        days += mdays[m];\n        if (m == 2 && is_leap(t.y)) {\n            days += 1;\n        }\n    }\n    days += t.d;\n    return days;\n}\n\n/* 0 = 星期日，1 = 星期一，……，6 = 星期六 */\nstatic int weekday(Date t)\n{\n    return (int)(date_days(t) % 7);\n}\n\n/* a 比 b 早返回 -1，相同返回 0，晚返回 1 */\nstatic int date_compare(Date a, Date b)\n{\n    long long da = date_days(a);\n    long long db = date_days(b);\n    if (da < db) {\n        return -1;\n    }\n    if (da > db) {\n        return 1;\n    }\n    return 0;\n}\n\nint main(void)\n{\n    Date a, b, early;\n    long long diff;\n\n    scanf(\"%d %d %d\", &a.y, &a.m, &a.d);\n    scanf(\"%d %d %d\", &b.y, &b.m, &b.d);\n\n    if (date_compare(a, b) <= 0) {\n        early = a;\n    } else {\n        early = b;\n    }\n\n    diff = date_days(a) - date_days(b);\n    if (diff < 0) {\n        diff = -diff;\n    }\n\n    printf(\"Earlier:%04d-%02d-%02d\\n\", early.y, early.m, early.d);\n    printf(\"Days:%lld\\n\", diff);\n    printf(\"Weekday:%s\\n\", WEEK[weekday(early)]);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2000 3 1\n1999 3 1\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2020 1 5\n2020 2 4\n","out":"Earlier:2020-01-05\nDays:30\nWeekday:SUN\n"}],"hint":"指定输入的完整输出：\n```\nEarlier:1999-03-01\nDays:366\nWeekday:MON\n```\n分析要点：核心是把日期压成一个序号：`y*365 + y/4 - y/100 + y/400`（y 取「年份 - 1」）再累加前面各月的天数，闰年 2 月加 1。两天序号相减就是天数差。\n边界核对：闰年判断要同时考虑「能被 4 整除但不能被 100 整除」和「能被 400 整除」两种情况；减出来的天数可能是负数，要取绝对值；星期用序号对 7 取模。","pitfalls":"闰年判断要同时考虑「能被 4 整除但不能被 100 整除」和「能被 400 整除」两种情况；减出来的天数可能是负数，要取绝对值；星期用序号对 7 取模。","solution":"#include <stdio.h>\n\ntypedef struct {\n    int y;\n    int m;\n    int d;\n} Date;\n\nstatic const char *WEEK[7] = {\"SUN\", \"MON\", \"TUE\", \"WED\", \"THU\", \"FRI\", \"SAT\"};\n\nstatic int is_leap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}\n\n/* 把日期换算成「公元 1 年 1 月 1 日以来的第几天」，相减即天数差 */\nstatic long long date_days(Date t)\n{\n    static const int mdays[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n    long long y = t.y - 1;\n    long long days = y * 365 + y / 4 - y / 100 + y / 400;\n    int m;\n\n    for (m = 1; m < t.m; m++) {\n        days += mdays[m];\n        if (m == 2 && is_leap(t.y)) {\n            days += 1;\n        }\n    }\n    days += t.d;\n    return days;\n}\n\n/* 0 = 星期日，1 = 星期一，……，6 = 星期六 */\nstatic int weekday(Date t)\n{\n    return (int)(date_days(t) % 7);\n}\n\n/* a 比 b 早返回 -1，相同返回 0，晚返回 1 */\nstatic int date_compare(Date a, Date b)\n{\n    long long da = date_days(a);\n    long long db = date_days(b);\n    if (da < db) {\n        return -1;\n    }\n    if (da > db) {\n        return 1;\n    }\n    return 0;\n}\n\nint main(void)\n{\n    Date a, b, early;\n    long long diff;\n\n    scanf(\"%d %d %d\", &a.y, &a.m, &a.d);\n    scanf(\"%d %d %d\", &b.y, &b.m, &b.d);\n\n    if (date_compare(a, b) <= 0) {\n        early = a;\n    } else {\n        early = b;\n    }\n\n    diff = date_days(a) - date_days(b);\n    if (diff < 0) {\n        diff = -diff;\n    }\n\n    printf(\"Earlier:%04d-%02d-%02d\\n\", early.y, early.m, early.d);\n    printf(\"Days:%lld\\n\", diff);\n    printf(\"Weekday:%s\\n\", WEEK[weekday(early)]);\n    return 0;\n}\n"},{"id":"V-T07","cat":"struct","title":"点与矩形的位置关系·代码分析","difficulty":2,"tags":["结构体嵌套","几何","距离计算","代码分析"],"source":"配套代码分析（原题 T07）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T07 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <math.h>\n\ntypedef struct {\n    double x;\n    double y;\n} Point;\n\ntypedef struct {\n    Point lo;   /* 左下角 */\n    Point hi;   /* 右上角 */\n} Rect;\n\nstatic Point make_point(double x, double y)\n{\n    Point p;\n    p.x = x;\n    p.y = y;\n    return p;\n}\n\n/* 点在矩形内（含边界）返回 1 */\nstatic int rect_contains(Rect r, Point p)\n{\n    return p.x >= r.lo.x && p.x <= r.hi.x &&\n           p.y >= r.lo.y && p.y <= r.hi.y;\n}\n\n/* 点到矩形的最短距离：点在矩形内为 0，否则取到最近边的欧氏距离 */\nstatic double rect_distance(Rect r, Point p)\n{\n    double dx = 0.0;\n    double dy = 0.0;\n\n    if (p.x < r.lo.x) {\n        dx = r.lo.x - p.x;\n    } else if (p.x > r.hi.x) {\n        dx = p.x - r.hi.x;\n    }\n    if (p.y < r.lo.y) {\n        dy = r.lo.y - p.y;\n    } else if (p.y > r.hi.y) {\n        dy = p.y - r.hi.y;\n    }\n    return sqrt(dx * dx + dy * dy);\n}\n\nint main(void)\n{\n    Rect r;\n    Point p;\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        double x1, y1, x2, y2, px, py;\n        scanf(\"%lf %lf %lf %lf %lf %lf\", &x1, &y1, &x2, &y2, &px, &py);\n        r.lo = make_point(x1, y1);\n        r.hi = make_point(x2, y2);\n        p = make_point(px, py);\n        if (rect_contains(r, p)) {\n            printf(\"IN %.2f\\n\", 0.0);\n        } else {\n            printf(\"OUT %.2f\\n\", rect_distance(r, p));\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2\n0 0 4 4 4 2\n0 0 4 4 7 2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\n0 0 4 3 2 1\n0 0 4 3 6 1\n0 0 4 3 5 7\n","out":"IN 0.00\nOUT 2.00\nOUT 4.12\n"}],"hint":"指定输入的完整输出：\n```\nIN 0.00\nOUT 3.00\n```\n分析要点：距离的 x 分量：点在矩形左侧取 `lo.x - p.x`，右侧取 `p.x - hi.x`，在左右范围内则为 0；y 分量同理。最后 `sqrt(dx*dx + dy*dy)`。函数参数直接传结构体值即可，不影响调用者。\n边界核对：边界算「在矩形内」，所以比较要带等号；先判 `IN` 再算距离，避免输出 `-0.00`；`sqrt` 需要 `#include <math.h>`。","pitfalls":"边界算「在矩形内」，所以比较要带等号；先判 `IN` 再算距离，避免输出 `-0.00`；`sqrt` 需要 `#include <math.h>`。","solution":"#include <stdio.h>\n#include <math.h>\n\ntypedef struct {\n    double x;\n    double y;\n} Point;\n\ntypedef struct {\n    Point lo;   /* 左下角 */\n    Point hi;   /* 右上角 */\n} Rect;\n\nstatic Point make_point(double x, double y)\n{\n    Point p;\n    p.x = x;\n    p.y = y;\n    return p;\n}\n\n/* 点在矩形内（含边界）返回 1 */\nstatic int rect_contains(Rect r, Point p)\n{\n    return p.x >= r.lo.x && p.x <= r.hi.x &&\n           p.y >= r.lo.y && p.y <= r.hi.y;\n}\n\n/* 点到矩形的最短距离：点在矩形内为 0，否则取到最近边的欧氏距离 */\nstatic double rect_distance(Rect r, Point p)\n{\n    double dx = 0.0;\n    double dy = 0.0;\n\n    if (p.x < r.lo.x) {\n        dx = r.lo.x - p.x;\n    } else if (p.x > r.hi.x) {\n        dx = p.x - r.hi.x;\n    }\n    if (p.y < r.lo.y) {\n        dy = r.lo.y - p.y;\n    } else if (p.y > r.hi.y) {\n        dy = p.y - r.hi.y;\n    }\n    return sqrt(dx * dx + dy * dy);\n}\n\nint main(void)\n{\n    Rect r;\n    Point p;\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        double x1, y1, x2, y2, px, py;\n        scanf(\"%lf %lf %lf %lf %lf %lf\", &x1, &y1, &x2, &y2, &px, &py);\n        r.lo = make_point(x1, y1);\n        r.hi = make_point(x2, y2);\n        p = make_point(px, py);\n        if (rect_contains(r, p)) {\n            printf(\"IN %.2f\\n\", 0.0);\n        } else {\n            printf(\"OUT %.2f\\n\", rect_distance(r, p));\n        }\n    }\n    return 0;\n}\n"},{"id":"V-T08","cat":"struct","title":"结构体嵌套与成绩排名·代码分析","difficulty":3,"tags":["结构体嵌套","多关键字排序","最值","代码分析"],"source":"配套代码分析（原题 T08）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T08 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\n/* 内层结构体：三门课成绩 */\ntypedef struct {\n    int math;\n    int english;\n    int c;\n} SCORE;\n\n/* 外层结构体：学生信息里嵌套一个 SCORE */\ntypedef struct {\n    char name[24];\n    char id[24];\n    SCORE sc;\n    int total;\n    double avg;\n} STUDENT;\n\n/* 返回最高分科目名，并列时按 数学 > 英语 > C语言 的顺序取 */\nstatic const char *best_subject(SCORE sc)\n{\n    if (sc.math >= sc.english && sc.math >= sc.c) {\n        return \"Math\";\n    }\n    if (sc.english >= sc.c) {\n        return \"English\";\n    }\n    return \"C\";\n}\n\n/* 总成绩降序，同分按姓名升序 */\nstatic int before(const STUDENT *a, const STUDENT *b)\n{\n    if (a->total != b->total) {\n        return a->total > b->total;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    STUDENT a[MAXN];\n    STUDENT key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %s %d %d %d\", a[i].name, a[i].id,\n              &a[i].sc.math, &a[i].sc.english, &a[i].sc.c);\n        a[i].total = a[i].sc.math + a[i].sc.english + a[i].sc.c;\n        a[i].avg = a[i].total / 3.0;\n    }\n\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%d %s %d %.2f %s\\n\", i + 1, a[i].name, a[i].total,\n               a[i].avg, best_subject(a[i].sc));\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\nAnn 2018001 80 90 70\nBob 2018002 70 100 70\nCindy 2018003 90 60 60\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"3\nAnn 2018001 80 90 70\nBob 2018002 70 100 70\nCindy 2018003 90 60 60\n","out":"1 Ann 240 80.00 English\n2 Bob 240 80.00 English\n3 Cindy 210 70.00 Math\n"}],"hint":"指定输入的完整输出：\n```\n1 Ann 240 80.00 English\n2 Bob 240 80.00 English\n3 Cindy 210 70.00 Math\n```\n分析要点：访问嵌套成员写成 `a[i].sc.math`；排序比较用总成绩（等价于平均分，还能避开浮点相等比较）。`best_subject` 用 `>=` 从数学开始比，就能自然实现「数学 > 英语 > C语言」的并列优先。\n边界核对：平均分 = 总分 / 3.0，别写成整除；并列科目的优先顺序靠比较时用 `>=` 实现，写成 `>` 会取到后面的科目。","pitfalls":"平均分 = 总分 / 3.0，别写成整除；并列科目的优先顺序靠比较时用 `>=` 实现，写成 `>` 会取到后面的科目。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\n/* 内层结构体：三门课成绩 */\ntypedef struct {\n    int math;\n    int english;\n    int c;\n} SCORE;\n\n/* 外层结构体：学生信息里嵌套一个 SCORE */\ntypedef struct {\n    char name[24];\n    char id[24];\n    SCORE sc;\n    int total;\n    double avg;\n} STUDENT;\n\n/* 返回最高分科目名，并列时按 数学 > 英语 > C语言 的顺序取 */\nstatic const char *best_subject(SCORE sc)\n{\n    if (sc.math >= sc.english && sc.math >= sc.c) {\n        return \"Math\";\n    }\n    if (sc.english >= sc.c) {\n        return \"English\";\n    }\n    return \"C\";\n}\n\n/* 总成绩降序，同分按姓名升序 */\nstatic int before(const STUDENT *a, const STUDENT *b)\n{\n    if (a->total != b->total) {\n        return a->total > b->total;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    STUDENT a[MAXN];\n    STUDENT key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %s %d %d %d\", a[i].name, a[i].id,\n              &a[i].sc.math, &a[i].sc.english, &a[i].sc.c);\n        a[i].total = a[i].sc.math + a[i].sc.english + a[i].sc.c;\n        a[i].avg = a[i].total / 3.0;\n    }\n\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%d %s %d %.2f %s\\n\", i + 1, a[i].name, a[i].total,\n               a[i].avg, best_subject(a[i].sc));\n    }\n    return 0;\n}\n"},{"id":"V-T09","cat":"struct","title":"图书销量榜多关键字排序·代码分析","difficulty":3,"tags":["结构体排序","多关键字","浮点比较","代码分析"],"source":"配套代码分析（原题 T09）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T09 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char name[24];\n    int sales;\n    double price;\n} BOOK;\n\n/* 销量降序 -> 价格升序 -> 书名字典序升序 */\nstatic int before(const BOOK *a, const BOOK *b)\n{\n    if (a->sales != b->sales) {\n        return a->sales > b->sales;\n    }\n    if (a->price != b->price) {\n        return a->price < b->price;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    BOOK a[MAXN];\n    BOOK key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %lf\", a[i].name, &a[i].sales, &a[i].price);\n    }\n\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d %.2f\\n\", a[i].name, a[i].sales, a[i].price);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n4\nCbook 100 35.50\nAbook 120 20.00\nBbook 100 12.00\nDbook 100 12.00\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4\nCbook 100 35.50\nAbook 120 20.00\nBbook 100 12.00\nDbook 100 12.00\n","out":"Abook 120 20.00\nBbook 100 12.00\nDbook 100 12.00\nCbook 100 35.50\n"}],"hint":"指定输入的完整输出：\n```\nAbook 120 20.00\nBbook 100 12.00\nDbook 100 12.00\nCbook 100 35.50\n```\n分析要点：比较函数里逐级判断：`sales` 不同就比销量（降序），`price` 不同就比价格（升序），最后 `strcmp` 比书名。价格用 `double` 存储，直接 `!=` 判断是否相同即可（本题输入最多 2 位小数）。\n边界核对：三个关键字的方向不同（销量降序、价格升序），写比较函数时容易把某一级的方向写反；插入排序移数组时要移动整条 `BOOK`，别只移动某个成员。","pitfalls":"三个关键字的方向不同（销量降序、价格升序），写比较函数时容易把某一级的方向写反；插入排序移数组时要移动整条 `BOOK`，别只移动某个成员。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXN 105\n\ntypedef struct {\n    char name[24];\n    int sales;\n    double price;\n} BOOK;\n\n/* 销量降序 -> 价格升序 -> 书名字典序升序 */\nstatic int before(const BOOK *a, const BOOK *b)\n{\n    if (a->sales != b->sales) {\n        return a->sales > b->sales;\n    }\n    if (a->price != b->price) {\n        return a->price < b->price;\n    }\n    return strcmp(a->name, b->name) < 0;\n}\n\nint main(void)\n{\n    BOOK a[MAXN];\n    BOOK key;\n    int n, i, j;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %lf\", a[i].name, &a[i].sales, &a[i].price);\n    }\n\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        j = i - 1;\n        while (j >= 0 && !before(&a[j], &key)) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = key;\n    }\n\n    for (i = 0; i < n; i++) {\n        printf(\"%s %d %.2f\\n\", a[i].name, a[i].sales, a[i].price);\n    }\n    return 0;\n}\n"},{"id":"V-T10","cat":"struct","title":"校园卡流水统计·代码分析","difficulty":3,"tags":["枚举","结构体","switch","代码分析"],"source":"配套代码分析（原题 T10）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T10 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define MAXN 1005\n\n/* 枚举：两种流水类型 */\ntypedef enum {\n    DEPOSIT = 0,    /* 存入 */\n    SPEND = 1       /* 消费 */\n} OP;\n\ntypedef struct {\n    OP op;\n    int amount;\n} RECORD;\n\nstatic char op_char(OP op)\n{\n    switch (op) {\n    case DEPOSIT:\n        return 'D';\n    case SPEND:\n        return 'S';\n    default:\n        return '?';\n    }\n}\n\nint main(void)\n{\n    RECORD rec[MAXN];\n    int n, i;\n    int balance = 0;\n    int failed = 0;\n    int deposits = 0;\n    int max_spend = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        char c;\n        scanf(\" %c %d\", &c, &rec[i].amount);\n        switch (c) {\n        case 'D':\n            rec[i].op = DEPOSIT;\n            break;\n        case 'S':\n            rec[i].op = SPEND;\n            break;\n        default:\n            rec[i].op = DEPOSIT;\n            break;\n        }\n    }\n\n    for (i = 0; i < n; i++) {\n        switch (rec[i].op) {\n        case DEPOSIT:\n            balance += rec[i].amount;\n            deposits += rec[i].amount;\n            break;\n        case SPEND:\n            if (rec[i].amount > balance) {\n                failed++;\n            } else {\n                balance -= rec[i].amount;\n                if (rec[i].amount > max_spend) {\n                    max_spend = rec[i].amount;\n                }\n            }\n            break;\n        }\n        printf(\"%c %d %d\\n\", op_char(rec[i].op), rec[i].amount, balance);\n    }\n\n    printf(\"Balance=%d\\n\", balance);\n    printf(\"Failed=%d\\n\", failed);\n    printf(\"Deposits=%d\\n\", deposits);\n    printf(\"MaxSpend=%d\\n\", max_spend);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3\nS 10\nD 5\nS 5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"4\nD 100\nS 30\nS 90\nD 50\n","out":"D 100 100\nS 30 70\nS 90 70\nD 50 120\nBalance=120\nFailed=1\nDeposits=150\nMaxSpend=30\n"}],"hint":"指定输入的完整输出：\n```\nS 10 0\nD 5 5\nS 5 0\nBalance=0\nFailed=1\nDeposits=5\nMaxSpend=5\n```\n分析要点：定义 `typedef enum { DEPOSIT, SPEND } OP;`，用 `switch` 把读入的字符映射成枚举值；处理时再用一次 `switch`，在 `DEPOSIT` 分支加余额、在 `SPEND` 分支判断后扣款。输出类型字符可以写一个把枚举转回 `'D'/'S'` 的函数。\n边界核对：失败的消费不能扣款、也不能参与 `MaxSpend` 统计；`Failed`、`Deposits`、`MaxSpend` 三个统计量含义不同，别混用。`scanf(\" %c\")` 中的空格用来跳过换行。","pitfalls":"失败的消费不能扣款、也不能参与 `MaxSpend` 统计；`Failed`、`Deposits`、`MaxSpend` 三个统计量含义不同，别混用。`scanf(\" %c\")` 中的空格用来跳过换行。","solution":"#include <stdio.h>\n\n#define MAXN 1005\n\n/* 枚举：两种流水类型 */\ntypedef enum {\n    DEPOSIT = 0,    /* 存入 */\n    SPEND = 1       /* 消费 */\n} OP;\n\ntypedef struct {\n    OP op;\n    int amount;\n} RECORD;\n\nstatic char op_char(OP op)\n{\n    switch (op) {\n    case DEPOSIT:\n        return 'D';\n    case SPEND:\n        return 'S';\n    default:\n        return '?';\n    }\n}\n\nint main(void)\n{\n    RECORD rec[MAXN];\n    int n, i;\n    int balance = 0;\n    int failed = 0;\n    int deposits = 0;\n    int max_spend = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        char c;\n        scanf(\" %c %d\", &c, &rec[i].amount);\n        switch (c) {\n        case 'D':\n            rec[i].op = DEPOSIT;\n            break;\n        case 'S':\n            rec[i].op = SPEND;\n            break;\n        default:\n            rec[i].op = DEPOSIT;\n            break;\n        }\n    }\n\n    for (i = 0; i < n; i++) {\n        switch (rec[i].op) {\n        case DEPOSIT:\n            balance += rec[i].amount;\n            deposits += rec[i].amount;\n            break;\n        case SPEND:\n            if (rec[i].amount > balance) {\n                failed++;\n            } else {\n                balance -= rec[i].amount;\n                if (rec[i].amount > max_spend) {\n                    max_spend = rec[i].amount;\n                }\n            }\n            break;\n        }\n        printf(\"%c %d %d\\n\", op_char(rec[i].op), rec[i].amount, balance);\n    }\n\n    printf(\"Balance=%d\\n\", balance);\n    printf(\"Failed=%d\\n\", failed);\n    printf(\"Deposits=%d\\n\", deposits);\n    printf(\"MaxSpend=%d\\n\", max_spend);\n    return 0;\n}\n"},{"id":"V-T11","cat":"struct","title":"用数组实现栈·代码分析","difficulty":3,"tags":["结构体封装","栈","函数接口","代码分析"],"source":"配套代码分析（原题 T11）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 T11 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define CAP 100     /* 栈的容量 */\n\n/* 用数组实现栈：data 存元素，top 同时表示「栈顶下标 + 1」和元素个数 */\ntypedef struct {\n    int data[CAP];\n    int top;\n} Stack;\n\nvoid stack_init(Stack *s)\n{\n    s->top = 0;\n}\n\n/* 压栈成功返回 1，栈满返回 0 */\nint stack_push(Stack *s, int x)\n{\n    if (s->top >= CAP) {\n        return 0;\n    }\n    s->data[s->top] = x;\n    s->top++;\n    return 1;\n}\n\n/* 弹栈成功返回 1，并把弹出的值写入 *x；栈空返回 0 */\nint stack_pop(Stack *s, int *x)\n{\n    if (s->top == 0) {\n        return 0;\n    }\n    s->top--;\n    *x = s->data[s->top];\n    return 1;\n}\n\n/* 只看栈顶，不弹出 */\nint stack_top(const Stack *s, int *x)\n{\n    if (s->top == 0) {\n        return 0;\n    }\n    *x = s->data[s->top - 1];\n    return 1;\n}\n\nint stack_empty(const Stack *s)\n{\n    return s->top == 0;\n}\n\nint stack_size(const Stack *s)\n{\n    return s->top;\n}\n\nint main(void)\n{\n    Stack st;\n    int n, i;\n\n    stack_init(&st);\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        int cmd, x;\n        scanf(\"%d\", &cmd);\n        if (cmd == 1) {\n            scanf(\"%d\", &x);\n            if (stack_push(&st, x)) {\n                printf(\"Push %d ok\\n\", x);\n            } else {\n                printf(\"Full\\n\");\n            }\n        } else if (cmd == 2) {\n            if (stack_pop(&st, &x)) {\n                printf(\"Pop %d\\n\", x);\n            } else {\n                printf(\"Empty\\n\");\n            }\n        } else if (cmd == 3) {\n            if (stack_top(&st, &x)) {\n                printf(\"Top %d\\n\", x);\n            } else {\n                printf(\"Empty\\n\");\n            }\n        } else if (cmd == 4) {\n            printf(\"Empty %s\\n\", stack_empty(&st) ? \"yes\" : \"no\");\n        } else {\n            printf(\"Size %d\\n\", stack_size(&st));\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5\n2\n4\n3\n1 7\n5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8\n1 5\n1 3\n5\n3\n2\n3\n2\n2\n","out":"Push 5 ok\nPush 3 ok\nSize 2\nTop 3\nPop 3\nTop 5\nPop 5\nEmpty\n"}],"hint":"指定输入的完整输出：\n```\nEmpty\nEmpty yes\nEmpty\nPush 7 ok\nSize 1\n```\n分析要点：结构体里用 `int data[100]` 加一个 `top`；让 `top` 表示「元素个数」，则压栈是 `data[top++] = x`，弹栈是 `x = data[--top]`，判空和取大小都是直接看 `top`。\n边界核对：`stack_pop` 和 `stack_top` 通过 `int *` 参数带回结果，调用时要传变量地址 `&x`；栈满判断必须放在写入之前，否则会越界写。","pitfalls":"`stack_pop` 和 `stack_top` 通过 `int *` 参数带回结果，调用时要传变量地址 `&x`；栈满判断必须放在写入之前，否则会越界写。","solution":"#include <stdio.h>\n\n#define CAP 100     /* 栈的容量 */\n\n/* 用数组实现栈：data 存元素，top 同时表示「栈顶下标 + 1」和元素个数 */\ntypedef struct {\n    int data[CAP];\n    int top;\n} Stack;\n\nvoid stack_init(Stack *s)\n{\n    s->top = 0;\n}\n\n/* 压栈成功返回 1，栈满返回 0 */\nint stack_push(Stack *s, int x)\n{\n    if (s->top >= CAP) {\n        return 0;\n    }\n    s->data[s->top] = x;\n    s->top++;\n    return 1;\n}\n\n/* 弹栈成功返回 1，并把弹出的值写入 *x；栈空返回 0 */\nint stack_pop(Stack *s, int *x)\n{\n    if (s->top == 0) {\n        return 0;\n    }\n    s->top--;\n    *x = s->data[s->top];\n    return 1;\n}\n\n/* 只看栈顶，不弹出 */\nint stack_top(const Stack *s, int *x)\n{\n    if (s->top == 0) {\n        return 0;\n    }\n    *x = s->data[s->top - 1];\n    return 1;\n}\n\nint stack_empty(const Stack *s)\n{\n    return s->top == 0;\n}\n\nint stack_size(const Stack *s)\n{\n    return s->top;\n}\n\nint main(void)\n{\n    Stack st;\n    int n, i;\n\n    stack_init(&st);\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        int cmd, x;\n        scanf(\"%d\", &cmd);\n        if (cmd == 1) {\n            scanf(\"%d\", &x);\n            if (stack_push(&st, x)) {\n                printf(\"Push %d ok\\n\", x);\n            } else {\n                printf(\"Full\\n\");\n            }\n        } else if (cmd == 2) {\n            if (stack_pop(&st, &x)) {\n                printf(\"Pop %d\\n\", x);\n            } else {\n                printf(\"Empty\\n\");\n            }\n        } else if (cmd == 3) {\n            if (stack_top(&st, &x)) {\n                printf(\"Top %d\\n\", x);\n            } else {\n                printf(\"Empty\\n\");\n            }\n        } else if (cmd == 4) {\n            printf(\"Empty %s\\n\", stack_empty(&st) ? \"yes\" : \"no\");\n        } else {\n            p
