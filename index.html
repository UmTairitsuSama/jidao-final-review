空格。\n\n### 样例说明\n5 个包裹、2 名分拣员，重量依次是 7、2、5、10、8。若在中间某处分段：切在第 3 个包裹后得到 `7+2+5=14` 与 `10+8=18`，最大的一份是 18，这是所有切法中最小的一种，所以输出 18。","samples":[{"in":"5 2\n7 2 5 10 8\n","out":"18\n"},{"in":"3 3\n4 5 6\n","out":"6\n"},{"in":"1 1\n9\n","out":"9\n"}],"hint":"答案一定是「最重单个包裹的重量」到「全部重量之和」之间的整数，而且在猜测的上限 `limit` 变大时，「能否分成不超过 m 段」这个判定是单调的，所以可以二分答案。判定时从头贪心：能装就继续往当前段里装，装不下就新开一段并数段数，最后看段数是否不超过 m；另外每个包裹本身都不能超过 `limit`。","pitfalls":"下界必须取单个包裹的最大重量，不能从 0 开始，否则判定里会出现装不下的包裹；段数统计要从 1 开始（人不够也至少要一段）；正确性条件是最小化最大段和，所以判定成功时要记录答案并往小的一半继续搜。","solution":"#include <stdio.h>\n\n#define MAXN 2005\n\n/* 判断能否按顺序把包裹切成不超过 m 段，使每段重量之和都不超过 limit */\nstatic int feasible(const long long *w, int n, int m, long long limit)\n{\n    int used = 1;\n    long long cur = 0;\n    int i;\n\n    for (i = 0; i < n; i++) {\n        if (w[i] > limit) {\n            return 0;\n        }\n        if (cur + w[i] <= limit) {\n            cur += w[i];\n        } else {\n            used++;\n            cur = w[i];\n        }\n    }\n    return used <= m;\n}\n\nint main(void)\n{\n    static long long w[MAXN];\n    int n, m, i;\n    long long lo = 0, hi = 0, ans = 0;\n\n    if (scanf(\"%d %d\", &n, &m) != 2) {\n        return 0;\n    }\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%lld\", &w[i]) != 1) {\n            return 0;\n        }\n        if (w[i] > lo) {\n            lo = w[i];      /* 下界：单个最重的包裹 */\n        }\n        hi += w[i];         /* 上界：全部由一个分拣员承担 */\n    }\n    ans = hi;\n    /* 二分答案：最小的「单段重量上限」，使段数不超过 m */\n    while (lo <= hi) {\n        long long mid = lo + (hi - lo) / 2;\n        if (feasible(w, n, m, mid)) {\n            ans = mid;\n            hi = mid - 1;\n        } else {\n            lo = mid + 1;\n        }\n    }\n    printf(\"%lld\\n\", ans);\n    return 0;\n}\n","_exam":"FM5","_examTitle":"期末全真模拟卷 5 · 电商与学籍"},{"id":"FM5-6","cat":"algo","title":"评论区爆款商品的编号","difficulty":4,"tags":["摩尔投票","数组","计数"],"source":"新编（参考期末机考风格）","desc":"### 题目描述\n电商平台的评论区里，某个爆款商品的编号出现次数超过了评论总数的一半。给定全部评论对应的商品编号，请找出这个商品编号以及它出现的次数。要求只用「抵消」思想（摩尔投票）实现，不要使用计数数组或排序。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 100000`）。\n第二行，`n` 个整数，表示每条评论对应的商品编号（`1 ≤ 编号 ≤ 10^9`），用空格分隔。\n\n### 输出格式\n一行，两个整数，用一个空格分隔：出现次数超过 n/2 的商品编号，以及它出现的次数。\n\n### 样例说明\n`3 1 3 3 7 3 2` 共 7 个编号，编号 3 出现 4 次，4 超过 7/2 = 3.5，所以输出 `3 4`。","samples":[{"in":"7\n3 1 3 3 7 3 2\n","out":"3 4\n"},{"in":"1\n42\n","out":"42 1\n"},{"in":"5\n8 8 1 8 2\n","out":"8 3\n"}],"hint":"摩尔投票：维护候选值 `cand` 和计数器 `cnt`。当前数与候选相同则 `cnt++`，不同则 `cnt--`，`cnt` 减到 0 时把候选换成当前数。因为目标编号超过一半，最后留下的候选一定是它；再扫一遍数出真实次数即可。","pitfalls":"`n` 最大 100000，数组请开成全局或 `static`，不要放在 `main` 的栈上；计数器减到 0 时必须同时把候选换成当前元素，否则会得到错误候选。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nint main(void)\n{\n    static int a[MAXN];\n    int n, i;\n    int cand = 0, cnt = 0, total = 0;\n\n    if (scanf(\"%d\", &n) != 1) {\n        return 0;\n    }\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%d\", &a[i]) != 1) {\n            return 0;\n        }\n        if (cnt == 0) {\n            cand = a[i];\n            cnt = 1;\n        } else if (a[i] == cand) {\n            cnt++;\n        } else {\n            cnt--;\n        }\n    }\n    for (i = 0; i < n; i++) {\n        if (a[i] == cand) {\n            total++;\n        }\n    }\n    printf(\"%d %d\\n\", cand, total);\n    return 0;\n}\n","_exam":"FM5","_examTitle":"期末全真模拟卷 5 · 电商与学籍"}]},{"id":"FM6","title":"期末全真模拟卷 6 · 压轴卷","subtitle":"全范围压轴：查表转换、报文解析、差分数组、二维前缀和、结构体汇总与单调栈，难度：偏难","duration":120,"problems":[{"id":"FM6-1","cat":"func","title":"门诊楼层的罗马数字铭牌","difficulty":3,"tags":["函数设计","查表","字符串拼接"],"source":"新编","desc":"### 题目描述\n医院给每个门诊楼层做了一块罗马数字铭牌。罗马数字由 `I`(1)、`V`(5)、`X`(10)、`L`(50)、`C`(100)、`D`(500)、`M`(1000) 组成，并且规定：数值小的符号写在数值大的符号左边表示相减（如 `IV` = 4、`IX` = 9、`CM` = 900），写在右边表示相加（如 `VI` = 6）。\n\n请实现一个把整数转换成罗马数字的函数，并在 `main` 中输出结果。\n\n### 输入格式\n一行，一个整数 `n`（`1 ≤ n ≤ 3999`）。\n\n### 输出格式\n一行，`n` 对应的罗马数字，全部用大写字母，行末无多余空格。\n\n### 样例说明\n`4` 写成 `IV`；`1994` 写成 `MCMXCIV`（1000 + 900 + 90 + 4）；`3999` 写成 `MMMCMXCIX`（3000 + 900 + 90 + 9）。","samples":[{"in":"4\n","out":"IV\n"},{"in":"1994\n","out":"MCMXCIV\n"},{"in":"3999\n","out":"MMMCMXCIX\n"}],"hint":"把 13 个「数值-符号」对按数值从大到小排好（`1000 M`、`900 CM`、`500 D`、`400 CD`、`100 C`、`90 XC`、`50 L`、`40 XL`、`10 X`、`9 IX`、`5 V`、`4 IV`、`1 I`），然后贪心：只要 `n` 还大于等于当前数值，就追加对应符号并减去该数值，减到 0 为止。","pitfalls":"必须把 900、400、90、40、9、4 这些减法的组合也放进对照表，否则 `1994` 会被写成 `MDCCCCLXXXXIIII`；转换结果字符串要先置成空串（`out[0] = '\\0'`）再拼接，否则会打印出缓冲区里的垃圾字符。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXLEN 32\n\n/* 把 1..3999 的整数转换成罗马数字，结果写入 out（调用者保证空间足够） */\nvoid to_roman(int n, char *out)\n{\n    const int val[13] = {1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1};\n    const char *sym[13] = {\"M\", \"CM\", \"D\", \"CD\", \"C\", \"XC\", \"L\", \"XL\",\n                           \"X\", \"IX\", \"V\", \"IV\", \"I\"};\n    int i;\n\n    out[0] = '\\0';\n    for (i = 0; i < 13; i++) {\n        while (n >= val[i]) {\n            strcat(out, sym[i]);\n            n -= val[i];\n        }\n    }\n}\n\nint main(void)\n{\n    char buf[MAXLEN];\n    int n;\n\n    if (scanf(\"%d\", &n) != 1) {\n        return 0;\n    }\n    if (n < 1 || n > 3999) {\n        return 0;\n    }\n    to_roman(n, buf);\n    printf(\"%s\\n\", buf);\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"},{"id":"FM6-2","cat":"string","title":"龙门架报文的字段解析","difficulty":3,"tags":["字符串解析","strtol","指针遍历"],"source":"新编（参考期末机考风格）","desc":"### 题目描述\n高速公路龙门架每周期上报一行报文，字段是该时段通过车辆的车速（单位 km/h），字段之间用英文逗号分隔，可能出现负数（表示逆行）。请解析出这一行里的所有整数，统计字段个数、总和与最大值。\n\n### 输入格式\n一行，由英文逗号分隔的整数组成，每个整数满足 `-1000 ≤ 值 ≤ 1000`，字段个数 `1 ≤ k ≤ 100`，整行长度不超过 1000，行末可能有换行符。\n\n### 输出格式\n一行，三个整数，用一个空格分隔：字段个数、所有字段的总和、最大的字段值，行末无多余空格。\n\n### 样例说明\n`86,72,-5,103` 共 4 个字段，总和 86 + 72 - 5 + 103 = 256，最大值 103，所以输出 `4 256 103`。","samples":[{"in":"86,72,-5,103\n","out":"4 256 103\n"},{"in":"0\n","out":"1 0 0\n"},{"in":"-3,-9\n","out":"2 -12 -3\n"}],"hint":"整行用 `fgets` 读入，再用字符指针 `p` 从头扫：跳过空格，用 `strtol(p, &end, 10)` 一次解析出一个整数，`end` 就是下一个字段的起始位置（此时 `*end` 是逗号），把 `p` 移到 `end` 之后继续。","pitfalls":"最大值要用第一个字段初始化，不能写 0（全是负数时会错）；`strtol` 返回 `long`，`end == p` 说明这一位不是整数，要跳过一个字符避免死循环；字段可能为负号开头，不能用 `%d` 逐个读。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXLEN 2048\n\nint main(void)\n{\n    char buf[MAXLEN];\n    char *p = buf;\n    int cnt = 0;\n    int maxv = 0;\n    long long sum = 0;\n\n    if (fgets(buf, sizeof(buf), stdin) == NULL) {\n        return 0;\n    }\n    for (;;) {\n        char *end = NULL;\n        long v;\n        while (*p == ' ') {\n            p++;\n        }\n        if (*p == '\\0' || *p == '\\n' || *p == '\\r') {\n            break;\n        }\n        v = strtol(p, &end, 10);\n        if (end == p) {         /* 不是整数（例如多余的逗号），跳过 */\n            p++;\n            continue;\n        }\n        if (cnt == 0 || (int)v > maxv) {\n            maxv = (int)v;\n        }\n        cnt++;\n        sum += v;\n        p = end;\n        if (*p == ',') {\n            p++;\n        }\n    }\n    printf(\"%d %lld %d\\n\", cnt, sum, maxv);\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"},{"id":"FM6-3","cat":"pointer","title":"巡查路段的覆盖次数","difficulty":3,"tags":["动态内存","差分数组","前缀和"],"source":"新编","desc":"### 题目描述\n高速公路共有 n 个路段，今天有 m 次巡查任务，第 i 次任务对编号在 `[l, r]` 内的所有路段各巡查一次。请统计每个路段今天被巡查了多少次。\n\n要求用 `malloc`（或 `calloc`）动态申请一个长度为 n + 2 的数组，用「差分 + 前缀和」在 O(n + m) 内完成统计。\n\n### 输入格式\n第一行，两个整数 `n` 和 `m`（`1 ≤ n ≤ 2000`，`0 ≤ m ≤ 2000`），用一个空格分隔。\n接下来 `m` 行，每行两个整数 `l` 和 `r`（`1 ≤ l ≤ r ≤ n`），表示一次巡查覆盖的路段区间。若 `m = 0`，则没有后续行。\n\n### 输出格式\n一行，`n` 个整数，第 i 个数表示编号为 i 的路段被巡查的次数，整数之间用一个空格分隔，行末无多余空格。\n\n### 样例说明\n`n = 5`，两次巡查分别是 `[1,3]` 和 `[3,5]`，编号 3 的路段被巡查 2 次，其余各 1 次，所以输出 `1 1 2 1 1`。","samples":[{"in":"5 2\n1 3\n3 5\n","out":"1 1 2 1 1\n"},{"in":"3 0\n","out":"0 0 0\n"},{"in":"3 1\n2 2\n","out":"0 1 0\n"}],"hint":"差分数组：每次对 `[l, r]` 加 1，就只做 `d[l] += 1` 和 `d[r+1] -= 1`；全部操作完成后从 1 到 n 做一遍前缀和 `d[i] += d[i-1]`，`d[i]` 就是路段 i 的次数。","pitfalls":"数组要开到 `n + 2`，因为要对 `r + 1` 做减法，`r = n` 时下标会到 `n + 1`；用 `calloc` 或先清零，否则差分值里会带上随机垃圾；题目允许 `m = 0`，此时不能去读后面不存在的行。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n    int n, m, i;\n    int *d;\n\n    if (scanf(\"%d %d\", &n, &m) != 2) {\n        return 0;\n    }\n    /* 下标 1..n 存差分值，多留一位给 r+1 */\n    d = (int *)calloc((size_t)n + 2, sizeof(int));\n    if (d == NULL) {\n        return 1;\n    }\n    for (i = 0; i < m; i++) {\n        int l = 0, r = 0;\n        if (scanf(\"%d %d\", &l, &r) != 2) {\n            break;\n        }\n        d[l] += 1;\n        d[r + 1] -= 1;\n    }\n    for (i = 1; i <= n; i++) {\n        d[i] += d[i - 1];       /* 前缀和还原每个路段的次数 */\n    }\n    for (i = 1; i <= n; i++) {\n        printf(i == 1 ? \"%d\" : \" %d\", d[i]);\n    }\n    printf(\"\\n\");\n    free(d);\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"},{"id":"FM6-4","cat":"algo","title":"雨量图的矩形区域查询","difficulty":4,"tags":["二维前缀和","矩阵","区间查询"],"source":"新编","desc":"### 题目描述\n气象台的雨量图是一个 m 行 n 列的网格，每个格子里的整数表示该格的雨量（单位 0.1 mm）。现在有 q 次查询，每次给出一个矩形区域（左上角与右下角的行列号），问这个矩形内所有格子的雨量之和。\n\n查询次数较多，请预处理二维前缀和，使每次查询为 O(1)。\n\n### 输入格式\n第一行，三个整数 `m`、`n`、`q`（`1 ≤ m, n ≤ 200`，`1 ≤ q ≤ 1000`），用空格分隔。\n接下来 `m` 行，每行 `n` 个整数（`0 ≤ 雨量 ≤ 1000`），用空格分隔。\n接下来 `q` 行，每行四个整数 `r1 c1 r2 c2`（`1 ≤ r1 ≤ r2 ≤ m`，`1 ≤ c1 ≤ c2 ≤ n`），表示查询左上角为第 `r1` 行第 `c1` 列、右下角为第 `r2` 行第 `c2` 列的矩形。行列号都从 1 开始。\n\n### 输出格式\n共 `q` 行，每行一个整数，为该矩形区域内的雨量总和。\n\n### 样例说明\n雨量图第一行是 `1 2 3`，第二行是 `4 5 6`。查询 `1 1 1 3` 得到第一行之和 6；查询 `2 2 2 3` 得到 5 + 6 = 11。","samples":[{"in":"2 3 2\n1 2 3\n4 5 6\n1 1 1 3\n2 2 2 3\n","out":"6\n11\n"},{"in":"1 1 1\n7\n1 1 1 1\n","out":"7\n"},{"in":"2 2 3\n1 1\n1 1\n1 1 2 2\n1 1 1 1\n2 2 2 2\n","out":"4\n1\n1\n"}],"hint":"设 `pre[i][j]` 为左上角到 `(i, j)` 的矩形和，则 `pre[i][j] = pre[i-1][j] + pre[i][j-1] - pre[i-1][j-1] + a[i][j]`；任意矩形 `(r1,c1)-(r2,c2)` 的和是 `pre[r2][c2] - pre[r1-1][c2] - pre[r2][c1-1] + pre[r1-1][c1-1]`。","pitfalls":"行列号从 1 开始，前缀和数组要多开一行一列并初始化为 0，否则 `r1 - 1`、`c1 - 1` 会越界；200 列、1000 次查询的和最大约 4 × 10^7，累加变量用 `long long` 更安全；大数组不要放栈上。","solution":"#include <stdio.h>\n\n#define MAXMN 205\n\nint main(void)\n{\n    static long long pre[MAXMN][MAXMN];\n    int m, n, q, i, j;\n\n    if (scanf(\"%d %d %d\", &m, &n, &q) != 3) {\n        return 0;\n    }\n    for (i = 1; i <= m; i++) {\n        for (j = 1; j <= n; j++) {\n            long long x = 0;\n            if (scanf(\"%lld\", &x) != 1) {\n                return 0;\n            }\n            pre[i][j] = pre[i - 1][j] + pre[i][j - 1] - pre[i - 1][j - 1] + x;\n        }\n    }\n    for (i = 0; i < q; i++) {\n        int r1 = 0, c1 = 0, r2 = 0, c2 = 0;\n        if (scanf(\"%d %d %d %d\", &r1, &c1, &r2, &c2) != 4) {\n            return 0;\n        }\n        printf(\"%lld\\n\", pre[r2][c2] - pre[r1 - 1][c2]\n                         - pre[r2][c1 - 1] + pre[r1 - 1][c1 - 1]);\n    }\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"},{"id":"FM6-5","cat":"struct","title":"医保结算的分类汇总","difficulty":4,"tags":["结构体数组","分类汇总","格式输出"],"source":"新编","desc":"### 题目描述\n医保结算台账里有 n 条报销记录，每条记录属于一个类别（用一个大写字母表示）。财务需要按类别汇总：统计每个类别的笔数、报销总额，以及该类总额占全部记录总额的百分比，并按总额从高到低输出；总额相同时类别字母小的在前。\n\n请用结构体保存「类别、笔数、总额」三项汇总信息，并写程序完成汇总与排序。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 1000`）。\n接下来 `n` 行，每行三个值：记录编号（`1 ≤ 编号 ≤ 99999` 的整数）、类别（一个大写字母 `A`–`Z`）、报销金额（`0 ≤ 金额 ≤ 100000` 的整数），用一个空格分隔。出现过的类别最多 26 种。\n\n### 输出格式\n若干行（行数等于出现过的类别数），每行四个值 `类别 笔数 总额 占比`，相邻两个值之间用一个空格分隔，行末无多余空格。占比为「该类总额 ÷ 全部记录总额 × 100」，保留 1 位小数，只写数字不加百分号；若全部记录总额为 0，则占比输出 `0.0`。\n\n### 样例说明\nA 类 2 笔共 500，B 类 2 笔共 600，C 类 1 笔共 150，全部总额 1250。按总额从高到低是 B、A、C，占比分别是 48.0、40.0、12.0。","samples":[{"in":"5\n101 A 300\n102 B 500\n103 A 200\n104 C 150\n105 B 100\n","out":"B 2 600 48.0\nA 2 500 40.0\nC 1 150 12.0\n"},{"in":"3\n201 C 100\n202 C 100\n203 A 0\n","out":"C 2 200 100.0\nA 1 0 0.0\n"},{"in":"2\n1 A 0\n2 B 0\n","out":"A 1 0 0.0\nB 1 0 0.0\n"}],"hint":"开一个结构体数组存所有出现过的类别（最多 26 个），每读一条记录就在数组里找同类项：找到就累加笔数和总额，找不到就追加一个新元素。读完再按「总额降序、类别升序」选择排序，最后用 `double` 算占比、`%.1f` 输出。","pitfalls":"全部金额为 0 时占比的分母为 0，必须先判断再计算，否则会得到 `nan` 或 `-nan`；占比要保留 1 位小数，用 `(double)` 强制转换后再除，整数除法会直接丢小数；结构体数组的规模按「类别的种数」统计，不要按记录条数开。","solution":"#include <stdio.h>\n\n#define MAXC 26\n\ntypedef struct {\n    char cat;          /* 类别字母 */\n    int count;         /* 笔数 */\n    long long total;   /* 报销总额 */\n} Ledger;\n\nint main(void)\n{\n    Ledger led[MAXC];\n    int size = 0;\n    int n, i, j;\n    long long all = 0;\n\n    if (scanf(\"%d\", &n) != 1) {\n        return 0;\n    }\n    for (i = 0; i < n; i++) {\n        int id = 0;\n        char cat[4];\n        long long amount = 0;\n        if (scanf(\"%d %3s %lld\", &id, cat, &amount) != 3) {\n            continue;\n        }\n        for (j = 0; j < size; j++) {\n            if (led[j].cat == cat[0]) {\n                break;\n            }\n        }\n        if (j == size) {                /* 新类别 */\n            led[size].cat = cat[0];\n            led[size].count = 0;\n            led[size].total = 0;\n            size++;\n        }\n        led[j].count += 1;\n        led[j].total += amount;\n        all += amount;\n    }\n    /* 按总额降序、类别字母升序排序 */\n    for (i = 0; i < size - 1; i++) {\n        int k = i;\n        for (j = i + 1; j < size; j++) {\n            if (led[j].total > led[k].total ||\n                (led[j].total == led[k].total && led[j].cat < led[k].cat)) {\n                k = j;\n            }\n        }\n        if (k != i) {\n            Ledger t = led[i];\n            led[i] = led[k];\n            led[k] = t;\n        }\n    }\n    for (i = 0; i < size; i++) {\n        double pct;\n        if (all > 0) {\n            pct = (double)led[i].total * 100.0 / (double)all;\n        } else {\n            pct = 0.0;\n        }\n        printf(\"%c %d %lld %.1f\\n\", led[i].cat, led[i].count, led[i].total, pct);\n    }\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"},{"id":"FM6-6","cat":"algo","title":"未来第一个更暖的日子","difficulty":4,"tags":["单调栈","数组","查找"],"source":"新编","desc":"### 题目描述\n气象台想知道：对连续 n 天的每日最高气温，每一天「之后第几天气温会首次严格高于今天」。如果后面没有更暖的日子，就记 0。请用单调栈在 O(n) 时间内求出全部答案。\n\n### 输入格式\n第一行，一个整数 `n`（`1 ≤ n ≤ 2000`）。\n第二行，`n` 个整数，第 i 个数表示第 i 天的最高气温（`-50 ≤ 气温 ≤ 50`），用空格分隔。\n\n### 输出格式\n一行，`n` 个整数，第 i 个数表示第 i 天之后第一次出现更高气温所隔的天数（不存在则为 0），整数之间用一个空格分隔，行末无多余空格。\n\n### 样例说明\n`73 74 75 71 69 72 76 73`：第 1 天 73 的后面第 1 天是 74，比它高，记 1；第 3 天 75 之后要到第 7 天才出现 76，记 4；第 7 天 76 之后没有更高的气温，记 0。结果为 `1 1 4 2 1 1 0 0`。","samples":[{"in":"8\n73 74 75 71 69 72 76 73\n","out":"1 1 4 2 1 1 0 0\n"},{"in":"3\n2 2 2\n","out":"0 0 0\n"},{"in":"1\n30\n","out":"0\n"}],"hint":"从右往左扫描，维护一个下标栈，栈内气温自栈底到栈顶严格递减：遇到新的一天，先把栈顶所有「气温不高于今天」的下标弹掉，此时栈顶就是右边第一个更暖的日子，答案等于两者下标之差，然后把今天的下标入栈。","pitfalls":"题目要求「严格高于」，所以弹栈条件必须是 `t[栈顶] <= t[i]`（等于也要弹），否则同温的两天会被当成答案；`ans` 要全部初始化为 0，栈里只存下标不存温度。","solution":"#include <stdio.h>\n\n#define MAXN 2005\n\nint main(void)\n{\n    static int t[MAXN], ans[MAXN], st[MAXN];\n    int n, i, top = 0;\n\n    if (scanf(\"%d\", &n) != 1) {\n        return 0;\n    }\n    for (i = 0; i < n; i++) {\n        if (scanf(\"%d\", &t[i]) != 1) {\n            return 0;\n        }\n        ans[i] = 0;\n    }\n    /* 从右往左扫描，栈中保存下标，对应气温自栈底到栈顶递减 */\n    for (i = n - 1; i >= 0; i--) {\n        while (top > 0 && t[st[top - 1]] <= t[i]) {\n            top--;\n        }\n        if (top > 0) {\n            ans[i] = st[top - 1] - i;\n        }\n        st[top++] = i;\n    }\n    for (i = 0; i < n; i++) {\n        printf(i == 0 ? \"%d\" : \" %d\", ans[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n","_exam":"FM6","_examTitle":"期末全真模拟卷 6 · 压轴卷"}]},{"id":"FM7","title":"期末仿真卷 7 · 数组边界与接口设计","subtitle":"新编练习卷；120分钟，100分；六题分值10、15、15、20、20、20。按本地课程范围设计，不代表学校真实命题。","duration":120,"problems":[{"id":"FM7-1","cat":"array1","title":"温度变化转折点","difficulty":1,"tags":["数组","期末仿真"],"source":"新编","desc":"### 题目描述\n本题10分。输入n（1至100）及n个温度（-100至100）。统计内部位置中严格大于两个邻居或严格小于两个邻居的位置个数。相等不算。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"5\n1 3 2 4 4\n","out":"2\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"只遍历拥有两个邻居的位置。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,a[100],c=0;scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);for(int i=1;i+1<n;i++)c+=(a[i]>a[i-1]&&a[i]>a[i+1])||(a[i]<a[i-1]&&a[i]<a[i+1]);printf(\"%d\\n\",c);return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"},{"id":"FM7-2","cat":"func","title":"递归数位交替和","difficulty":2,"tags":["函数与递归","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入非负整数n（≤10^9）。实现递归函数：个位为正、十位为负、百位为正，依次交替求数位和。输出结果。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"1234\n","out":"2\n"},{"in":"0\n","out":"0\n"}],"hint":"f(n)=末位-f(剩余部分)。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint f(int n){return n<10?n:n%10-f(n/10);}int main(void){int n;scanf(\"%d\",&n);printf(\"%d\\n\",f(n));return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"},{"id":"FM7-3","cat":"string","title":"相邻重复单词折叠","difficulty":2,"tags":["字符串","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入一行由小写单词及空格组成的文本，长度1至200，可含首尾和连续空格。连续重复的相同单词只保留一个，词间输出一个空格；没有单词输出空行。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"a a b a a\n","out":"a b a\n"},{"in":"   \n","out":"\n"}],"hint":"只和上一个单词比较，不能全局去重。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[202],last[202]=\"\";if(!fgets(s,sizeof s,stdin))return 0;int first=1;for(char *p=strtok(s,\" \\r\\n\");p;p=strtok(NULL,\" \\r\\n\")){if(strcmp(p,last)){printf(\"%s%s\",first?\"\":\" \",p);first=0;}strcpy(last,p);}puts(\"\");return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"},{"id":"FM7-4","cat":"pointer","title":"二级指针切分动态序列","difficulty":3,"tags":["指针","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至100）和n个整数（绝对值≤100）。实现 split(const int *a,int n,int **neg,int *cnt)，动态分配并返回所有负数，保持顺序；无负数时返回NULL和计数0。输出个数，下一行输出负数（无则EMPTY），释放结果。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"4\n-2 0 -1 3\n","out":"2\n-2 -1\n"},{"in":"1\n0\n","out":"0\nEMPTY\n"}],"hint":"先计数再分配，明确返回内存的释放责任。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint split(const int *a,int n,int **p,int *c){*p=NULL;*c=0;for(int i=0;i<n;i++)*c+=a[i]<0;if(!*c)return 1;*p=malloc((size_t)*c*sizeof **p);if(!*p)return 0;int k=0;for(int i=0;i<n;i++)if(a[i]<0)(*p)[k++]=a[i];return 1;}int main(void){int n,a[100],*p,c;scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);if(!split(a,n,&p,&c))return 1;printf(\"%d\\n\",c);if(!c)puts(\"EMPTY\");else{for(int i=0;i<c;i++)printf(\"%s%d\",i?\" \":\"\",p[i]);puts(\"\");}free(p);return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"},{"id":"FM7-5","cat":"struct","title":"最早到期的有效订单","difficulty":3,"tags":["结构体","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至100），随后每行订单编号、到期日、状态（编号1至10000且唯一，日期用1至365整数，状态0取消1有效）。输出有效订单中到期日最小者的编号，同日取编号最小；无有效订单输出NONE。使用结构体数组。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"3\n8 10 1\n2 10 1\n1 1 0\n","out":"2\n"},{"in":"1\n1 2 0\n","out":"NONE\n"}],"hint":"先过滤有效状态，再做两级比较。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstruct O{int id,day,ok;};int main(void){int n,b=-1;struct O a[100];scanf(\"%d\",&n);for(int i=0;i<n;i++){scanf(\"%d%d%d\",&a[i].id,&a[i].day,&a[i].ok);if(a[i].ok&&(b<0||a[i].day<a[b].day||(a[i].day==a[b].day&&a[i].id<a[b].id)))b=i;}if(b<0)puts(\"NONE\");else printf(\"%d\\n\",a[b].id);return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"},{"id":"FM7-6","cat":"algo","title":"区间增量的最终峰值","difficulty":4,"tags":["综合算法","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n,m（各1至100），初始n项全0。随后m行l,r,v（1≤l≤r≤n，-100≤v≤100），为闭区间加v。输出最终最大值及其第一次出现的1起始位置。要求差分数组实现。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"4 2\n1 3 2\n2 4 -1\n","out":"2 1\n"},{"in":"1 1\n1 1 -5\n","out":"-5 1\n"}],"hint":"区间修改化为两处差分，前缀还原时维护最值。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,m,d[102]={0};scanf(\"%d%d\",&n,&m);for(int i=0,l,r,v;i<m;i++){scanf(\"%d%d%d\",&l,&r,&v);d[l]+=v;d[r+1]-=v;}int s=0,b=-100000,p=1;for(int i=1;i<=n;i++){s+=d[i];if(s>b){b=s;p=i;}}printf(\"%d %d\\n\",b,p);return 0;}\n","_exam":"FM7","_examTitle":"期末仿真卷 7 · 数组边界与接口设计"}]},{"id":"FM8","title":"期末仿真卷 8 · 矩阵与内存管理","subtitle":"新编练习卷；120分钟，100分；六题分值10、15、15、20、20、20。按本地课程范围设计，不代表学校真实命题。","duration":120,"problems":[{"id":"FM8-1","cat":"array2","title":"矩阵十字交点","difficulty":1,"tags":["二维数组","期末仿真"],"source":"新编","desc":"### 题目描述\n本题10分。输入r,c（1至20）及r*c个绝对值≤100的整数。计算每个位置所在行的和加所在列的和再减本身，输出最大结果。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"2 2\n1 2\n3 4\n","out":"9\n"},{"in":"1 1\n-2\n","out":"-2\n"}],"hint":"交点只计一次。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int r,c,a[20][20],rs[20]={0},cs[20]={0};scanf(\"%d%d\",&r,&c);for(int i=0;i<r;i++)for(int j=0;j<c;j++){scanf(\"%d\",&a[i][j]);rs[i]+=a[i][j];cs[j]+=a[i][j];}int b=-100000;for(int i=0;i<r;i++)for(int j=0;j<c;j++){int x=rs[i]+cs[j]-a[i][j];if(x>b)b=x;}printf(\"%d\\n\",b);return 0;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"},{"id":"FM8-2","cat":"func","title":"递归判断非降序","difficulty":2,"tags":["函数与递归","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入n（1至100）和n个绝对值≤100的整数。实现递归函数判断数组是否非降序，输出YES或NO。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"3\n1 1 2\n","out":"YES\n"},{"in":"2\n2 1\n","out":"NO\n"}],"hint":"非降序允许相等。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint ordered(const int *a,int n){return n<=1||(a[n-2]<=a[n-1]&&ordered(a,n-1));}int main(void){int n,a[100];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);puts(ordered(a,n)?\"YES\":\"NO\");return 0;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"},{"id":"FM8-3","cat":"string","title":"连续数字段求和","difficulty":2,"tags":["字符串","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入一行仅含小写字母及数字的字符串，长度1至100，每段连续数字不超过6位。把各数字段解释为十进制非负整数并求和，输出总和。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"ab12c003d4\n","out":"19\n"},{"in":"abc\n","out":"0\n"}],"hint":"遇分隔符提交数字段，末尾也要提交。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[102];fgets(s,sizeof s,stdin);long long sum=0,v=0;for(int i=0;;i++){char c=s[i];if(c>='0'&&c<='9')v=v*10+c-'0';else{sum+=v;v=0;}if(!c)break;}printf(\"%lld\\n\",sum);return 0;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"},{"id":"FM8-4","cat":"pointer","title":"动态锯齿表行和","difficulty":3,"tags":["指针","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入行数r（1至20），每行先给长度k（1至20）再给k个绝对值≤100的整数。以int **动态建立各行不同长度的数组，输出各行和，最后逐行释放。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"2\n2 1 2\n1 -4\n","out":"3 -4\n"},{"in":"1\n1 0\n","out":"0\n"}],"hint":"各行独立分配，失败也必须清理已经分配的行。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int r,k[20];scanf(\"%d\",&r);int **a=calloc((size_t)r,sizeof *a);if(!a)return 1;int ok=1;for(int i=0;i<r;i++){scanf(\"%d\",&k[i]);a[i]=malloc((size_t)k[i]*sizeof **a);if(!a[i]){ok=0;break;}for(int j=0;j<k[i];j++)scanf(\"%d\",&a[i][j]);}if(ok)for(int i=0;i<r;i++){int s=0;for(int j=0;j<k[i];j++)s+=a[i][j];printf(\"%s%d\",i?\" \":\"\",s);}if(ok)puts(\"\");for(int i=0;i<r;i++)free(a[i]);free(a);return ok?0:1;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"},{"id":"FM8-5","cat":"struct","title":"区间预约冲突数","difficulty":3,"tags":["结构体","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至100）及n个预约的起止时刻s,e（0≤s<e≤1440）。使用结构体存储。半开区间[s,e)在有正长度重合时冲突，输出冲突预约对数。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"3\n0 10\n10 20\n5 12\n","out":"2\n"},{"in":"1\n1 2\n","out":"0\n"}],"hint":"相接端点不算冲突，每对只计一次。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstruct I{int s,e;};int main(void){int n,c=0;struct I a[100];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d%d\",&a[i].s,&a[i].e);for(int i=0;i<n;i++)for(int j=i+1;j<n;j++)c+=a[i].s<a[j].e&&a[j].s<a[i].e;printf(\"%d\\n\",c);return 0;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"},{"id":"FM8-6","cat":"algo","title":"最短达标连续段","difficulty":4,"tags":["综合算法","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至1000）、目标s（1至100000），再输入n个正整数（1至100）。输出总和至少s的最短连续段长度；无解输出0。要求线性滑动窗口。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"5 7\n2 3 1 2 4\n","out":"3\n"},{"in":"1 9\n2\n","out":"0\n"}],"hint":"正数保证移动左端时区间和单调减小。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,s,a[1000];scanf(\"%d%d\",&n,&s);for(int i=0;i<n;i++)scanf(\"%d\",a+i);int l=0,sum=0,b=n+1;for(int r=0;r<n;r++){sum+=a[r];while(sum>=s){if(r-l+1<b)b=r-l+1;sum-=a[l++];}}printf(\"%d\\n\",b==n+1?0:b);return 0;}\n","_exam":"FM8","_examTitle":"期末仿真卷 8 · 矩阵与内存管理"}]},{"id":"FM9","title":"期末仿真卷 9 · 文本与结构体封装","subtitle":"新编练习卷；120分钟，100分；六题分值10、15、15、20、20、20。按本地课程范围设计，不代表学校真实命题。","duration":120,"problems":[{"id":"FM9-1","cat":"array1","title":"缺失的最小非负编号","difficulty":1,"tags":["数组","期末仿真"],"source":"新编","desc":"### 题目描述\n本题10分。输入n（1至100）和n个整数（0至10000）。输出没有出现的最小非负整数。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"4\n0 1 1 3\n","out":"2\n"},{"in":"1\n9\n","out":"0\n"}],"hint":"答案不超过n，用计数标记即可。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,seen[102]={0},x;scanf(\"%d\",&n);for(int i=0;i<n;i++){scanf(\"%d\",&x);if(x<=n)seen[x]=1;}int k=0;while(seen[k])k++;printf(\"%d\\n\",k);return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"},{"id":"FM9-2","cat":"func","title":"递归折半查找次数","difficulty":2,"tags":["函数与递归","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入n（1至100）、目标x及严格递增的n个整数（绝对值≤1000）。实现递归二分，每次访问中点计1次，空区间计0次；输出总访问次数，找到与否都按实际过程统计。中点取下整。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"5 4\n1 2 3 4 5\n","out":"2\n"},{"in":"1 0\n1\n","out":"1\n"}],"hint":"递归返回1加子问题次数，空区间不能再访问数组。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint visits(const int *a,int l,int r,int x){if(l>r)return 0;int m=l+(r-l)/2;if(a[m]==x)return 1;return 1+(x<a[m]?visits(a,l,m-1,x):visits(a,m+1,r,x));}int main(void){int n,x,a[100];scanf(\"%d%d\",&n,&x);for(int i=0;i<n;i++)scanf(\"%d\",a+i);printf(\"%d\\n\",visits(a,0,n-1,x));return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"},{"id":"FM9-3","cat":"string","title":"反斜杠转义解码","difficulty":2,"tags":["字符串","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入一行长度≤100的文本。只把反斜杠n解码为换行、双反斜杠解码为一个反斜杠；其他反斜杠与后续字符原样保留，末尾孤立反斜杠也保留。解码结果后额外输出一个换行。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"a\\nb\n","out":"a\nb\n"},{"in":"abc\n","out":"abc\n"}],"hint":"只消费成功识别的两个字符，未知转义不能丢字符。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[102];fgets(s,sizeof s,stdin);s[strcspn(s,\"\\r\\n\")]=0;for(int i=0;s[i];i++){if(s[i]=='\\\\'&&s[i+1]=='n'){putchar('\\n');i++;}else if(s[i]=='\\\\'&&s[i+1]=='\\\\'){putchar('\\\\');i++;}else putchar(s[i]);}putchar('\\n');return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"},{"id":"FM9-4","cat":"struct","title":"有理数约分相加","difficulty":3,"tags":["结构体","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入a,b,c,d（-100≤a,c≤100，1≤b,d≤100），分别代表a/b和c/d。定义有理数结构体及返回结构体的加法函数。输出最简分数p/q，零输出0/1，分母为正。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"1 2 1 3\n","out":"5/6\n"},{"in":"-1 2 1 2\n","out":"0/1\n"}],"hint":"先通分，再以绝对值求gcd。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\ntypedef struct{int p,q;}Rat;int gcd(int a,int b){return b?gcd(b,a%b):a;}Rat plus(Rat a,Rat b){Rat r={a.p*b.q+b.p*a.q,a.q*b.q};int g=gcd(abs(r.p),r.q);r.p/=g;r.q/=g;return r;}int main(void){Rat a,b,r;scanf(\"%d%d%d%d\",&a.p,&a.q,&b.p,&b.q);r=plus(a,b);printf(\"%d/%d\\n\",r.p,r.q);return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"},{"id":"FM9-5","cat":"pointer","title":"稳定分组的指针视图","difficulty":3,"tags":["指针","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至50），随后n个无空白小写单词（长度1至20）。用字符数组存储，用指针数组构建视图：先按原顺序放以元音aeiou开头的词，再放其余词。不得移动或修改原字符串。每词单独一行。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"3\ncat apple egg\n","out":"apple\negg\ncat\n"},{"in":"1\nzoo\n","out":"zoo\n"}],"hint":"指针数组改变访问次序，字符存储保持不动。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,k=0;char a[50][21],*p[50];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%20s\",a[i]);for(int group=1;group>=0;group--)for(int i=0;i<n;i++)if((strchr(\"aeiou\",a[i][0])!=NULL)==group)p[k++]=a[i];for(int i=0;i<n;i++)puts(p[i]);return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"},{"id":"FM9-6","cat":"algo","title":"公共空闲整数时段","difficulty":4,"tags":["综合算法","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至100）和n个半开忙碌区间[l,r)（0≤l<r≤100）。考察整数时段[t,t+1)，0≤t<100。输出没有被任何区间覆盖的最长连续时段长度及最早起点；没有空闲则输出0 -1。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"1\n10 20\n","out":"80 20\n"},{"in":"1\n0 100\n","out":"0 -1\n"}],"hint":"先得到覆盖次数，再扫描零段；相同长度保留最早起点。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,d[102]={0};scanf(\"%d\",&n);for(int i=0,l,r;i<n;i++){scanf(\"%d%d\",&l,&r);d[l]++;d[r]--;}int active=0,len=0,b=0,start=-1;for(int t=0;t<100;t++){active+=d[t];if(active==0){len++;if(len>b){b=len;start=t-len+1;}}else len=0;}printf(\"%d %d\\n\",b,start);return 0;}\n","_exam":"FM9","_examTitle":"期末仿真卷 9 · 文本与结构体封装"}]},{"id":"FM10","title":"期末仿真卷 10 · 综合推理与边界处理","subtitle":"新编练习卷；120分钟，100分；六题分值10、15、15、20、20、20。按本地课程范围设计，不代表学校真实命题。","duration":120,"problems":[{"id":"FM10-1","cat":"array2","title":"矩阵局部严格峰值","difficulty":1,"tags":["二维数组","期末仿真"],"source":"新编","desc":"### 题目描述\n本题10分。输入r,c（1至20）及r*c个绝对值≤100的整数。若一个元素严格大于所有存在的上下左右邻居，则为峰值。单元素矩阵的唯一元素也是峰值。输出峰值个数。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"2 2\n1 3\n4 2\n","out":"2\n"},{"in":"1 1\n-1\n","out":"1\n"}],"hint":"不存在的邻居不参与比较。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int r,c,a[20][20],cnt=0;scanf(\"%d%d\",&r,&c);for(int i=0;i<r;i++)for(int j=0;j<c;j++)scanf(\"%d\",&a[i][j]);for(int i=0;i<r;i++)for(int j=0;j<c;j++){int ok=1;if(i&&a[i][j]<=a[i-1][j])ok=0;if(i+1<r&&a[i][j]<=a[i+1][j])ok=0;if(j&&a[i][j]<=a[i][j-1])ok=0;if(j+1<c&&a[i][j]<=a[i][j+1])ok=0;cnt+=ok;}printf(\"%d\\n\",cnt);return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"},{"id":"FM10-2","cat":"func","title":"递归镜像数列第k项","difficulty":2,"tags":["函数与递归","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。数列L(1)=[1]，L(n)=L(n-1)、n、L(n-1)的拼接。输入n,k（1≤n≤20，1≤k≤2^n-1），通过递归定位第k项，禁止建立完整数列。输出该项。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"3 6\n","out":"2\n"},{"in":"1 1\n","out":"1\n"}],"hint":"先比较中心位置，右半部分下标减去中心位置。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint at(int n,int k){int mid=1<<(n-1);if(k==mid)return n;return at(n-1,k<mid?k:k-mid);}int main(void){int n,k;scanf(\"%d%d\",&n,&k);printf(\"%d\\n\",at(n,k));return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"},{"id":"FM10-3","cat":"string","title":"可删除一个字符的回文","difficulty":2,"tags":["字符串","期末仿真"],"source":"新编","desc":"### 题目描述\n本题15分。输入一个长度1至200的小写字符串。判断最多删除一个字符能否使其成为回文，输出YES或NO。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"abca\n","out":"YES\n"},{"in":"abc\n","out":"NO\n"}],"hint":"第一次不匹配时，只需尝试删除左端或右端。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint pal(const char *s,int l,int r){while(l<r)if(s[l++]!=s[r--])return 0;return 1;}int main(void){char s[201];scanf(\"%200s\",s);int l=0,r=(int)strlen(s)-1;while(l<r&&s[l]==s[r]){l++;r--;}puts(l>=r||pal(s,l+1,r)||pal(s,l,r-1)?\"YES\":\"NO\");return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"},{"id":"FM10-4","cat":"pointer","title":"返回最长正数段的指针","difficulty":3,"tags":["指针","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至100）和n个绝对值≤100的整数。实现 int *find(int *a,int n,int *len)，返回最长连续正数段首地址及长度，长度相同取最早；没有正数返回NULL、长度0。主函数输出起点下标和长度，无正数输出-1 0。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"5\n1 2 0 3 4\n","out":"0 2\n"},{"in":"2\n0 -1\n","out":"-1 0\n"}],"hint":"返回调用者数组内部地址有效；NULL不能参与指针相减。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint *find(int *a,int n,int *len){int *best=NULL,k=0;*len=0;for(int i=0;i<n;i++){k=a[i]>0?k+1:0;if(k>*len){*len=k;best=a+i-k+1;}}return best;}int main(void){int n,a[100],len;scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);int *p=find(a,n,&len);printf(\"%d %d\\n\",p?(int)(p-a):-1,len);return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"},{"id":"FM10-5","cat":"struct","title":"库存命令执行器","difficulty":3,"tags":["结构体","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n（1至30）、m（1至100），随后n行编号与初始库存（编号1至1000且唯一，库存0至1000），再m行编号与变动量（-100至100）。未知编号或变动后库存为负则拒绝，否则执行。输出拒绝次数，下一行按原顺序输出最终库存。用结构体和独立操作函数封装。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"2 3\n1 5\n2 0\n1 -6\n2 3\n9 1\n","out":"2\n5 3\n"},{"in":"1 1\n1 0\n1 0\n","out":"0\n0\n"}],"hint":"校验成功后才修改，拒绝的操作不得改变库存。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstruct Item{int id,qty;};int apply(struct Item *a,int n,int id,int d){for(int i=0;i<n;i++)if(a[i].id==id){if(a[i].qty+d<0)return 0;a[i].qty+=d;return 1;}return 0;}int main(void){int n,m,bad=0;struct Item a[30];scanf(\"%d%d\",&n,&m);for(int i=0;i<n;i++)scanf(\"%d%d\",&a[i].id,&a[i].qty);for(int i=0,id,d;i<m;i++){scanf(\"%d%d\",&id,&d);bad+=!apply(a,n,id,d);}printf(\"%d\\n\",bad);for(int i=0;i<n;i++)printf(\"%s%d\",i?\" \":\"\",a[i].qty);puts(\"\");return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"},{"id":"FM10-6","cat":"algo","title":"恰好选k项的最大和","difficulty":4,"tags":["综合算法","期末仿真"],"source":"新编","desc":"### 题目描述\n本题20分。输入n,k（1≤k≤n≤30），再输入n个绝对值≤100的整数。从中选恰好k个互不相邻的元素，输出最大和；无法选足输出IMPOSSIBLE。要求动态规划。\n\n### 输入格式\n按上述次序读入，以空白分隔；字符串另有约定。\n\n### 输出格式\n按任务输出，各数之间一个空格，每行末尾换行；无额外提示文字。","samples":[{"in":"5 2\n5 9 4 8 2\n","out":"17\n"},{"in":"2 2\n1 2\n","out":"IMPOSSIBLE\n"},{"in":"1 1\n-3\n","out":"-3\n"}],"hint":"状态表示前i项恰好选j项，不能把不可达状态初始化为0。","pitfalls":"注意最小规模、重复值和输出格式；动态内存分配后检查并释放。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,k,a[31],d[31][31];scanf(\"%d%d\",&n,&k);for(int i=1;i<=n;i++)scanf(\"%d\",a+i);for(int i=0;i<=n;i++)for(int j=0;j<=k;j++)d[i][j]=j?-1000000:0;for(int i=1;i<=n;i++)for(int j=1;j<=k;j++){d[i][j]=d[i-1][j];int prev=i>=2?d[i-2][j-1]:(j==1?0:-1000000);if(prev>-1000000&&prev+a[i]>d[i][j])d[i][j]=prev+a[i];}if(d[n][k]==-1000000)puts(\"IMPOSSIBLE\");else printf(\"%d\\n\",d[n][k]);return 0;}\n","_exam":"FM10","_examTitle":"期末仿真卷 10 · 综合推理与边界处理"}]}],"cheatsheet":{"sections":[{"title":"函数定义与调用速查","body":"### 三种写法\n\n| 形式 | 写法 | 说明 |\n|---|---|---|\n| 定义 | `int add(int a, int b) { return a + b; }` | 有函数体 |\n| 声明 | `int add(int a, int b);` | 参数名可省：`int add(int, int);` |\n| 调用 | `add(3, 4)` | 实参个数、类型必须匹配 |\n| 无参 | `int f(void);` | 一定要写 `void` |\n| 无返回 | `void f(int x);` | 可写 `return;` 提前结束 |\n\n### 值传递 vs 地址传递\n\n| 目的 | 形参写法 | 调用写法 |\n|---|---|---|\n| 只读一个整数 | `int x` | `f(a)` |\n| 要改调用者的整数 | `int *px` | `f(&a)` |\n| 只读数组 | `const int a[]` | `f(a, n)` |\n| 修改数组 | `int a[], int n` | `f(a, n)` |\n| 修改结构体 | `Student *s` | `f(&stu)` |\n| 交换两个字符串指针 | `char **x, char **y` | `f(&p, &q)` |\n\n```c\nvoid swapInt(int *a, int *b);                          /* 交换两个整数 */\nvoid stat(const int a[], int n, int *pmin, int *pmax); /* 求最值 */\nint  binarySearch(const int a[], int n, int key);      /* 二分查找 */\nint  isPrime(int n);                                   /* 判素数 */\nint  gcd(int a, int b);                                /* 最大公约数 */\nint  myStrlen(const char *s);                          /* 手写求长度 */\nvoid reverse(int a[], int n);                          /* 原地逆置 */\nvoid sortInt(int a[], int n);                          /* 排序 */\n```\n\n### 返回多个值的三种做法\n\n| 做法 | 形态 | 评价 |\n|---|---|---|\n| 指针输出参数 | `void f(int *pmin, ...)` | 与题目接口一致，首选 |\n| 返回结构体 | `MinMax f(...)` | 语义清晰，稍慢 |\n| 全局变量 | `g_min`、`g_max` | **不要**，多次调用会算错 |\n\n### 存储类与作用域\n\n| 类别 | 初值 | 生命周期 | 可见范围 |\n|---|---|---|---|\n| 局部变量 | 随机 | 一次调用 | 本函数块 |\n| `static` 局部 | 0 | 整个程序 | 仅本函数 |\n| 全局变量 | 0 | 整个程序 | 之后所有函数 |\n| `static` 全局 | 0 | 整个程序 | 仅本文件 |\n\n### 三条铁律\n\n- 想让函数改谁，就传谁的地址；只想读，就加 `const`。\n- 数组作参数会退化成指针，长度必须另传。\n- 函数里别用全局变量攒结果，题目可能多次调用。\n"},{"title":"递归模板与三要素","body":"### 三要素自查\n\n1. **出口**写了吗（`n == 0`、`n == 1`、`depth == n`）？\n2. **规模变小**了吗（`n - 1`、`n / 2`、少一个元素）？\n3. **返回值怎么组合**（相加、取大、先递归再输出）？\n\n### 模板对照\n\n| 题型 | 递归式 | 出口 |\n|---|---|---|\n| 阶乘 / 累加 | `f(n) = n 乘 f(n-1)` | `n <= 1` |\n| 快速幂 | `half = f(x, n/2)` 再平方 | `n == 0` |\n| 递归最值 | 前 n-1 个的最值与 `a[n-1]` 比 | `n == 1` |\n| 进制输出 | 先 `f(n/base)`，再输出 `n%base` | `n < base` |\n| 逆序输出 | 先输出 `n%10`，再 `f(n/10)` | `n < 10` |\n| 最大公约数 | `f(b, a%b)` | `b == 0` |\n| 汉诺塔 | 移 n-1 到中转，移大盘，再移 n-1 | `n == 0` |\n| 全排列 | 选一个未用的数，递归，再回溯 | `depth == n` |\n\n```c\nlong long fact(int n)        { return n <= 1 ? 1 : (long long)n * fact(n - 1); }\nint       gcd2(int a, int b) { return b == 0 ? a : gcd2(b, a % b); }\nint       isPow2Rec(int n)   { return n <= 1 ? 1 : (n % 2 == 0 ? isPow2Rec(n / 2) : 0); }\n\nint maxOf(const int a[], int n)\n{\n    int m;\n    if (n == 1) return a[0];\n    m = maxOf(a, n - 1);\n    return a[n - 1] > m ? a[n - 1] : m;\n}\n```\n\n```c\n/* 汉诺塔：打印移动步骤；n 个盘共 2^n - 1 步 */\nvoid hanoi(int n, char from, char to, char via)\n{\n    if (n == 0) return;\n    hanoi(n - 1, from, via, to);\n    printf(\"%d:%c->%c\\n\", n, from, to);\n    hanoi(n - 1, via, to, from);\n}\n```\n\n### 递归的病与药\n\n| 症状 | 病因 | 处方 |\n|---|---|---|\n| 结果差一位 | 出口边界写错 | 手算前 3 项对照 |\n| 程序卡死 | 参数没变小 | 检查递归调用的实参 |\n| RE / 崩 | 深度过大爆栈 | 改迭代或记忆化 |\n| TLE | 重复子问题 | 记忆化 / 递推 |\n| 答案越积越多 | 用了全局计数器 | 改为返回值传递 |\n\n- 递归深度上千就要警惕；`fib` 递归到 45 已要几秒。\n- 回溯固定骨架：**做选择 → 递归 → 撤销选择**。\n- 题面写\"用递归实现\"就必须自己调用自己，改循环会判错。\n"},{"title":"指针与地址速查","body":"### 基本写法\n\n| 写法 | 含义 | 内存动作 |\n|---|---|---|\n| `int a = 5;` | 整型变量 | 分配 4 字节 |\n| `int *p = &a;` | p 存 a 的地址 | 分配指针大小 |\n| `*p` | 取 p 指向的值 | 读或写那块内存 |\n| `&a` | 取 a 的地址 | 不访问内容 |\n| `p = NULL;` | 空指针 | 指向地址 0 |\n| `p = &a;` | 重新指向 | 换一个地址 |\n\n### 指针与数组对照\n\n| 数组写法 | 指针写法 | 说明 |\n|---|---|---|\n| `a[i]` | `*(a + i)` | 完全等价 |\n| `&a[i]` | `a + i` | 第 i 个元素的地址 |\n| `a` | `&a[0]` | 首元素地址 |\n| `p[i]` | `*(p + i)` | p 可自增 |\n| `a++` | 非法 | 数组名是常量地址 |\n\n- `sizeof(a)` 是整个数组的字节数；`sizeof(p)` 是指针大小。\n- 指针加减 1 按**元素**跳：`int` 跳 4 字节，`char` 跳 1 字节。\n\n### 参数与返回\n\n| 需求 | 写法 |\n|---|---|\n| 改调用者的整数 | `void f(int *p)` |\n| 改调用者的指针 | `void f(int **pp)` |\n| 遍历数组 | `void f(const int a[], int n)` |\n| 二维数组 | `void f(int a[][N], int m)` |\n| 返回字符串 | 返回 `char *`，但不能返回局部数组地址 |\n\n### 常见错误对照\n\n| 错误 | 后果 | 正确做法 |\n|---|---|---|\n| 声明未初始化就解引用 | 野指针崩 | 定义时赋 `NULL` 或合法地址 |\n| `malloc` 后不判空 | 空指针写入崩 | 判 `NULL` 再退出 |\n| 返回局部数组地址 | 函数返回后失效 | 用 `static` 或 `malloc` |\n| `free` 后继续使用 | 悬垂指针 | `free` 后置 `NULL` |\n| 用 `==` 比较字符串 | 比的是地址 | 用 `strcmp` |\n| 指针类型不匹配 | 编译警告、读写错 | 强制转换或改类型 |\n"},{"title":"字符串函数对照","body":"### 库函数一览（都要 `#include <string.h>`）\n\n| 函数 | 作用 | 返回值 | 注意 |\n|---|---|---|---|\n| `strlen(s)` | 求长度 | 不含结束符的长度 | 遇到 `'\\0'` 停 |\n| `strcpy(d, s)` | 复制 | 目标地址 | 目标空间要够 |\n| `strncpy(d, s, n)` | 复制前 n 个 | 目标地址 | 不保证补结束符 |\n| `strcat(d, s)` | 拼接 | 目标地址 | 目标要有剩余空间 |\n| `strcmp(a, b)` | 字典序比较 | 负 / 0 / 正 | 不能用 `==` 代替 |\n| `strncmp(a, b, n)` | 比较前 n 个 | 负 / 0 / 正 | 判断前缀常用 |\n| `strchr(s, c)` | 找字符 | 指针或 `NULL` | 找首次出现 |\n| `strstr(s, sub)` | 找子串 | 指针或 `NULL` | 找首次出现 |\n| `strcspn(s, rej)` | 开头不属于 rej 的长度 | 长度 | 删换行神器 |\n\n### 读入方式对照\n\n| 方式 | 遇到空格 | 换行符 | 结束条件 | 场景 |\n|---|---|---|---|---|\n| `scanf(\"%s\", s)` | 停止 | 留在缓冲 | 遇空白 | 单词、学号 |\n| `fgets(s, n, stdin)` | 照读 | 读进来且留在串尾 | 遇换行或满 n-1 | 含空格的整行 |\n| `scanf(\" %c\", &ch)` | 跳过前导空白 | 不读 | 读 1 个字符 | 单字符输入 |\n| `getchar()` | 照读 | 会读到 | 读 1 个字符 | 清缓冲 |\n\n```c\nchar line[128];\n\n/* 去掉 fgets 读进来的行尾换行 */\nfgets(line, sizeof(line), stdin);\nline[strcspn(line, \"\\n\")] = '\\0';\n\n/* 清掉 scanf 残留的换行 */\nwhile (getchar() != '\\n') { }\n```\n\n### 手写实现（考试可能要求）\n\n```c\nsize_t myStrlen(const char *s) { size_t n = 0; while (s[n] != '\\0') n++; return n; }\n\nvoid myStrcpy(char *d, const char *s) { while ((*d++ = *s++) != '\\0') { } }\n\nvoid myStrcat(char *d, const char *s)\n{\n    while (*d != '\\0') d++;\n    while ((*d++ = *s++) != '\\0') { }\n}\n\nint myStrcmp(const char *a, const char *b)\n{\n    while (*a != '\\0' && *a == *b) { a++; b++; }\n    return (int)(unsigned char)*a - (int)(unsigned char)*b;\n}\n```\n\n### 八个高频题型\n\n- 统计：`cnt[26]` 桶统计字母；分类统计数字、空格、其他。\n- 逆序：双指针交换；回文：两端向中间比。\n- 删除：读写双指针压紧，末尾补 `'\\0'`。\n- 子串：双重循环 + `strncmp` 比对，记录起点。\n- 单词：跳空格、记起点、算长度，求最长/最短/第一个。\n- 括号匹配：数组当栈，左括号入栈、右括号出栈比对。\n- 排序：`strcmp` 比较、`strcpy` 交换，或用指针数组。\n- 加密：凯撒位移，注意 `%26` 与大小写分界。\n"},{"title":"结构体与排序速查","body":"### 定义模板\n\n```c\ntypedef struct {\n    char id[16];\n    char name[32];\n    int  score;\n} Student;\n\ntypedef struct {\n    int y, m, d;\n} Date;\n\ntypedef struct {\n    char name[32];\n    Date birth;      /* 嵌套结构体 */\n    int  score;\n} Person;\n```\n\n### 访问与传参\n\n| 场景 | 写法 |\n|---|---|\n| 变量取成员 | `s.score` |\n| 指针取成员 | `p->score`，等价 `(*p).score` |\n| 结构体数组 | `a[i].score` |\n| 传参避免拷贝 | `const Student *s` |\n| 整体赋值 | `s2 = s1;` 同类型合法 |\n| 比较 | 逐成员比，不能直接用 `==` |\n| 读字符串成员 | `scanf(\"%s\", s.id)`，不加 `&` |\n\n### 多关键字排序三段式\n\n```c\ntypedef struct {\n    char id[16];\n    int  total, ce;      /* 总分、机试成绩 */\n} Student;\n\nint Comp(const Student *a, const Student *b)\n{\n    if (a->total != b->total) return a->total > b->total;   /* 总分降序 */\n    if (a->ce != b->ce)       return a->ce > b->ce;         /* 机试降序 */\n    return strcmp(a->id, b->id) < 0;                        /* 学号升序 */\n}\n\nvoid Swap(Student *a, Student *b) { Student t = *a; *a = *b; *b = t; }\n\nvoid Sort(Student a[], int n)\n{\n    int i, j;\n    for (i = 0; i < n - 1; i++)\n        for (j = 0; j < n - 1 - i; j++)\n            if (!Comp(&a[j], &a[j + 1]))\n                Swap(&a[j], &a[j + 1]);\n}\n```\n\n### 数组增删查\n\n```c\ntypedef struct {\n    char id[16];\n    int  score;\n} Student;\n\nint findById(const Student a[], int n, const char *id)\n{\n    int i;\n    for (i = 0; i < n; i++)\n        if (strcmp(a[i].id, id) == 0) return i;\n    return -1;\n}\n\nint removeAt(Student a[], int *pn, int pos)\n{\n    int i;\n    if (pos < 0 || pos >= *pn) return 0;\n    for (i = pos; i < *pn - 1; i++) a[i] = a[i + 1];\n    (*pn)--;\n    return 1;\n}\n```\n\n### 枚举与联合\n\n| 类型 | 长度 | 要点 |\n|---|---|---|\n| `enum` | 同 int | 整型常量序列，可用于 `switch` |\n| `union` | 最大成员 | 成员共用内存，改一个影响其他 |\n| `struct` | 成员之和 | 各占独立空间，含对齐填充 |\n\n- `typedef enum { MON = 1, TUE, WED } WeekDay;` 后 `WeekDay` 可直接当类型名。\n- 结构体数组占空间大时放全局，避免栈溢出。\n- 输出结构体要逐成员 `printf`，不能整体打印。\n"},{"title":"动态内存分配速查","body":"### 四个函数（`#include <stdlib.h>`）\n\n| 函数 | 作用 | 内容 | 注意 |\n|---|---|---|---|\n| `malloc(size)` | 分配 size 字节 | 不初始化 | 最常用 |\n| `calloc(n, size)` | 分配 n 乘 size 字节 | 自动清零 | 等价 malloc + 清零 |\n| `realloc(p, size)` | 调整大小 | 保留原内容 | 可能返回新地址 |\n| `free(p)` | 释放 | — | 只能释放上述函数申请的 |\n\n### 标准模板（背下来）\n\n```c\nint n = 10;\nint *a = (int *)malloc((size_t)n * sizeof(int));\nif (a == NULL) {\n    printf(\"no memory\\n\");\n    return 1;\n}\n/* 使用 a[0] 到 a[n-1] */\nfree(a);\na = NULL;\n```\n\n### 二维动态数组\n\n```c\nint rows = 3, cols = 4, i, j;\nint **g = (int **)malloc((size_t)rows * sizeof(int *));\nif (g == NULL) return 1;\nfor (i = 0; i < rows; i++) {\n    g[i] = (int *)malloc((size_t)cols * sizeof(int));\n    if (g[i] == NULL) return 1;\n}\nfor (i = 0; i < rows; i++)\n    for (j = 0; j < cols; j++)\n        g[i][j] = 0;\nfor (i = 0; i < rows; i++) free(g[i]);   /* 先释放每一行 */\nfree(g);                                 /* 再释放行指针数组 */\ng = NULL;\n```\n\n### 字符串动态复制\n\n```c\nchar *dupString(const char *s)\n{\n    size_t n = strlen(s) + 1;       /* 别忘给结束符留位置 */\n    char *p = (char *)malloc(n);\n    if (p != NULL) strcpy(p, s);\n    return p;\n}\n```\n\n### 常见错误\n\n| 错误 | 后果 |\n|---|---|\n| 不判空就用 | 空指针写入崩 |\n| 少乘 `sizeof(类型)` | 空间不足，越界 |\n| 字符串少加 1 | 没有位置放 `'\\0'` |\n| 只 free 外层 | 内存泄漏 |\n| 两次 free 同一指针 | 未定义行为 |\n| `free` 后继续用 | 悬垂指针 |\n| 返回局部数组地址 | 函数返回后内容失效 |\n\n- 元素个数乘 `sizeof` 是**字节数**，`malloc` 只认字节。\n- 课堂题型一般不需要动态内存，静态数组够用就别冒险。\n"},{"title":"排序算法复杂度对照","body":"### 复杂度总表\n\n| 算法 | 最好 | 平均 | 最坏 | 额外空间 | 稳定性 |\n|---|---|---|---|---|---|\n| 冒泡排序 | O(n) | O(n^2) | O(n^2) | O(1) | 稳定 |\n| 选择排序 | O(n^2) | O(n^2) | O(n^2) | O(1) | 不稳定 |\n| 插入排序 | O(n) | O(n^2) | O(n^2) | O(1) | 稳定 |\n| 归并排序 | O(n log n) | O(n log n) | O(n log n) | O(n) | 稳定 |\n| 快速排序 | O(n log n) | O(n log n) | O(n^2) | O(log n) | 不稳定 |\n| 堆排序 | O(n log n) | O(n log n) | O(n log n) | O(1) | 不稳定 |\n| 计数排序 | O(n + k) | O(n + k) | O(n + k) | O(k) | 稳定 |\n\n### 按数据范围选算法\n\n| n 的范围 | 可用复杂度 | 期末做法 |\n|---|---|---|\n| n 不超过 1000 | O(n^2) | 冒泡、选择、插入 |\n| n 约 10^5 | O(n log n) | 归并、快排，或桶 |\n| n 约 10^6 且值域小 | O(n) | 计数排序、前缀和 |\n| 多关键字排序 | 比较函数里写全 | 直接写 `Comp` |\n\n### 三个一句话记忆\n\n- 冒泡：相邻逆序就交换，每轮把最大值送到末尾。\n- 选择：每轮在未排序部分找最小值，与当前位交换。\n- 插入：把当前元素插进前面已排好的有序段，相等不后移所以稳定。\n\n```c\nvoid bubble(int a[], int n)\n{\n    int i, j, t;\n    for (i = 0; i < n - 1; i++)\n        for (j = 0; j < n - 1 - i; j++)\n            if (a[j] > a[j + 1]) { t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; }\n}\n\nvoid insertion(int a[], int n)\n{\n    int i, j, key;\n    for (i = 1; i < n; i++) {\n        key = a[i];\n        for (j = i - 1; j >= 0 && a[j] > key; j--) a[j + 1] = a[j];\n        a[j + 1] = key;\n    }\n}\n```\n\n- 稳定性只在\"两次排序\"或\"同分保持原顺序\"时才有意义。\n- 排序题先写清规则：按什么关键字、升序还是降序、相同怎么处理。\n"},{"title":"二分查找三种变式","body":"### 先记住前提\n\n数组必须**有序**；`mid` 一律用 `l + (r - l) / 2` 防溢出。\n\n### 三种写法对照\n\n| 目标 | 区间与条件 | 收缩方式 | 返回 |\n|---|---|---|---|\n| 精确查找 | 闭区间，`l <= r` | 命中即返回 | 下标或 -1 |\n| 第一个大于等于 x | 左闭右开，`l < r` | 满足则 `r = mid` | l，可能是 n |\n| 最后一个小于等于 x | 闭区间，`l < r`，mid 上取整 | 满足则 `l = mid` | l，可能是 -1 |\n| 第一个大于 x | 左闭右开，`l < r` | 满足则 `r = mid` | l，可能是 n |\n\n```c\n/* 变式 1：精确查找 */\nint binarySearch(const int a[], int n, int key)\n{\n    int l = 0, r = n - 1;\n    while (l <= r) {\n        int mid = l + (r - l) / 2;\n        if (a[mid] == key) return mid;\n        if (a[mid] < key) l = mid + 1;\n        else r = mid - 1;\n    }\n    return -1;\n}\n\n/* 变式 2：第一个大于等于 x 的位置 */\nint lowerBound(const int a[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (a[mid] >= x) r = mid;\n        else l = mid + 1;\n    }\n    return l;\n}\n\n/* 变式 3：最后一个小于等于 x 的位置 */\nint lastLE(const int a[], int n, int x)\n{\n    int l = -1, r = n - 1;\n    while (l < r) {\n        int mid = l + (r - l + 1) / 2;   /* 上取整，防死循环 */\n        if (a[mid] <= x) l = mid;\n        else r = mid - 1;\n    }\n    return l;\n}\n```\n\n### 三个死循环坑\n\n1. `l = mid` 配下取整：`l` 与 `r` 相邻时 `mid` 恒等于 `l`，永远不动 → 改上取整。\n2. `r = mid` 配上取整：同理卡住 → 用下取整。\n3. 忘了先排序：二分的全部前提都失效。\n\n### 用法示例\n\n- 找元素是否存在：用变式 1，返回 -1 就是不存在。\n- 统计等于 x 的个数：`lowerBound(x+1) - lowerBound(x)`。\n- 插入位置：就是变式 2 的返回值。\n- 浮点数二分：循环固定 100 次，比写精度判断稳。\n"},{"title":"位运算技巧清单","body":"### 六个运算符\n\n```c\nunsigned int a = 12u, b = 10u, k = 2u;\n\nunsigned int r1 = a & b;        /* 按位与：对应位都是 1 才是 1 */\nunsigned int r2 = a | b;        /* 按位或：有一个 1 就是 1 */\nunsigned int r3 = a ^ b;        /* 按位异或：不同为 1，相同为 0 */\nunsigned int r4 = ~a;           /* 按位取反 */\nunsigned int r5 = a << k;       /* 左移 k 位，相当于乘 2 的 k 次方 */\nunsigned int r6 = a >> k;       /* 右移 k 位，相当于整除 2 的 k 次方 */\n```\n\n### 常用技巧表\n\n| 技巧 | 写法 | 用途 |\n|---|---|---|\n| 判奇偶 | `x & 1` | 结果为 1 是奇数 |\n| 除以 2 | `x >> 1` | 非负数时等价 `x / 2` |\n| 乘 2 的 k 次方 | `x << k` | 注意溢出 |\n| 取最低位的 1 | `x & (-x)` | 树状数组、快速拆位 |\n| 清掉最低位的 1 | `x & (x - 1)` | 数 1 的个数 |\n| 判断 2 的幂 | 清位后为 0 且 x 不为 0 | 二进制里只有一个 1 |\n| 取第 k 位 | `(x >> k) & 1` | k 从 0 开始 |\n| 置第 k 位为 1 | 与上 2 的 k 次方做按位或 | 合并状态 |\n| 清第 k 位 | 与上取反后的掩码做按位与 | 清除状态 |\n| 翻转第 k 位 | 与上掩码做按位异或 | 开关切换 |\n\n### 小工具函数\n\n```c\nint popcount(unsigned int x) { int c = 0; while (x) { c += (int)(x & 1u); x >>= 1; } return c; }\n\nint isPowerOfTwo(unsigned int x) { return x != 0u && (x & (x - 1u)) == 0u; }\n\nint getBit(int x, int k)   { return (x >> k) & 1; }\nint setBit(int x, int k)   { return x | (1 << k); }\nint clearBit(int x, int k) { return x & ~(1 << k); }\nint flipBit(int x, int k)  { return x ^ (1 << k); }\n\n/* 找出唯一出现奇数次的元素：全部异或 */\nint singleNumber(const int a[], int n)\n{\n    int i, r = 0;\n    for (i = 0; i < n; i++) r ^= a[i];\n    return r;\n}\n```\n\n### 三条结论\n\n- 恒等式：`x ^ x` 为 0，`x ^ 0` 为 x，`x ^ x ^ y` 为 y。\n- `~x` 等于 `-x - 1`（补码性质）。\n- 位运算优先级低于比较运算，复杂表达式一律加括号。\n"},{"title":"格式符进阶速查","body":"### 输入输出对照\n\n| 类型 | scanf | printf | 备注 |\n|---|---|---|---|\n| int | `%d` | `%d` | 4 字节，约 21 亿上限 |\n| long long | `%lld` | `%lld` | 结果可能超 21 亿就用它 |\n| unsigned | `%u` | `%u` | 非负 |\n| float | `%f` | `%f` | 6 到 7 位有效数字 |\n| double | `%lf` | `%f` | 读用 lf，写用 f |\n| char | `%c` | `%c` | 读前加空格跳过空白 |\n| 字符串 | `%s` | `%s` | 遇空白停止 |\n| 八进制 | `%o` | `%o` | 无前缀 |\n| 十六进制 | `%x` | `%x` | 无前缀，字母小写 |\n\n### 宽度与精度组合\n\n| 写法 | 效果 | 示例 |\n|---|---|---|\n| `%5d` | 右对齐宽 5 | 前面补 3 个空格 |\n| `%-5d` | 左对齐宽 5 | 后面补 3 个空格 |\n| `%05d` | 补前导零宽 5 | `00042` |\n| `%+d` | 强制带符号 | `+42` |\n| `%.2f` | 保留 2 位小数 | `3.14` |\n| `%8.2f` | 宽 8 右对齐 2 位小数 | 小数前补空格 |\n| `%.3s` | 只输出前 3 个字符 | `abc` |\n| `%%` | 输出一个百分号 | `%` |\n| `%*d` | 宽度由参数给 | 了解即可 |\n\n### 必背输出片段\n\n```c\nint       x     = 42;\nlong long sum   = 1234567890123LL;\ndouble    avg   = 3.14159;\nint       id    = 42;\nchar      name[16] = \"Tom\";\nint       score = 90;\nchar      ch    = 'A';\n\nprintf(\"%d\\n\", x);                 /* 整数加换行 */\nprintf(\"%lld\\n\", sum);             /* long long */\nprintf(\"%.2f\\n\", avg);             /* 两位小数 */\nprintf(\"%.1lf\\n\", avg);            /* 一位小数（写成 %f 也行） */\nprintf(\"%05d\\n\", id);              /* 前导零 */\nprintf(\"%s %d\\n\", name, score);    /* 字符串加整数 */\nprintf(\"%c\\n\", ch);                /* 单个字符 */\nprintf(\"%d\\n\", (int)sizeof(int));  /* 求类型大小 */\n```\n\n### 行末空格消除法\n\n```c\nint i;\nint n = 5;\nint a[5] = {3, 1, 4, 1, 5};\n\nfor (i = 0; i < n; i++)\n    printf(i ? \" %d\" : \"%d\", a[i]);   /* 第一个数不带空格 */\nprintf(\"\\n\");\n```\n\n### 五个格式陷阱\n\n- 题目要求\"保留 2 位小数\"就写 `%.2f`，不要自己四舍五入后再输出整数。\n- 输出内容与样例逐字符对齐：冒号、空格、大小写、括号都不能变。\n- 多组数据要按题目要求分隔，别自作主张加空行。\n- 一律不要打印提示语（如\"请输入\"），评测机不认。\n- 整数除法先转 `double`：`(double)sum / n`，否则小数位永远为 0。\n"},{"title":"机考前 10 分钟检查清单","body":"### 逐条打勾\n\n1. 每道题都提交过至少一次，有分比没分强。\n2. 数组大小留了余量（`+5` 或 `+10`）。\n3. 需要 `long long` 的地方格式符同步改成 `%lld`。\n4. 多组输入写成 `while (scanf(\"%d\", &n) == 1)`。\n5. 行末没有多余空格，最后一行也有换行。\n6. 没有用 `gets`，整行改用 `fgets`。\n7. 读 `double` 用的是 `%lf`。\n8. `scanf(\"%c\")` 前面加了空格。\n9. `malloc` 后有判空，末尾有 `free`。\n10. 局部数组初始化成 `{0}`，或改成全局数组。\n11. 样例自己能复现，输出逐字符核对过。\n12. 递归题的出口和\"参数变小\"都检查过。\n13. 结构体排序的比较函数覆盖了全部关键字。\n14. 没有残留的调试 `printf`。\n15. 编译通过且没有\"未初始化\"\"可能越界\"类警告。\n\n### 30 秒格式自检\n\n| 题面要求 | 检查点 |\n|---|---|\n| 保留 n 位小数 | 写的是 `%.2f` 还是 `%.3f` |\n| 数字间空格 | 行末是否多一个空格 |\n| 每行换行 | 最后一行也要换行 |\n| 不存在的情况 | 有没有输出指定提示语 |\n| 英文大小写 | 与样例逐字符一致 |\n\n### 卡住时的动作顺序\n\n1. 重新读题面的输入格式与输出格式。\n2. 用最小样例（n 等于 1）手工算，对比程序输出。\n3. 打印中间变量定位。\n4. 换一题，回头再看。\n5. 时间不够就交暴力写法，先拿部分分。\n"},{"title":"常见错误 Top 20","body":"| # | 错误写法 | 后果 | 正确做法 |\n|---|---|---|---|\n| 1 | `scanf(\"%d\", n)` 漏取地址 | 乱值或 RE | 写成 `&n` |\n| 2 | `scanf(\"%s\", &s)` 多取地址 | 类型不匹配 | 数组名不加 `&` |\n| 3 | `double` 用 `%f` 读 | 读不到值 | 用 `%lf` |\n| 4 | `long long` 用 `%d` 输出 | 输出错 | 用 `%lld` |\n| 5 | 局部数组不初始化 | 随机值 | 写 `= {0}` |\n| 6 | 数组开小一位 | 越界或 RE | 多开 5 个 |\n| 7 | 存 5 个字符开 5 字节 | 没有结束符 | 至少开 6 字节 |\n| 8 | 字符串用 `==` 比较 | 永远不等 | 用 `strcmp` |\n| 9 | `fgets` 后不删换行 | 比较失败 | 用 `strcspn` 删 |\n| 10 | 循环条件写成 `<= n` | 越界读 | 改成 `< n` |\n| 11 | 忘记 `#include <string.h>` | 隐式声明警告 | 补头文件 |\n| 12 | `malloc` 少乘 `sizeof` | 空间不足 | 个数乘元素大小 |\n| 13 | 返回局部数组地址 | 内容失效 | 用 `static` 或 `malloc` |\n| 14 | 指针未初始化就解引用 | 崩溃 | 定义即赋 `NULL` |\n| 15 | 递归没有出口 | 爆栈 | 先写终止条件 |\n| 16 | 递归参数没变小 | 死循环 | 检查实参 |\n| 17 | 交换函数只传值 | 原变量没变 | 传地址 |\n| 18 | 排序比较函数漏关键字 | 顺序不对 | 逐层比较写清 |\n| 19 | 浮点数用 `==` 判断 | 判等失败 | 差值小于 `1e-6` |\n| 20 | 输出加了提示语 | WA | 只输出题目要求的内容 |\n\n### 三条通用排查法\n\n- **先查格式再查算法**：八成 WA 死在空格、换行、小数位上。\n- **把数组开大 10 倍再跑一次**：答案变了就说明有越界。\n- **把所有 `int` 换成 `long long` 再跑一次**：答案变了就是溢出。\n"},{"title":"数据类型与取值范围","body":"本课程环境中 `int` 占 4 字节（Windows 下 `long` 也是 4 字节），`long long` 占 8 字节。\n\n| 类型 | 字节 | 取值范围 |\n|---|---|---|\n| `char` | 1 | -128 ~ 127 |\n| `short` | 2 | -32768 ~ 32767 |\n| `int` | 4 | -2147483648 ~ 2147483647（约 21 亿） |\n| `unsigned int` | 4 | 0 ~ 4294967295 |\n| `long long` | 8 | -9.22×10^18 ~ 9.22×10^18 |\n| `float` | 4 | 约 6~7 位有效数字 |\n| `double` | 8 | 约 15~16 位有效数字 |\n\n**整型除法与取余**：两个整数相除，结果仍是整数，向零截断；`%` 的符号与被除数一致。\n\n```c\nint a = 7 / 2;       /* 3 */\nint b = -7 / 2;      /* -3 */\nint c = -7 % 2;      /* -1 */\ndouble d = 7.0 / 2;  /* 3.5：想得到小数，需有一个操作数为浮点 */\n```\n\n**溢出**：`int` 最大约 2.1×10^9，求和、阶乘、斐波那契要及时换 `long long`。数组长度用宏定义，如 `#define N 1005`。\n\n**整型常量**：`1e9` 这种写法是 `double`，`1e9 + 7` 也是浮点；要写整型大数请用 `1000000007`，需要 `long long` 时加后缀写成 `1000000007LL`。"},{"title":"scanf 与 printf 格式符","body":"| 数据类型 | scanf | printf |\n|---|---|---|\n| `int` | `%d` | `%d` |\n| `long long` | `%lld` | `%lld` |\n| `float` | `%f` | `%f` |\n| `double` | `%lf` | `%f` |\n| `char` | `%c` | `%c` |\n| 字符串 | `%s` | `%s` |\n| 十六进制 | `%x` | `%x` |\n\n**常见坑**：\n- `scanf` 的变量必须取地址（数组名、字符串数组名除外）：`scanf(\"%d\", &n)`。\n- 读 `double` 用 `%lf`，读 `float` 用 `%f`；输出 `double` 用 `%f`。\n- `%c` 会读入空格和换行，前面加一个空格可跳过空白：`scanf(\" %c\", &ch)`。\n- 保留小数：`%.2f`（四舍五入到 2 位）；宽度：`%5d` 右对齐、`%-5d` 左对齐、`%05d` 补前导零。\n- 多组输入：`while (scanf(\"%d\", &n) == 1) { ... }`。\n\n```c\nint n;\ndouble x;\nscanf(\"%d%lf\", &n, &x);\nprintf(\"%d %.2f\\n\", n, x);\n```\n\n**其他格式符**：`%o` 输出八进制、`%e` 科学计数法、`%g` 自动选择较短形式；`%s` 遇到空白就停止，要读含空格的一整行请用 `fgets`。"},{"title":"运算符优先级与结合性","body":"| 优先级 | 运算符 | 结合性 |\n|---|---|---|\n| 1（最高） | `()` `[]` `++` `--`（后缀） | 左 |\n| 2 | `!` `~` `++` `--`（前缀） `+` `-`（正负号） `(类型)` `*` `&`（单目） `sizeof` | 右 |\n| 3 | `*` `/` `%` | 左 |\n| 4 | `+` `-` | 左 |\n| 5 | `<<` `>>` | 左 |\n| 6 | `<` `<=` `>` `>=` | 左 |\n| 7 | `==` `!=` | 左 |\n| 8 | `&` | 左 |\n| 9 | `^` | 左 |\n| 10 | `|` | 左 |\n| 11 | `&&` | 左 |\n| 12 | `||` | 左 |\n| 13 | `?:` | 右 |\n| 14 | `=` `+=` `-=` `*=` `/=` `%=` | 右 |\n| 15（最低） | `,` | 左 |\n\n**自增自减**：`++i` 先加再用，`i++` 先用再加。\n\n```c\nint i = 3;\nint x = i++;   /* x = 3, i = 4 */\nint y = ++i;   /* i = 5, y = 5 */\n```\n\n**注意**：不要在同一条表达式中对同一变量多次 `++/--`（如 `printf(\"%d %d\", i++, i)`），C 标准规定这是未定义行为。不确定优先级时就加括号。\n\n**典型易错**：`*` 高于 `+`，`a + b * c` 先算乘法；`=` 优先级低于 `&&`，`x = a && b` 是先算逻辑与再赋值；`?:` 和赋值都右结合，`a = b = 0` 等价于 `a = (b = 0)`。"},{"title":"关系运算、逻辑运算与短路","body":"- 关系表达式的结果是 `0`（假）或 `1`（真）；C 中非 0 即真。\n- 不能写 `0 <= x <= 100`：它等价于 `(0 <= x) <= 100`，恒为真，应写成 `0 <= x && x <= 100`。\n- `&&` 和 `||` 有短路特性：`&&` 左边为假时右边不再计算，`||` 左边为真时右边不再计算，可用来防除零、防越界。\n- 判断相等用 `==`，赋值是 `=`；写 `if (x = 0)` 会把 x 赋成 0 且条件为假。\n\n```c\n/* 利用短路避免除零 */\nif (x != 0 && y / x > 2) { ... }\n\n/* 判断闰年 */\nif ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) { ... }\n```\n\n**注意**：逻辑非 `!` 优先级很高，`!a == b` 是 `(!a) == b`；代码复杂时加括号最稳妥。"},{"title":"浮点数比较与精度","body":"- 0.1、0.2 等十进制小数无法用二进制精确表示，`0.1 + 0.2 == 0.3` 通常为假，**不要用 `==` 比较浮点数**。\n- 判断相等：包含 `<math.h>` 后用 `fabs(a - b) < 1e-6`（`float` 用 `fabsf`）。\n- 判断大小仍可直接用 `<`、`>`、`<=`、`>=`。\n- 输出四舍五入用 `printf(\"%.2f\", x)`；大量累加时用 `double` 而非 `float`。\n- 可能出现 `-0.0`，可把绝对值极小的数置 0。\n\n```c\n#include <math.h>\n#define EPS 1e-6\nif (fabs(a - b) < EPS) printf(\"equal\\n\");\nif (fabs(x) < 1e-9) x = 0;   /* 消除 -0.0 */\n```\n\n**常见坑**：用 `==` 判断 `sqrt(n) * sqrt(n) == n`；在循环条件里直接写 `x != 0.1`。\n\n**保留两位小数的比较**：若题目只要求两位小数，可先把两个数都四舍五入到两位再比较，如 `if (fabs(a - b) < 0.005)`，避免累加误差导致误判。"},{"title":"选择结构易错点","body":"- `else` 与最近的未配对 `if` 结合（悬空 else），必要时加花括号 `{}`。\n- 即使分支只有一条语句，也建议写花括号。\n- `switch(表达式)` 的表达式必须是整型或字符型；`case` 后必须是常量，不能是变量或范围。\n- 每个 `case` 末尾一般要加 `break`，否则会继续执行下一个分支（穿透）。\n- 不要忘记 `default`；`switch` 不能用于浮点数比较。\n\n```c\nswitch (grade) {\ncase 'A': printf(\"优秀\\n\"); break;\ncase 'B': printf(\"良好\\n\"); break;\ndefault:  printf(\"继续加油\\n\"); break;\n}\n```\n\n**注意**：多个 `case` 可以共用一个语句段（如 `case 'a': case 'e':`），这是有意为之，不算错误。"},{"title":"循环结构与穷举模板","body":"- `for` 适合次数已知的循环；`while` 适合条件驱动的循环；`do-while` 至少执行一次。\n- 累加器、计数器要在循环前初始化，不要在循环体内重复初始化。\n- 穷举法：枚举所有候选，逐个判断是否满足条件。\n- 判断素数只需试除到 `i * i <= n`，写成 `i <= n / i` 可避免溢出。\n- 多组输入：`while (scanf(\"%d\", &n) == 1) { ... }`。\n\n```c\n/* 判断素数 */\nint n, i, isPrime = 1;\nscanf(\"%d\", &n);\nif (n < 2) isPrime = 0;\nfor (i = 2; i <= n / i; i++)\n    if (n % i == 0) { isPrime = 0; break; }\nif (isPrime) printf(\"是素数\\n\");\n```\n\n**注意**：`break` 只跳出当前一层循环；`continue` 直接进入下一次循环，后面的语句不再执行。"},{"title":"一维数组常用模板","body":"定义数组时长度用常量：`int a[1005];`，下标范围 `0 ~ n-1`；全局数组会自动清零。\n\n```c\n/* 最值与下标 */\nint max = a[0], pos = 0;\nfor (i = 1; i < n; i++)\n    if (a[i] > max) { max = a[i]; pos = i; }\n\n/* 逆置 */\nfor (i = 0, j = n - 1; i < j; i++, j--) {\n    int t = a[i]; a[i] = a[j]; a[j] = t;\n}\n\n/* 冒泡排序（升序） */\nfor (i = 0; i < n - 1; i++)\n    for (j = 0; j < n - 1 - i; j++)\n        if (a[j] > a[j + 1]) {\n            int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;\n        }\n\n/* 二分查找（数组已升序） */\nint left = 0, right = n - 1, ans = -1;\nwhile (left <= right) {\n    int mid = left + (right - left) / 2;\n    if (a[mid] == key) { ans = mid; break; }\n    else if (a[mid] < key) left = mid + 1;\n    else right = mid - 1;\n}\n\n/* 统计与计数 */\nint cnt = 0;\nfor (i = 0; i < n; i++)\n    if (a[i] % 2 == 0) cnt++;\n\n/* 前缀和：pre[i] 表示 a[0] ~ a[i-1] 的和 */\nlong long pre[1005];\npre[0] = 0;\nfor (i = 0; i < n; i++)\n    pre[i + 1] = pre[i] + a[i];\n/* 区间 [l, r] 的元素和：pre[r + 1] - pre[l] */\n```\n\n**注意**：冒泡每轮把当前最大值“冒”到末尾；选择排序每轮在未排序部分找最小值与当前位交换；插入排序把元素插入前面已排好的有序段，相等元素不后移即可保持稳定。数组越界不会报错，只会悄悄读写到别的变量，务必检查下标在 `0 ~ n-1` 内。"},{"title":"二维数组模板","body":"定义：`int a[105][105];`，按行优先存储，访问 `a[i][j]`（i 是行，j 是列）。输出题面从 1 开始时，记得把下标 +1。\n\n- 主对角线：`i == j`；副对角线：`i + j == n - 1`。\n- 边界：`i == 0 || i == n - 1 || j == 0 || j == m - 1`。\n- 转置：`b[j][i] = a[i][j]`；顺时针旋转 90°：`b[i][j] = a[n - 1 - j][i]`。\n\n```c\n/* 8 邻居求和（防越界） */\nint sum = 0;\nfor (di = -1; di <= 1; di++)\n    for (dj = -1; dj <= 1; dj++) {\n        if (di == 0 && dj == 0) continue;          /* 跳过中心 */\n        ni = x + di; nj = y + dj;\n        if (ni >= 0 && ni < m && nj >= 0 && nj < n)\n            sum += a[ni][nj];\n    }\n```\n\n**螺旋遍历**：用方向数组 `dx[4] = {0, 1, 0, -1}`、`dy[4] = {1, 0, -1, 0}`，每走一步检查下一格是否越界或已访问，若不行就 `d = (d + 1) % 4` 转向。\n\n**套路**：先确定下标含义（行/列、0 还是 1 起点）再写边界条件；遍历时把「行」放外层、「列」放内层，既符合内存顺序也不易写错。n 阶方阵的副对角线满足 `i + j == n - 1`。"},{"title":"字符与字符串处理","body":"| 字符 | ASCII 码 |\n|---|---|---|\n| `'0'` | 48 |\n| `'A'` | 65 |\n| `'a'` | 97 |\n\n- 数字字符转数值：`ch - '0'`；数值转数字字符：`d + '0'`。\n- 大写转小写：`ch - 'A' + 'a'`；小写转大写：`ch - 'a' + 'A'`。\n- 判断数字字符：`ch >= '0' && ch <= '9'`。\n\n```c\nchar s[105];\nscanf(\"%s\", s);              /* 读到空白为止，数组名不加 & */\nfgets(s, sizeof(s), stdin);  /* 读整行，会把 '\\n' 也读进来 */\nint len = strlen(s);         /* 需要 #include <string.h> */\nfor (i = 0; i < len; i++)\n    if (s[i] >= 'a' && s[i] <= 'z')\n        s[i] = s[i] - 'a' + 'A';\n```\n\n**注意**：`fgets` 读入的末尾换行可用 `s[strcspn(s, \"\\n\")] = '\\0';` 去掉；比较字符串用 `strcmp`，不能用 `==`。\n\n**要点**：C 字符串必须以 `'\\0'` 结尾，`char s[105];` 最多存 104 个字符再加结束符；`strlen` 不算结束符；`strcpy` 复制、`strcat` 拼接、`strchr` 查找字符，都要 `#include <string.h>`。\n\n**读单词**：`scanf(\"%s\", s)` 会自动跳过前导空白，适合逐个读入不含空格的单词；读到文件末尾返回 `EOF`，可写 `while (scanf(\"%s\", s) != EOF)`。"},{"title":"经典递推与斐波那契变式","body":"- 递推三要素：初始值、递推式、计算顺序（从小到大）。\n- 斐波那契：`f[1] = f[2] = 1; f[i] = f[i-1] + f[i-2];`。`f[46] = 1836311903` 仍在 int 范围内，但 `f[47]` 就溢出，因此从第 47 项起必须用 `long long`；再大就取模。\n- 爬楼梯（每次上 1 或 2 级）：`f[0] = 1; f[1] = 1; f[i] = f[i-1] + f[i-2]`。\n- 累加、累乘、数字反转（`while (x) { ...; x /= 10; }`）也是常见循环题。\n\n```c\nlong long f[100];\nf[1] = f[2] = 1;\nfor (i = 3; i <= n; i++)\n    f[i] = f[i - 1] + f[i - 2];\n\n/* 取模版：防止溢出 */\nlong long g[100005];\ng[1] = g[2] = 1;\nfor (i = 3; i <= n; i++)\n    g[i] = (g[i - 1] + g[i - 2]) % 1000000007;\n```\n\n**注意**：斐波那契、走楼梯、兔子繁殖的递推式相同，只是初始值和问法不同。\n\n**验证方法**：写完递推先手算前几项，再与程序输出对照，能快速发现初值或下标写错的问题。"},{"title":"常见输出格式与坑","body":"- 行末不要多输出空格：先输出第一个数，其后用“空格 + 数”的格式。\n- 每行输出后都要换行，包括最后一行。\n- 矩阵输出固定套路：\n\n```c\nfor (i = 0; i < n; i++) {\n    for (j = 0; j < m; j++)\n        printf(j ? \" %d\" : \"%d\", a[i][j]);\n    printf(\"\\n\");\n}\n```\n\n- 保留小数用 `%.1f`、`%.2f`；整数补零用 `%02d`；`long long` 用 `%lld`。\n- 输出内容严格按题面，不要加“请输入”“答案是”等提示语。\n- 注意中英文标点、英文句点、空格、tab 都必须与题目要求一致。\n- 多组数据之间按题目要求空行或换行。"}]},"guide":{"sections":[{"id":"g-array","title":"数组进阶：一维、二维与字符数组","ch":"实验 7–9 · Ch5","weight":"必考","body":"### 一、数组的三条本质\n\n- **同类型、连续存放**：`int a[10];` 是 10 个 int 紧贴在一起（本机 40 字节），`a[0]` 是首元素，`a[9]` 是末元素，中间没有空隙。\n- **长度必须是编译期常量**：写 `int a[10]`，或用 `#define N 1005` 后写 `int a[N]`。不要写 `int n; scanf(\"%d\", &n); int a[n];`——这是变长数组（VLA），本课程不允许，评测机上容易直接导致 RE。\n- **数组名是首元素地址**：`a` 与 `&a[0]` 值相同；`sizeof(a)` 是\"整个数组占多少字节\"，这两件事要分清楚。\n\n### 二、一维、二维、字符数组其实是同一件事\n\n| 写法 | 单元是什么 | 元素个数 | `sizeof` | 内存排布 |\n|---|---|---|---|---|\n| `int a[5]` | 一个 int | 5 | 20 | 一行 5 个 |\n| `int b[3][4]` | 一个 int | 12 | 48 | 3 行 × 4 列，按行存储 |\n| `char s[8]` | 一个 char | 8 | 8 | 能装 7 个字符 + `'\\0'` |\n| `char t[3][10]` | 一行 10 个 char | 30 | 30 | 3 个字符串，每个最长 9 字符 |\n\n二维数组 `b[i][j]` 换算成一维就是 `b[i * 4 + j]`（行优先 / 按行存储），所以**按行遍历比按列遍历快**，因为内存连续、缓存命中率高。字符数组只是\"元素类型为 char 的数组\"，它之所以特殊，是因为 C 语言给\"以 `'\\0'` 结尾的字符数组\"起了名字——字符串。\n\n### 三、初始化陷阱（机考最常见的丢分点）\n\n```c\nint a[5];              /* 局部数组：5 个不确定的垃圾值，必须自己赋 */\nint b[5] = {0};        /* 只写一个 0：5 个元素全部为 0（推荐） */\nint c[5] = {1, 2};     /* 前两个是 1、2，后面三个自动补 0 */\nint d[3][4] = {{0}};   /* 二维清零最省事的写法 */\nchar s1[] = \"abc\";     /* 长度 4：'a' 'b' 'c' '\\0' */\nchar s2[3] = \"abc\";    /* 长度刚好 3，没有位置放 '\\0'——它不是字符串！ */\nchar s3[5] = \"abc\";    /* 后两个位置自动补 '\\0' */\n```\n\n- 全局数组、`static` 数组**自动清零**；局部数组**不清零**。题目要求初始化为 0 时，写 `= {0}`，或者把数组定义在 `main` 外面。\n- `memset(a, 0, sizeof(a))` 只能用来清零或填 `-1`；用它把 int 数组填成 1 是错的，因为 `memset` 按字节填充。\n- 大数组（如 `int a[1000000]`）一定定义在 `main` 外面：局部变量在栈上，栈只有几 MB，直接爆栈 RE。\n\n### 四、下标越界：C 不会拦住你，只会悄悄改坏别的变量\n\n```c\nint a[5] = {1, 2, 3, 4, 5};\nint sum = 0, i;\n\nfor (i = 0; i <= 5; i++)   /* 错：i == 5 时越界，读到\"邻居\"内存 */\n    sum += a[i];\n\nfor (i = 0; i < 5; i++)    /* 对：合法下标是 0 ~ 4 */\n    sum += a[i];\n```\n\n越界的典型信号有三种：程序看起来正常但答案偏大偏小、旁边某个变量被莫名改掉、直接运行时就崩。**写循环前先问自己三句**：下标从几开始？到几结束（用 `<` 还是 `<=`）？数组容量够不够（读入时多开 5 个位置做冗余）？\n\n### 五、数组作函数参数：长度会\"丢掉\"\n\n```c\n#include <stdio.h>\n#define N 10\n\nvoid show(int a[], int n)   /* 形参 int a[] 等价于 int *a */\n{\n    printf(\"%d\\n\", (int)sizeof(a));   /* 指针大小（8 或 4），绝不是 40 */\n    for (int i = 0; i < n; i++)\n        printf(\"%d \", a[i]);\n    printf(\"\\n\");\n}\n\nvoid addOne(int a[], int n)  /* 传的是地址，函数里改的就是原数组 */\n{\n    for (int i = 0; i < n; i++)\n        a[i]++;\n}\n\nint main(void)\n{\n    int a[N] = {1, 2, 3};\n    show(a, 3);      /* 数组名就是首地址，不用写 & */\n    addOne(a, 3);\n    show(a, 3);\n    return 0;\n}\n```\n\n三条规则背下来：\n\n1. **长度必须单独传**：函数里的 `sizeof(a)` 会退化成指针大小，一律按 `(数组, 长度)` 双参数约定。\n2. **在函数里改数组会影响调用者**（因为传的是地址）；形参写 `const int a[]` 表示只读，既防改错又说明意图。\n3. **二维数组传参必须写明列数**：`void f(int a[][N], int m)` 合法，`void f(int a[][], int m)` 编译不过。\n\n### 六、五种必背遍历模式\n\n```c\n/* 1) 最值 + 最值下标 */\nint findMax(const int a[], int n, int *posOut)\n{\n    int i, max = a[0];\n    *posOut = 0;\n    for (i = 1; i < n; i++)\n        if (a[i] > max) {\n            max = a[i];\n            *posOut = i;\n        }\n    return max;\n}\n```\n\n```c\n/* 2) 原地逆置：双指针向中间靠 */\nvoid reverse(int a[], int n)\n{\n    int i = 0, j = n - 1, t;\n    while (i < j) {\n        t = a[i];\n        a[i] = a[j];\n        a[j] = t;\n        i++;\n        j--;\n    }\n}\n```\n\n```c\n/* 3) 循环左移 k 位：三次逆置，不用额外数组 */\nstatic void reverseRange(int a[], int l, int r)\n{\n    int t;\n    while (l < r) {\n        t = a[l];\n        a[l] = a[r];\n        a[r] = t;\n        l++;\n        r--;\n    }\n}\n\nvoid rotateLeft(int a[], int n, int k)\n{\n    if (n <= 0) return;\n    k %= n;\n    reverseRange(a, 0, k - 1);\n    reverseRange(a, k, n - 1);\n    reverseRange(a, 0, n - 1);\n}\n```\n\n```c\n/* 4) 计数桶：值域小时用数组当\"哈希表\" */\nint countValue(const int a[], int n, int val, int maxValue)\n{\n    int i;\n    int cnt[1005] = {0};       /* 局部数组必须 = {0} 清零 */\n    for (i = 0; i < n; i++)\n        if (a[i] >= 0 && a[i] <= maxValue)\n            cnt[a[i]]++;\n    if (val < 0 || val > maxValue) return 0;\n    return cnt[val];\n}\n```\n\n```c\n/* 5) 双指针压紧：删除所有等于 val 的元素，返回新长度 */\nint removeValue(int a[], int n, int val)\n{\n    int i, k = 0;\n    for (i = 0; i < n; i++)\n        if (a[i] != val)\n            a[k++] = a[i];\n    return k;\n}\n```\n\n### 七、考点提示\n\n- 二维题（转置、鞍点、蛇形、矩阵变换）先确定\"谁是行谁是列\"，再写边界；输出时注意题面是否从 1 开始。\n- 一维题的常见变式：最长平台、连续子序列、去重、统计众数、求次大值——都是\"一次遍历 + 几个状态变量\"。\n- 读入 n 个数前先判断 `if (scanf(\"%d\", &n) != 1) return 0;`，防止空输入时使用未初始化变量。\n"},{"id":"g-string","title":"字符数组与字符串","ch":"实验 9 · Ch5","weight":"必考","body":"### 一、C 字符串只有一条规则：以 `'\\0'` 结尾\n\n`'\\0'` 是 ASCII 码为 0 的字符，作用只有一个——标记\"字符串到这里结束\"。它不算内容，但**占一个字节**。\n\n- `char s[10];` 最多存 **9** 个可见字符，最后一个位置留给 `'\\0'`。题面写\"长度不超过 100\"，数组就要开 `105`。\n- `strlen(s)` 数到 `'\\0'` 为止，**不把 `'\\0'` 算进去**；`sizeof(s)` 数的是数组容量，两者完全不同。\n- 忘了写 `'\\0'`：`printf(\"%s\", s)` 会一直往后读，输出乱码甚至崩溃。所以手工逐字符填完后，务必补一句 `s[k] = '\\0';`。\n- `'\\0'` 与 `'0'` 不是一回事：前者是结束标记（数值 0），后者是数字字符（数值 48）。\n\n### 二、四种读入方式对比（这是最容易翻车的地方）\n\n| 方式 | 读什么 | 遇到空格 | 换行符 | 典型用法 |\n|---|---|---|---|---|\n| `scanf(\"%s\", s)` | 一个不含空白的单词 | 停止，下一个 `%s` 继续读 | 留在缓冲区 | 读单词、读学号 |\n| `fgets(s, sizeof(s), stdin)` | 一整行（含空格） | 照读 | **读进来并留在串尾** | 读含空格的句子 |\n| `scanf(\" %c\", &ch)` | 一个字符 | 前导空格被跳过 | 不读 | 逐个字符处理 |\n| `getchar()` | 一个字符（含空格、换行） | 照读 | 会读到 | 清缓冲、逐字符扫描 |\n\n```c\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n{\n    char word[32];\n    char line[128];\n    int n;\n\n    scanf(\"%d\", &n);                    /* 缓冲区里残留一个 '\\n' */\n    scanf(\"%s\", word);                  /* %s 自动跳过前导空白，能吃掉那个 '\\n' */\n    getchar();                          /* 下一句要读整行，先手动清掉行尾换行 */\n    if (fgets(line, sizeof(line), stdin) != NULL) {\n        line[strcspn(line, \"\\n\")] = '\\0';   /* 去掉 fgets 读进来的换行 */\n        printf(\"[%s] [%s]\\n\", word, line);\n    }\n    return 0;\n}\n```\n\n三个高频坑：\n\n1. `scanf(\"%d\", &n)` 之后直接 `scanf(\"%c\", &ch)`，会读到上一行的 `'\\n'`。解决：写成 `scanf(\" %c\", &ch)`（`%c` 前加一个空格）或先 `getchar()`。\n2. `fgets` 一定把行尾 `'\\n'` 读进来，比较字符串前要用 `strcspn` 或手工删掉，否则 `\"abc\\n\" != \"abc\"`。\n3. 循环里混用 `scanf` 和 `fgets`，最常见的就是\"少读一行\"。记口诀：**数字用 `scanf`，整行先清换行**。\n\n### 三、四个必会函数 + 手写实现\n\n| 函数 | 作用 | 返回值 |\n|---|---|---|\n| `strlen(s)` | 求长度（不含 `'\\0'`） | 长度 |\n| `strcpy(dst, src)` | 复制（含 `'\\0'`） | `dst` |\n| `strcat(dst, src)` | 把 src 拼到 dst 末尾 | `dst` |\n| `strcmp(a, b)` | 字典序比较 | 负数 / 0 / 正数 |\n\n```c\n#include <stddef.h>\n\nsize_t my_strlen(const char *s)\n{\n    size_t n = 0;\n    while (s[n] != '\\0')\n        n++;\n    return n;\n}\n\nchar *my_strcpy(char *dst, const char *src)\n{\n    char *p = dst;\n    while ((*p++ = *src++) != '\\0')\n        ;\n    return dst;\n}\n\nchar *my_strcat(char *dst, const char *src)\n{\n    char *p = dst;\n    while (*p)\n        p++;                    /* 先走到 dst 的末尾 '\\0' 处 */\n    while ((*p++ = *src++) != '\\0')\n        ;\n    return dst;\n}\n\nint my_strcmp(const char *a, const char *b)\n{\n    while (*a && *a == *b) {\n        a++;\n        b++;\n    }\n    return (int)(unsigned char)*a - (int)(unsigned char)*b;\n}\n```\n\n- 想\"取前 k 个字符\"用 `strncpy(dst, src, k)`，但**它不保证补 `'\\0'`**，要自己写 `dst[k] = '\\0'`。\n- 查找：`strchr(s, ch)` 返回首次出现位置的指针（找不到返回 `NULL`），`strstr(s, sub)` 找子串。\n- 比较字符串**只能**用 `strcmp(a, b) == 0`，`a == b` 比较的是两个地址，永远是假的。\n- 别把 `strcat` 拼到字面量上：`char *s = \"abc\"; strcat(s, \"d\");` 会写只读内存，直接崩。\n\n### 四、常见字符串题型清单\n\n- **统计类**：字母 / 数字 / 空格 / 其他字符各多少个；每个字母出现几次（用 `cnt[26]` 桶）；最长单词、最短单词。\n- **变换类**：大小写互转、凯撒密码、逆序输出、句子反序（单词顺序颠倒）。\n- **判断类**：回文、是不是数字串、括号是否匹配（用一个数组当栈，`top` 指针压入弹出）。\n- **查找与删除**：子串出现位置与次数、删除指定字符、删除所有空格、替换字符。\n- **排序类**：对若干字符串按字典序排序（用 `strcmp` 比较、`strcpy` 交换，或用指针数组）。\n- **拆分类**：按空格 / 逗号切词并逐个输出，记录每个单词的首地址与长度。\n\n### 五、实用小模板\n\n```c\n#include <string.h>\n\n/* 删除字符串中所有空格，原地完成 */\nvoid removeSpaces(char *s)\n{\n    int i = 0, k = 0;\n    while (s[i] != '\\0') {\n        if (s[i] != ' ')\n            s[k++] = s[i];\n        i++;\n    }\n    s[k] = '\\0';\n}\n\n/* 判断回文：双指针从两端向中间比 */\nint isPalindrome(const char *s)\n{\n    int i = 0;\n    int j = (int)strlen(s) - 1;\n    while (i < j) {\n        if (s[i] != s[j])\n            return 0;\n        i++;\n        j--;\n    }\n    return 1;\n}\n```\n\n注意：`removeSpaces` 用的是\"读指针 i、写指针 k\"的双指针压紧法，和数组去重是同一个套路，只是元素换成了字符。凡是要\"原地\"完成、不许多开数组的题目，基本都用这种写法。\n\n### 六、考点提示\n\n- 题面写\"一行\"，就用 `fgets`；写\"一个单词 / 不含空格\"，就用 `scanf(\"%s\")`。用错读入方式，样例永远对不上。\n- 输出逆序、反向打印类题目注意：不要把 `'\\0'` 打印出来，下标从 `len - 1` 递到 `0`。\n- 字符数组开大 5 个位置；`strcat` 前确认目标数组够长，否则越界写会改坏别的变量。\n"},{"id":"g-func","title":"函数：定义、传参与作用域","ch":"实验 5 · Ch6","weight":"必考","body":"### 一、定义、声明、调用三件事\n\n- **定义**：写出函数体。`返回类型 函数名(参数表) { ... }`。\n- **声明（原型）**：只写头，如 `int add(int a, int b);`。定义写在调用之后时，必须先在前面声明，否则编译器按 C89 规则猜类型，容易出链接错误。\n- **调用**：`add(3, 4)`。实参的个数、类型要和形参对得上。\n- 无参数写 `void`：`int f(void);` 表示\"不接受参数\"，写 `int f();` 是\"参数不确定\"，两码事。\n- `return` 只能返回**一个**值；`void` 函数可以 `return;` 提前结束。\n\n```c\n#include <stdio.h>\n\nint add(int a, int b);          /* 声明 */\n\nint main(void)\n{\n    printf(\"%d\\n\", add(3, 4));  /* 调用 */\n    return 0;\n}\n\nint add(int a, int b)           /* 定义 */\n{\n    return a + b;\n}\n```\n\n### 二、值传递：形参只是实参的副本\n\n这是函数题的**第一考点**。函数收到的是一份拷贝，改形参不会改实参。想让函数改调用者的变量，必须传地址。\n\n```c\n#include <stdio.h>\n\nvoid swapWrong(int x, int y)    /* 交换的只是副本，调用者毫无感觉 */\n{\n    int t = x;\n    x = y;\n    y = t;\n}\n\nvoid swapRight(int *px, int *py)  /* 传地址，才是真交换 */\n{\n    int t = *px;\n    *px = *py;\n    *py = t;\n}\n\nint main(void)\n{\n    int a = 1, b = 2;\n    swapWrong(a, b);\n    printf(\"a=%d b=%d\\n\", a, b);   /* 1 2，没变 */\n    swapRight(&a, &b);\n    printf(\"a=%d b=%d\\n\", a, b);   /* 2 1，变了 */\n    return 0;\n}\n```\n\n### 三、数组作参数\n\n- `void f(int a[], int n)` 与 `void f(int *a, int n)` 完全等价，**长度必须另外传**。\n- 传数组传的是首地址，函数里改数组会改到调用者；只读时写 `const int a[]`。\n- 二维数组只能省第一维：`void f(int a[][N], int m)`，其中 `N` 必须是常量。\n- 结构体作参数默认也是值传递（整块拷贝，大结构体开销大），一般写 `const Student *s` 传指针。\n\n### 四、返回多个值的两种做法\n\n**做法一：指针作为输出参数**（最常用，和题目接口一致）。\n\n```c\nvoid stat2(const int a[], int n, int *pmin, int *pmax)\n{\n    int i;\n    *pmin = *pmax = a[0];\n    for (i = 1; i < n; i++) {\n        if (a[i] < *pmin) *pmin = a[i];\n        if (a[i] > *pmax) *pmax = a[i];\n    }\n}\n```\n\n**做法二：返回一个结构体**（把多个值打包，语义更清楚）。\n\n```c\ntypedef struct {\n    int minv;\n    int maxv;\n} MinMax;\n\nMinMax stat(const int a[], int n)\n{\n    MinMax r;\n    int i;\n    r.minv = r.maxv = a[0];\n    for (i = 1; i < n; i++) {\n        if (a[i] < r.minv) r.minv = a[i];\n        if (a[i] > r.maxv) r.maxv = a[i];\n    }\n    return r;    /* 按值返回整个结构体，合法且安全 */\n}\n```\n\n**不要用全局变量传结果**：题目会多次调用你的函数，全局累加器会\"多做一遍\"，是函数题最常见的错误来源。\n\n### 五、局部、静态、全局变量与作用域\n\n| 类别 | 定义位置 | 初值 | 生命周期 | 可见范围 |\n|---|---|---|---|---|\n| 局部变量 | 函数内 | **随机值** | 本次调用 | 本函数块内 |\n| 静态局部 `static` | 函数内 | 0 | **整个程序** | 仅本函数 |\n| 全局变量 | 所有函数外 | 0 | 整个程序 | 其后的所有函数 |\n| 全局静态 `static` | 文件级 | 0 | 整个程序 | 仅本文件 |\n\n```c\n#include <stdio.h>\n\nint g_count;                 /* 全局：自动为 0，所有函数可见 */\n\nvoid counter(void)\n{\n    int local = 0;           /* 局部：每次调用重建 */\n    static int calls = 0;    /* 静态局部：只创建一次，跨调用保留 */\n    local++;\n    calls++;\n    g_count++;\n    printf(\"local=%d calls=%d\\n\", local, calls);\n}\n\nint main(void)\n{\n    counter();               /* local=1 calls=1 */\n    counter();               /* local=1 calls=2 */\n    counter();               /* local=1 calls=3 */\n    printf(\"g_count=%d\\n\", g_count);\n    return 0;\n}\n```\n\n要点：\n\n- `static` 局部变量常用于\"只初始化一次\"的场合，但它让函数不可重入，递归里慎用。\n- 大数组放全局（或 `static`）既避免爆栈，又自动清零。\n- 变量命名避免与库函数同名（`index`、`y1`、`time` 之类）。\n\n### 六、递归 vs 迭代怎么选\n\n| 场景 | 建议 |\n|---|---|\n| 问题有明显\"自相似\"结构（树的遍历、汉诺塔、全排列、表达式求值） | 递归，代码短 |\n| 简单累加 / 计数 / 遍历数组 | 迭代，更快更安全 |\n| 递归深度可能超过几千（如 n 很大） | 迭代，否则爆栈 |\n| 存在大量重复子问题（斐波那契） | 迭代 / 递推，或记忆化 |\n\n原则是：**能一眼写出递推式的用循环，结构天然分层的用递归**。考试中递归题按题目要求写，别自作聪明改迭代（题面要求\"用递归实现\"就必须递归）。\n\n### 七、考点提示\n\n- 函数题（PTA `6-xx`）改编成完整程序时，注意 `main` 里读入、调用、输出三段要齐全，接口签名与题面**逐字符一致**。\n- 判素数、求 gcd、进制转换这类函数，注意边界：`n < 2`、`b == 0`、`n == 0`。\n- 一个函数只做一件事；名字能看出功能（`isPrime`、`getDigit`、`printPerfect`），阅卷和自查都省时间。\n"},{"id":"g-recursion","title":"递归：三要素、模板与栈","ch":"实验 6 · Ch6","weight":"高频","body":"### 一、递归的三要素\n\n1. **出口（终止条件）**：最简单情形直接给出答案，例如 `n == 1`、`n == 0`、`left > right`。\n2. **递归式**：把规模 n 的问题化为规模更小（n-1、n/2、少一个元素）的同类问题。\n3. **向出口靠近**：每次递归调用都必须让参数朝出口方向变小，否则无限递归 → 栈溢出。\n\n写递归时按这个顺序自问：**出口写了吗？规模变小了吗？返回值怎么组合？**\n\n### 二、递归求值\n\n```c\nlong long fact(int n)\n{\n    if (n <= 1) return 1;          /* 出口 */\n    return (long long)n * fact(n - 1);   /* 递归式 */\n}\n\nlong long mypow(int x, int n)      /* 快速幂：O(log n) 层递归 */\n{\n    long long half;\n    if (n == 0) return 1;\n    half = mypow(x, n / 2);\n    if (n % 2 == 0)\n        return half * half;\n    return half * half * x;\n}\n```\n\n注意 `fact(13)` 已经超出 int 范围，返回值一律用 `long long` 并用 `%lld` 输出。\n\n### 三、递归求最值\n\n```c\nint maxOf(const int a[], int n)\n{\n    int m;\n    if (n == 1) return a[0];        /* 出口：只剩一个元素 */\n    m = maxOf(a, n - 1);            /* 先求前 n-1 个的最大值 */\n    return a[n - 1] > m ? a[n - 1] : m;\n}\n```\n\n同类变式：递归求和、递归求平均值、递归统计满足条件的元素个数，套路都是\"先处理前 n-1 个，再和最后一个合并\"。\n\n### 四、进制转换与逆序输出：借\"递归回来的顺序\"天然反向\n\n```c\nvoid toBase(int n, int base)        /* 2 <= base <= 16，n 为非负 */\n{\n    const char *digits = \"0123456789ABCDEF\";\n    if (n >= base)\n        toBase(n / base, base);     /* 先递归处理高位 */\n    printf(\"%c\", digits[n % base]); /* 回来时再输出低位，顺序自动正确 */\n}\n```\n\n```c\n/* 逆序输出各位数字：先输出末位，再递归处理高位 */\nvoid printReverse(long long n)\n{\n    if (n < 0) {\n        printf(\"-\");\n        n = -n;\n    }\n    printf(\"%lld\", n % 10);\n    if (n >= 10)\n        printReverse(n / 10);\n}\n```\n\n若题目要求\"逆序后不输出前导 0\"（如 120 逆序输出 21），先算出逆序数值再输出更省事：`rev = rev * 10 + n % 10`。\n\n### 五、gcd、斐波那契、汉诺塔\n\n```c\nint gcd(int a, int b)\n{\n    return b == 0 ? a : gcd(b, a % b);   /* 一行递归，欧几里得算法 */\n}\n```\n\n```c\nlong long fib(int n)                    /* 只适合 n <= 40 演示递归 */\n{\n    if (n <= 2) return 1;\n    return fib(n - 1) + fib(n - 2);\n}\n```\n\n```c\nvoid hanoi(int n, char from, char to, char via, int *pcount)\n{\n    if (n == 0) return;\n    hanoi(n - 1, from, via, to, pcount);       /* 把上面 n-1 个挪到中转柱 */\n    printf(\"%d:%c->%c\\n\", n, from, to);        /* 移动最大盘 */\n    (*pcount)++;\n    hanoi(n - 1, via, to, from, pcount);       /* 再把 n-1 个挪到目标柱 */\n}\n```\n\n汉诺塔移动次数为 `2^n - 1`，n = 64 时早已超出 `long long`，题目一般只问到 n ≤ 30。\n\n### 六、全排列模板（回溯法）\n\n```c\n#include <stdio.h>\n\n#define N 10\n\nint a[N];        /* 当前排列 */\nint used[N + 1]; /* used[i] 表示数字 i 是否已被使用 */\n\nvoid perm(int depth, int n)\n{\n    int i;\n    if (depth == n) {                    /* 出口：凑满一个排列 */\n        for (i = 0; i < n; i++)\n            printf(i ? \" %d\" : \"%d\", a[i]);\n        printf(\"\\n\");\n        return;\n    }\n    for (i = 0; i < n; i++) {\n        if (used[i]) continue;\n        used[i] = 1;                     /* 做选择 */\n        a[depth] = i + 1;\n        perm(depth + 1, n);              /* 进入下一层 */\n        used[i] = 0;                     /* 回溯：撤销选择 */\n    }\n}\n```\n\n三点记住：**\"做选择 → 递归 → 撤销选择\"** 是回溯的固定骨架；`used` 数组是状态；每层都要能恢复现场，否则结果变少。\n\n### 七、递归树与栈：为什么慢、为什么爆\n\n- 每次调用都会压入一个**栈帧**，保存参数、返回地址、局部变量。函数返回时弹出，所以递归天生占内存。\n- `fib(n)` 的递归树有约 `2^n` 个结点，大量重复计算：`fib(30)` 已经调用上百万次，`fib(45)` 要等好几秒。改成递推（数组或三个变量滚动）立刻变成 O(n)。\n- 递归深度过大会**栈溢出**：Windows 默认栈约 1MB，每帧几十字节，深度上万就到极限。深度可能上万时（如扫描 10 万个元素）必须写循环。\n- 递归转迭代的通用手法：把中间结果存进数组（递推 / 动态规划），或用自己开的数组模拟栈。\n\n| 维度 | 递归 | 迭代 |\n|---|---|---|\n| 代码长度 | 短，贴近定义 | 略长 |\n| 效率 | 有调用开销，可能重复计算 | 无额外开销 |\n| 风险 | 栈溢出 | 循环边界写错 |\n| 适用 | 分治、回溯、树、汉诺塔 | 线性扫描、累加、递推 |\n\n### 八、考点提示\n\n- 题面写\"请用递归实现\"，就必须出现函数自己调用自己，用循环会判错。\n- 递归题最容易错的两处：**出口的边界值**（`n == 0` 还是 `n == 1`）和**参数有没有变小**。\n- 递归求值类题（实验 6_1、6_2）先手算前 3 项，把公式写清再敲代码，比调试快得多。\n- 递归里不要用静态/全局计数器做中间结果，除非题目明确多次独立调用不会互相影响。\n"},{"id":"g-pointer","title":"指针：地址、数组与参数","ch":"实验 10 · Ch7","weight":"必考","body":"### 一、地址与指针：先建立模型\n\n变量在内存里有门牌号，叫**地址**。指针变量就是专门存放地址的变量。\n\n- `&a` 取出 a 的地址；`*p` 取出 p 所指向的那个变量的值（解引用）。\n- 指针的**类型**决定两件事：一次读几个字节；指针加减 1 时跳多少字节（`int` 指针跳 4 字节，`char` 指针跳 1 字节）。\n- 未初始化的指针是**野指针**，指向随机内存，读写都可能崩。定义时就初始化：`int *p = NULL;`。\n- 用之前判空：`if (p != NULL) { ... }`。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a = 10;\n    int *p = &a;                /* p 保存 a 的地址 */\n\n    printf(\"%d\\n\", *p);         /* 10：*p 就是 a */\n    *p = 20;                    /* 通过指针修改 a */\n    printf(\"%d\\n\", a);          /* 20 */\n    printf(\"%d\\n\", (int)sizeof(p));   /* 指针自身大小：8（64 位）或 4 */\n    return 0;\n}\n```\n\n### 二、`*` 与 `&` 的两副面孔（极易混淆）\n\n| 出现位置 | 含义 |\n|---|---|\n| 定义语句里 `int *p;` | `*` 是类型的一部分，表示\"p 是指针\" |\n| 表达式里 `*p` | 解引用，取 p 指向的值 |\n| 表达式里 `&a` | 取 a 的地址 |\n| `int &a` | 本课程无此写法（那是 C++ 的引用），不要写 |\n\n```c\nint  a = 5;\nint *p = &a;      /* p 指向 a */\nint **pp = &p;    /* pp 指向\"指针 p\" */\n\n/* 三层理解：pp 是二级指针，*pp 是 p（一个 int*），**pp 才是 a 的值 5 */\n```\n\n### 三、指针与数组：等价但不相同\n\n| 写法 | 含义 | 能否自增 |\n|---|---|---|\n| `a[i]` | 数组第 i 个元素 | — |\n| `*(a + i)` | 与 `a[i]` 完全等价 | — |\n| `p[i]` | 指针 p 起第 i 个元素 | 可以 |\n| `*(p + i)` | 同上 | 可以 |\n| `a++` | 数组名是常量地址 | **非法**（编译错误） |\n\n```c\nint a[5] = {1, 2, 3, 4, 5};\nint *p = a;          /* 等价于 int *p = &a[0] */\nint *q = a + 2;      /* 指向 a[2] */\n\n/* p++; 合法，p 指向 a[1] */\n/* a++; 非法：数组名是常量地址 */\n```\n\n关键差别：`sizeof(a)` 是数组总字节数，`sizeof(p)` 是指针大小；数组名不能赋值、不能自增，指针可以。\n\n### 四、指针作参数：C 的\"输出参数\"\n\n```c\nvoid split(int total, int *q, int *r)\n{\n    *q = total / 10;    /* 商写回调用者的变量 */\n    *r = total % 10;    /* 余数写回 */\n}\n\nvoid swapStr(char **x, char **y)   /* 交换两个字符串指针本身 */\n{\n    char *t = *x;\n    *x = *y;\n    *y = t;\n}\n```\n\n判断\"什么时候要加一层指针\"：**函数想改谁，就传谁的地址**。想改 `int` 就传 `int *`；想改指针本身（例如交换两个字符串指针），参数里再写一层星号就行。\n\n### 五、指针数组 vs 数组指针（名字容易记反）\n\n| 写法 | 名称 | 含义 | 记忆法 |\n|---|---|---|---|\n| `char *a[10]` | 指针数组 | 10 个指针，每个指向一个 char | `[]` 后结合，先是数组 |\n| `int (*b)[10]` | 数组指针 | 一个指针，指向\"10 个 int 的一行\" | 括号先结合，先是指针 |\n| `int **c` | 二级指针 | 指向指针的指针 | 两个 `*` |\n| `char **argv` | 指针的指针 | 常见于字符串表格 | 指针数组作参数时退化 |\n\n```c\nchar *names[3] = {\"Tom\", \"Jerry\", \"Spike\"};   /* 指针数组：3 个字符串 */\nint a[3][4];\nint (*row)[4] = a;                            /* 数组指针：指向一行 */\n```\n\n**排序字符串时用指针数组最省事**：只交换指针，不动字符串内容，效率高且不会越界。\n\n### 六、字符串与指针\n\n```c\nchar  s1[] = \"hello\";      /* 数组：6 字节可写副本，s1[0] = 'H' 合法 */\nconst char *s2 = \"hello\";  /* 指向只读字面量，改它会崩溃 */\n```\n\n- `char *s = \"abc\";` 这种写法能编译，但**不要改 s 指向的内容**（未定义行为）。要么加 `const`，要么用数组。\n- `strlen`、`strcpy`、`strcat` 的参数都是指针，理解 `char *` 就理解了它们的本质。\n- 逐字符扫描统一写法：`while (*p != '\\0') { ... p++; }`。\n\n### 七、常见错误清单（考试前对号入座）\n\
