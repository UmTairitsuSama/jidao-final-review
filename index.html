return 1;\n    }\n\n    for (i = 0; i < n; i++) {\n        scanf(\"%s %d %d\", arr[i].name, &arr[i].a, &arr[i].b);\n        arr[i].total = arr[i].a + arr[i].b;\n    }\n\n    qsort(arr, (size_t)n, sizeof(PLAYER), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %s %d %d %d\\n\", i + 1, arr[i].name,\n               arr[i].total, arr[i].a, arr[i].b);\n    }\n\n    free(arr);\n    return 0;\n}\n"},{"id":"R01","cat":"algo","title":"通行卡权限位里 1 的个数","difficulty":1,"tags":["位运算","二进制","循环"],"source":"新编（综合应用：位运算入门）","desc":"### 题目描述\n电子实验室的门禁系统用一个整数的二进制位图记录每张通行卡的权限：第 i 位为 1 表示这张卡拥有第 i 项权限。现在给出 n 张通行卡各自的位图（都是非负整数），请统计每张卡拥有多少项权限（即该整数的二进制表示中 1 的个数），并找出权限最多的那张卡。\n\n### 输入格式\n第一行，一个整数 n（1 ≤ n ≤ 1000），表示通行卡的数量。\n第二行，n 个用空格分隔的非负整数（0 ≤ 每个整数 ≤ 10^9），依次为各张卡的位图。位图允许为 0，表示这张卡没有任何权限。\n\n### 输出格式\n共三行：\n- 第一行，n 个整数，依次为每张卡二进制表示中 1 的个数，相邻两个数之间用一个空格分隔，行末不能有多余空格。\n- 第二行，格式为 `SUM s`，其中 s 是这 n 个数之和（`SUM` 与 s 之间用一个空格分隔）。\n- 第三行，格式为 `MAX v`，其中 v 是权限最多的那张卡的位图；若有多张卡并列最多，输出输入中**最先出现**的那张卡。\n\n### 样例说明\n1023 的二进制表示是 1111111111，共有 10 个 1，是权限最多的卡，所以第三行输出 `MAX 1023`；这 5 个数的 1 的个数分别是 0、1、2、2、10，和为 15。","samples":[{"in":"5\n0 1 5 12 1023\n","out":"0 1 2 2 10\nSUM 15\nMAX 1023\n"},{"in":"3\n7 7 3\n","out":"3 3 2\nSUM 8\nMAX 7\n"}],"hint":"对每个数反复做 `x & 1` 取最低位、`x >>= 1` 去掉最低位，直到 x 变成 0，累加就得到 1 的个数。找一个变量记录当前的“最大个数”以及对应的原数，只有严格更大时才更新，就能自然实现“并列取最先出现”。","pitfalls":"0 的二进制中 1 的个数是 0（循环一次也不执行），容易漏掉；把位图存成 `unsigned int` 更稳妥，避免对有符号数右移的依赖；n 个数可能跨行，用循环调用 `scanf` 读够 n 个即可。","solution":"#include <stdio.h>\n\n#define MAXN 1005\n\nunsigned int card[MAXN];\nint cnt[MAXN];\n\nint main(void)\n{\n    int n, i, sum = 0, best = -1, arg = 0;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%u\", &card[i]);\n    }\n\n    for (i = 0; i < n; i++) {\n        unsigned int x = card[i];\n        int c = 0;\n        while (x > 0) {\n            c += (int)(x & 1u);\n            x >>= 1;\n        }\n        cnt[i] = c;\n        sum += c;\n        if (c > best) {\n            best = c;\n            arg = (int)card[i];\n        }\n    }\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", cnt[i]);\n    }\n    printf(\"\\n\");\n    printf(\"SUM %d\\n\", sum);\n    printf(\"MAX %d\\n\", arg);\n    return 0;\n}\n"},{"id":"R02","cat":"algo","title":"不能直接跨端的塔片搬运","difficulty":2,"tags":["递推","long long","汉诺塔变式"],"source":"新编（经典汉诺塔的规则变式）","desc":"### 题目描述\n搬运工要把 n 片大小不同的塔片从 A 柱搬到 C 柱，中途可以借用 B 柱。规则和经典汉诺塔一样：每次只能搬动一片，任何时刻都不允许大片压在小片上面。\n\n和经典汉诺塔不同的是，这次场地中间有一条狭窄通道，**禁止把塔片直接从 A 柱搬到 C 柱，也禁止直接从 C 柱搬到 A 柱**；跨过两端必须先经过 B 柱（A→B、B→C、B→A、C→B 这四种搬法都允许）。请计算把 n 片塔片全部从 A 柱搬到 C 柱最少需要搬多少次。\n\n### 输入格式\n一行，一个整数 n（1 ≤ n ≤ 38），表示塔片数目。\n\n### 输出格式\n一行，一个整数，表示最少的搬运次数。\n\n### 样例说明\nn = 1 时，那一片只能走 A→B→C，共 2 次，所以输出 2。n = 2 时最少 8 次：先把小片搬到 C（2 次），把大片搬到 B（1 次），把小片从 C 搬回 A（2 次），把大片从 B 搬到 C（1 次），最后把小片从 A 搬到 C（2 次）。\n\n由此可归纳出递推式：f(1) = 2，且 f(n) = 3 × f(n-1) + 2，整理得 f(n) = 3^n - 1。","samples":[{"in":"1\n","out":"2\n"},{"in":"3\n","out":"26\n"},{"in":"38\n","out":"1350851717672992088\n"}],"hint":"f(n) 的三步结构：把上面 n-1 片从 A 搬到 C（f(n-1) 次），把最大的那片从 A 搬到 B（1 次），把 n-1 片从 C 搬回 A（f(n-1) 次），把最大片从 B 搬到 C（1 次），再把 n-1 片从 A 搬到 C（f(n-1) 次）。用一个循环 `f = 3 * f + 2` 递推到 n 即可。","pitfalls":"n = 38 时答案约 1.35×10^18，必须用 `long long` 存并用 `%lld` 输出，`int` 会溢出；递推是 `f = 3 * f + 2` 从 f = 0 开始执行 n 轮（等于 3^n - 1），不要套用经典汉诺塔的 2^n - 1。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, i;\n    long long f = 0; /* f(0) = 0，f(n) = 3 * f(n-1) + 2 */\n\n    scanf(\"%d\", &n);\n    for (i = 1; i <= n; i++) {\n        f = 3 * f + 2;\n    }\n    printf(\"%lld\\n\", f);\n    return 0;\n}\n"},{"id":"R03","cat":"algo","title":"成绩表的计数排序","difficulty":2,"tags":["计数排序","桶计数","统计"],"source":"新编（实验 7 排序方法的综合应用）","desc":"### 题目描述\n期末结束后，辅导员手上有 n 条成绩记录，每条都是 0 到 100 之间的整数。为了不被排序算法的时间复杂度卡住，请用**计数排序**完成下面几件事：把所有成绩按非递减顺序输出，并统计最高分、最低分和出现次数最多的分数。\n\n### 输入格式\n第一行，一个整数 n（1 ≤ n ≤ 100000），表示成绩条数。\n第二行，n 个用空格分隔的整数（0 ≤ 每个整数 ≤ 100），表示各条成绩。成绩可以重复。\n\n### 输出格式\n共四行：\n- 第一行，n 个整数，为按非递减顺序排列的成绩，相邻两个之间用一个空格分隔，行末不能有多余空格。\n- 第二行，格式为 `MAX 最高分`。\n- 第三行，格式为 `MIN 最低分`。\n- 第四行，格式为 `MODE 众数`；若出现次数最多的分数不止一个，输出其中**最小**的那个分数。\n\n### 样例说明\n样例 1 中 88 出现了 3 次，是所有分数里最多的，所以第四行输出 `MODE 88`；成绩按非递减顺序排列后是 60 72 72 88 88 88 95 100。","samples":[{"in":"8\n88 72 95 88 60 72 88 100\n","out":"60 72 72 88 88 88 95 100\nMAX 100\nMIN 60\nMODE 88\n"},{"in":"1\n100\n","out":"100\nMAX 100\nMIN 100\nMODE 100\n"}],"hint":"开一个 `int cnt[101]` 统计每个分数出现的次数，再让 s 从 0 扫到 100，把 cnt[s] 个 s 依次输出，就完成了计数排序，时间复杂度只有 O(n + 100)。统计众数时顺序扫描，用 `cnt[s] > best` 判断，就能自然取到并列中的较小分数。","pitfalls":"n 最大 10 万，输出时注意行末不能多空格；众数并列要取较小值（判断写成 `>` 而不是 `>=`）；`cnt` 数组必须初始化为 0。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n#define MAXS 101\n\nint score[MAXN];\nint cnt[MAXS];\n\nint main(void)\n{\n    int n, i, s;\n    int hi = -1, lo = 101, mode = 0, modeCnt = 0, first = 1;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &score[i]);\n        cnt[score[i]]++;\n    }\n\n    for (s = 0; s <= 100; s++) {\n        for (i = 0; i < cnt[s]; i++) {\n            if (!first) {\n                printf(\" \");\n            }\n            printf(\"%d\", s);\n            first = 0;\n        }\n        if (cnt[s] > 0) {\n            if (s > hi) {\n                hi = s;\n            }\n            if (s < lo) {\n                lo = s;\n            }\n            if (cnt[s] > modeCnt) {\n                modeCnt = cnt[s];\n                mode = s;\n            }\n        }\n    }\n    printf(\"\\n\");\n    printf(\"MAX %d\\n\", hi);\n    printf(\"MIN %d\\n\", lo);\n    printf(\"MODE %d\\n\", mode);\n    return 0;\n}\n"},{"id":"R04","cat":"algo","title":"阶乘末尾连续零的个数","difficulty":2,"tags":["数论","公式","long long"],"source":"新编（经典阶乘末尾零问题）","desc":"### 题目描述\n仓库管理员要把 n 件不同的货物排成一列装车，一共有 n! 种排法。他想知道 n! 的十进制表示末尾一共有多少个连续的 0，也就是 n! 能被 10 的多少次幂整除。\n\n### 输入格式\n一行，一个整数 n（1 ≤ n ≤ 10^9）。\n\n### 输出格式\n一行，一个整数，表示 n! 末尾连续零的个数。\n\n### 样例说明\n10! = 3628800，末尾有 2 个 0；25! 中因子 5 的个数是 25/5 + 25/25 = 5 + 1 = 6，因此末尾有 6 个 0。","samples":[{"in":"10\n","out":"2\n"},{"in":"25\n","out":"6\n"},{"in":"1000\n","out":"249\n"}],"hint":"末尾 0 的个数等于 min(n! 中因子 2 的个数, 因子 5 的个数)，而 2 的个数一定不少于 5 的个数，所以只数 5：个数 = n/5 + n/25 + n/125 + …。用 while 循环每次 `n /= 5` 累加即可，复杂度 O(log n)。","pitfalls":"n 最大 10^9，绝对不能真的去算 n!（会溢出）；注意 100 以内的数也可能贡献多个 5（如 25、125），所以要循环除 5 而不是只除一次；计数用 `long long`。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    long long n, cnt = 0;\n\n    scanf(\"%lld\", &n);\n    while (n > 0) {\n        n /= 5;\n        cnt += n;\n    }\n    printf(\"%lld\\n\", cnt);\n    return 0;\n}\n"},{"id":"R05","cat":"algo","title":"档案编号的三类二分检索","difficulty":3,"tags":["二分查找","边界处理","lower_bound"],"source":"新编（实验 7 二分查找的三种变式）","desc":"### 题目描述\n档案馆里的 n 份档案按编号**非递减**顺序排列，编号允许重复。现在有 m 次检索请求，每次给出请求类型 t 和一个编号 x，请用二分查找回答：\n\n- t = 1：编号 x 一共出现了多少次；\n- t = 2：编号大于等于 x 的第一份档案排在**第几份**（从 1 开始计数），若不存在输出 0；\n- t = 3：编号小于等于 x 的最后一份档案排在**第几份**（从 1 开始计数），若不存在输出 0。\n\n### 输入格式\n第一行，两个整数 n 和 m（1 ≤ n ≤ 200000，1 ≤ m ≤ 200000）。\n第二行，n 个用空格分隔的整数（每个编号的绝对值不超过 10^9），按非递减顺序给出。\n接下来 m 行，每行两个整数 t 和 x（t 为 1、2 或 3，x 的绝对值不超过 10^9），表示一次检索请求。\n\n### 输出格式\n共 m 行，每行一个整数，依次为每次请求的答案。\n\n### 样例说明\n档案编号为 1 3 3 3 7 9 时：请求 `2 4` 中第一个不小于 4 的编号是第 5 份（编号 7）；请求 `3 4` 中最后一个不大于 4 的编号是第 4 份（编号 3）；请求 `1 3` 表示编号 3 出现了 3 次。","samples":[{"in":"6 6\n1 3 3 3 7 9\n1 3\n2 4\n3 4\n2 10\n3 0\n1 5\n","out":"3\n5\n4\n0\n0\n0\n"},{"in":"5 3\n-2 -2 0 5 5\n1 -2\n2 7\n3 -2\n","out":"2\n0\n2\n"}],"hint":"三种请求都能归结为两个边界函数：`lower(x)` 返回第一个大于等于 x 的下标（下标从 0 开始，可能等于 n，表示不存在），`upper(x)` 返回第一个大于 x 的下标。于是 t=1 的答案是 `upper - lower`；t=2 的答案是 `lower + 1`，但当 lower 等于 n 时要输出 0；t=3 的答案是 `upper` 本身（它就是“不大于 x 的元素个数”，正好等于最后一份的序号）。","pitfalls":"边界函数用 `while (l < r)` + `mid = l + (r - l) / 2` 最不容易写错；n、m 都可能达到 20 万，逐个顺序扫描会超时，必须二分；所有输出位置都是从 1 开始计数的，别忘记 +1 或换算。","solution":"#include <stdio.h>\n\n#define MAXN 200005\n\nint a[MAXN];\n\n/* 第一个大于等于 x 的下标，范围 0..n */\nint lowerBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] < x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\n/* 第一个大于 x 的下标，范围 0..n */\nint upperBound(int arr[], int n, int x)\n{\n    int l = 0, r = n;\n    while (l < r) {\n        int mid = l + (r - l) / 2;\n        if (arr[mid] <= x) {\n            l = mid + 1;\n        } else {\n            r = mid;\n        }\n    }\n    return l;\n}\n\nint main(void)\n{\n    int n, m, i, t, x;\n\n    scanf(\"%d%d\", &n, &m);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &a[i]);\n    }\n\n    for (i = 0; i < m; i++) {\n        scanf(\"%d%d\", &t, &x);\n        if (t == 1) {\n            int cnt = upperBound(a, n, x) - lowerBound(a, n, x);\n            printf(\"%d\\n\", cnt);\n        } else if (t == 2) {\n            int p = lowerBound(a, n, x);\n            printf(\"%d\\n\", p < n ? p + 1 : 0);\n        } else {\n            int p = upperBound(a, n, x);\n            printf(\"%d\\n\", p);\n        }\n    }\n    return 0;\n}\n"},{"id":"R06","cat":"algo","title":"学科竞赛的多关键字榜单","difficulty":3,"tags":["结构体数组","多关键字排序","qsort"],"source":"新编（实验 7 排序 + 实验 11 结构体综合）","desc":"### 题目描述\n某学科竞赛有 n 名选手，每人有一个不超过 10^6 的正整数编号，以及数学、英语两项成绩（0 到 100 的整数），总分为两项之和。现在要评出前 k 名，排名规则依次是：\n\n1. 总分高的排在前面；\n2. 总分相同时，数学分高的排在前面；\n3. 总分和数学分都相同时，编号小的排在前面。\n\n请按这个规则排好序，输出前 k 名选手。\n\n### 输入格式\n第一行，两个整数 n 和 k（1 ≤ k ≤ n ≤ 100000）。\n接下来 n 行，每行三个整数 id、math、english（1 ≤ id ≤ 10^6，0 ≤ math ≤ 100，0 ≤ english ≤ 100），分别表示选手编号、数学成绩、英语成绩。\n\n### 输出格式\n共 k 行，第 i 行输出排在第 i 名的选手，格式为 `编号 总分`，两项之间用一个空格分隔，行末不能有多余空格。\n\n### 样例说明\n样例中三人的总分分别是 180、175、170，按总分排在前三位；另外两人总分都是 170，数学较高（92）的那位排在数学较低（90）的前面。","samples":[{"in":"4 3\n101 90 80\n102 95 85\n103 92 78\n104 95 80\n","out":"102 180\n104 175\n103 170\n"},{"in":"3 3\n7 100 100\n2 100 100\n5 99 100\n","out":"2 200\n7 200\n5 199\n"}],"hint":"把每位选手的编号、数学、英语和总分放进结构体数组（可以只设 `id`、`math`、`eng`、`total` 这几个成员），再用 `qsort` 和一个比较函数一次排好。比较函数按“总分 → 数学 → 编号”的顺序依次判断，第一个不相等的键决定顺序。","pitfalls":"比较函数必须返回负数、0、正数三种情况，漏掉 `return 0;` 会让 qsort 行为不确定；10 万个结构体约 1.6 MB，务必定义成全局变量，否则可能爆栈；只要输出前 k 名，别把所有人都打印出来。","solution":"#include <stdio.h>\n#include <stdlib.h>\n\n#define MAXN 100005\n\ntypedef struct {\n    int id;\n    int math;\n    int eng;\n    int total;\n} Player;\n\nPlayer stu[MAXN];\n\n/* 总分降序 -> 数学降序 -> 编号升序 */\nint cmp(const void *pa, const void *pb)\n{\n    const Player *a = (const Player *)pa;\n    const Player *b = (const Player *)pb;\n\n    if (a->total != b->total) {\n        return a->total > b->total ? -1 : 1;\n    }\n    if (a->math != b->math) {\n        return a->math > b->math ? -1 : 1;\n    }\n    if (a->id != b->id) {\n        return a->id < b->id ? -1 : 1;\n    }\n    return 0;\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d%d%d\", &stu[i].id, &stu[i].math, &stu[i].eng);\n        stu[i].total = stu[i].math + stu[i].eng;\n    }\n\n    qsort(stu, (size_t)n, sizeof(Player), cmp);\n\n    for (i = 0; i < k; i++) {\n        printf(\"%d %d\\n\", stu[i].id, stu[i].total);\n    }\n    return 0;\n}\n"},{"id":"R07","cat":"algo","title":"连续订单的最高净收益","difficulty":3,"tags":["最大连续子段和","动态规划","long long"],"source":"新编（经典最大子段和，增加区间输出）","desc":"### 题目描述\n校园创业小组记录了连续 n 天的净收益 a[i]（正数表示盈利，负数表示亏损，单位：元）。组长想找出**连续若干天**（至少 1 天）的一段时间，使这段时间的净收益之和最大，并报告这段时间的起止天数。\n\n如果有多个时间段都能取到最大和，请按下面的规则选出唯一的一个：\n\n1. 起始天数更早的那段优先；\n2. 起始天数相同时，天数更少的那段优先。\n\n### 输入格式\n第一行，一个整数 n（1 ≤ n ≤ 100000）。\n第二行，n 个用空格分隔的整数 a[i]（-10^9 ≤ a[i] ≤ 10^9），依次表示第 1 天到第 n 天的净收益。\n\n### 输出格式\n一行，三个整数，相邻两个之间用一个空格分隔，依次为：最大的净收益之和、该时间段的起始天数、结束天数（天数从 1 开始编号）。\n\n### 样例说明\n样例 1 中最大和是 1，第 1 天单独一段取到 1；虽然 1 -1 1 这三天之和也是 1，但它起始天数相同而天数更多，按规则 2 不取。样例 2 中所有数都是负数，最大和是 -1，对应第 4 天一天。","samples":[{"in":"3\n1 -1 1\n","out":"1 1 1\n"},{"in":"5\n-5 -2 -9 -1 -7\n","out":"-1 4 4\n"},{"in":"7\n4 -2 3 -10 5 5 -3\n","out":"10 5 6\n"}],"hint":"用 Kadane 递推：设 cur 为“以第 i 天结尾的最大子段和”，则 cur = max(cur + a[i], a[i])，同时记录 cur 的起点；当 cur + a[i] 与 a[i] 相等时沿用旧起点，才能保证起点更早。然后再和全局最优比较：和更大就换；和相同则起点更早优先；起点也相同则结束天数更小优先。","pitfalls":"全负数时答案是最小的那个负数，不能把初始最大和设成 0；和可能超出 int 范围，必须用 `long long`；cur 的起点别在“相等”时被重置，否则会丢掉“起点更早”的合法答案。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nlong long a[MAXN];\n\nint main(void)\n{\n    int n, i;\n    long long cur, best;\n    int cs, bs, be;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%lld\", &a[i]);\n    }\n\n    best = a[0];\n    bs = 0;\n    be = 0;\n    cur = a[0];\n    cs = 0;\n\n    for (i = 1; i < n; i++) {\n        if (cur + a[i] >= a[i]) { /* 相等时沿用更早的起点 */\n            cur += a[i];\n        } else {\n            cur = a[i];\n            cs = i;\n        }\n        if (cur > best || (cur == best && (cs < bs || (cs == bs && i < be)))) {\n            best = cur;\n            bs = cs;\n            be = i;\n        }\n    }\n\n    printf(\"%lld %d %d\\n\", best, bs + 1, be + 1);\n    return 0;\n}\n"},{"id":"R08","cat":"algo","title":"区间内的素数计数","difficulty":3,"tags":["素数筛","前缀和","预处理"],"source":"新编（实验 7 算法 + 综合应用）","desc":"### 题目描述\n小北在准备一个加密工具，需要统计很多区间里各有多少个素数。既然要查很多次，请先把 1 到 10^6 之间的素数全部筛出来，再用前缀和回答每次询问。\n\n### 输入格式\n第一行，一个整数 q（1 ≤ q ≤ 100000），表示询问次数。\n接下来 q 行，每行两个整数 L 和 R（1 ≤ L ≤ R ≤ 10^6），表示一次询问。\n\n### 输出格式\n共 q 行，每行一个整数，依次表示每个闭区间 [L, R] 内素数的个数。\n\n### 样例说明\n1 到 10 之间有 2、3、5、7 四个素数；11 到 20 之间有 11、13、17、19 四个素数；1 到 10^6 之间共有 78498 个素数。","samples":[{"in":"3\n1 10\n11 20\n1 1000000\n","out":"4\n4\n78498\n"},{"in":"2\n1 1\n999983 1000000\n","out":"0\n1\n"}],"hint":"用埃拉托斯特尼筛法把 1 到 10^6 的素数标记出来：`isPrime[i]` 初值为真，从 2 开始，若 i 是素数就把它的倍数（可以从 i*i 开始）全部标记成合数。筛完再做前缀和 `pre[i] = pre[i - 1] + isPrime[i]`，每次询问用 `pre[R] - pre[L - 1]` 一次算出答案。","pitfalls":"1 不是素数，必须把 `isPrime[1]` 置 0；筛法的内层从 `i * i` 开始，注意 `i * i` 在 int 内不要越界；区间查询要用前缀和，不能每次询问都重新筛一遍（q 最大 10 万）。","solution":"#include <stdio.h>\n\n#define MAXV 1000000\n\nstatic char isPrime[MAXV + 2];\nstatic int pre[MAXV + 2];\n\nint main(void)\n{\n    int q, i, j, l, r;\n\n    for (i = 2; i <= MAXV; i++) {\n        isPrime[i] = 1;\n    }\n    for (i = 2; (long long)i * i <= MAXV; i++) {\n        if (isPrime[i]) {\n            for (j = i * i; j <= MAXV; j += i) {\n                isPrime[j] = 0;\n            }\n        }\n    }\n    pre[0] = 0;\n    for (i = 1; i <= MAXV; i++) {\n        pre[i] = pre[i - 1] + (isPrime[i] ? 1 : 0);\n    }\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        scanf(\"%d%d\", &l, &r);\n        printf(\"%d\\n\", pre[r] - pre[l - 1]);\n    }\n    return 0;\n}\n"},{"id":"R09","cat":"algo","title":"两个纪念日相隔的天数","difficulty":3,"tags":["日期计算","闰年","模拟"],"source":"新编（日期与年历综合）","desc":"### 题目描述\n小北想把两位好友的生日记在同一个倒计时程序里，他需要知道两个公历日期之间相隔多少个整天（同一天为 0）。\n\n### 输入格式\n两行，每行三个整数 year、month、day，分别表示年、月、日，用空格分隔。保证日期合法，年份都在 1900 到 2100 之间。\n\n### 输出格式\n一行，一个整数，表示两个日期相隔的天数（取绝对值）。\n\n### 样例说明\n2024 年是闰年，2 月有 29 天，所以 2024 1 1 到 2024 12 31 相隔 365 天；2000 2 28 到 2000 3 1 相隔 2 天（2000 年也是闰年，中间还隔着 2 月 29 日）。","samples":[{"in":"2024 1 1\n2024 12 31\n","out":"365\n"},{"in":"2000 2 28\n2000 3 1\n","out":"2\n"},{"in":"1900 1 1\n2100 12 31\n","out":"73413\n"}],"hint":"写两个小函数：`isLeap(y)` 判断闰年，`serial(y, m, d)` 把日期换算成“从 1900 年 1 月 1 日起是第几天”——先累加之前整年的天数（每年 365 或 366），再累加之前整月的天数（闰年 2 月加 1 天），最后加上 `d - 1`。两个 serial 相减再取绝对值就是答案。","pitfalls":"闰年规则是“能被 4 整除且不能被 100 整除，或能被 400 整除”，只写 `y % 4 == 0` 会在 2100 年算错；闰年 2 月要在月份天数表的基础上额外加 1；相隔天数可能达到 7 万多天，用 `long long` 统计，并且别忘记取绝对值。","solution":"#include <stdio.h>\n\nstatic const int mdays[13] = {0, 31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n\nstatic int isLeap(int y)\n{\n    return (y % 4 == 0 && y % 100 != 0) || (y % 400 == 0);\n}\n\n/* 从 1900-01-01 起算，返回该日期是第几天（0 开始） */\nstatic long long serial(int y, int m, int d)\n{\n    long long s = 0;\n    int i;\n\n    for (i = 1900; i < y; i++) {\n        s += isLeap(i) ? 366 : 365;\n    }\n    for (i = 1; i < m; i++) {\n        s += mdays[i];\n        if (i == 2 && isLeap(y)) {\n            s += 1;\n        }\n    }\n    s += d - 1;\n    return s;\n}\n\nint main(void)\n{\n    int y1, m1, d1, y2, m2, d2;\n    long long diff;\n\n    scanf(\"%d%d%d\", &y1, &m1, &d1);\n    scanf(\"%d%d%d\", &y2, &m2, &d2);\n\n    diff = serial(y1, m1, d1) - serial(y2, m2, d2);\n    if (diff < 0) {\n        diff = -diff;\n    }\n    printf(\"%lld\\n\", diff);\n    return 0;\n}\n"},{"id":"R10","cat":"algo","title":"千位大整数的加法","difficulty":3,"tags":["高精度","字符数组","进位"],"source":"新编（高精度加法入门）","desc":"### 题目描述\n账本上有两个非常长的非负整数，位数最多 1000 位，`long long` 装不下。请用字符数组模拟竖式加法，算出它们的和。输入里的数字可能带前导零，输出必须是最简形式：不带多余的前导零，结果为 0 时只输出一个 0。\n\n### 输入格式\n两行，每行一个由数字 0 到 9 组成的字符串，长度在 1 到 1000 之间（允许以 0 开头）。\n\n### 输出格式\n一行，一个整数，表示这两个数的和。\n\n### 样例说明\n`000123` 与 `0777` 相加等于 900，去掉前导零后输出 `900`；`999` 与 `1` 相加产生进位，结果是四位的 `1000`；`0` 与 `0` 相加输出 `0`。","samples":[{"in":"000123\n0777\n","out":"900\n"},{"in":"999\n1\n","out":"1000\n"},{"in":"0\n0\n","out":"0\n"}],"hint":"用两个字符数组读入，从两个串的末尾开始逐位相加并处理进位，结果存到 int 数组里（多留一位存最高位的进位），最后从高位找第一个非零位开始输出。","pitfalls":"结果可能比输入多一位（如 999 + 1 = 1000），结果数组要开到 1002；去掉前导零时不要把有效位全删光，结果为 0 时必须输出 `0`；字符转数字要减 `'0'`。","solution":"#include <stdio.h>\n#include <string.h>\n\n#define MAXL 1005\n\nint main(void)\n{\n    char s1[MAXL], s2[MAXL];\n    int res[MAXL + 2];\n    int n1, n2, len, i, carry, top;\n\n    scanf(\"%s\", s1);\n    scanf(\"%s\", s2);\n    n1 = (int)strlen(s1);\n    n2 = (int)strlen(s2);\n    len = (n1 > n2) ? n1 : n2;\n\n    for (i = 0; i <= len + 1; i++) {\n        res[i] = 0;\n    }\n\n    carry = 0;\n    for (i = 0; i < len; i++) {\n        int d1 = (i < n1) ? s1[n1 - 1 - i] - '0' : 0;\n        int d2 = (i < n2) ? s2[n2 - 1 - i] - '0' : 0;\n        int sum = d1 + d2 + carry;\n        res[i] = sum % 10;\n        carry = sum / 10;\n    }\n    if (carry > 0) {\n        res[len] = carry;\n    }\n\n    top = len;\n    while (top > 0 && res[top] == 0) {\n        top--;\n    }\n    for (i = top; i >= 0; i--) {\n        printf(\"%d\", res[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"R11","cat":"algo","title":"手写快速排序与第 k 矮","difficulty":4,"tags":["快速排序","分区","递归"],"source":"新编（实验 7 手写快速排序）","desc":"### 题目描述\n体测结束后，体育老师要把 n 个身高值（整数，单位毫米，允许相同）从小到大排好，并且想知道其中最矮的第 k 个身高是多少。\n\n排序部分要求**自己手写快速排序**：写一个分区函数，以某个元素为基准把不大于基准的放到左边、大于基准的放到右边，再递归处理左右两部分；不允许调用 `qsort` 或其他库排序函数。为了避免在近乎有序的数据上退化，建议用“三数取中”选择基准。\n\n### 输入格式\n第一行，两个整数 n 和 k（1 ≤ n ≤ 100000，1 ≤ k ≤ n）。\n第二行，n 个用空格分隔的整数 h[i]（0 ≤ h[i] ≤ 3000），表示每个同学的身高。\n\n### 输出格式\n共两行：\n- 第一行，n 个整数，为按非递减顺序排好的身高，相邻两个之间用一个空格分隔，行末不能有多余空格。\n- 第二行，格式为 `KTH 身高`，其中“身高”就是第 k 矮的那个值。\n\n### 样例说明\n身高依次为 5 3 9 3 1 8 3 7 时，排好序是 1 3 3 3 5 7 8 9，其中第 4 矮的是 3，所以第二行输出 `KTH 3`。","samples":[{"in":"8 4\n5 3 9 3 1 8 3 7\n","out":"1 3 3 3 5 7 8 9\nKTH 3\n"},{"in":"5 1\n2 2 2 2 2\n","out":"2 2 2 2 2\nKTH 2\n"}],"hint":"分区可以用“挖坑法”：先三数取中选基准（把 l、mid、r 中大小居中的那个换到 h[l]），取出 pivot 后 l 位置就成了一个“坑”；右指针 j 从右往左找不大于 pivot 的元素，把它填进左边的坑，再让左指针 i 从左往右找不小于 pivot 的元素，把它填进右边的坑；i、j 相遇时把 pivot 放进最后的坑，返回这个位置。再递归 `[l, cut-1]` 和 `[cut+1, r]`。排好序后输出 `h[k-1]`。","pitfalls":"递归出口必须写 `if (l >= r) return;`；注意每次分区后基准已经落到最终位置，递归时要把它排除在外（写成 `[l, cut-1]` 和 `[cut+1, r]`），否则会死递归；基准若固定取第一个元素，在已排序的 10 万数据上会退化到 O(n^2) 而超时；内层扫描一律加 `i < j` 保护，防止越界。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\n\nstatic void swapElem(int *x, int *y)\n{\n    int t = *x;\n    *x = *y;\n    *y = t;\n}\n\n/* 三数取中：调整后 h[l] <= h[mid] <= h[r]，再把中位数换到 h[l] 作基准 */\nstatic void medianToLeft(int l, int r)\n{\n    int mid = l + (r - l) / 2;\n\n    if (h[mid] < h[l]) {\n        swapElem(&h[mid], &h[l]);\n    }\n    if (h[r] < h[l]) {\n        swapElem(&h[r], &h[l]);\n    }\n    if (h[r] < h[mid]) {\n        swapElem(&h[r], &h[mid]);\n    }\n    swapElem(&h[l], &h[mid]);\n}\n\n/* 挖坑法分区：返回基准的最终下标，左侧元素都不大于基准，右侧都不小于基准 */\nstatic int partition(int l, int r)\n{\n    int pivot, i, j;\n\n    medianToLeft(l, r);\n    pivot = h[l];\n    i = l;\n    j = r;\n    while (i < j) {\n        while (i < j && h[j] > pivot) {\n            j--;\n        }\n        if (i < j) {\n            h[i] = h[j];\n            i++;\n        }\n        while (i < j && h[i] < pivot) {\n            i++;\n        }\n        if (i < j) {\n            h[j] = h[i];\n            j--;\n        }\n    }\n    h[i] = pivot;\n    return i;\n}\n\nstatic void quickSort(int l, int r)\n{\n    int cut;\n\n    if (l >= r) {\n        return;\n    }\n    cut = partition(l, r);\n    quickSort(l, cut - 1);\n    quickSort(cut + 1, r);\n}\n\nint main(void)\n{\n    int n, k, i;\n\n    scanf(\"%d%d\", &n, &k);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    quickSort(0, n - 1);\n\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    printf(\"KTH %d\\n\", h[k - 1]);\n    return 0;\n}\n"},{"id":"R12","cat":"algo","title":"身高队列的相邻交换次数","difficulty":4,"tags":["归并排序","逆序对","分治"],"source":"新编（归并排序 + 逆序对统计）","desc":"### 题目描述\n操场上 n 名同学按身高排成一队，老师每次只能让**相邻**的两名同学交换位置。老师想让队伍按身高非递减排列，问最少需要交换多少次？并输出排好队后的身高序列。\n\n### 输入格式\n第一行，一个整数 n（1 ≤ n ≤ 100000）。\n第二行，n 个用空格分隔的整数 h[i]（0 ≤ h[i] ≤ 10^9），表示从队首到队尾的身高。身高允许相同。\n\n### 输出格式\n共两行：\n- 第一行，格式为 `SWAPS 最少交换次数`。\n- 第二行，n 个整数，为排好队后的身高，相邻两个之间用一个空格分隔，行末不能有多余空格。\n\n### 样例说明\n身高 3 1 2 中，前面的 3 比后面两个同学都高，需要交换 2 次；身高 2 2 1 中，两个 2 都要越过 1，同样需要 2 次。","samples":[{"in":"3\n3 1 2\n","out":"SWAPS 2\n1 2 3\n"},{"in":"3\n2 2 1\n","out":"SWAPS 2\n1 2 2\n"},{"in":"5\n5 4 3 2 1\n","out":"SWAPS 10\n1 2 3 4 5\n"}],"hint":"相邻交换的最少次数等于序列的**逆序对**个数，即满足 i < j 且 h[i] > h[j] 的配对个数。用归并排序在合并时顺带统计：合并左右两段时，若取的是右段的元素，说明它比左段剩下的所有元素都小，可以一次性把“左段剩余元素个数”累加进答案。","pitfalls":"逆序对最多约 5×10^9，必须用 `long long` 统计；身高相等不算逆序对（比较用 `>`，合并时左段优先取等值元素）；合并前记得保存两段元素或用临时数组，且注意临时数组下标不要越界。","solution":"#include <stdio.h>\n\n#define MAXN 100005\n\nint h[MAXN];\nint tmp[MAXN];\nlong long swaps = 0;\n\nstatic void mergeSort(int l, int r)\n{\n    int mid, i, j, k;\n\n    if (l >= r) {\n        return;\n    }\n    mid = l + (r - l) / 2;\n    mergeSort(l, mid);\n    mergeSort(mid + 1, r);\n\n    i = l;\n    j = mid + 1;\n    k = l;\n    while (i <= mid && j <= r) {\n        if (h[i] <= h[j]) {\n            tmp[k++] = h[i++];\n        } else {\n            tmp[k++] = h[j++];\n            swaps += (long long)(mid - i + 1);\n        }\n    }\n    while (i <= mid) {\n        tmp[k++] = h[i++];\n    }\n    while (j <= r) {\n        tmp[k++] = h[j++];\n    }\n    for (k = l; k <= r; k++) {\n        h[k] = tmp[k];\n    }\n}\n\nint main(void)\n{\n    int n, i;\n\n    scanf(\"%d\", &n);\n    for (i = 0; i < n; i++) {\n        scanf(\"%d\", &h[i]);\n    }\n\n    mergeSort(0, n - 1);\n\n    printf(\"SWAPS %lld\\n\", swaps);\n    for (i = 0; i < n; i++) {\n        if (i > 0) {\n            printf(\" \");\n        }\n        printf(\"%d\", h[i]);\n    }\n    printf(\"\\n\");\n    return 0;\n}\n"},{"id":"R13","cat":"algo","title":"带路障棋盘的通行方案数","difficulty":4,"tags":["递推","动态规划","取模"],"source":"新编（走格子路径数 + 障碍）","desc":"### 题目描述\n探险家要从棋盘的左上角 (1,1) 走到右下角 (m,n)，每一步只能向右或向下走一格。棋盘上有一些格子塌陷了（路障），不能踩上去；保证 (1,1) 和 (m,n) 都不是路障。请计算不同的走法总数。方案可能非常多，请把结果对 1000000007 取模后输出。\n\n### 输入格式\n第一行，三个整数 m、n、k（1 ≤ m, n ≤ 1000，0 ≤ k ≤ 1000），分别表示行数、列数和路障个数。\n接下来 k 行，每行两个整数 r、c（1 ≤ r ≤ m，1 ≤ c ≤ n），表示第 r 行第 c 列的格子是路障。保证给出的路障不重复。\n\n### 输出格式\n一行，一个整数，表示从 (1,1) 到 (m,n) 的走法数对 1000000007 取模的结果。\n\n### 样例说明\n3×3 的棋盘一共有 6 条路线；若 (2,2) 塌陷，经过它的 4 条路线都不能走，只剩下 2 条（先一直向右再向下，或先一直向下再向右）。","samples":[{"in":"3 3 1\n2 2\n","out":"2\n"},{"in":"2 3 0\n","out":"3\n"},{"in":"3 3 0\n","out":"6\n"}],"hint":"设 dp[i][j] 为走到 (i,j) 的走法数，则 dp[i][j] = (dp[i-1][j] + dp[i][j-1]) % 1000000007；路障格子的 dp 直接置 0；dp[1][1] 的初值为 1。按行列顺序递推，最后输出 dp[m][n]。","pitfalls":"每做一次加法就要取模，否则路径数会远远超出 `long long` 的范围；dp 数组要开到 1001×1001（约 4 MB），必须定义为全局变量，放到 main 里会爆栈；边界要判断：第一行只能从左边转移、第一列只能从上边转移，用 `i > 1`、`j > 1` 防止越界，起点 (1,1) 的初值只能是 1。","solution":"#include <stdio.h>\n\n#define MAXN 1005\n#define MOD 1000000007\n\nstatic int dp[MAXN][MAXN];\nstatic char blocked[MAXN][MAXN];\n\nint main(void)\n{\n    int m, n, k, i, j, r, c;\n\n    scanf(\"%d%d%d\", &m, &n, &k);\n    for (i = 0; i < k; i++) {\n        scanf(\"%d%d\", &r, &c);\n        blocked[r][c] = 1;\n    }\n\n    if (blocked[1][1]) {\n        printf(\"0\\n\");\n        return 0;\n    }\n    dp[1][1] = 1;\n    for (i = 1; i <= m; i++) {\n        for (j = 1; j <= n; j++) {\n            if (i == 1 && j == 1) {\n                continue;\n            }\n            if (blocked[i][j]) {\n                dp[i][j] = 0;\n                continue;\n            }\n            {\n                long long s = 0;\n                if (i > 1) {\n                    s += dp[i - 1][j];\n                }\n                if (j > 1) {\n                    s += dp[i][j - 1];\n                }\n                dp[i][j] = (int)(s % MOD);\n            }\n        }\n    }\n\n    printf(\"%d\\n\", dp[m][n]);\n    return 0;\n}\n"},{"id":"R14","cat":"algo","title":"超大下标兔子数列取模","difficulty":4,"tags":["矩阵快速幂","递推","取模"],"source":"新编（斐波那契取模 + 矩阵快速幂入门）","desc":"### 题目描述\n兔子养殖场的兔子对数满足：第 1 个月 1 对，第 2 个月 1 对，从第 3 个月起每个月的对数等于前两个月之和。现在问题来了，月份编号 n 非常大（最大 10^18），逐项递推肯定会超时；而且我们只关心第 n 个月的对数对 M 取模的结果。\n\n请用**矩阵快速幂**解决：把递推关系写成矩阵乘法，再用二进制快速幂求出矩阵的 n-1 次方，从而在 O(log n) 的时间里得到答案。\n\n### 输入格式\n第一行，一个整数 q（1 ≤ q ≤ 100），表示询问次数。\n接下来 q 行，每行两个整数 n 和 M（1 ≤ n ≤ 10^18，2 ≤ M ≤ 10^9+7），表示询问第 n 个月的对数对 M 取模。\n\n### 输出格式\n共 q 行，每行一个整数，依次为每个询问的答案。\n\n### 样例说明\n第 10 个月有 55 对，55 mod 1000 = 55；n = 1 和 n = 2 时答案都是 1 mod M。由于 n 可以达到 10^18，即使写成 O(n) 的循环也会超时，必须用每次把指数减半的快速幂。","samples":[{"in":"3\n10 1000\n90 1000000007\n1 2\n","out":"55\n210345902\n1\n"},{"in":"2\n1000000000000000000 1000000007\n5 100\n","out":"209783453\n5\n"}],"hint":"记向量 V(k) = (f(k+1), f(k))，则 V(k) = A · V(k-1)，其中 A = [[1,1],[1,0]]，且 V(1) = (1,1)。所以 f(n) 就等于 A^(n-1) 的左上角元素。矩阵快速幂：结果矩阵初始化为单位阵，指数 e = n-1 不断右移，遇到二进制位为 1 就把结果乘上当前底数，底数每轮自乘一次，所有乘法都取模。","pitfalls":"M 最大约 10^9，两个小于 M 的数相乘接近 10^18，用 `int` 会溢出成负数，必须用 `long long` 存中间结果再取模；n = 1 时指数是 0，要保证返回 1；指数是 `long long`，循环条件写成 `while (e > 0)` 并每次 `e >>= 1`。","solution":"#include <stdio.h>\n\ntypedef struct {\n    long long m[2][2];\n} Mat;\n\nstatic long long MODV;\n\nstatic Mat multiply(Mat a, Mat b)\n{\n    Mat c;\n    int i, j, k;\n\n    for (i = 0; i < 2; i++) {\n        for (j = 0; j < 2; j++) {\n            long long s = 0;\n            for (k = 0; k < 2; k++) {\n                s = (s + a.m[i][k] * b.m[k][j]) % MODV;\n            }\n            c.m[i][j] = s;\n        }\n    }\n    return c;\n}\n\nint main(void)\n{\n    int q, i;\n    long long n, e;\n\n    scanf(\"%d\", &q);\n    for (i = 0; i < q; i++) {\n        Mat base, res;\n\n        scanf(\"%lld%lld\", &n, &MODV);\n\n        base.m[0][0] = 1; base.m[0][1] = 1;\n        base.m[1][0] = 1; base.m[1][1] = 0;\n        res.m[0][0] = 1;  res.m[0][1] = 0;\n        res.m[1][0] = 0;  res.m[1][1] = 1;\n\n        e = n - 1;\n        while (e > 0) {\n            if (e & 1) {\n                res = multiply(res, base);\n            }\n            base = multiply(base, base);\n            e >>= 1;\n        }\n        printf(\"%lld\\n\", res.m[0][0] % MODV);\n    }\n    return 0;\n}\n"},{"id":"X001","cat":"pointer","title":"二级指针选择目标","difficulty":2,"tags":["二级指针：改变指向与动态分配","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 a、b、k（a,b 在 -100 至 100，k 为0或1）。实现 choose(int **p,int *a,int *b,int k)，令调用者指针指向 a 或 b，再将目标加10，输出 a b。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3 5 1\n","out":"3 15\n"},{"in":"0 -1 0\n","out":"10 -1\n"}],"hint":"传入指针变量自身的地址，用 *p 修改它。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nvoid choose(int **p,int *a,int *b,int k){*p=k?b:a;}\nint main(void){int a,b,k,*p;scanf(\"%d%d%d\",&a,&b,&k);choose(&p,&a,&b,k);*p+=10;printf(\"%d %d\\n\",a,b);return 0;}\n"},{"id":"X002","cat":"pointer","title":"二级指针创建平方表","difficulty":2,"tags":["二级指针：改变指向与动态分配","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至100）。实现 create(int **p,int n)，分配数组并写入1至n的平方；主函数输出数组后释放。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n","out":"1 4 9\n"},{"in":"1\n","out":"1\n"}],"hint":"区分 *p 指针与 (*p)[i] 元素。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint create(int **p,int n){*p=malloc((size_t)n*sizeof **p);if(!*p)return 0;for(int i=0;i<n;i++)(*p)[i]=(i+1)*(i+1);return 1;}\nint main(void){int n,*p=NULL;scanf(\"%d\",&n);if(!create(&p,n))return 1;for(int i=0;i<n;i++)printf(\"%s%d\",i?\" \":\"\",p[i]);puts(\"\");free(p);return 0;}\n"},{"id":"X003","cat":"pointer","title":"数组指针求列和","difficulty":2,"tags":["数组指针与二维参数","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至20），再输入 n 行3列的整数（绝对值≤100）。用 int (*p)[3] 遍历，输出3个列和。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2\n1 2 3\n4 5 6\n","out":"5 7 9\n"},{"in":"1\n-1 0 1\n","out":"-1 0 1\n"}],"hint":"数组指针每次移动跨过整行，不能把 int ** 当作连续二维数组。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,a[20][3],s[3]={0};scanf(\"%d\",&n);int (*p)[3]=a;for(int i=0;i<n;i++)for(int j=0;j<3;j++){scanf(\"%d\",&p[i][j]);s[j]+=p[i][j];}printf(\"%d %d %d\\n\",s[0],s[1],s[2]);return 0;}\n"},{"id":"X004","cat":"pointer","title":"二维参数求行极差","difficulty":2,"tags":["数组指针与二维参数","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至20）和 n 行3列整数（绝对值≤100）。实现 void ranges(const int a[][3],int n)，逐行输出最大值减最小值。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2\n1 5 2\n4 4 4\n","out":"4\n0\n"},{"in":"1\n-3 0 4\n","out":"7\n"}],"hint":"二维数组形参必须保留第二维大小。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nvoid ranges(const int a[][3],int n){for(int i=0;i<n;i++){int lo=a[i][0],hi=lo;for(int j=1;j<3;j++){if(a[i][j]<lo)lo=a[i][j];if(a[i][j]>hi)hi=a[i][j];}printf(\"%d\\n\",hi-lo);}}\nint main(void){int n,a[20][3];scanf(\"%d\",&n);for(int i=0;i<n;i++)for(int j=0;j<3;j++)scanf(\"%d\",&a[i][j]);ranges(a,n);return 0;}\n"},{"id":"X005","cat":"pointer","title":"安全扩容后追加","difficulty":2,"tags":["动态扩容与所有权","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n,m（各1至30），再输入 n+m 个整数（绝对值≤100）。先只分配n项，读入前n项，再用 realloc 扩容，读入余项，输出总和。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2 2\n1 2 3 4\n","out":"10\n"},{"in":"1 1\n-2 2\n","out":"0\n"}],"hint":"realloc 失败时原指针仍有效，先用临时指针接收。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n,m;scanf(\"%d%d\",&n,&m);int *p=malloc((size_t)n*sizeof *p);if(!p)return 1;for(int i=0;i<n;i++)scanf(\"%d\",p+i);int *t=realloc(p,(size_t)(n+m)*sizeof *p);if(!t){free(p);return 1;}p=t;for(int i=n;i<n+m;i++)scanf(\"%d\",p+i);int s=0;for(int i=0;i<n+m;i++)s+=p[i];printf(\"%d\\n\",s);free(p);return 0;}\n"},{"id":"X006","cat":"pointer","title":"动态数组独立副本","difficulty":2,"tags":["动态扩容与所有权","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至30）和n个整数（绝对值≤100）。用 malloc 建立独立副本，将原数组首项加1，输出原数组首项与副本首项。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2\n3 5\n","out":"4 3\n"},{"in":"1\n-1\n","out":"0 -1\n"}],"hint":"指针赋值仅复制地址；独立副本需要另分配内存并复制元素。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int n;scanf(\"%d\",&n);int *a=malloc((size_t)n*sizeof *a),*b=malloc((size_t)n*sizeof *b);if(!a||!b){free(a);free(b);return 1;}for(int i=0;i<n;i++)scanf(\"%d\",a+i);memcpy(b,a,(size_t)n*sizeof *a);a[0]++;printf(\"%d %d\\n\",a[0],b[0]);free(a);free(b);return 0;}\n"},{"id":"X007","cat":"pointer","title":"回调变换求和","difficulty":2,"tags":["函数指针与回调","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n,k（1≤n≤30，k为0或1）和n个整数（绝对值≤100）。以函数指针调用变换：k=0取绝对值，k=1取平方，输出变换值之和。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3 0\n-2 0 3\n","out":"5\n"},{"in":"2 1\n-2 3\n","out":"13\n"}],"hint":"函数指针的返回值及参数类型必须相符。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint ab(int x){return x<0?-x:x;}int sq(int x){return x*x;}\nint main(void){int n,k,x,s=0;scanf(\"%d%d\",&n,&k);int (*f)(int)=k?sq:ab;for(int i=0;i<n;i++){scanf(\"%d\",&x);s+=f(x);}printf(\"%d\\n\",s);return 0;}\n"},{"id":"X008","cat":"pointer","title":"回调筛选计数","difficulty":2,"tags":["函数指针与回调","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n,k（1≤n≤30，k为0或1）和n个整数（绝对值≤100）。k=0统计正数，k=1统计偶数，必须通过谓词函数指针完成。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3 0\n-1 0 2\n","out":"1\n"},{"in":"3 1\n-2 0 3\n","out":"2\n"}],"hint":"0是偶数，但不是正数。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint pos(int x){return x>0;}int even(int x){return x%2==0;}\nint main(void){int n,k,x,c=0;scanf(\"%d%d\",&n,&k);int (*test)(int)=k?even:pos;for(int i=0;i<n;i++){scanf(\"%d\",&x);c+=test(x);}printf(\"%d\\n\",c);return 0;}\n"},{"id":"X009","cat":"func","title":"静态累计器","difficulty":2,"tags":["作用域与静态局部变量","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至20），实现 int tick(void)，内含初值0的静态局部变量，每次调用先加2再返回。连续调用n次，逐个输出返回值。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n","out":"2 4 6\n"},{"in":"1\n","out":"2\n"}],"hint":"静态局部变量只初始化一次；依次调用，避免在同一表达式中依赖求值顺序。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint tick(void){static int x=0;return x+=2;}int main(void){int n;scanf(\"%d\",&n);for(int i=0;i<n;i++)printf(\"%s%d\",i?\" \":\"\",tick());puts(\"\");return 0;}\n"},{"id":"X010","cat":"func","title":"同名变量遮蔽","difficulty":2,"tags":["作用域与静态局部变量","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 x（-100至100）。主函数保存 x；调用 f(x)，f在内层块定义同名局部变量 y=3并输出y，块外输出形参y+1；最后主函数输出原始x。每个数单独一行。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"8\n","out":"3\n9\n8\n"},{"in":"0\n","out":"3\n1\n0\n"}],"hint":"块内同名声明遮蔽外层名字；值传递不会修改主函数变量。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nvoid f(int y){{int y=3;printf(\"%d\\n\",y);}printf(\"%d\\n\",y+1);}int main(void){int x;scanf(\"%d\",&x);f(x);printf(\"%d\\n\",x);return 0;}\n"},{"id":"X011","cat":"func","title":"递归数组最大值","difficulty":2,"tags":["递归数组处理","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至50）和n个绝对值≤100的整数。用递归函数求最大值，禁止使用全局变量。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n-3 -1 -2\n","out":"-1\n"},{"in":"1\n4\n","out":"4\n"}],"hint":"递归出口是长度1，负数数组不能用0初始化最大值。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint mx(const int *a,int n){if(n==1)return a[0];int t=mx(a,n-1);return t>a[n-1]?t:a[n-1];}int main(void){int n,a[50];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);printf(\"%d\\n\",mx(a,n));return 0;}\n"},{"id":"X012","cat":"func","title":"递归统计负数","difficulty":2,"tags":["递归数组处理","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 n（1至50）和n个绝对值≤100的整数，用递归函数返回负数个数。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"4\n-2 0 -1 3\n","out":"2\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"先处理n=0的出口，再读取a[n-1]。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint count(const int *a,int n){return n==0?0:count(a,n-1)+(a[n-1]<0);}int main(void){int n,a[50];scanf(\"%d\",&n);for(int i=0;i<n;i++)scanf(\"%d\",a+i);printf(\"%d\\n\",count(a,n));return 0;}\n"},{"id":"X013","cat":"struct","title":"带类型标记的联合体","difficulty":2,"tags":["联合体与枚举类型（拓展）","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入 t,v（t为0或1，v为-100至100）。结构体含枚举类型标记和 union {int i;double d;}。t=0存整数v，输出v；t=1存v/2.0，输出一位小数。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"0 3\n","out":"3\n"},{"in":"1 3\n","out":"1.5\n"}],"hint":"联合体成员共享存储，按标记读取最后写入的成员。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nenum Kind{INTEGER,REAL};struct Value{enum Kind tag;union{int i;double d;}u;};int main(void){int t,v;scanf(\"%d%d\",&t,&v);struct Value x;x.tag=t?REAL:INTEGER;if(x.tag==INTEGER){x.u.i=v;printf(\"%d\\n\",x.u.i);}else{x.u.d=v/2.0;printf(\"%.1f\\n\",x.u.d);}return 0;}\n"},{"id":"X014","cat":"struct","title":"枚举状态转换","difficulty":2,"tags":["联合体与枚举类型（拓展）","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n枚举状态0空闲、1工作、2完成。输入初始状态s与操作字符c（S开始、F完成）。仅0遇S转1，1遇F转2，其余不变。输出最终状态数值。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"0 S\n","out":"1\n"},{"in":"2 S\n","out":"2\n"}],"hint":"转换需要同时检查原状态和操作。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nenum State{IDLE,WORK,DONE};int main(void){int s;char c;scanf(\"%d %c\",&s,&c);enum State x=(enum State)s;if(x==IDLE&&c=='S')x=WORK;else if(x==WORK&&c=='F')x=DONE;printf(\"%d\\n\",(int)x);return 0;}\n"},{"id":"X015","cat":"basic","title":"带括号的函数式宏","difficulty":2,"tags":["宏与条件编译","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入整数x（-100至100），用宏 SQUARE(x) 计算 (x+1) 的平方并输出。宏的参数及整个表达式都必须加括号。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2\n","out":"9\n"},{"in":"-1\n","out":"0\n"}],"hint":"不要把有自增等副作用的表达式作为会重复展开的宏参数。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#define SQUARE(x) ((x)*(x))\nint main(void){int x;scanf(\"%d\",&x);printf(\"%d\\n\",SQUARE(x+1));return 0;}\n"},{"id":"X016","cat":"basic","title":"条件编译选择系数","difficulty":2,"tags":["宏与条件编译","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n源文件定义 MODE 为1。输入x（-100至100）；使用 #if MODE == 1 选择输出2*x，否则输出3*x。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n","out":"6\n"},{"in":"0\n","out":"0\n"}],"hint":"预处理在编译前决定保留哪段代码。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\n#define MODE 1\nint main(void){int x;scanf(\"%d\",&x);\n#if MODE == 1\n printf(\"%d\\n\",2*x);\n#else\n printf(\"%d\\n\",3*x);\n#endif\nreturn 0;}\n"},{"id":"X017","cat":"basic","title":"整除与浮点除法对比","difficulty":2,"tags":["整型提升与表达式转换","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入a,b（0至100，b非0），先输出a/b的整数商，再输出(double)a/b，保留两位小数。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"5 2\n","out":"2 2.50\n"},{"in":"0 3\n","out":"0 0.00\n"}],"hint":"转换必须发生在除法前，事后转换不能恢复截掉的小数。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a,b;scanf(\"%d%d\",&a,&b);printf(\"%d %.2f\\n\",a/b,(double)a/b);return 0;}\n"},{"id":"X018","cat":"basic","title":"扩大类型后做乘法","difficulty":2,"tags":["整型提升与表达式转换","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入a,b（0至1000000000），输出精确整数乘积，必须在乘法之前转换到long long。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"1000000000 1000000000\n","out":"1000000000000000000\n"},{"in":"0 9\n","out":"0\n"}],"hint":"只把乘积存入long long不足以避免int乘法溢出。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){int a,b;scanf(\"%d%d\",&a,&b);long long v=(long long)a*b;printf(\"%lld\\n\",v);return 0;}\n"},{"id":"X019","cat":"algo","title":"权限位修改","difficulty":2,"tags":["位掩码集合操作","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入无符号整数x（0至255）、位号k（0至7）和v（0或1）。将第k位设为v，输出新值。最低位编号0。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3 1 0\n","out":"1\n"},{"in":"0 7 1\n","out":"128\n"}],"hint":"清零使用与按位取反的掩码，避免使用逻辑非。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){unsigned x,k,v;scanf(\"%u%u%u\",&x,&k,&v);x=v?(x|(1u<<k)):(x&~(1u<<k));printf(\"%u\\n\",x);return 0;}\n"},{"id":"X020","cat":"algo","title":"权限集合交并差","difficulty":2,"tags":["位掩码集合操作","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入a,b（0至255），分别输出交集a&b、并集a|b及差集a&~b的十进制值。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"5 3\n","out":"1 7 4\n"},{"in":"0 255\n","out":"0 255 0\n"}],"hint":"位运算每一位独立；&&、||不表示集合交并。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){unsigned a,b;scanf(\"%u%u\",&a,&b);printf(\"%u %u %u\\n\",a&b,a|b,a&~b);return 0;}\n"},{"id":"X021","cat":"string","title":"有限长度复制","difficulty":2,"tags":["字符串终止符与缓冲区容量","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入不含空白的字符串s（长度1至30）和k（0至30）。用容量31的目标数组复制前min(k,长度)个字符并显式补终止符，输出复制结果，k=0输出空行。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"abc 2\n","out":"ab\n"},{"in":"a 0\n","out":"\n"}],"hint":"字符内容长度不包括终止符，分配容量需多1。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char s[31],t[31];int k;scanf(\"%30s%d\",s,&k);int n=(int)strlen(s);if(k>n)k=n;memcpy(t,s,(size_t)k);t[k]=0;puts(t);return 0;}\n"},{"id":"X022","cat":"string","title":"有限容量字符串拼接","difficulty":2,"tags":["字符串终止符与缓冲区容量","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入两个非空无空白字符串（各≤30字符），目标容量固定为11。先放第一个串的前10个字符，再追加第二串直至总长10。输出结果。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"abc def\n","out":"abcdef\n"},{"in":"abcdefghij xyz\n","out":"abcdefghij\n"}],"hint":"最后一个位置必须留给终止符。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nint main(void){char a[31],b[31],t[11];scanf(\"%30s%30s\",a,b);int n=0;for(int i=0;a[i]&&n<10;i++)t[n++]=a[i];for(int i=0;b[i]&&n<10;i++)t[n++]=b[i];t[n]=0;puts(t);return 0;}\n"},{"id":"X023","cat":"struct","title":"结构体值复制","difficulty":2,"tags":["结构体复制与指针成员","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入x,y（-100至100），结构体Point包含两个int。复制a到b，再将a.x加1；输出b.x、b.y和a.x。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"2 3\n","out":"2 3 3\n"},{"in":"0 -1\n","out":"0 -1 1\n"}],"hint":"普通标量成员被独立复制。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\ntypedef struct{int x,y;}Point;int main(void){Point a,b;scanf(\"%d%d\",&a.x,&a.y);b=a;a.x++;printf(\"%d %d %d\\n\",b.x,b.y,a.x);return 0;}\n"},{"id":"X024","cat":"struct","title":"结构体浅拷贝的共享对象","difficulty":2,"tags":["结构体复制与指针成员","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入整数x（-100至100）。Box含int *p，让a.p指向x，结构体赋值b=a，再通过b.p加2。输出*a.p与*b.p。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n","out":"5 5\n"},{"in":"-2\n","out":"0 0\n"}],"hint":"结构体赋值复制地址，不复制指针所指对象。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\ntypedef struct{int *p;}Box;int main(void){int x;scanf(\"%d\",&x);Box a={&x},b=a;*b.p+=2;printf(\"%d %d\\n\",*a.p,*b.p);return 0;}\n"},{"id":"X025","cat":"pointer","title":"链表头插逆序","difficulty":2,"tags":["单链表（拓展）","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入n（1至30）及n个绝对值≤100的整数。动态分配单链表节点逐个头插，输出链表值后释放全部节点。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3\n1 2 3\n","out":"3 2 1\n"},{"in":"1\n0\n","out":"0\n"}],"hint":"释放前保存next。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstruct N{int v;struct N *next;};int main(void){int n,x;scanf(\"%d\",&n);struct N *h=NULL;for(int i=0;i<n;i++){scanf(\"%d\",&x);struct N *p=malloc(sizeof *p);if(!p){while(h){p=h->next;free(h);h=p;}return 1;}p->v=x;p->next=h;h=p;}int first=1;while(h){printf(\"%s%d\",first?\"\":\" \",h->v);first=0;struct N *p=h->next;free(h);h=p;}puts(\"\");return 0;}\n"},{"id":"X026","cat":"pointer","title":"链表删除首个匹配值","difficulty":2,"tags":["单链表（拓展）","补缺练习"],"source":"新编（逐项核查补充）","desc":"### 题目描述\n输入n（1至30）、目标x及n个绝对值≤100的整数。尾插建立链表，删除首个值为x的节点并释放；输出余下值，空表输出EMPTY。\n\n### 输入格式\n见上述约定；所有整数均为十进制。\n\n### 输出格式\n按题意输出，数之间一个空格，行末换行。","samples":[{"in":"3 2\n1 2 2\n","out":"1 2\n"},{"in":"1 5\n5\n","out":"EMPTY\n"}],"hint":"二级指针把删除头节点与内部节点统一处理。","pitfalls":"检查输入边界与对象生存期；不得访问越界或已经释放的对象。","solution":"#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\nstruct N{int v;struct N *next;};int main(void){int n,x;scanf(\"%d%d\",&n,&x);struct N *h=NULL,**tail=&h;for(int i=0;i<n;i++){struct N *p=malloc(sizeof *p);if(!p){while(h){p=h->next;free(h);h=p;}return 1;}scanf(\"%d\",&p->v);p->next=NULL;*tail=p;tail=&p->next;}struct N **link=&h;while(*link&&(*link)->v!=x)link=&(*link)->next;if(*link){struct N *p=*link;*link=p->next;free(p);}if(!h)puts(\"EMPTY\");else{int first=1;while(h){printf(\"%s%d\",first?\"\":\" \",h->v);first=0;struct N *p=h->next;free(h);h=p;}puts(\"\");}return 0;}\n"},{"id":"V-A01","cat":"basic","title":"两数之和与差的计算·代码分析","difficulty":1,"tags":["输入输出","算术运算","代码分析"],"source":"配套代码分析（原题 A01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a, b;\n\n    scanf(\"%d%d\", &a, &b);\n    printf(\"The sum is %d and the difference is %d.\\n\", a + b, a - b);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n-100 250\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"1 2\n","out":"The sum is 3 and the difference is -1.\n"}],"hint":"指定输入的完整输出：\n```\nThe sum is 150 and the difference is -350.\n```\n分析要点：用 `scanf(\"%d%d\", &a, &b)` 读入两个整数，再用 `printf` 按题目给出的格式输出 `a + b` 和 `a - b`。\n边界核对：输出句子的标点和句末句点是格式的一部分；差是「第一个数减第二个数」，不要写反。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int a, b;\n\n    scanf(\"%d%d\", &a, &b);\n    printf(\"The sum is %d and the difference is %d.\\n\", a + b, a - b);\n    return 0;\n}\n","pitfalls":"输出句子的标点和句末句点是格式的一部分；差是「第一个数减第二个数」，不要写反。"},{"id":"V-A02","cat":"basic","title":"性别、年龄与身高的格式化输出·代码分析","difficulty":1,"tags":["字符型","格式化输出","基本类型","代码分析"],"source":"配套代码分析（原题 A02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char sex;\n    int age;\n    float height;\n\n    scanf(\" %c\", &sex);\n    scanf(\"%d\", &age);\n    scanf(\"%f\", &height);\n    printf(\"The sex is %c, the age is %d, and the height is %f.\\n\",\n           sex, age, height);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nF\n20\n1.5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"M\n18\n1.66\n","out":"The sex is M, the age is 18, and the height is 1.660000.\n"}],"hint":"指定输入的完整输出：\n```\nThe sex is F, the age is 20, and the height is 1.500000.\n```\n分析要点：性别用 `char` 和 `%c`，年龄用 `int` 和 `%d`，身高用 `float` 和 `%f`；`%f` 默认输出 6 位小数。\n边界核对：身高必须用 `float` 型（题目要求），输入格式符是 `%f`；`%c` 不会跳过空白字符，写成 `\" %c\"` 更稳妥。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    char sex;\n    int age;\n    float height;\n\n    scanf(\" %c\", &sex);\n    scanf(\"%d\", &age);\n    scanf(\"%f\", &height);\n    printf(\"The sex is %c, the age is %d, and the height is %f.\\n\",\n           sex, age, height);\n    return 0;\n}\n","pitfalls":"身高必须用 `float` 型（题目要求），输入格式符是 `%f`；`%c` 不会跳过空白字符，写成 `\" %c\"` 更稳妥。"},{"id":"V-A03","cat":"basic","title":"四则运算表达式的求值·代码分析","difficulty":2,"tags":["浮点运算","double","表达式","代码分析"],"source":"配套代码分析（原题 A03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    double a, b, c, d, result;\n\n    scanf(\"%lf%lf%lf%lf\", &a, &b, &c, &d);\n    result = (a + b) * (a - b) + c / d;\n    printf(\"%f\\n\", result);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n3 4 1 2\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"1.5 2.0 10.00 5.0\n","out":"0.250000\n"}],"hint":"指定输入的完整输出：\n```\n-6.500000\n```\n分析要点：四个数都用 `double` 存储，输入用 `%lf`；按运算优先级直接用一条表达式计算即可。\n边界核对：操作数是浮点数，必须用 `%lf` 读入；用 `int` 读入会丢掉小数部分。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    double a, b, c, d, result;\n\n    scanf(\"%lf%lf%lf%lf\", &a, &b, &c, &d);\n    result = (a + b) * (a - b) + c / d;\n    printf(\"%f\\n\", result);\n    return 0;\n}\n","pitfalls":"操作数是浮点数，必须用 `%lf` 读入；用 `int` 读入会丢掉小数部分。"},{"id":"V-A04","cat":"basic","title":"圆的周长与面积·代码分析","difficulty":2,"tags":["符号常量","浮点运算","格式控制","代码分析"],"source":"配套代码分析（原题 A04）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A04 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\n#define PI 3.14159265\n\nint main(void)\n{\n    double r, perimeter, area;\n\n    scanf(\"%lf\", &r);\n    perimeter = 2.0 * PI * r;\n    area = PI * r * r;\n    printf(\"The perimeter is %.4f, the area is %.4f.\\n\", perimeter, area);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5.5\n","out":"The perimeter is 34.5575, the area is 95.0332.\n"}],"hint":"指定输入的完整输出：\n```\nThe perimeter is 6.2832, the area is 3.1416.\n```\n分析要点：用 `#define PI 3.14159265` 定义符号常量，输出用 `%.4f`（`double` 也可以写 `%.4lf`）。\n边界核对：周长是 `2 * PI * R`，面积是 `PI * R * R`，两者不要写混；结果保留 4 位小数。","solution":"#include <stdio.h>\n\n#define PI 3.14159265\n\nint main(void)\n{\n    double r, perimeter, area;\n\n    scanf(\"%lf\", &r);\n    perimeter = 2.0 * PI * r;\n    area = PI * r * r;\n    printf(\"The perimeter is %.4f, the area is %.4f.\\n\", perimeter, area);\n    return 0;\n}\n","pitfalls":"周长是 `2 * PI * R`，面积是 `PI * R * R`，两者不要写混；结果保留 4 位小数。"},{"id":"V-A05","cat":"basic","title":"三位整数的拆位与逆序·代码分析","difficulty":2,"tags":["整除取余","数字拆分","代码分析"],"source":"配套代码分析（原题 A05）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A05 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int n, hundreds, tens, units;\n\n    scanf(\"%d\", &n);\n    hundreds = n / 100;\n    tens = n / 10 % 10;\n    units = n % 10;\n    printf(\"%d %d\\n\", hundreds + tens + units,\n           units * 100 + tens * 10 + hundreds);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n999\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"123\n","out":"6 321\n"}],"hint":"指定输入的完整输出：\n```\n27 999\n```\n分析要点：百位是 `n / 100`，十位是 `n / 10 % 10`，个位是 `n % 10`；逆序数用 `个位 * 100 + 十位 * 10 + 百位` 计算。\n边界核对：个位是 0 时逆序数会有前导零（如 120 → 21），直接按整数计算即可自动去掉；`/` 和 `%` 优先级相同，注意从左到右计算。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int n, hundreds, tens, units;\n\n    scanf(\"%d\", &n);\n    hundreds = n / 100;\n    tens = n / 10 % 10;\n    units = n % 10;\n    printf(\"%d %d\\n\", hundreds + tens + units,\n           units * 100 + tens * 10 + hundreds);\n    return 0;\n}\n","pitfalls":"个位是 0 时逆序数会有前导零（如 120 → 21），直接按整数计算即可自动去掉；`/` 和 `%` 优先级相同，注意从左到右计算。"},{"id":"V-A06","cat":"basic","title":"网购订单的运费计算·代码分析","difficulty":2,"tags":["多分支","分段计费","代码分析"],"source":"配套代码分析（原题 A06）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A06 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int p1, p2, p3, p4, total, shipping;\n\n    scanf(\"%d%d%d%d\", &p1, &p2, &p3, &p4);\n    total = p1 + p2 + p3 + p4;\n    if (total < 20) {\n        shipping = 10;\n    } else if (total < 30) {\n        shipping = 8;\n    } else if (total < 40) {\n        shipping = 5;\n    } else {\n        shipping = 0;\n    }\n    printf(\"%d\\n\", total + shipping);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n10 10 10 10\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"1 2 3 4\n","out":"20\n"}],"hint":"指定输入的完整输出：\n```\n40\n```\n分析要点：先把 4 件商品的价格求和，再按总价所在的区间累加运费，可以用 `if-else if` 链依次判断。\n边界核对：总价区间是左闭右开：20 元属于 8 元档、30 元属于 5 元档、40 元包邮，不要把边界判错。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int p1, p2, p3, p4, total, shipping;\n\n    scanf(\"%d%d%d%d\", &p1, &p2, &p3, &p4);\n    total = p1 + p2 + p3 + p4;\n    if (total < 20) {\n        shipping = 10;\n    } else if (total < 30) {\n        shipping = 8;\n    } else if (total < 40) {\n        shipping = 5;\n    } else {\n        shipping = 0;\n    }\n    printf(\"%d\\n\", total + shipping);\n    return 0;\n}\n","pitfalls":"总价区间是左闭右开：20 元属于 8 元档、30 元属于 5 元档、40 元包邮，不要把边界判错。"},{"id":"V-A07","cat":"basic","title":"公历闰年判断·代码分析","difficulty":2,"tags":["条件判断","闰年","代码分析"],"source":"配套代码分析（原题 A07）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A07 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int y;\n\n    scanf(\"%d\", &y);\n    if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {\n        printf(\"Yes\\n\");\n    } else {\n        printf(\"No\\n\");\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2000\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2008\n","out":"Yes\n"}],"hint":"指定输入的完整输出：\n```\nYes\n```\n分析要点：闰年条件可以写成 `(y % 4 == 0 && y % 100 != 0) || y % 400 == 0`。\n边界核对：整百年份必须能被 400 整除才是闰年：1900 是平年，2000 是闰年。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int y;\n\n    scanf(\"%d\", &y);\n    if ((y % 4 == 0 && y % 100 != 0) || y % 400 == 0) {\n        printf(\"Yes\\n\");\n    } else {\n        printf(\"No\\n\");\n    }\n    return 0;\n}\n","pitfalls":"整百年份必须能被 400 整除才是闰年：1900 是平年，2000 是闰年。"},{"id":"V-A08","cat":"basic","title":"字母的编码与大小写转换·代码分析","difficulty":2,"tags":["字符型","ASCII码","代码分析"],"source":"配套代码分析（原题 A08）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A08 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char c;\n\n    scanf(\" %c\", &c);\n    printf(\"%d %c %d\\n\", c, c - 'A' + 'a', c - 'A' + 1);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nZ\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"G\n","out":"71 g 7\n"}],"hint":"指定输入的完整输出：\n```\n90 z 26\n```\n分析要点：字符在 C 中可以直接当整数用；大写转小写加 32（即 `c - 'A' + 'a'`），字母序号为 `c - 'A' + 1`。\n边界核对：输出三个值之间各用一个空格分隔；`%d` 和 `%c` 不要用混。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    char c;\n\n    scanf(\" %c\", &c);\n    printf(\"%d %c %d\\n\", c, c - 'A' + 'a', c - 'A' + 1);\n    return 0;\n}\n","pitfalls":"输出三个值之间各用一个空格分隔；`%d` 和 `%c` 不要用混。"},{"id":"V-A09","cat":"basic","title":"基本数据类型与所占字节数·代码分析","difficulty":3,"tags":["数据类型","sizeof","格式化输出","代码分析"],"source":"配套代码分析（原题 A09）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A09 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char a;\n    short b;\n    int c;\n    long d;\n    long long e;\n    float f;\n    double g;\n\n    scanf(\"%c\", &a);\n    scanf(\"%hd\", &b);\n    scanf(\"%d\", &c);\n    scanf(\"%ld\", &d);\n    scanf(\"%lld\", &e);\n    scanf(\"%f\", &f);\n    scanf(\"%lf\", &g);\n\n    printf(\"The 'char' variable is %c, it takes %zu byte.\\n\", a, sizeof(a));\n    printf(\"The 'short' variable is %hd, it takes %zu bytes.\\n\", b, sizeof(b));\n    printf(\"The 'int' variable is %d, it takes %zu bytes.\\n\", c, sizeof(c));\n    printf(\"The 'long' variable is %ld, it takes %zu bytes.\\n\", d, sizeof(d));\n    printf(\"The 'long long' variable is %lld, it takes %zu bytes.\\n\", e, sizeof(e));\n    printf(\"The 'float' variable is %f, it takes %zu bytes.\\n\", f, sizeof(f));\n    printf(\"The 'double' variable is %f, it takes %zu bytes.\\n\", g, sizeof(g));\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nQ\n-32768\n-5\n12\n123456789012\n2.5\n3.14159265\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"X\n1234\n2000000000\n2000000000\n500000000000000\n1.2345\n9.87654321\n","out":"The 'char' variable is X, it takes 1 byte.\nThe 'short' variable is 1234, it takes 2 bytes.\nThe 'int' variable is 2000000000, it takes 4 bytes.\nThe 'long' variable is 2000000000, it takes 4 bytes.\nThe 'long long' variable is 500000000000000, it takes 8 bytes.\nThe 'float' variable is 1.234500, it takes 4 bytes.\nThe 'double' variable is 9.876543, it takes 8 bytes.\n"}],"hint":"指定输入的完整输出：\n```\nThe 'char' variable is Q, it takes 1 byte.\nThe 'short' variable is -32768, it takes 2 bytes.\nThe 'int' variable is -5, it takes 4 bytes.\nThe 'long' variable is 12, it takes 4 bytes.\nThe 'long long' variable is 123456789012, it takes 8 bytes.\nThe 'float' variable is 2.500000, it takes 4 bytes.\nThe 'double' variable is 3.141593, it takes 8 bytes.\n```\n分析要点：按题目顺序定义 7 个变量并依次读入；用 `sizeof(变量)` 得到字节数，用 `%zu` 输出；注意各类型对应的 `scanf` 格式符（`%hd`、`%ld`、`%lld`、`%f`、`%lf`）。\n边界核对：各类型的 `scanf` 格式符不能混用（`short` 用 `%hd`、`long` 用 `%ld`、`long long` 用 `%lld`）；`char` 行用 `byte`，其余行用 `bytes`；`long` 的字节数随平台变化，不要写死。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    char a;\n    short b;\n    int c;\n    long d;\n    long long e;\n    float f;\n    double g;\n\n    scanf(\"%c\", &a);\n    scanf(\"%hd\", &b);\n    scanf(\"%d\", &c);\n    scanf(\"%ld\", &d);\n    scanf(\"%lld\", &e);\n    scanf(\"%f\", &f);\n    scanf(\"%lf\", &g);\n\n    printf(\"The 'char' variable is %c, it takes %zu byte.\\n\", a, sizeof(a));\n    printf(\"The 'short' variable is %hd, it takes %zu bytes.\\n\", b, sizeof(b));\n    printf(\"The 'int' variable is %d, it takes %zu bytes.\\n\", c, sizeof(c));\n    printf(\"The 'long' variable is %ld, it takes %zu bytes.\\n\", d, sizeof(d));\n    printf(\"The 'long long' variable is %lld, it takes %zu bytes.\\n\", e, sizeof(e));\n    printf(\"The 'float' variable is %f, it takes %zu bytes.\\n\", f, sizeof(f));\n    printf(\"The 'double' variable is %f, it takes %zu bytes.\\n\", g, sizeof(g));\n    return 0;\n}\n","pitfalls":"各类型的 `scanf` 格式符不能混用（`short` 用 `%hd`、`long` 用 `%ld`、`long long` 用 `%lld`）；`char` 行用 `byte`，其余行用 `bytes`；`long` 的字节数随平台变化，不要写死。"},{"id":"V-A10","cat":"basic","title":"三角形面积（海伦公式）·代码分析","difficulty":3,"tags":["数学函数","条件判断","浮点运算","代码分析"],"source":"配套代码分析（原题 A10）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A10 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n#include <math.h>\n\nint main(void)\n{\n    int a, b, c;\n\n    scanf(\"%d%d%d\", &a, &b, &c);\n    if (a + b > c && a + c > b && b + c > a) {\n        double s = (a + b + c) / 2.0;\n        double area = sqrt(s * (s - a) * (s - b) * (s - c));\n        printf(\"%.3f\\n\", area);\n    } else {\n        printf(\"The edges cannot make up of a triangle.\\n\");\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1 2 3\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5 12 13\n","out":"30.000\n"}],"hint":"指定输入的完整输出：\n```\nThe edges cannot make up of a triangle.\n```\n分析要点：先判断 `a + b > c && a + c > b && b + c > a`；再用 `#include <math.h>` 中的 `sqrt` 计算海伦公式，注意 S 要用浮点数。\n边界核对：`S = (a + b + c) / 2.0` 不能写成 `/ 2`，否则会整除丢掉小数；`sqrt` 需要 `#include <math.h>`。","solution":"#include <stdio.h>\n#include <math.h>\n\nint main(void)\n{\n    int a, b, c;\n\n    scanf(\"%d%d%d\", &a, &b, &c);\n    if (a + b > c && a + c > b && b + c > a) {\n        double s = (a + b + c) / 2.0;\n        double area = sqrt(s * (s - a) * (s - b) * (s - c));\n        printf(\"%.3f\\n\", area);\n    } else {\n        printf(\"The edges cannot make up of a triangle.\\n\");\n    }\n    return 0;\n}\n","pitfalls":"`S = (a + b + c) / 2.0` 不能写成 `/ 2`，否则会整除丢掉小数；`sqrt` 需要 `#include <math.h>`。"},{"id":"V-A11","cat":"basic","title":"双十一满减与会员折扣·代码分析","difficulty":4,"tags":["浮点比较","分段计费","格式控制","代码分析"],"source":"配套代码分析（原题 A11）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 A11 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    double p1, p2, p3;\n    char member;\n    long long cents;\n\n    scanf(\"%lf%lf%lf\", &p1, &p2, &p3);\n    scanf(\" %c\", &member);\n\n    cents = (long long)(p1 * 100 + 0.5)\n          + (long long)(p2 * 100 + 0.5)\n          + (long long)(p3 * 100 + 0.5);\n\n    if (cents >= 30000) {\n        cents -= 5000;\n    } else if (cents >= 20000) {\n        cents -= 3000;\n    } else if (cents >= 10000) {\n        cents -= 1000;\n    }\n\n    if (member == 'Y') {\n        cents = (cents * 95 + 50) / 100;\n    }\n\n    printf(\"%lld.%02lld\\n\", cents / 100, cents % 100);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n10.00 5.00 3.00\nN\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"114.60 181.70 3.70\nN\n","out":"250.00\n"}],"hint":"指定输入的完整输出：\n```\n18.00\n```\n分析要点：把每个单价换算成「分」：`(long long)(p * 100 + 0.5)`，求和后用整数分做满减和 95 折，最后分别输出整数部分和小数部分，避免浮点误差。\n边界核对：300.00 元必须按「满 300 减 50」计算，直接对 double 求和可能得到 299.999… 而判错档位；95 折按分四舍五入：`(cents * 95 + 50) / 100`；输出必须恰好两位小数。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    double p1, p2, p3;\n    char member;\n    long long cents;\n\n    scanf(\"%lf%lf%lf\", &p1, &p2, &p3);\n    scanf(\" %c\", &member);\n\n    cents = (long long)(p1 * 100 + 0.5)\n          + (long long)(p2 * 100 + 0.5)\n          + (long long)(p3 * 100 + 0.5);\n\n    if (cents >= 30000) {\n        cents -= 5000;\n    } else if (cents >= 20000) {\n        cents -= 3000;\n    } else if (cents >= 10000) {\n        cents -= 1000;\n    }\n\n    if (member == 'Y') {\n        cents = (cents * 95 + 50) / 100;\n    }\n\n    printf(\"%lld.%02lld\\n\", cents / 100, cents % 100);\n    return 0;\n}\n","pitfalls":"300.00 元必须按「满 300 减 50」计算，直接对 double 求和可能得到 299.999… 而判错档位；95 折按分四舍五入：`(cents * 95 + 50) / 100`；输出必须恰好两位小数。"},{"id":"V-B01","cat":"select","title":"两个整数的大小比较·代码分析","difficulty":2,"tags":["if-else","比较","代码分析"],"source":"配套代码分析（原题 B01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a, b, max, min;\n\n    scanf(\"%d%d\", &a, &b);\n    if (a == b) {\n        printf(\"The two numbers are equal.\\n\");\n    } else {\n        if (a > b) {\n            max = a;\n            min = b;\n        } else {\n            max = b;\n            min = a;\n        }\n        printf(\"The larger number is %d, the smaller number is %d.\\n\", max, min);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n-3 -9\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"100 25\n","out":"The larger number is 100, the smaller number is 25.\n"}],"hint":"指定输入的完整输出：\n```\nThe larger number is -3, the smaller number is -9.\n```\n分析要点：先用 `if` 判断两数是否相等，再用 `if-else` 分别选出 `max` 与 `min`。\n边界核对：相等的情况要单独处理，不能输出「较大数/较小数」；负数比较时不要用绝对值。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int a, b, max, min;\n\n    scanf(\"%d%d\", &a, &b);\n    if (a == b) {\n        printf(\"The two numbers are equal.\\n\");\n    } else {\n        if (a > b) {\n            max = a;\n            min = b;\n        } else {\n            max = b;\n            min = a;\n        }\n        printf(\"The larger number is %d, the smaller number is %d.\\n\", max, min);\n    }\n    return 0;\n}\n","pitfalls":"相等的情况要单独处理，不能输出「较大数/较小数」；负数比较时不要用绝对值。"},{"id":"V-B02","cat":"select","title":"表达式求值与除零判断·代码分析","difficulty":2,"tags":["浮点运算","除零判断","代码分析"],"source":"配套代码分析（原题 B02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    double a, b, c, d, denom;\n\n    scanf(\"%lf%lf%lf%lf\", &a, &b, &c, &d);\n    denom = b * c - d;\n    if (denom == 0.0) {\n        printf(\"error\\n\");\n    } else {\n        printf(\"%.1f\\n\", a / denom);\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1 2 3 4\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"66.09 7.7 3.5 1.6\n","out":"2.6\n"}],"hint":"指定输入的完整输出：\n```\n0.5\n```\n分析要点：先计算分母 `b * c - d` 并判断它是否为 0：为 0 时直接输出 `error`，否则再计算除法。\n边界核对：分母为 0 时不能做除法；输出结果保留 1 位小数。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    double a, b, c, d, denom;\n\n    scanf(\"%lf%lf%lf%lf\", &a, &b, &c, &d);\n    denom = b * c - d;\n    if (denom == 0.0) {\n        printf(\"error\\n\");\n    } else {\n        printf(\"%.1f\\n\", a / denom);\n    }\n    return 0;\n}\n","pitfalls":"分母为 0 时不能做除法；输出结果保留 1 位小数。"},{"id":"V-B03","cat":"select","title":"百分制成绩的等级划分·代码分析","difficulty":2,"tags":["多分支","区间判断","代码分析"],"source":"配套代码分析（原题 B03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int score;\n\n    scanf(\"%d\", &score);\n    if (score < 0 || score > 100) {\n        printf(\"The score is out of range!\\n\");\n    } else if (score >= 90) {\n        printf(\"A\\n\");\n    } else if (score >= 80) {\n        printf(\"B\\n\");\n    } else if (score >= 70) {\n        printf(\"C\\n\");\n    } else if (score >= 60) {\n        printf(\"D\\n\");\n    } else {\n        printf(\"E\\n\");\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n-5\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"89\n","out":"B\n"}],"hint":"指定输入的完整输出：\n```\nThe score is out of range!\n```\n分析要点：用 `if-else if` 链从高分到低分依次判断；注意先处理小于 0 或大于 100 的越界情况。\n边界核对：区间是左闭右开：90 分是 A，89 分是 B，60 分是 D；越界提示末尾的感叹号和句点要完全一致。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int score;\n\n    scanf(\"%d\", &score);\n    if (score < 0 || score > 100) {\n        printf(\"The score is out of range!\\n\");\n    } else if (score >= 90) {\n        printf(\"A\\n\");\n    } else if (score >= 80) {\n        printf(\"B\\n\");\n    } else if (score >= 70) {\n        printf(\"C\\n\");\n    } else if (score >= 60) {\n        printf(\"D\\n\");\n    } else {\n        printf(\"E\\n\");\n    }\n    return 0;\n}\n","pitfalls":"区间是左闭右开：90 分是 A，89 分是 B，60 分是 D；越界提示末尾的感叹号和句点要完全一致。"},{"id":"V-B04","cat":"select","title":"居民阶梯水费计算·代码分析","difficulty":3,"tags":["多分支","分段计费","代码分析"],"source":"配套代码分析（原题 B04）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B04 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int x;\n    double fee;\n\n    scanf(\"%d\", &x);\n    if (x <= 15) {\n        fee = x * 2.50;\n    } else if (x <= 25) {\n        fee = 15 * 2.50 + (x - 15) * 3.75;\n    } else {\n        fee = 15 * 2.50 + 10 * 3.75 + (x - 25) * 7.00;\n    }\n    printf(\"%.2f\\n\", fee);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n30\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"8\n","out":"20.00\n"}],"hint":"指定输入的完整输出：\n```\n110.00\n```\n分析要点：用 `if-else if` 分成 0~15、15~25、25 以上三段，每一段只累加超出该档起点的部分水费。\n边界核对：不能把全部用水量都按最高档单价相乘；15 吨、25 吨这两个边界属于较低档。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int x;\n    double fee;\n\n    scanf(\"%d\", &x);\n    if (x <= 15) {\n        fee = x * 2.50;\n    } else if (x <= 25) {\n        fee = 15 * 2.50 + (x - 15) * 3.75;\n    } else {\n        fee = 15 * 2.50 + 10 * 3.75 + (x - 25) * 7.00;\n    }\n    printf(\"%.2f\\n\", fee);\n    return 0;\n}\n","pitfalls":"不能把全部用水量都按最高档单价相乘；15 吨、25 吨这两个边界属于较低档。"},{"id":"V-B05","cat":"select","title":"该日期是当年的第几天·代码分析","difficulty":3,"tags":["switch","闰年","累加","代码分析"],"source":"配套代码分析（原题 B05）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B05 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int y, m, d, leap, sum;\n\n    scanf(\"%d%d%d\", &y, &m, &d);\n    leap = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;\n    sum = d;\n\n    switch (m) {\n    /* 11 月：30 天 */\n    case 12: sum += 30;  /* fall through */\n    /* 10 月：31 天 */\n    case 11: sum += 31;  /* fall through */\n    /* 9 月：30 天 */\n    case 10: sum += 30;  /* fall through */\n    /* 8 月：31 天 */\n    case 9:  sum += 31;  /* fall through */\n    /* 7 月：31 天 */\n    case 8:  sum += 31;  /* fall through */\n    /* 6 月：30 天 */\n    case 7:  sum += 30;  /* fall through */\n    /* 5 月：31 天 */\n    case 6:  sum += 31;  /* fall through */\n    /* 4 月：30 天 */\n    case 5:  sum += 30;  /* fall through */\n    /* 3 月：31 天 */\n    case 4:  sum += 31;  /* fall through */\n    /* 2 月：闰年 29 天，平年 28 天 */\n    case 3:  sum += leap ? 29 : 28;  /* fall through */\n    /* 1 月：31 天 */\n    case 2:  sum += 31;  /* fall through */\n    case 1:  break;\n    default: break;\n    }\n\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2023 12 31\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"2024 3 1\n","out":"61\n"}],"hint":"指定输入的完整输出：\n```\n365\n```\n分析要点：先判断闰年确定 2 月天数；再用 `switch` 从当前月份开始，借助不加 `break` 的「贯穿」特性，把之前各月的天数依次累加，最后加上 d。\n边界核对：`switch` 里不加 `break` 的贯穿是故意使用的，但 `case 1` 后必须 `break`，否则不会停止累加；闰年的整百规则别漏（1900 不是闰年）。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int y, m, d, leap, sum;\n\n    scanf(\"%d%d%d\", &y, &m, &d);\n    leap = (y % 4 == 0 && y % 100 != 0) || y % 400 == 0;\n    sum = d;\n\n    switch (m) {\n    /* 11 月：30 天 */\n    case 12: sum += 30;  /* fall through */\n    /* 10 月：31 天 */\n    case 11: sum += 31;  /* fall through */\n    /* 9 月：30 天 */\n    case 10: sum += 30;  /* fall through */\n    /* 8 月：31 天 */\n    case 9:  sum += 31;  /* fall through */\n    /* 7 月：31 天 */\n    case 8:  sum += 31;  /* fall through */\n    /* 6 月：30 天 */\n    case 7:  sum += 30;  /* fall through */\n    /* 5 月：31 天 */\n    case 6:  sum += 31;  /* fall through */\n    /* 4 月：30 天 */\n    case 5:  sum += 30;  /* fall through */\n    /* 3 月：31 天 */\n    case 4:  sum += 31;  /* fall through */\n    /* 2 月：闰年 29 天，平年 28 天 */\n    case 3:  sum += leap ? 29 : 28;  /* fall through */\n    /* 1 月：31 天 */\n    case 2:  sum += 31;  /* fall through */\n    case 1:  break;\n    default: break;\n    }\n\n    printf(\"%d\\n\", sum);\n    return 0;\n}\n","pitfalls":"`switch` 里不加 `break` 的贯穿是故意使用的，但 `case 1` 后必须 `break`，否则不会停止累加；闰年的整百规则别漏（1900 不是闰年）。"},{"id":"V-B06","cat":"select","title":"判断同构数·代码分析","difficulty":3,"tags":["整除取余","条件判断","边界检查","代码分析"],"source":"配套代码分析（原题 B06）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B06 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int x;\n\n    scanf(\"%d\", &x);\n    if (x < 1 || x > 10000) {\n        printf(\"%d out of range\\n\", x);\n    } else {\n        long long sq = (long long)x * x;\n        long long p = 10;\n        while (p <= x) {\n            p *= 10;\n        }\n        if (sq % p == x) {\n            printf(\"Yes\\n\");\n        } else {\n            printf(\"No\\n\");\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n20000\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"5\n","out":"Yes\n"}],"hint":"指定输入的完整输出：\n```\n20000 out of range\n```\n分析要点：先判断 x 是否在 [1, 10000] 内；再数出 x 的位数 k，比较 `x * x % 10^k` 与 x 是否相等。\n边界核对：必须先判断范围再计算；x 最大为 10000，`x * x` 为 10^8，用 `int` 也放得下，但用 `long long` 更稳妥。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int x;\n\n    scanf(\"%d\", &x);\n    if (x < 1 || x > 10000) {\n        printf(\"%d out of range\\n\", x);\n    } else {\n        long long sq = (long long)x * x;\n        long long p = 10;\n        while (p <= x) {\n            p *= 10;\n        }\n        if (sq % p == x) {\n            printf(\"Yes\\n\");\n        } else {\n            printf(\"No\\n\");\n        }\n    }\n    return 0;\n}\n","pitfalls":"必须先判断范围再计算；x 最大为 10000，`x * x` 为 10^8，用 `int` 也放得下，但用 `long long` 更稳妥。"},{"id":"V-B07","cat":"select","title":"鸡、兔、蜻蜓的数量·代码分析","difficulty":3,"tags":["穷举","条件判断","多解输出","代码分析"],"source":"配套代码分析（原题 B07）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B07 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int m, n, rest, k, d, r, c;\n\n    scanf(\"%d%d\", &m, &n);\n    rest = n - 2 * m;              /* 2r + 4d = n - 2m */\n    if (rest >= 0 && rest % 2 == 0) {\n        k = rest / 2;              /* r + 2d = k */\n        for (d = 0; d <= k / 2; d++) {\n            r = k - 2 * d;\n            c = m - r - d;\n            if (c >= 0 && r >= 0) {\n                printf(\"%d %d %d\\n\", c, r, d);\n            }\n        }\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n5 14\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"15 40\n","out":"10 5 0\n11 3 1\n12 1 2\n"}],"hint":"指定输入的完整输出：\n```\n3 2 0\n4 0 1\n```\n分析要点：设鸡 c、兔 r、蜻蜓 d，则 c + r + d = m、2c + 4r + 6d = n；两式相减得 r + 2d = (n - 2m) / 2，于是只需枚举 d 就能依次求出 r 和 c。\n边界核对：三种动物的数量都必须非负；无解时不要输出任何内容；按 d 从小到大枚举，鸡的只数正好从小到大排列。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int m, n, rest, k, d, r, c;\n\n    scanf(\"%d%d\", &m, &n);\n    rest = n - 2 * m;              /* 2r + 4d = n - 2m */\n    if (rest >= 0 && rest % 2 == 0) {\n        k = rest / 2;              /* r + 2d = k */\n        for (d = 0; d <= k / 2; d++) {\n            r = k - 2 * d;\n            c = m - r - d;\n            if (c >= 0 && r >= 0) {\n                printf(\"%d %d %d\\n\", c, r, d);\n            }\n        }\n    }\n    return 0;\n}\n","pitfalls":"三种动物的数量都必须非负；无解时不要输出任何内容；按 d 从小到大枚举，鸡的只数正好从小到大排列。"},{"id":"V-B08","cat":"select","title":"三对三篮球赛胜负判定·代码分析","difficulty":4,"tags":["多分支","规则判断","边界","代码分析"],"source":"配套代码分析（原题 B08）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B08 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int a, b;\n\n    scanf(\"%d%d\", &a, &b);\n    if (a >= 21 && b >= 21) {\n        printf(\"error\\n\");\n    } else if (a >= 21) {\n        printf(\"A win\\n\");\n    } else if (b >= 21) {\n        printf(\"B win\\n\");\n    } else if (a > b) {\n        printf(\"A win\\n\");\n    } else if (b > a) {\n        printf(\"B win\\n\");\n    } else {\n        printf(\"no result\\n\");\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n29 30\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"11 17\n","out":"B win\n"}],"hint":"指定输入的完整输出：\n```\nerror\n```\n分析要点：依次判断：两队是否都达到 21 分（error）→ 是否只有一队达到 21 分（该队获胜）→ 两队都未到 21 分时比较大小。\n边界核对：两队都 ≥ 21 时比分不可能出现；只有两队都低于 21 分且相等时才输出 `no result`；`A win`、`B win` 的大小写和空格要与题目一致。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int a, b;\n\n    scanf(\"%d%d\", &a, &b);\n    if (a >= 21 && b >= 21) {\n        printf(\"error\\n\");\n    } else if (a >= 21) {\n        printf(\"A win\\n\");\n    } else if (b >= 21) {\n        printf(\"B win\\n\");\n    } else if (a > b) {\n        printf(\"A win\\n\");\n    } else if (b > a) {\n        printf(\"B win\\n\");\n    } else {\n        printf(\"no result\\n\");\n    }\n    return 0;\n}\n","pitfalls":"两队都 ≥ 21 时比分不可能出现；只有两队都低于 21 分且相等时才输出 `no result`；`A win`、`B win` 的大小写和空格要与题目一致。"},{"id":"V-B09","cat":"select","title":"出租车分段计费·代码分析","difficulty":4,"tags":["多分支","分段计费","浮点运算","代码分析"],"source":"配套代码分析（原题 B09）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 B09 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    double s, fee;\n    char period;\n\n    scanf(\"%lf\", &s);\n    scanf(\" %c\", &period);\n\n    if (s <= 3.0) {\n        fee = 13.0;\n    } else if (s <= 15.0) {\n        fee = 13.0 + (s - 3.0) * 2.30;\n    } else {\n        fee = 13.0 + 12.0 * 2.30 + (s - 15.0) * 3.45;\n    }\n    if (period == 'N') {\n        fee = fee * 1.2;\n    }\n    printf(\"%.2f\\n\", fee);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n2.5\nD\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"10.0\nD\n","out":"29.10\n"}],"hint":"指定输入的完整输出：\n```\n13.00\n```\n分析要点：先按里程用 `if-else if` 分成 `s ≤ 3`、`3 < s ≤ 15`、`s > 15` 三段计算基础车费，再根据时段字符决定是否乘以 1.2。\n边界核对：15 公里是分段点，前后两段在 15 处应连续；夜间加价是在总费用基础上乘 1.2，而不是在每段单价上；结果保留 2 位小数。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    double s, fee;\n    char period;\n\n    scanf(\"%lf\", &s);\n    scanf(\" %c\", &period);\n\n    if (s <= 3.0) {\n        fee = 13.0;\n    } else if (s <= 15.0) {\n        fee = 13.0 + (s - 3.0) * 2.30;\n    } else {\n        fee = 13.0 + 12.0 * 2.30 + (s - 15.0) * 3.45;\n    }\n    if (period == 'N') {\n        fee = fee * 1.2;\n    }\n    printf(\"%.2f\\n\", fee);\n    return 0;\n}\n","pitfalls":"15 公里是分段点，前后两段在 15 处应连续；夜间加价是在总费用基础上乘 1.2，而不是在每段单价上；结果保留 2 位小数。"},{"id":"V-C01","cat":"loop","title":"二进制转十进制·代码分析","difficulty":1,"tags":["进制转换","数位处理","while循环","代码分析"],"source":"配套代码分析（原题 C01）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 C01 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char s[20];\n    long long value = 0;\n    int i;\n\n    scanf(\"%19s\", s);\n    for (i = 0; s[i] != '\\0'; i++) {\n        value = value * 2 + (s[i] - '0');\n    }\n    printf(\"%lld\\n\", value);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n1010\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"11111\n","out":"31\n"}],"hint":"指定输入的完整输出：\n```\n10\n```\n分析要点：可以把输入当成字符串逐位处理：从左到右 `val = val * 2 + (s[i] - '0')`；\n也可以读成整数后用 `% 10` 取最低位、`/ 10` 去掉最低位，按 2 的幂累加。\n边界核对：二进制数的长度不超过 10 位，结果不超过 1023，用 `int` 即可，但用 `long long` 更稳妥。\n注意前导零不影响结果。","pitfalls":"二进制数的长度不超过 10 位，结果不超过 1023，用 `int` 即可，但用 `long long` 更稳妥。\n注意前导零不影响结果。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    char s[20];\n    long long value = 0;\n    int i;\n\n    scanf(\"%19s\", s);\n    for (i = 0; s[i] != '\\0'; i++) {\n        value = value * 2 + (s[i] - '0');\n    }\n    printf(\"%lld\\n\", value);\n    return 0;\n}\n"},{"id":"V-C02","cat":"loop","title":"统计各类字符个数·代码分析","difficulty":2,"tags":["字符处理","分支判断","while循环","代码分析"],"source":"配套代码分析（原题 C02）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 C02 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int ch;\n    int letters = 0, spaces = 0, digits = 0, others = 0;\n\n    while ((ch = getchar()) != '\\n' && ch != EOF) {\n        if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {\n            letters++;\n        } else if (ch == ' ') {\n            spaces++;\n        } else if (ch >= '0' && ch <= '9') {\n            digits++;\n        } else {\n            others++;\n        }\n    }\n    printf(\"%d %d %d %d\\n\", letters, spaces, digits, others);\n    return 0;\n}\n\n```\n\n### 指定输入\n```\nHappy new year #100101 !\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"Happy new year #100101 !\n","out":"12 4 6 2\n"}],"hint":"指定输入的完整输出：\n```\n12 4 6 2\n```\n分析要点：用 `while ((ch = getchar()) != '\\n' && ch != EOF)` 逐个读字符，再用 `if` 分支归类计数。\n注意字母要同时判断大小写两段区间。\n边界核对：读到换行符就停止，不要把换行符本身算进「其他字符」。\n`getchar()` 的返回值用 `int` 保存，才能和 `EOF`（-1）比较。","pitfalls":"读到换行符就停止，不要把换行符本身算进「其他字符」。\n`getchar()` 的返回值用 `int` 保存，才能和 `EOF`（-1）比较。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    int ch;\n    int letters = 0, spaces = 0, digits = 0, others = 0;\n\n    while ((ch = getchar()) != '\\n' && ch != EOF) {\n        if ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z')) {\n            letters++;\n        } else if (ch == ' ') {\n            spaces++;\n        } else if (ch >= '0' && ch <= '9') {\n            digits++;\n        } else {\n            others++;\n        }\n    }\n    printf(\"%d %d %d %d\\n\", letters, spaces, digits, others);\n    return 0;\n}\n"},{"id":"V-C03","cat":"loop","title":"判断回文数·代码分析","difficulty":2,"tags":["数位处理","整数反转","分支判断","代码分析"],"source":"配套代码分析（原题 C03）","desc":"### 题目描述\n阅读下面程序，先不运行，推导指定输入下的完整输出。写出关键变量变化、循环或递归的停止条件，并说明一个边界条件为什么不会越界或出错。本题与 C03 共用算法，练习形式为代码分析，不计作独立算法。\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    long long n, x, rev = 0;\n\n    scanf(\"%lld\", &n);\n    x = n;\n    while (x > 0) {\n        rev = rev * 10 + x % 10;\n        x /= 10;\n    }\n    if (rev == n) {\n        printf(\"Yes\\n\");\n    } else {\n        printf(\"No\\n\");\n    }\n    return 0;\n}\n\n```\n\n### 指定输入\n```\n12345\n```\n\n### 作答要求\n写出输出及上述解释，再展开参考答案核对。参考输出在答案区展示。","samples":[{"in":"12321\n","out":"Yes\n"}],"hint":"指定输入的完整输出：\n```\nNo\n```\n分析要点：用循环把 `n` 的各位数字倒过来得到 `rev`：`rev = rev * 10 + x % 10; x /= 10;`，\n最后判断 `rev == n` 即可。\n边界核对：反转后的数可能超出 `int` 范围（例如 1999999999），要用 `long long` 保存。","pitfalls":"反转后的数可能超出 `int` 范围（例如 1999999999），要用 `long long` 保存。","solution":"#include <stdio.h>\n\nint main(void)\n{\n    long long n, x, rev = 0;\n\n    scanf(\"%lld\", &n);\n    x = n;\n    while (x > 0) {\n        rev = rev * 10 + x % 10;\n        x /= 10;\n    }\n    if (rev == n) {\n        pr
